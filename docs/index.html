["imported-images/2024-2-q06-1.png"],"parts":[{"label":"정답","answers":["㉥","㉥ 순차적 응집도","순차적 응집도","순차적","Sequential Cohesion","순차적 응집도(Sequential Cohesion)"]}],"explanation":"순차적 응집도는 모듈 안에서 한 기능의 출력이 다음 기능의 입력으로 이어지는 관계로 묶인 경우이다. 설명의 「출력 자료가 다음 기능 원소의 입력 자료로 제공」이 바로 그 특징이다. 비슷한 절차적 응집도는 순서대로 수행된다는 점만 같고 데이터가 이어지지는 않으며, 교환적(통신적) 응집도는 같은 입력이나 출력을 사용하는 기능들을 모은 것이다. 응집도는 기능적 > 순차적 > 교환적 > 절차적 > 시간적 > 논리적 > 우연적 순으로 강하다.","difficulty":"","point":"순차적 응집도","unordered":false},{"id":"past-2024-2-7","sourceNumber":7,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"디자인 패턴에 대한 다음 설명에서 알맞은 용어를 보기에서 찾아 쓰시오.\n\n- 컬렉션 객체의 내부 구조를 노출하지 않고 순차적으로 접근할 수 있게 하는 패턴이다.\n- 객체의 내부 표현 방식에 독립적으로 요소에 접근할 수 있다.\n- 반복 프로세스를 캡슐화하여 클라이언트 코드에서는 컬렉션의 구체적인 구현에 종속되지 않게 한다.\n- Cursor라고도 한다.","code":"","images":["imported-images/2024-2-q07-1.png"],"parts":[{"label":"정답","answers":["Iterator"]}],"explanation":"Iterator 패턴은 컬렉션의 내부 구조(배열인지 리스트인지 등)를 드러내지 않고 요소를 하나씩 차례로 꺼낼 수 있게 해 주는 행위 패턴이다. hasNext, next 같은 공통 인터페이스로 순회를 캡슐화하므로 클라이언트는 컬렉션 구현에 의존하지 않는다. 커서(Cursor)라는 별칭이 결정적 단서다. 같은 행위 패턴인 Visitor는 요소 구조는 그대로 두고 새 연산을 추가하는 패턴이고, Observer는 상태 변화를 구독자에게 알리는 패턴이라 구분된다.","difficulty":"","point":"Iterator 패턴"},{"id":"past-2024-2-8","sourceNumber":8,"bucketLabel":"Python","type":"short","language":"","question":"다음 Python으로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"def cnt(str, p):\n    result = 0\n    for i in range(len(str)):\n        sub = str[i:i+len(p)]\n        if sub == p:\n            result += 1\n    return result\n\nstr = \"abdcabcabca\"\np1 = \"ca\"\np2 = \"ab“\n\nprint(f'ab{cnt(str, p1)} ca{cnt(str, p2)}')","images":[],"parts":[{"label":"정답","answers":["ab3 ca3"]}],"explanation":"cnt 함수는 문자열의 각 위치 i에서 패턴 길이만큼 잘라 패턴과 같으면 개수를 센다. str은 a b d c a b c a b c a(인덱스 0~10)이다. p1 = ca는 인덱스 3, 6, 9에서 일치해 3이고, p2 = ab는 인덱스 0, 4, 7에서 일치해 3이다. 끝부분 슬라이싱은 범위를 넘어도 오류 없이 짧게 잘리므로 일치하지 않을 뿐이다. f-string은 ab 뒤에 cnt(str, p1) 결과를, ca 뒤에 cnt(str, p2) 결과를 붙이므로 ab3 ca3이 출력된다(원문의 p2 끝 따옴표가 특수 문자로 복원된 것은 일반 큰따옴표로 본다).","difficulty":"","point":"Python 부분 문자열 개수"},{"id":"past-2024-2-9","sourceNumber":9,"bucketLabel":"네트워크","type":"short","language":"","question":"데이터 교환 방식에 대한 다음 설명에서 괄호(①, ②)에 들어갈 알맞은 용어를 쓰시오.\n\n(  ①  ) : 연결형 통신에서 주로 사용되는 방식으로, 출발지와 목적지의 전송 경로를 미리 연결하여 논리적으로 고정한 후 통신하는 방식이다.\n(  ②  ) : 비연결형 통신에서 주로 사용되는 방식으로, 사전에 접속 절차를 수행하지 않고 헤더에 출발지에서 목적지까지의 경로 지정을 위한 충분한 정보를 붙여서 개별적으로 전달하는 방식이다.","code":"","images":[],"parts":[{"label":"①","answers":["가상 회선 방식","가상 회선","Virtual Circuit","가상 회선 방식(Virtual Circuit)"]},{"label":"②","answers":["데이터그램 방식","데이터그램","Datagram","데이터그램 방식(Datagram)"]}],"explanation":"패킷 교환 방식은 가상 회선 방식과 데이터그램 방식으로 나뉜다. 가상 회선 방식은 전송 전에 논리적 경로를 먼저 설정하고 모든 패킷이 그 경로를 따라 순서대로 전달되는 연결형 방식이다. 데이터그램 방식은 연결 설정 없이 각 패킷이 헤더의 주소 정보만으로 독립적으로 경로를 찾아가므로 도착 순서가 바뀔 수 있는 비연결형 방식이다. 물리적 회선을 통신 동안 독점하는 회선 교환 방식과 혼동하지 않아야 한다.","difficulty":"","point":"가상 회선과 데이터그램","unordered":false},{"id":"past-2024-2-10","sourceNumber":10,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"#include \n\nvoid swap() {\n\tint a = 11;\n\tint b = 19;\n\tint t = a;\n\ta = b;\n\tb = t;\n}\n\nint main() {\n\tint a = 11;\n\tint b = 19;\n\tswap();\n\tswitch(a) {\n\t\tcase 1:\n\t\t\tb += 1;\n\t\tcase 11:\n\t\t\tb += 2;\n\t\tdefault:\n\t\t\tb += 3;\n\t\t\tbreak;\n\t}\n\tprintf(\"%d\", a-b);\n}","images":[],"parts":[{"label":"정답","answers":["-13"]}],"explanation":"swap 함수 안의 a, b는 main의 a, b와 이름만 같은 별개의 지역 변수이므로 swap() 호출은 main의 값에 아무 영향을 주지 않는다. 따라서 switch에 들어갈 때 a = 11, b = 19이다. case 11로 진입해 b += 2로 b = 21이 되고, break가 없어 default까지 이어서 실행(fall-through)되어 b += 3으로 b = 24가 된 뒤 break로 빠져나온다. 마지막으로 a - b = 11 - 24 = -13이 출력된다(원문의 #include 뒤 헤더 이름 stdio.h는 복원 과정에서 빠진 것이다).","difficulty":"","point":"C switch fall-through"},{"id":"past-2024-2-11","sourceNumber":11,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"#include \n#include \n\nvoid func(char *d, char *s) {\n\tint sum = 0;\n\twhile (*s) {\n\t\t*d = *s;\n\t\td++;\n\t\ts++;\n\t}\n\t*d = '';\n}\n\nint main() {\n\tchar* str1 = \"first\";\n\tchar str2[50] = \"teststring\";\n\tint result = 0;\n\tfunc(str2, str1);\n\n\tfor (int i = 0; str2[i] != ''; i++) {\n\t\tresult += i;\n\t}\n\tprintf(\"%d\", result);\n\treturn 0;\n}","images":[],"parts":[{"label":"정답","answers":["10"]}],"explanation":"func는 s가 가리키는 문자열을 널 문자를 만날 때까지 d에 한 글자씩 복사하고 끝에 널 문자를 붙이는 strcpy와 같은 함수이다(복원 과정에서 '\\0'이 ''로 표기되었다). str2의 앞부분이 first로 덮이고 인덱스 5에 널 문자가 들어가므로 str2는 first가 된다. for문은 str2[i]가 널 문자가 아닌 동안 i를 더하므로 i = 0, 1, 2, 3, 4가 더해진다. 0 + 1 + 2 + 3 + 4 = 10이 출력되며, 뒤에 남은 teststring의 나머지 글자는 널 문자 뒤라서 영향을 주지 않는다.","difficulty":"","point":"C 문자열 복사와 널 문자"},{"id":"past-2024-2-12","sourceNumber":12,"bucketLabel":"Java","type":"short","language":"","question":"다음 Java로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"interface Number {\n\tint sum(int[] a, boolean odd);\n}\n\npublic class Main {\n\tpublic static void main(String[] args) {\n\t\tint a[] = {1, 2, 3, 4, 5, 6, 7, 8, 9};\n\t\tOENumber OE = new OENumber();\n\t\tSystem.out.print(OE.sum(a, true) + \", \" + OE.sum(a, false));\n\t}\n}\nclass OENumber implements Number {\n\tpublic int sum(int[] a, boolean odd) {\n\t\tint result = 0;\n\t\tfor(int i=0; i < a.length; i++) {\n\t\t\tif((odd && a[i] % 2 != 0) || (!odd && a[i] % 2 == 0))\n\t\t\t\tresult += a[i];\n\t\t}\t\t\n\t\treturn result;\n\t}\t\n}","images":[],"parts":[{"label":"정답","answers":["25, 20"]}],"explanation":"OENumber는 Number 인터페이스의 sum을 구현하며, odd가 true면 홀수만, false면 짝수만 더한다. sum(a, true)는 1 + 3 + 5 + 7 + 9 = 25이고, sum(a, false)는 2 + 4 + 6 + 8 = 20이다. 출력식은 문자열 연결이므로 25, 20이 그대로 출력된다. 조건식 (odd && 홀수) || (!odd && 짝수)는 odd 값에 따라 두 조건 중 하나만 살아나는 구조라는 점을 읽어 내는 것이 포인트다.","difficulty":"","point":"Java 인터페이스 구현"},{"id":"past-2024-2-13","sourceNumber":13,"bucketLabel":"네트워크","type":"short","language":"","question":"다음 라우터 A에서 라우터 F까지 경로를 설정하기 위해 RIP 방식을 사용한다고 할 때, 라우터가 지나가는 경로를 순서대로 쓰시오.(단, 간선 위의 숫자는 라우터 간의 거리를 의미한다.)\n\n답 : A ➝","code":"","images":["imported-images/2024-2-q13-1.png"],"parts":[{"label":"정답","answers":["A ➝ D ➝ C ➝ F","A → D → C → F","D → C → F"]}],"explanation":"RIP는 거리 벡터 라우팅 프로토콜로, 링크의 비용이 아니라 거쳐 가는 라우터 수(홉 수)를 경로 비용으로 삼아 홉 수가 가장 적은 경로를 고른다. A에서 F로 가는 경로 중 A-D-C-F는 3홉으로 가장 짧고, A-B-D-C-F는 4홉, A-D-C-E-F도 4홉이다. 따라서 RIP는 A → D → C → F를 선택한다. 간선의 숫자(거리)를 더하면 A-D-C-E-F가 1 + 2 + 1 + 2 = 6으로 A-D-C-F의 8보다 작지만, 이는 링크 비용을 쓰는 OSPF 같은 링크 상태 방식의 기준이므로 RIP 문제에서는 쓰지 않는다. RIP의 최대 홉 수는 15이며 16은 도달 불가로 본다.","difficulty":"","point":"RIP 홉 수 경로 선택","unordered":false},{"id":"past-2024-2-14","sourceNumber":14,"bucketLabel":"정보 보안","type":"short","language":"","question":"아래 설명하는 내용을 확인하여 알맞는 알고리즘을 작성하시오.\n\n- 대칭키 알고리즘으로 1997년 NIST(미국 국립기술표준원)에서 DES를 대체하기 위해 생성되었다.\n- 128비트, 192비트 또는 256비트의 가변 키 크기와 128비트의 고정 블록 크기를 사용한다.\n- 높은 안전성과 효율성, 속도 등으로 인해 DES 대신 전 세계적으로 많이 사용되고 있다.","code":"","images":[],"parts":[{"label":"정답","answers":["AES"]}],"explanation":"AES는 DES의 짧은 56비트 키 문제를 해결하기 위해 NIST가 공모해 채택한 대칭키 블록 암호이다. 블록 크기는 128비트로 고정이고 키 길이는 128·192·256비트 중 선택하며, 키 길이에 따라 라운드 수가 10·12·14회로 달라진다. DES의 64비트 블록·56비트 키, 3DES의 DES 3회 반복 구조와 구분하면 된다. RSA처럼 공개키 방식이 아니라 암복호화에 같은 키를 쓰는 대칭키 방식이라는 점도 함께 기억한다.","difficulty":"","point":"AES 대칭키 암호"},{"id":"past-2024-2-15","sourceNumber":15,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"#include \n\nint main() {\n\tint arr[3][3] = {1, 2, 3, 4, 5, 6, 7, 8, 9};\n\tint* parr[2] = {arr[1], arr[2]};\n\tprintf(\"%d\", parr[1][1] + *(parr[1]+2) + **parr);\n\n\treturn 0;\n}","images":[],"parts":[{"label":"정답","answers":["21"]}],"explanation":"arr는 3행 3열로 arr[0] = {1, 2, 3}, arr[1] = {4, 5, 6}, arr[2] = {7, 8, 9}이다. parr[0]은 arr[1]의 시작을, parr[1]은 arr[2]의 시작을 가리킨다. parr[1][1]은 arr[2][1] = 8, *(parr[1] + 2)는 arr[2][2] = 9, **parr는 *parr[0] 즉 arr[1][0] = 4이다. 따라서 8 + 9 + 4 = 21이 출력된다. 포인터 배열의 원소가 각 행의 시작 주소라는 점과 **parr가 parr[0][0]과 같다는 점이 핵심이다.","difficulty":"","point":"C 포인터 배열과 2차원 배열"},{"id":"past-2024-2-16","sourceNumber":16,"bucketLabel":"운영체제","type":"short","language":"","question":"아래의 표를 확인하여 SRT 스케줄링의 평균 대기시간을 계산하여 작성하시오.","code":"","images":["imported-images/2024-2-q16-1.png"],"parts":[{"label":"정답","answers":["6.5"]}],"explanation":"SRT는 남은 실행 시간이 가장 짧은 프로세스를 먼저 실행하며, 더 짧은 작업이 도착하면 선점한다. 0초에 A가 시작하고 1초에 B(4)가 도착하면 A의 남은 시간 7보다 짧아 B가 선점해 1~5초 동안 실행된다(그 사이 도착한 C 9, D 5보다 B의 남은 시간이 짧다). 5초에 남은 시간은 A 7, C 9, D 5이므로 D가 5~10초, A가 10~17초, C가 17~26초에 실행된다. 대기 시간(종료 - 도착 - 실행)은 A = 17 - 0 - 8 = 9, B = 5 - 1 - 4 = 0, C = 26 - 2 - 9 = 15, D = 10 - 3 - 5 = 2이다. 평균은 (9 + 0 + 15 + 2) / 4 = 26 / 4 = 6.5이다. 비선점형인 SJF와 달리 실행 중에도 선점된다는 점이 차이다.","difficulty":"","point":"SRT 평균 대기시간"},{"id":"past-2024-2-17","sourceNumber":17,"bucketLabel":"Java","type":"short","language":"","question":"다음 Java로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"public class Main {\n\tpublic static String rf(String str, int index, boolean[] seen) {\n\t\tif(index < 0) return \"\";\n\t\tchar c = str.charAt(index);\n\t\tString result = rf(str, index-1, seen);\n\t\tif(!seen[c]) {\n\t\t\tseen[c] = true;\n\t\t\treturn c + result;\n\t\t}\n\t\treturn result;\n\t}\n\tpublic static void main(String[] args) {\n\t\tString str = \"abacabcd\";\n\t\tint length = str.length();\n\t\tboolean[] seen = new boolean[256];\n\t\tSystem.out.print(rf(str, length-1, seen));\n\t}\n}","images":[],"parts":[{"label":"정답","answers":["dcba"]}],"explanation":"rf는 자기 자신을 먼저 호출(index - 1)한 뒤 현재 문자를 처리하므로, 실제 판정은 인덱스 0부터 왼쪽에서 오른쪽 순서로 이루어진다. 처음 보는 문자이면 seen에 표시하고 그 문자를 앞쪽 결과의 맨 앞에 붙이며, 이미 본 문자이면 결과를 그대로 넘긴다. abacabcd를 따라가면 a에서 a, b에서 ba, a는 중복, c에서 cba, 이후 a·b·c는 모두 중복, 마지막 d에서 dcba가 된다. 결국 중복을 제거한 첫 등장 순서 a, b, c, d가 뒤집혀 dcba가 출력된다. seen[c]에서 char가 아스키 코드값 인덱스로 쓰인다는 점도 확인해 둔다.","difficulty":"","point":"Java 재귀 중복 문자 제거"},{"id":"past-2024-2-18","sourceNumber":18,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"소프트웨어 설계에 대한 다음 설명에서 괄호에 들어갈 알맞은 용어를 쓰시오.\n\n- 어떤 모듈이 다른 모듈 내부의 논리적인 흐름을 제어하기 위해, 제어를 통신하거나 제어 요소를 전달하는 결합도이다.\n- 한 모듈이 다른 모듈의 상세한 처리 절차를 알고 있어 이를 통제하는 경우나 처리 기능이 두 모듈에 분리되어 설계된 경우에 발생한다.\n\n답 : (                   )  Coupling","code":"","images":[],"parts":[{"label":"정답","answers":["Control","제어","Control Coupling","제어 결합도","제어 결합도(Control Coupling)"]}],"explanation":"제어 결합도는 한 모듈이 다른 모듈에 플래그 같은 제어 신호를 넘겨 그 모듈 내부의 처리 흐름을 결정하는 결합이다. 호출하는 쪽이 호출받는 쪽의 내부 로직을 알아야 하므로 정보 은닉이 깨진다. 단순 값만 넘기는 자료 결합도, 구조체를 넘기는 스탬프 결합도보다 강하고, 전역 데이터를 공유하는 공통 결합도나 내부를 직접 참조하는 내용 결합도보다는 약하다. 결합도 순서는 자료 < 스탬프 < 제어 < 외부 < 공통 < 내용이다.","difficulty":"","point":"제어 결합도","unordered":false},{"id":"past-2024-2-19","sourceNumber":19,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"#include \n\nstruct node {\n\tint n1;\n\tstruct node *n2;\n};\n\nint main() {\n\tstruct node a = {10, 0};\n\tstruct node b = {20, 0};\n\tstruct node c = {30, 0};\n\n\tstruct node *head = &a;\n\ta.n2 = &b;\n\tb.n2 = &c;\n\n\tprintf(\"%d\", head -> n2 -> n1);\n\n        return 0;\n}","images":[],"parts":[{"label":"정답","answers":["20"]}],"explanation":"구조체 node는 정수 n1과 다음 노드를 가리키는 포인터 n2를 가진 연결 리스트 노드이다. a.n2 = &b, b.n2 = &c로 a → b → c 순서로 연결되고 head는 a를 가리킨다. head->n2는 b의 주소이고 head->n2->n1은 b의 n1이므로 20이 출력된다. 화살표 연산자(->)가 포인터를 따라가 멤버에 접근한다는 점과, 왼쪽부터 차례로 적용된다는 점이 핵심이다.","difficulty":"","point":"C 구조체 연결 리스트"},{"id":"past-2024-2-20","sourceNumber":20,"bucketLabel":"Java","type":"short","language":"","question":"다음 Java로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"public class Main {\n\tpublic static void main(String[] args) {\n\t\tString str = \"ITISTESTSTRING\";\n\t\tString[] result = str.split(\"T\");\n\t\tSystem.out.print(result[3]);\n\t}\n}","images":[],"parts":[{"label":"정답","answers":["S"]}],"explanation":"split(T)는 문자열을 T를 기준으로 잘라 배열을 만든다. ITISTESTSTRING에서 T의 위치로 나누면 I, IS, ES, S, RING의 5개 조각이 된다. 인덱스는 0부터이므로 result[3]은 S이다. Java의 split은 문자열 끝에 생기는 빈 문자열은 제거하지만 이 문자열은 G로 끝나 빈 조각이 생기지 않으며, 구분자 자체(T)는 결과에 포함되지 않는다는 점이 포인트다.","difficulty":"","point":"Java String split"}]},{"key":"past-2024-3","name":"2024년 3회 기출","questions":[{"id":"past-2024-3-1","sourceNumber":1,"bucketLabel":"Java","type":"short","language":"","question":"아래 자바 코드에서 출력되는 값을 작성하시오.","code":"public class Main {\n    static void func(String[] m, int n) {\n        for (int i = 1; i < n; i++) {\n            if (m[i-1].equals(m[i])) {  \n                System.out.print(\"O\");\n            } else {\n                System.out.print(\"N\");\n            }\n        }\n\n        for (String mo : m) {\n            System.out.print(mo);\n        }\n    }\n\n    public static void main(String[] args) {\n        String[] m = new String[3];\n        m[0] = \"A\";\n        m[1] = \"A\";\n        m[2] = new String(\"A\");  \n        func(m, 3);\n    }\n}","images":[],"parts":[{"label":"정답","answers":["OOAAA"]}],"explanation":"String의 equals는 참조가 아니라 문자열 내용을 비교한다. m[0]과 m[1]은 리터럴 A, m[2]는 new String(A)로 만든 별도 객체지만 내용이 모두 A이므로 i = 1, 2 두 번의 비교가 모두 true가 되어 OO가 출력된다. 이어서 향상된 for문이 배열 원소 A, A, A를 차례로 출력한다. 따라서 OOAAA가 출력된다. 만약 == 로 비교했다면 m[0]과 m[1]은 같은 상수 풀 객체라 true, m[1]과 m[2]는 다른 객체라 false가 되어 ON이 되었을 것이라는 점이 구분 포인트다.","difficulty":"","point":"Java String equals 비교"},{"id":"past-2024-3-2","sourceNumber":2,"bucketLabel":"Python","type":"short","language":"","question":"아래 코드에서 출력되는 값을 작성하시오.","code":"def test(lst):\n\tfor i in range(len(lst) // 2):\n\t\tlst[i], lst[-i-1] = lst[-i-1], lst[i]\nls = [1,2,3,4,5,6]\ntest(ls)\nprint(sum(ls[::2]) - sum(ls[1::2]))","images":[],"parts":[{"label":"정답","answers":["3"]}],"explanation":"test는 i = 0부터 len // 2 - 1까지 앞쪽 i번째와 뒤쪽 -i-1번째를 맞바꾸어 리스트를 뒤집는다. 길이 6이므로 i = 0, 1, 2에서 (1,6), (2,5), (3,4)가 교환되어 ls = [6, 5, 4, 3, 2, 1]이 된다. ls[::2]는 인덱스 0, 2, 4의 6, 4, 2로 합이 12이고, ls[1::2]는 인덱스 1, 3, 5의 5, 3, 1로 합이 9이다. 12 - 9 = 3이 출력된다. 리스트는 가변 객체라 함수 안의 변경이 호출한 쪽의 ls에 그대로 반영된다는 점도 핵심이다.","difficulty":"","point":"Python 리스트 뒤집기·슬라이싱"},{"id":"past-2024-3-3","sourceNumber":4,"bucketLabel":"운영체제","type":"short","language":"","question":"LRU 페이지 교체 알고리즘에 따른 페이지 부재 횟수를 작성하시오. (프레임 3칸)\n\n7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1","code":"","images":[],"parts":[{"label":"정답","answers":["12"]}],"explanation":"LRU는 가장 오랫동안 참조되지 않은 페이지를 교체한다. 프레임 3칸으로 따라가면 7, 0, 1이 차례로 부재(3회), 2는 7을 내보내며 부재(4), 0은 적중, 3은 1을 내보내며 부재(5), 0 적중, 4는 2를 내보내며 부재(6), 2는 3을 내보내며 부재(7), 3은 0을 내보내며 부재(8), 0은 4를 내보내며 부재(9), 3·2 적중, 1은 0을 내보내며 부재(10), 2 적중, 0은 3을 내보내며 부재(11), 1 적중, 7은 2를 내보내며 부재(12), 0·1 적중이다. 따라서 페이지 부재는 총 12회이다. 가장 먼저 들어온 페이지를 내보내는 FIFO(같은 문자열에서 15회), 앞으로 가장 오래 쓰이지 않을 페이지를 내보내는 OPT(9회)와 구분한다.","difficulty":"","point":"LRU 페이지 부재 횟수"},{"id":"past-2024-3-4","sourceNumber":5,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음으로 알맞은 용어를 작성하시오\n\nICMP, 송신 주소를 공격 대상의 IP 주소로 위장하고, 수신 주소를 해당 네트워크 라우터의 브로드캐스트 주소로 설정하는 공격으로 과부화 시키는 기법은? ICMP 패킷을 크게 만들어서 과부화 시키는 죽음의 핑과 같은 서비스 공격 유형이다.","code":"","images":[],"parts":[{"label":"정답","answers":["스머핑(Smurfing)","스머핑","Smurfing","Smurf","스머프 공격","Smurf Attack"]}],"explanation":"스머핑은 출발지 IP를 공격 대상의 주소로 위조한 ICMP Echo Request를 네트워크의 브로드캐스트 주소로 보내는 공격이다. 그 네트워크의 모든 호스트가 위조된 출발지, 즉 피해자에게 Echo Reply를 보내므로 응답이 증폭되어 피해자가 마비된다. 죽음의 핑(Ping of Death)은 허용 크기를 넘는 ICMP 패킷을 보내 재조립 과정에서 장애를 일으키는 공격이고, 랜드 어택은 출발지와 목적지를 모두 피해자 주소로 같게 만드는 공격이라 구분된다. 브로드캐스트 주소와 증폭이 스머핑의 핵심어이다.","difficulty":"","point":"스머핑 DoS 공격","unordered":false},{"id":"past-2024-3-5","sourceNumber":6,"bucketLabel":"C 언어","type":"short","language":"","question":"아래 코드에서 출력되는 값을 작성하시오.","code":"","images":["imported-images/2024-3-q05-1.png"],"parts":[{"label":"정답","answers":["20"]}],"explanation":"increment 안의 x는 static 지역 변수라 처음 한 번만 0으로 초기화되고 함수가 끝나도 값이 유지된다. 따라서 호출할 때마다 2, 4, 6, 8을 반환한다. main의 x는 이름만 같은 별개의 지역 변수이므로 x++는 결과에 영향을 주지 않는다. sum = 2 + 4 + 6 + 8 = 20이 출력된다. static이 없었다면 매번 0에서 시작해 2를 네 번 더한 8이 되었을 것이라는 점이 구분 포인트다.","difficulty":"","point":"C static 지역 변수"},{"id":"past-2024-3-6","sourceNumber":7,"bucketLabel":"네트워크","type":"short","language":"","question":"다음으로 알맞은 용어를 작성하시오\n\n인터넷을 통해 장치 간 사설 네트워크 연결을 생성하는 서비스로  장치의 실제 IP 주소를 가상 IP 주소로 대체하고, 데이터를 암호화하고, 데이터를 전 세계 보안 네트워크로 라우팅함으로써 정보를 보호하는 기법","code":"","images":[],"parts":[{"label":"정답","answers":["VPN"]}],"explanation":"VPN(가상 사설망)은 공용 인터넷 위에 암호화된 터널을 만들어 마치 전용 사설망처럼 안전하게 통신하게 하는 기술이다. 사용자의 실제 IP 대신 VPN 서버 쪽 IP가 드러나고, 오가는 데이터는 암호화되어 도청을 막는다. 구현 방식으로는 네트워크 계층의 IPsec VPN과 웹 브라우저 기반의 SSL VPN이 대표적이다. 사설망 연결, IP 대체, 암호화, 터널링이 정답을 고르는 핵심어이다.","difficulty":"","point":"VPN 가상 사설망"},{"id":"past-2024-3-7","sourceNumber":8,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"빈칸에 알맞은 용어를 작성하시오.\n\n(         ) 패턴은 객체 간의 상호 작용하는 방법과 책임을 분배하는 방법 에 중점을 두는 디자인 패턴으로 Command, Interpreter, Memento, Observer, Visitor등이 존재한다.","code":"","images":[],"parts":[{"label":"정답","answers":["행위"]}],"explanation":"GoF 디자인 패턴은 생성, 구조, 행위 패턴으로 나뉜다. 행위 패턴은 객체들이 어떻게 상호작용하고 책임을 나누는지에 초점을 두며 Command, Interpreter, Memento, Observer, Visitor, Iterator, Strategy, State, Template Method 등이 속한다. 생성 패턴은 객체 생성 방식(Singleton, Factory Method 등), 구조 패턴은 클래스·객체를 조합하는 방식(Adapter, Composite 등)을 다룬다. 설명의 「상호 작용」과 「책임 분배」가 행위 패턴을 가리키는 단서이다.","difficulty":"","point":"행위 디자인 패턴"},{"id":"past-2024-3-8","sourceNumber":9,"bucketLabel":"테스트","type":"short","language":"","question":"아래 설명에 맞는 테스트 커버리지를 보기에서 골라 기호로 작성하시오.\n\n① 소스 코드의 모든 구문이 한 번 이상 수행되도록 테스트 케이스를 설계한다.\n② 소스 코드의 모든 조건문에 대해 조건식의 결과가 True인 경우와 False인 경우가 한 번 이상 수행되도록 테스트 케이스를 설계한다.\n③ 소스 코드의 조건문에 포함된 개별 조건식의 결과가 True인 경우와 False인 경우가 한 번 이상 수행되도록 테스트 케이스를 설계한다.\n\n(보기)\n㉠ 선택 커버리지\n㉡ 경로 커버리지\n㉢ 조건 커버리지\n㉣ 분기 커버리지\n㉤ 함수 커버리지\n㉥ 문장 커버리지\n㉧ 루프 커버리지","code":"","images":[],"parts":[{"label":"①","answers":["㉥","㉥ 문장 커버리지","㉥ 문장"]},{"label":"②","answers":["㉣","㉣ 분기 커버리지","㉣ 분기"]},{"label":"③","answers":["㉢","㉢ 조건 커버리지","㉢ 조건"]}],"explanation":"① 모든 구문(문장)을 한 번 이상 실행하는 것은 문장 커버리지이다. ② 각 조건문(분기)의 전체 결과가 참과 거짓을 한 번 이상 갖게 하는 것은 분기(결정) 커버리지이다. ③ 조건문 안의 개별 조건식 각각이 참과 거짓을 한 번 이상 갖게 하는 것은 조건 커버리지이다. 분기 커버리지는 결정 전체의 결과를, 조건 커버리지는 결정을 이루는 개별 조건을 본다는 점이 구분 포인트이며, 둘을 함께 만족시키는 것이 조건/결정 커버리지이다. 따라서 답은 ㉥, ㉣, ㉢이다.","difficulty":"","point":"테스트 커버리지 종류","unordered":false},{"id":"past-2024-3-9","sourceNumber":10,"bucketLabel":"데이터베이스","type":"short","language":"","question":"아래 설명에 맞는 용어 보기에서 골라 빈칸에 작성하시오.\n\n1. 참조하는 테이블의 기본 키(Primary Key)를 가리키며, 데이터 무결성을 유지하는 데 중요한 역할을 한다. (          )\n\n2.  유일성과 최소성을 모두 갖춘 키이다. (          )\n\n3. 후보키 중에서 기본 키로 선택되지 않은 나머지 키이다. (         )\n\n4. 유일성을 만족시키지만, 최소성은 만족시키지 않는다.(          )\n\n\n(보기)\n㉠ 슈퍼키\n㉡ 외래키\n㉢ 대체키\n㉣ 후보키","code":"","images":[],"parts":[{"label":"1","answers":["㉡","㉡ 외래키","외래키"]},{"label":"2","answers":["㉣","㉣ 후보키","후보키"]},{"label":"3","answers":["㉢","㉢ 대체키","대체키"]},{"label":"4","answers":["㉠","㉠ 슈퍼키","슈퍼키"]}],"explanation":"1번은 다른 테이블의 기본키를 참조해 참조 무결성을 유지하는 외래키이다. 2번은 유일성과 최소성을 모두 갖춘 후보키이다. 3번은 후보키 중 기본키로 선택되지 않고 남은 대체키이다. 4번은 유일성은 만족하지만 최소성은 만족하지 않는, 즉 불필요한 속성이 섞여 있어도 되는 슈퍼키이다. 후보키에서 최소성을 빼면 슈퍼키, 후보키 중 하나를 고르면 기본키, 나머지가 대체키라는 관계로 정리하면 헷갈리지 않는다.","difficulty":"","point":"데이터베이스 키 종류","unordered":false},{"id":"past-2024-3-10","sourceNumber":11,"bucketLabel":"네트워크","type":"short","language":"","question":"아래 설명에 맞는 번호를 그림에서 골라 작성하시오.\n\nㄱ. 추가적인 질의를 제공하는 부분으로, 웹 서버에 전달할 추가 데이터를 나타낸다.(      )\n\nㄴ. 자원 경로를 나타내며, 서버 상에서 해당 리소스의 위치를 지정한다. (      )\n\nㄷ. 웹 프로토콜을 정의하는 부분으로, 예를 들어 HTTP, FTP 등의 방식을 나타낸다. (      )\n\nㄹ. 호스트와 포트 번호를 나타내는 부분으로, 서버 주소와 함께 포트번호를 나타낸다. (      )\n\nㅁ. 특정 페이지 내의 위치를 가리키며, 문서 내 특정 섹션으로 이동하는 데 사용된다. (      )","code":"","images":["imported-images/2024-3-q10-1.png"],"parts":[{"label":"ㄱ","answers":["④","④ query"]},{"label":"ㄴ","answers":["③","③ path"]},{"label":"ㄷ","answers":["①","① scheme"]},{"label":"ㄹ","answers":["②","② authority"]},{"label":"ㅁ","answers":["⑤","⑤ fragment"]}],"explanation":"URI는 scheme://authority/path?query#fragment 구조이다. ㄱ의 추가 질의 데이터는 ? 뒤의 query(④), ㄴ의 자원 경로는 path(③), ㄷ의 프로토콜 방식은 foo 같은 scheme(①), ㄹ의 호스트와 포트는 example.com:8042인 authority(②), ㅁ의 문서 내 특정 위치는 # 뒤의 fragment(⑤)이다. 따라서 순서대로 ④, ③, ①, ②, ⑤이다. fragment는 서버로 전송되지 않고 브라우저에서만 쓰인다는 점, query는 이름=값 쌍을 &로 이어 붙인다는 점도 함께 알아 둔다.","difficulty":"","point":"URI 구성 요소","unordered":false},{"id":"past-2024-3-11","sourceNumber":12,"bucketLabel":"C 언어","type":"short","language":"","question":"아래 C언어 코드에서 출력되는 값을 작성하시오.","code":"struct Node {\n    int value;\n    struct Node* next;  \n};\n\nvoid func(struct Node* node) {\n    while (node != NULL && node->next != NULL) {\n        int t = node->value;\n        node->value = node->next->value;\n        node->next->value = t;\n        node = node->next->next;\n    }\n}\n\nint main() {\n    struct Node n1 = {1, NULL};\n    struct Node n2 = {2, NULL};\n    struct Node n3 = {3, NULL};\n    \n    n1.next = &n3;  \n    n3.next = &n2;\n\n    func(&n1);\n\n    struct Node* current = &n1;\n    while (current != NULL) {\n        printf(\"%d\", current->value);  \n        current = current->next;\n    }\n}","images":[],"parts":[{"label":"정답","answers":["312"]}],"explanation":"연결 순서는 n1 → n3 → n2이므로 처음 값은 1, 3, 2 순서이다. func는 두 노드씩 짝지어 값을 맞바꾸고 두 칸 건너뛴다. 첫 반복에서 node = n1, 다음이 n3이므로 값을 바꿔 n1 = 3, n3 = 1이 되고, node는 n3->next인 n2로 이동한다. n2의 next가 NULL이라 반복이 끝난다. 이후 n1부터 따라가며 출력하면 3, 1, 2가 이어져 312가 출력된다(원문에 #include 줄은 생략되어 있다).","difficulty":"","point":"C 연결 리스트 값 교환"},{"id":"past-2024-3-12","sourceNumber":13,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음으로 알맞은 용어를 작성하시오\n\n(         ) 무결성은 데이터베이스의 테이블에서 기본 키(Primary Key) 값을 반드시 유일하고 NULL이 아니게 유지해야 한다는 규칙을 의미한다.","code":"","images":[],"parts":[{"label":"정답","answers":["개체"]}],"explanation":"개체 무결성은 기본키를 이루는 속성은 NULL일 수 없고 값이 중복되어서도 안 된다는 제약이다. 기본키로 각 튜플을 유일하게 식별해야 하기 때문이다. 외래키 값은 참조하는 테이블의 기본키 값이거나 NULL이어야 한다는 참조 무결성, 속성 값이 정해진 도메인 범위에 있어야 한다는 도메인 무결성과 구분한다. 「기본키」와 「유일·NULL 불가」가 개체 무결성의 핵심어이다.","difficulty":"","point":"개체 무결성"},{"id":"past-2024-3-13","sourceNumber":14,"bucketLabel":"Python","type":"short","language":"","question":"아래 코드에서 출력되는 값을 작성하시오.","code":"def test(v):\n\tif type(v) == type(\"\"):\n\t\treturn len(v)\n\telif type(v) == type(100):\n\t\treturn 101\n\telse:\n\t\treturn 20\na = \"100.0\"  \nb = 100.0 \nc = (100.0, 200.0)\nprint(test(a) + test(b) + test(c))","images":[],"parts":[{"label":"정답","answers":["45"]}],"explanation":"test는 인자가 문자열이면 길이를, 정수(int)이면 101을, 그 밖이면 20을 반환한다. a = 100.0은 따옴표로 감싼 문자열이므로 길이 5를 반환한다. b = 100.0은 소수점이 있는 float라 int와 타입이 달라 20을 반환한다. c는 튜플이므로 역시 20이다. 5 + 20 + 20 = 45가 출력된다. 100과 100.0은 값은 같아도 타입이 int와 float로 다르다는 점이 함정이다.","difficulty":"","point":"Python 자료형 판별"},{"id":"past-2024-3-14","sourceNumber":15,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"빈칸에 맞는 기호를 보기에서 골라 작성하시오.","code":"","images":["imported-images/2024-3-q14-1.png"],"parts":[{"label":"1","answers":["㉡","㉡ 연관"]},{"label":"2","answers":["㉢","㉢ 일반화"]},{"label":"3","answers":["㉠","㉠ 의존"]}],"explanation":"1번은 차와 엔진·부품·타이어의 관계로, 「차는 엔진을 가진다」처럼 전체와 부분을 이루는 관계이다. 집약·합성은 연관의 특수한 형태이므로 보기 중에서는 연관이 된다(복원된 그림에는 상속 삼각형이 그려져 있지만 의미상 부분-전체 관계이다). 2번은 트럭·버스·택시가 「차의 한 종류」인 is-a 관계이므로 일반화이다. 3번은 텔레비전이 리모콘을 잠시 이용하는 관계로, 점선 화살표가 의존 관계를 뜻한다. 따라서 1 연관, 2 일반화, 3 의존이다.","difficulty":"","point":"UML 클래스 관계","unordered":false},{"id":"past-2024-3-15","sourceNumber":16,"bucketLabel":"Java","type":"short","language":"","question":"아래 코드에서 출력되는 값을 작성하시오.","code":"public class Main {\n\tpublic static void main(String[] args) {\n\t\tint sum = 0;\n\t\ttry {\n\t\t\tfunc();\n\t\t} catch(NullPointerException e) {\n\t\t\tsum = sum + 1;\n\t\t} catch(Exception e) {\n\t\t\tsum = sum + 10;\n\t\t} finally {\n\t\t\tsum = sum + 100;\n\t\t}\n\t\tSystem.out.print(sum);\n\t}\n\tstatic void func() throws Exception {\n\t\tthrow new NullPointerException();\n\t}\n}","images":[],"parts":[{"label":"정답","answers":["101"]}],"explanation":"func는 NullPointerException을 던진다. catch는 위에서부터 차례로 타입을 맞춰 보며, 첫 catch가 NullPointerException이므로 여기서 잡혀 sum = 1이 되고 두 번째 catch(Exception)는 건너뛴다. finally는 예외 발생 여부와 관계없이 항상 실행되므로 sum = 101이 된다. 따라서 101이 출력된다. 하위 예외를 먼저, 상위 예외(Exception)를 나중에 써야 하며 순서가 반대면 컴파일 오류가 난다는 점도 함께 알아 둔다.","difficulty":"","point":"Java 예외 처리 순서"},{"id":"past-2024-3-16","sourceNumber":17,"bucketLabel":"Java","type":"short","language":"","question":"아래 코드에서 출력되는 값을 작성하시오.","code":"class B {\n\tint x = 3;\n\tint getX() {\n\t\treturn x * 2;\n\t}\n}\n\nclass A extends B {\n\tint x = 7;\n\t@Override\n\tint getX() {\n\t\treturn x * 3;\n\t}\n}\n\npublic class Annotation {\n\tpublic static void main(String[] args) {\n\t\tB b1 = new A(); \n\t\tA b2 = new A(); \n\t\tSystem.out.print(b1.getX() + b1.x + b2.getX() + b2.x);\n\t}\n}","images":[],"parts":[{"label":"정답","answers":["52"]}],"explanation":"메서드는 오버라이딩되면 실제 객체 타입 기준으로 호출되지만(동적 바인딩), 필드는 오버라이딩되지 않고 변수의 선언 타입 기준으로 접근된다. b1은 B 타입 변수에 A 객체이므로 b1.getX()는 A의 getX로 7 × 3 = 21, b1.x는 B의 x인 3이다. b2는 A 타입이므로 b2.getX() = 21, b2.x = 7이다. 21 + 3 + 21 + 7 = 52가 출력된다(모두 정수라 덧셈이 먼저 계산된다). A 안의 x는 B의 x를 가리는 별개의 필드라는 점이 핵심이다.","difficulty":"","point":"Java 필드 숨김과 동적 바인딩"},{"id":"past-2024-3-17","sourceNumber":18,"bucketLabel":"Java","type":"short","language":"","question":"아래 코드에서 출력되는 값을 작성하시오.","code":"","images":["imported-images/2024-3-q17-1.png"],"parts":[{"label":"정답","answers":["B0"]}],"explanation":"Container는 의도상 제네릭 클래스 Container<T>이다(복원된 코드에서 클래스 선언의 <T>가 빠져 있다). 오버로딩된 메서드 중 어떤 것을 부를지는 실행 시점의 실제 값이 아니라 컴파일 시점의 정적 타입으로 결정된다. value의 정적 타입은 T이고, 제한이 없는 T는 Object로 취급되므로 print(Object)가 선택된다. 실제로 담긴 값은 Integer 0이지만 print(Integer)나 print(Number)가 호출되지 않는다. 따라서 B와 0이 이어져 B0이 출력된다.","difficulty":"","point":"Java 제네릭과 오버로딩"},{"id":"past-2024-3-18","sourceNumber":20,"bucketLabel":"네트워크","type":"short","language":"","question":"아래 설명에 맞는 용어를 작성하시오.\n\n중앙 집중식 인프라 없이, 즉 사전 설정된 네트워크 기반 시설이 없이 구성된 자율형 네트워크를 의미합니다.\n이러한 네트워크는 노드(주로 무선 장치)가 서로 직접 연결하여 통신하며, 군사 작전 중에 실시간으로 정보를 공유하기 위한 네트워크로 사용된다.\n\nㄱ.Infrastructure Network ㄴ. Firmware Network        \nㄷ. Peer-to-Peer Network ㄹ. Ad-hoc Network \nㅁ. Mesh Network ㅂ.Sensor Network ㅅ.Virtual Private Network","code":"","images":[],"parts":[{"label":"정답","answers":["ㄹ","ㄹ. 애드혹 네트워크(Ad-hoc network)","ㄹ. 애드혹 네트워크","ㄹ. Ad-hoc Network","애드혹 네트워크","Ad-hoc Network","애드혹 네트워크(Ad-hoc network)"]}],"explanation":"애드혹 네트워크는 기지국이나 AP 같은 고정 기반 시설 없이 무선 노드들이 서로 직접 연결해 구성하는 자율 네트워크이다. 노드가 이동하며 스스로 경로를 찾아 중계하므로 군사 작전, 재난 현장처럼 기반 시설을 쓸 수 없는 곳에 적합하다. 인프라스트럭처 네트워크는 AP를 중심으로 동작하고, 메시 네트워크는 고정된 메시 라우터들이 그물처럼 연결되는 구조라 구분된다. 「중앙 기반 시설 없음」과 「군사 작전」이 핵심 단서이다.","difficulty":"","point":"애드혹 네트워크","unordered":false}]},{"key":"past-2025-1-1","name":"2025년 1회 기출 A","questions":[{"id":"past-2025-1-1","sourceNumber":1,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음은 네트워크 보완에 관련된 문제이다. 괄호안에 알맞는 용어를 작성하시오.\n\n(   )은/는 '세션을 가로채다.' 라는 의미로 다른 사람의 세션 상태를 훔치거나 도용하여 액세스하는 해킹 기법이다. \n\nTCP (   )은/는 TCP의 3-way 핸드셰이크가 완료된 후에 공격자가 시퀀스 번호 등을 조작하여 정상적인 세션을 가로채고 인증 없이 통신을 탈취하는 공격 공격이다.","code":"","images":[],"parts":[{"label":"정답","answers":["세션 하이재킹","Session Hijacking","세션 하이재킹(Session Hijacking)"]}],"explanation":"세션 하이재킹(Session Hijacking)은 이미 인증을 마친 사용자의 세션을 공격자가 가로채, 별도의 로그인 없이 그 사용자인 것처럼 통신을 이어 가는 공격이다. TCP 세션 하이재킹은 3-way 핸드셰이크로 연결이 맺어진 뒤 공격자가 시퀀스 번호(SEQ)와 확인 응답 번호(ACK)를 예측·조작해 정상 연결 사이에 끼어드는 방식이다. 웹에서는 세션 쿠키나 세션 ID를 탈취하는 형태로 나타난다. 연결 자체를 위조하는 IP 스푸핑, 중간에서 엿듣는 스니핑과 달리 '이미 성립된 세션을 빼앗는다'는 점이 핵심이다.","difficulty":"","point":"세션 하이재킹 개념","unordered":false},{"id":"past-2025-1-2","sourceNumber":2,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 제약조건과 관련된 문제이다. 괄호안에 알맞는 용어를 보기에 골라 작성하시오.","code":"","images":["imported-images/2025-1-q02-1.png"],"parts":[{"label":"ㄱ","answers":["도메인","도메인 무결성","Domain","Domain Integrity"]},{"label":"ㄴ","answers":["개체","개체 무결성","Entity","Entity Integrity"]},{"label":"ㄷ","answers":["참조","참조 무결성","Referential","Referential Integrity"]}],"explanation":"표의 (ㄱ)은 제약 대상이 속성이고 제약조건 수가 속성 개수와 같으므로, 각 속성 값이 정해진 데이터 타입·범위(도메인)에 속해야 한다는 도메인 무결성이다. (ㄴ)은 대상이 튜플이고 기본키에 NULL을 허용하지 않으며 릴레이션당 1개이므로, 기본키는 NULL이 될 수 없고 중복되면 안 된다는 개체 무결성이다. (ㄷ)은 외래키와 관련되고 부모 릴레이션의 수정·삭제 시에도 확인하므로, 외래키 값이 참조 대상 기본키 값이거나 NULL이어야 한다는 참조 무결성이다. 구분 요령은 「속성 범위=도메인, 기본키=개체, 외래키=참조」이며, 빈칸 순서대로 쓰면 도메인, 개체, 참조이다.","difficulty":"","point":"무결성 제약조건 구분","unordered":false},{"id":"past-2025-1-3","sourceNumber":1,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음은 네트워크 보완에 관련된 문제이다. 괄호안에 알맞는 용어를 작성하시오.\n\n(   )은/는 '세션을 가로채다.' 라는 의미로 다른 사람의 세션 상태를 훔치거나 도용하여 액세스하는 해킹 기법이다. \n\n \n\nTCP (   )은/는 TCP의 3-way 핸드셰이크가 완료된 후에 공격자가 시퀀스 번호 등을 조작하여 정상적인 세션을 가로채고 인증 없이 통신을 탈취하는 공격 공격이다.","code":"","images":[],"parts":[{"label":"정답","answers":["세션 하이재킹","Session Hijacking","세션 하이재킹(Session Hijacking)"]}],"explanation":"세션 하이재킹(Session Hijacking)은 이미 인증을 마친 사용자의 세션을 공격자가 가로채, 별도의 로그인 없이 그 사용자인 것처럼 통신을 이어 가는 공격이다. TCP 세션 하이재킹은 3-way 핸드셰이크로 연결이 맺어진 뒤 공격자가 시퀀스 번호(SEQ)와 확인 응답 번호(ACK)를 예측·조작해 정상 연결 사이에 끼어드는 방식이다. 웹에서는 세션 쿠키나 세션 ID를 탈취하는 형태로 나타난다. 연결 자체를 위조하는 IP 스푸핑, 중간에서 엿듣는 스니핑과 달리 '이미 성립된 세션을 빼앗는다'는 점이 핵심이다.","difficulty":"","point":"세션 하이재킹 개념","unordered":false},{"id":"past-2025-1-4","sourceNumber":2,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 제약조건과 관련된 문제이다. 괄호안에 알맞는 용어를 보기에 골라 작성하시오.\n\n개체, 참조, 도메인","code":"","images":["imported-images/2025-1-q04-1.png"],"parts":[{"label":"ㄱ","answers":["도메인","도메인 무결성","Domain","Domain Integrity"]},{"label":"ㄴ","answers":["개체","개체 무결성","Entity","Entity Integrity"]},{"label":"ㄷ","answers":["참조","참조 무결성","Referential","Referential Integrity"]}],"explanation":"표의 (ㄱ)은 제약 대상이 속성이고 제약조건 수가 속성 개수와 같으므로, 각 속성 값이 정해진 데이터 타입·범위(도메인)에 속해야 한다는 도메인 무결성이다. (ㄴ)은 대상이 튜플이고 기본키에 NULL을 허용하지 않으며 릴레이션당 1개이므로, 기본키는 NULL이 될 수 없고 중복되면 안 된다는 개체 무결성이다. (ㄷ)은 외래키와 관련되고 부모 릴레이션의 수정·삭제 시에도 확인하므로, 외래키 값이 참조 대상 기본키 값이거나 NULL이어야 한다는 참조 무결성이다. 구분 요령은 '속성 범위=도메인, 기본키=개체, 외래키=참조'로 기억하면 된다.","difficulty":"","point":"무결성 제약조건 구분","unordered":false},{"id":"past-2025-1-5","sourceNumber":3,"bucketLabel":"네트워크","type":"short","language":"","question":"아래의 내용에서 설명 글의 괄호안의 용어를 영문 약자로 작성하시오.\n\n(        ) 은/는 3글자의 영어 약자로 이루어진 오류 기법으로 데이터를 전송하거나 저장할 때 데이터의 오류를 감지하는 데 사용되는 오류 검출 코드이다.\n\n\n(        ) 은/는 데이터에 체크섬을 추가하여 데이터를 전송하거나 저장한 후, 수신 또는 읽을 때 이 체크섬을 다시 계산하여 데이터가 변경되었는지 확인하는 기법이다.\n\n\n(        ) 은/는 데이터 전송의 안정성을 높이는 데 중요한 역할을 한다.\n\n\n데이터는 이진수(0과 1)로 표현되며 정해진 다항식(x³ + x + 1)을 기반으로 데이터를 2진수 나눗셈하고나머지를 (       ) 값으로 삼는다.","code":"","images":[],"parts":[{"label":"정답","answers":["CRC","CRC(Cyclic Redundancy Check)","CRC(순환 중복 검사)","CRC(Cyclic Redundancy Check, 순환 중복 검사)"]}],"explanation":"CRC(Cyclic Redundancy Check, 순환 중복 검사)는 데이터를 이진 다항식으로 보고 미리 정한 생성 다항식(여기서는 x³+x+1, 즉 1011)으로 모듈로-2 나눗셈을 한 나머지를 검사값으로 붙이는 오류 검출 방식이다. 송신 측은 나머지를 덧붙여 보내고, 수신 측은 같은 다항식으로 다시 나눠 나머지가 0이 아니면 오류로 판단한다. 패리티 검사보다 연속(버스트) 오류 검출 능력이 뛰어나 이더넷 프레임 등에 널리 쓰인다. 오류를 찾기만 하는 검출 코드이므로, 오류 위치까지 찾아 고치는 해밍 코드(정정 코드)와 구분해야 한다.","difficulty":"","point":"CRC 오류 검출","unordered":false},{"id":"past-2025-1-6","sourceNumber":4,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음은 악성코드 관련된 문제이다. 아래 내용을 확인하여 보기에 골라 작성하시오.\n\n사용자가 원치 않는 소프트웨어를 구매하도록 조작하기 위해 사회 공학을 사용하여 충격, 불안 또는 위협에 대한 인식을 유발하는 악성 소프트웨어의 한 형태이다.\n\n‘겁을 주다’라는 영어 단어에서 유래한 것으로 공포를 이용하여 피해자를 속여 대가를 지불 하거나 특정 행동을 유도하는 랜섬웨어이다.\n\n가짜 바이러스 경고나 시스템 문제를 표시하여 사용자가 돈을 지불하거나 특정 소프트웨어를 설치하도록 속이는 방식으로 작동한다. \n\n\n보기\nㄱ. 컴포넌트 웨어  ㄴ. 유즈웨어  ㄷ. 셔블웨어  ㄹ. 스캐어 웨어  ㅁ. 안티 스파이 웨어  ㅂ. 네트웨어  ㅅ. 그룹웨어  ㅇ. 애드웨어","code":"","images":[],"parts":[{"label":"정답","answers":["ㄹ","ㄹ. 스캐어 웨어","스캐어 웨어","스케어웨어","Scareware","ㄹ. Scareware"]}],"explanation":"스케어웨어(Scareware)는 'scare(겁주다)'에서 이름이 온 악성 소프트웨어로, 가짜 바이러스 감염 경고나 시스템 오류 화면을 띄워 사용자를 불안하게 만든 뒤 쓸모없는 프로그램을 사거나 설치하게 유도한다. 기술적 침투보다 공포심을 자극하는 사회 공학이 핵심이다. 광고를 띄워 수익을 내는 애드웨어, 파일을 실제로 암호화해 몸값을 요구하는 일반 랜섬웨어와는 '거짓 위협으로 겁을 준다'는 점에서 구분된다. 보기의 그룹웨어·네트웨어·컴포넌트웨어 등은 악성코드가 아닌 일반 소프트웨어 용어이다.","difficulty":"","point":"스케어웨어 정의","unordered":false},{"id":"past-2025-1-7","sourceNumber":5,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"public class Main {\n \n  public static void main(String[] args) {\n \n    int a=5,b=0;\n \n    try{\n      System.out.print(a/b);\n    }catch(ArithmeticException e){\n      System.out.print(\"출력1\");\n    }catch(ArrayIndexOutOfBoundsException e) {\n      System.out.print(\"출력2\");\n    }catch(NumberFormatException e) {\n      System.out.print(\"출력3\");\n    }catch(Exception e){\n      System.out.print(\"출력4\");\n    }finally{\n      System.out.print(\"출력5\");\n    }\n  }\n}","images":[],"parts":[{"label":"정답","answers":["출력1출력5"]}],"explanation":"try 블록에서 a/b, 즉 5/0을 계산하는데 정수를 0으로 나누면 ArithmeticException이 발생해 print는 실행되지 않는다. catch 블록은 위에서부터 차례로 검사되므로 첫 번째 catch(ArithmeticException)가 잡아 \"출력1\"을 출력하고, 나머지 catch는 건너뛴다. finally 블록은 예외 발생 여부와 관계없이 항상 실행되므로 이어서 \"출력5\"가 출력된다. print는 줄바꿈이 없으므로 최종 출력은 「출력1출력5」이다. 참고로 실수형(double) 나눗셈이었다면 예외 없이 Infinity가 출력된다.","difficulty":"","point":"Java 예외 처리 흐름"},{"id":"past-2025-1-8","sourceNumber":6,"bucketLabel":"네트워크","type":"short","language":"","question":"아래 내용은 ARP/RARP에 대한 설명이다. 각 설명에 해당하는 것을 작성하시오.\n\n( 1 ) 은/는 네트워크상에서 IP 주소를 MAC 주소로 변환하는 프로토콜이고,\n\n( 2 ) 은/는 MAC 주소를 IP 주소로 변환하는 프로토콜이다.","code":"","images":[],"parts":[{"label":"(1)","answers":["ARP","Address Resolution Protocol","ARP(Address Resolution Protocol)"]},{"label":"(2)","answers":["RARP","Reverse ARP","Reverse Address Resolution Protocol","RARP(Reverse Address Resolution Protocol)"]}],"explanation":"ARP(Address Resolution Protocol)는 IP 주소를 알고 있을 때 같은 네트워크에 브로드캐스트로 질의해 해당 장비의 MAC(물리) 주소를 알아내는 프로토콜이다. RARP(Reverse ARP)는 반대로 자신의 MAC 주소만 알고 IP 주소를 모를 때(예: 디스크 없는 단말) 서버에 IP 주소를 요청하는 프로토콜이다. 방향을 '논리 주소→물리 주소는 ARP, 물리 주소→논리 주소는 R(Reverse)ARP'로 기억하면 헷갈리지 않는다. 오늘날 RARP의 역할은 BOOTP·DHCP가 대신한다.","difficulty":"","point":"ARP와 RARP 구분","unordered":false},{"id":"past-2025-1-9","sourceNumber":7,"bucketLabel":"SQL","type":"code","language":"","question":"다음은 SQL 문제이다. 아래 두 테이블을 참고하여 보기에 쿼리 실행 결과를 작성하시오.","code":"[보기]\n\nSELECT name, incentive FROM emp, sal WHERE emp.id = sal.id and incentives >= 500","images":["imported-images/2025-1-q09-1.png"],"parts":[{"label":"정답","answers":["name  |  incentives\n이순신 | 1000"]}],"explanation":"FROM emp, sal에 WHERE emp.id = sal.id를 주면 두 테이블의 id가 같은 행끼리만 결합하는 동등 조인이 된다. 양쪽에 모두 있는 id는 1002(홍길동, 300), 1004(강감찬, 300), 1008(이순신, 1000)이고, 1001은 sal에, 1009는 emp에 없어 제외된다. 여기에 incentives >= 500 조건을 걸면 1008 이순신(1000)만 남는다. 따라서 결과는 name 이순신, incentives 1000의 한 행이다. 문제의 SELECT 절에 incentive로 적힌 것은 복원 과정의 오타로 보고 incentives 컬럼으로 해석했다.","difficulty":"","point":"SQL 동등 조인 결과"},{"id":"past-2025-1-10","sourceNumber":8,"bucketLabel":"데이터베이스","type":"short","language":"","question":"아래는 데이터베이스에 관련된 설명이다. 알맞는 용어를 보기에서 골라 괄호를 작성하시오.\n\n1. 릴레이션에서 속성의 개수를 의미 : ( 1 )\n\n2. 릴레이션에서 튜플의 개수를 의미 : ( 2 )\n\n3. 한 릴레이션의 속상이 다른 릴레이션의 기본 키를 참조할 때, 참조하는 속성을 의미 : ( 3 )\n\n4. 특정 속성에 대해 입력될 수 있는 값의 유형이나 범위를 의미하고 무결성을 보장하는 기준 : ( 4 )\n\n[보기]\nㄱ. domain   ㄴ. primary   ㄷ. degree    ㄹ. candidate   ㅁ. cardinality   ㅂ. attribute   ㅅ. foreign","code":"","images":[],"parts":[{"label":"(1)","answers":["ㄷ","ㄷ. degree","degree"]},{"label":"(2)","answers":["ㅁ","ㅁ. cardinality","cardinality"]},{"label":"(3)","answers":["ㅅ","ㅅ. foreign","foreign"]},{"label":"(4)","answers":["ㄱ","ㄱ. domain","domain"]}],"explanation":"릴레이션의 속성(열) 개수는 차수(degree), 튜플(행) 개수는 카디널리티(cardinality)이다. 다른 릴레이션의 기본키를 참조하는 속성은 외래키(foreign key)이고, 한 속성이 가질 수 있는 값의 타입·범위 집합은 도메인(domain)이다. 차수와 카디널리티는 자주 뒤바뀌므로 '차수=열의 수, 카디널리티=행의 수'로 정리해 둔다. 보기의 candidate(후보키)는 유일성과 최소성을 만족하는 키, primary(기본키)는 후보키 중 선택된 키이며 attribute는 속성 자체를 뜻하므로 답이 아니다. 따라서 (1) ㄷ, (2) ㅁ, (3) ㅅ, (4) ㄱ이다.","difficulty":"","point":"릴레이션 구성 용어","unordered":false},{"id":"past-2025-1-11","sourceNumber":9,"bucketLabel":"네트워크","type":"short","language":"","question":"IP 주소가 192.168.35.10, 서브넷 255.255.252.0인 PC에서 브로드캐스팅으로 다른 IP로 정보를 전달한다고 할 때 수신할 수 있는 알맞는 IP를 보기에서 골라 모두 작성하시오.\n\n[보기]\n\nㄱ. 192.168.34.1 \nㄴ. 192.168.32.19\nㄷ. 192.168.35.200\nㄹ. 192.168.33.138\nㅁ. 192.168.35.50","code":"","images":[],"parts":[{"label":"정답","answers":["ㄱ,ㄴ,ㄷ,ㄹ,ㅁ"]}],"explanation":"서브넷 마스크 255.255.252.0은 /22로, 세 번째 옥텟 252는 2진수 11111100이라 하위 2비트가 호스트 영역이다. IP 192.168.35.10의 세 번째 옥텟 35(00100011)와 252를 AND하면 32가 되므로 네트워크 주소는 192.168.32.0이다. 블록 크기가 4이므로 이 네트워크 범위는 192.168.32.0~192.168.35.255이고 브로드캐스트 주소는 192.168.35.255이다. 보기의 세 번째 옥텟은 34, 32, 35, 33, 35로 모두 32~35 사이에 있으므로 다섯 개 모두 같은 네트워크에 속해 브로드캐스트를 받는다.","difficulty":"","point":"서브넷 브로드캐스트 범위"},{"id":"past-2025-1-12","sourceNumber":10,"bucketLabel":"C 언어","type":"code","language":"","question":"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-1-q12-1.png"],"parts":[{"label":"정답","answers":["4\nBACDE"]}],"explanation":"Data는 {'B','A','D','E'}로 초기화되고 남은 Data[4]는 널 문자(0)이다. 먼저 Data[3]-Data[1]은 'E'(69)-'A'(65)=4이므로 4와 줄바꿈이 출력된다. 첫 for문은 c='C'보다 큰 문자를 찾는데 i=0('B'), i=1('A')은 아니고 i=2('D')에서 break하므로 i=2이다. temp='D'를 보관하고 Data[2]='C'로 넣은 뒤 i=3부터 한 칸씩 밀어낸다: i=3에서 Data[3]='D'(temp='E'), i=4에서 Data[4]='E'(temp=0). 결과 배열은 B, A, C, D, E이므로 두 번째 줄에 BACDE가 출력된다(정렬이 아니라 'C보다 큰 첫 위치에 삽입' 로직이다).","difficulty":"","point":"C 배열 삽입·밀어내기"},{"id":"past-2025-1-13","sourceNumber":11,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-1-q13-1.png"],"parts":[{"label":"정답","answers":["13"]}],"explanation":"set 함수는 data[i]를 arr[((i+1)/3)%3][(i+1)%3]에 넣으므로, 위치가 한 칸씩 밀려 저장된다. i=0~7은 차례로 (0,1)=5, (0,2)=2, (1,0)=7, (1,1)=4, (1,2)=1, (2,0)=8, (2,1)=3, (2,2)=6에 들어가고, 마지막 i=8은 (9/3)%3=0, 9%3=0이라 (0,0)=9가 된다. 그래서 arr는 [9,5,2], [7,4,1], [8,3,6]이다. 합계 루프는 i를 0~8로 돌며 arr[i/3][i%3]에 짝수 i는 +1, 홀수 i는 -1을 곱하므로 9-5+2-7+4-1+8-3+6을 계산한다. 누적값은 9, 4, 6, -1, 3, 2, 10, 7, 13으로 최종 출력은 13이다.","difficulty":"","point":"C 2차원 동적 배열 인덱스"},{"id":"past-2025-1-14","sourceNumber":12,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 결합도와 관련된 내용이다. 보기에 알맞는 답을 골라 작성하시오.\n\n(1) 다른 모듈 내부에 있는 변수나 기능을 다른 모듈에서 사용하는 경우의 결합도\n\n(2) 모듈 간의 인터페이스로 배열이나 오브젝트, 자료구조 등이 전달되는 경우의 결합도\n\n(3) 파라미터가 아닌 모듈 밖에 선언되어 있는 전역 변수를 참조하고 전역 변수를 갱신하는 식으로 상호작용하는 경우의 결합도\n\n[보기]\n\nㄱ. 자료 결합도  ㄴ. 스탬프 결합도 ㄷ. 제어 결합도  ㄹ. 공통 결합도  ㅁ. 내용 결합도  ㅂ. 외부 결합도","code":"","images":[],"parts":[{"label":"(1)","answers":["ㅁ","ㅁ. 내용 결합도","ㅁ. 내용","내용 결합도","내용"]},{"label":"(2)","answers":["ㄴ","ㄴ. 스탬프 결합도","ㄴ. 스탬프","스탬프 결합도","스탬프"]},{"label":"(3)","answers":["ㄹ","ㄹ. 공통 결합도","ㄹ. 공통","공통 결합도","공통"]}],"explanation":"(1) 한 모듈이 다른 모듈의 내부 변수나 기능을 직접 참조·변경하는 것은 결합도가 가장 강한 내용 결합도(Content)이다. (2) 모듈 사이에 배열·객체·레코드 같은 자료구조를 통째로 넘기는 것은 스탬프 결합도(Stamp)이며, 단순한 값(스칼라)만 넘기는 자료 결합도(Data)와 구분된다. (3) 파라미터 대신 모듈 밖의 전역 변수를 함께 참조·갱신하는 것은 공통 결합도(Common)이다. 전역 변수가 아닌 외부에서 선언된 데이터(외부 파일·장치 형식 등)를 공유하면 외부 결합도, 플래그 같은 제어 신호를 넘기면 제어 결합도이다. 결합도 강도 순서는 내용 > 공통 > 외부 > 제어 > 스탬프 > 자료이다.","difficulty":"","point":"모듈 결합도 종류","unordered":false},{"id":"past-2025-1-15","sourceNumber":13,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"public class Main {\n    public static void main(String[] args) {\n        new Child();\n        System.out.println(Parent.total);\n    }\n}\n \n \nclass Parent {\n    static int total = 0;\n    int v = 1;\n \n    public Parent() {\n        total += (++v);\n        show();    \n    }\n \n    public void show() {\n        total += total;\n    }\n}\n \n \nclass Child extends Parent {\n    int v = 10;\n \n    public Child() {\n        v += 2;\n        total += v++;\n        show();\n    }\n \n    @Override\n    public void show() {\n        total += total * 2;\n    }\n}","images":[],"parts":[{"label":"정답","answers":["54"]}],"explanation":"new Child()를 하면 먼저 부모 생성자 Parent()가 실행된다. Parent의 v는 1이므로 ++v로 2가 되어 total=2가 되고, 이어서 호출되는 show()는 동적 바인딩 때문에 오버라이딩된 Child.show()가 실행되어 total = 2 + 2*2 = 6이 된다. 부모 생성자가 끝나면 Child의 필드 초기화(v=10)가 이루어지고, Child 생성자에서 v += 2로 v=12, total += v++로 total=6+12=18(이후 v=13)이 된다. 마지막 show()도 Child.show()이므로 total = 18 + 18*2 = 54이다. 부모와 자식의 v는 이름만 같은 별개의 필드(필드 하이딩)이며, 메서드만 오버라이딩된다는 점이 핵심이다.","difficulty":"","point":"Java 생성자 순서·동적 바인딩"},{"id":"past-2025-1-16","sourceNumber":14,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"아래는 디자인 패턴에 대한 설명이다. 알맞는 답을 보기에 골라 작성하시오.\n\n서로 다른 인터페이스를 가진 클래스들을 연결해 사용 가능하게 한다.\n\n기존 클래스(Adaptee)를 원하는 인터페이스(Target)에 맞게 변환하는 어댑터(Adapter)를 만든다.\n\n기존 클래스를 감싸서(wrapper) 인터페이스를 변환해주는 역할을 한다.","code":"","images":["imported-images/2025-1-q16-1.png"],"parts":[{"label":"정답","answers":["Adapter"]}],"explanation":"설명은 인터페이스가 서로 맞지 않는 기존 클래스(Adaptee)를 감싸서(wrapper) 클라이언트가 원하는 인터페이스(Target)로 바꿔 주는 구조 패턴인 어댑터(Adapter) 패턴이다. 콘센트 변환 플러그처럼 기존 코드를 고치지 않고 연결만 맞춰 준다는 것이 핵심이다. 같은 구조 패턴인 데코레이터(Decorator)도 객체를 감싸지만 인터페이스는 그대로 두고 기능을 덧붙이며, 퍼사드(Facade)는 여러 하위 시스템을 하나의 단순한 창구로 묶는다는 점에서 다르다. 브리지(Bridge)는 구현과 추상을 처음부터 분리하는 설계라 기존 클래스를 변환하는 어댑터와 구분된다.","difficulty":"","point":"어댑터 패턴"},{"id":"past-2025-1-17","sourceNumber":15,"bucketLabel":"테스트","type":"short","language":"","question":"문장(Statement) 커버리지 테스트를 수행하려고 한다. 코드를 아래의 제어 흐름도 빈칸에 연결되도록 작성하고 문장 커버리지 순서대로 작성하시오.","code":"int Main(int b[], int m, int x) {\n    int a = 0;\n    while (a < m || b[a] < x) {\n        if (b[a] < 0)\n            b[a] = -b[a];\n        a++;\n    }\n    return 1;\n}\n\n\n보기\n1. (    ①    )    2. (    ②    )    3. (    ③    )    4. (    ④    )    5. (    ⑤    )  6. (    ⑥    )\n문장 커버리지 순서 1 → 2  → (          ⑦           )","images":["imported-images/2025-1-q17-1.png"],"parts":[{"label":"①","answers":["int a = 0"]},{"label":"②","answers":["a < m || b[a] < x","while (a < m || b[a] < x)"]},{"label":"③","answers":["b[a] < 0","if (b[a] < 0)"]},{"label":"④","answers":["b[a] = -b[a];"]},{"label":"⑤","answers":["a++;"]},{"label":"⑥","answers":["return 1;"]},{"label":"⑦","answers":["③ → ④ → ⑤ → ② → ⑥","3 → 4 → 5 → 2 → 6"]}],"explanation":"흐름도에서 1은 시작 문장 int a = 0, 2는 while 조건 a < m || b[a] < x, 3은 if 조건 b[a] < 0, 4는 b[a] = -b[a], 5는 a++, 6은 반복 종료 후의 return 1이다. 2의 조건이 거짓이면 6으로 빠져나가고, 3의 조건이 거짓이면 4를 건너뛰고 5로 가며, 5가 끝나면 다시 2로 돌아간다. 문장 커버리지는 모든 문장이 최소 한 번 실행되면 충족되므로, 3이 참이 되어 4를 거치는 경로가 반드시 포함되어야 한다. 따라서 1 → 2 → 3 → 4 → 5 → 2 → 6 경로 하나로 모든 문장을 실행할 수 있어 ⑦은 ③ → ④ → ⑤ → ② → ⑥이다. 결정의 참·거짓을 모두 거쳐야 하는 분기(결정) 커버리지와 달리, 문장 커버리지는 문장 실행 여부만 따진다.","difficulty":"","point":"문장 커버리지 흐름도","unordered":false},{"id":"past-2025-1-18","sourceNumber":16,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"public class Main {\n \n    public static void main(String[] args) {\n        int[] data = {3, 5, 8, 12, 17};\n        System.out.println(func(data, 0, data.length - 1));\n    }\n \n    static int func(int[] a, int st, int end) {\n        if (st >= end) return 0;\n        int mid = (st + end) / 2;\n        return a[mid] + Math.max(func(a, st, mid), func(a, mid + 1, end));\n    } \n \n}","images":[],"parts":[{"label":"정답","answers":["20"]}],"explanation":"func는 구간 [st, end]의 가운데 값 a[mid]에 왼쪽 절반과 오른쪽 절반 결과 중 큰 값을 더하는 재귀 함수이고, st >= end이면 0을 반환한다. func(0,4)는 mid=2라 a[2]=8 + max(func(0,2), func(3,4))이다. func(0,2)는 mid=1이라 5 + max(func(0,1), func(2,2))인데, func(0,1)은 mid=0이라 3 + max(0, 0) = 3이고 func(2,2)=0이므로 5+3=8이다. func(3,4)는 mid=3이라 12 + max(func(3,3), func(4,4)) = 12+0 = 12이다. 따라서 결과는 8 + max(8, 12) = 20이다.","difficulty":"","point":"Java 분할 재귀 최댓값"},{"id":"past-2025-1-19","sourceNumber":17,"bucketLabel":"Python","type":"short","language":"","question":"다음은 파이썬에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"class Node:\n    def __init__(self, value):\n        self.value = value\n        self.children = []\n \ndef tree(li):\n    nodes = [Node(i) for i in li]\n    for i in range(1, len(li)):\n        nodes[(i - 1) // 2].children.append(nodes[i])\n    return nodes[0]\n \ndef calc(node, level=0):\n    if node is None:\n        return 0\n    return (node.value if level % 2 == 1 else 0) + sum(calc(n, level + 1) for n in node.children)\n \nli = [3, 5, 8, 12, 15, 18, 21]\n \nroot = tree(li)\n \nprint(calc(root))","images":[],"parts":[{"label":"정답","answers":["13"]}],"explanation":"tree 함수는 리스트를 배열 기반 완전 이진트리처럼 연결한다: i번째 노드의 부모는 (i-1)//2번째 노드이다. 따라서 루트 3(레벨 0) 아래에 5, 8(레벨 1)이 있고, 5 아래에 12, 15, 8 아래에 18, 21(레벨 2)이 붙는다. calc는 레벨이 홀수인 노드의 값만 더하고 짝수 레벨은 0으로 처리하면서 자식들을 재귀로 합산한다. 홀수 레벨은 레벨 1뿐이므로 5 + 8 = 13이 출력된다. level 기본값 0에서 시작해 자식으로 내려갈 때마다 1씩 증가한다는 점을 놓치지 않아야 한다.","difficulty":"","point":"Python 트리 레벨별 합"},{"id":"past-2025-1-20","sourceNumber":18,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-1-q20-1.png"],"parts":[{"label":"정답","answers":["35421"]}],"explanation":"insert는 새 노드를 리스트 맨 앞에 붙이므로 1부터 5까지 넣으면 리스트는 5 → 4 → 3 → 2 → 1이 된다. reconnect(head, 3)은 head부터 값 3을 찾으며 prev=4, curr=3 위치에서 멈춘다. 이후 prev(4)의 next를 curr의 next(2)로 이어 3을 빼내고, 3의 next를 기존 head(5)로 연결한 뒤 head를 3으로 바꾼다. 결과 리스트는 3 → 5 → 4 → 2 → 1이며, 줄바꿈 없이 출력하므로 35421이다. 찾는 값이 이미 맨 앞이면(head->value == value) 아무것도 바꾸지 않는다는 조건도 함께 기억해 둔다.","difficulty":"","point":"C 연결 리스트 노드 이동"}]},{"key":"past-2025-1-2","name":"2025년 1회 기출 B","questions":[{"id":"past-2025-1-21","sourceNumber":19,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"#include \n \ntypedef struct student {\n    char* name;\n    int score[3];\n} Student;\n \nint dec(int enc) {\n    return enc & 0xA5;\n}\n \nint sum(Student* p) {\n    return dec(p->score[0]) + dec(p->score[1]) + dec(p->score[2]);\n}\n \nint main() {\n    Student s[2] = { \"Kim\", {0xA0, 0xA5, 0xDB}, \"Lee\", {0xA0, 0xED, 0x81} };\n    Student* p = s;\n    int result = 0;\n \n    for (int i = 0; i < 2; i++) {\n        result += sum(&s[i]);\n    }\n    printf(\"%d\", result);\n    return 0;\n}","images":[],"parts":[{"label":"정답","answers":["908"]}],"explanation":"dec는 값과 0xA5(1010 0101)를 비트 AND 하므로, 0xA5에서 1인 비트만 남긴다. Kim의 점수는 0xA0(1010 0000)&0xA5=0xA0=160, 0xA5&0xA5=165, 0xDB(1101 1011)&0xA5=1000 0001=0x81=129로 합이 454이다. Lee의 점수는 0xA0→160, 0xED(1110 1101)&0xA5=1010 0101=165, 0x81(1000 0001)&0xA5=0x81=129로 역시 합이 454이다. 두 학생의 합을 더한 result는 454+454=908이며 %d로 출력된다. 비트 OR(|)나 XOR(^)과 혼동하지 않도록, AND는 두 비트가 모두 1일 때만 1이라는 점을 확인한다.","difficulty":"","point":"C 비트 AND 연산"},{"id":"past-2025-1-22","sourceNumber":20,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-1-q22-1.png"],"parts":[{"label":"정답","answers":["4"]}],"explanation":"main에서 calc(\"5\")는 문자열 인자이므로 오버로딩된 calc(String)이 호출되고, value=5가 되어 calc(4) + calc(2)를 반환한다. 이때 4와 2는 int이므로 이후 호출은 모두 calc(int)이며, 이 메서드는 calc(n-1)+calc(n-2), n<=1이면 n을 돌려주는 피보나치 수열이다. calc(0)=0, calc(1)=1, calc(2)=1, calc(3)=2, calc(4)=3이므로 결과는 3 + 1 = 4이다. 오버로딩은 컴파일 시점에 인자 타입으로 호출할 메서드가 결정되므로, String 버전은 처음 한 번만 실행된다는 점이 함정이다.","difficulty":"","point":"Java 메서드 오버로딩 재귀"},{"id":"past-2025-1-23","sourceNumber":3,"bucketLabel":"네트워크","type":"short","language":"","question":"아래의 내용에서 설명 글의 괄호안의 용어를 영문 약자로 작성하시오.\n\n(        ) 은/는 3글자의 영어 약자로 이루어진 오류 기법으로 데이터를 전송하거나 저장할 때 데이터의 오류를 감지하는 데 사용되는 오류 검출 코드이다.\n\n\n(        ) 은/는 데이터에 체크섬을 추가하여 데이터를 전송하거나 저장한 후, 수신 또는 읽을 때 이 체크섬을 다시 계산하여 데이터가 변경되었는지 확인하는 기법이다.\n\n\n(        ) 은/는 데이터 전송의 안정성을 높이는 데 중요한 역할을 한다.\n\n\n데이터는 이진수(0과 1)로 표현되며 정해진 다항식(x³ + x + 1)을 기반으로 데이터를 2진수 나눗셈하고나머지를 (       ) 값으로 삼는다.","code":"","images":[],"parts":[{"label":"정답","answers":["CRC","CRC(Cyclic Redundancy Check)","CRC(순환 중복 검사)","CRC(Cyclic Redundancy Check, 순환 중복 검사)"]}],"explanation":"CRC(Cyclic Redundancy Check, 순환 중복 검사)는 데이터를 이진 다항식으로 보고 미리 정한 생성 다항식(여기서는 x³+x+1, 즉 1011)으로 모듈로-2 나눗셈을 한 나머지를 검사값으로 붙이는 오류 검출 방식이다. 송신 측은 나머지를 덧붙여 보내고, 수신 측은 같은 다항식으로 다시 나눠 나머지가 0이 아니면 오류로 판단한다. 패리티 검사보다 연속(버스트) 오류 검출 능력이 뛰어나 이더넷 프레임 등에 널리 쓰인다. 오류를 찾기만 하는 검출 코드이므로, 오류 위치까지 찾아 고치는 해밍 코드(정정 코드)와 구분해야 한다.","difficulty":"","point":"CRC 오류 검출","unordered":false},{"id":"past-2025-1-24","sourceNumber":4,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음은 악성코드 관련된 문제이다. 아래 내용을 확인하여 보기에 골라 작성하시오.\n\n사용자가 원치 않는 소프트웨어를 구매하도록 조작하기 위해 사회 공학을 사용하여 충격, 불안 또는 위협에 대한 인식을 유발하는 악성 소프트웨어의 한 형태이다.\n\n‘겁을 주다’라는 영어 단어에서 유래한 것으로 공포를 이용하여 피해자를 속여 대가를 지불 하거나 특정 행동을 유도하는 랜섬웨어이다.\n\n가짜 바이러스 경고나 시스템 문제를 표시하여 사용자가 돈을 지불하거나 특정 소프트웨어를 설치하도록 속이는 방식으로 작동한다.","code":"","images":[],"parts":[{"label":"정답","answers":["ㄹ","ㄹ. 스캐어 웨어","스캐어 웨어","스케어웨어","Scareware","ㄹ. Scareware"]}],"explanation":"스케어웨어(Scareware)는 'scare(겁주다)'에서 이름이 온 악성 소프트웨어로, 가짜 바이러스 감염 경고나 시스템 오류 화면을 띄워 사용자를 불안하게 만든 뒤 쓸모없는 프로그램을 사거나 설치하게 유도한다. 기술적 침투보다 공포심을 자극하는 사회 공학이 핵심이다. 광고를 띄워 수익을 내는 애드웨어, 파일을 실제로 암호화해 몸값을 요구하는 일반 랜섬웨어와는 '거짓 위협으로 겁을 준다'는 점에서 구분된다. 이 문항 본문에는 보기가 빠져 있으나 원 문제의 보기에서 ㄹ이 스캐어 웨어이다.","difficulty":"","point":"스케어웨어 정의","unordered":false},{"id":"past-2025-1-25","sourceNumber":5,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"public class Main {\n \n  public static void main(String[] args) {\n \n    int a=5,b=0;\n \n    try{\n      System.out.print(a/b);\n    }catch(ArithmeticException e){\n      System.out.print(\"출력1\");\n    }catch(ArrayIndexOutOfBoundsException e) {\n      System.out.print(\"출력2\");\n    }catch(NumberFormatException e) {\n      System.out.print(\"출력3\");\n    }catch(Exception e){\n      System.out.print(\"출력4\");\n    }finally{\n      System.out.print(\"출력5\");\n    }\n  }\n}","images":[],"parts":[{"label":"정답","answers":["출력1출력5"]}],"explanation":"try 블록에서 a/b, 즉 5/0을 계산하는데 정수를 0으로 나누면 ArithmeticException이 발생해 print는 실행되지 않는다. catch 블록은 위에서부터 차례로 검사되므로 첫 번째 catch(ArithmeticException)가 잡아 \"출력1\"을 출력하고, 나머지 catch는 건너뛴다. finally 블록은 예외 발생 여부와 관계없이 항상 실행되므로 이어서 \"출력5\"가 출력된다. print는 줄바꿈이 없으므로 최종 출력은 「출력1출력5」이다. 참고로 실수형(double) 나눗셈이었다면 예외 없이 Infinity가 출력된다.","difficulty":"","point":"Java 예외 처리 흐름"},{"id":"past-2025-1-26","sourceNumber":6,"bucketLabel":"네트워크","type":"short","language":"","question":"아래 내용은 프로토콜에 대한 설명이다. 각 설명에 해당하는 것을 작성하시오.\n\n( 1 ) 은/는 네트워크상에서 IP 주소를 MAC 주소로 변환하는 프로토콜이고,\n\n( 2 ) 은/는 MAC 주소를 IP 주소로 변환하는 프로토콜이다.","code":"","images":[],"parts":[{"label":"(1)","answers":["ARP","Address Resolution Protocol","ARP(Address Resolution Protocol)"]},{"label":"(2)","answers":["RARP","Reverse ARP","Reverse Address Resolution Protocol","RARP(Reverse Address Resolution Protocol)"]}],"explanation":"ARP(Address Resolution Protocol)는 IP 주소를 알고 있을 때 같은 네트워크에 브로드캐스트로 질의해 해당 장비의 MAC(물리) 주소를 알아내는 프로토콜이다. RARP(Reverse ARP)는 반대로 자신의 MAC 주소만 알고 IP 주소를 모를 때(예: 디스크 없는 단말) 서버에 IP 주소를 요청하는 프로토콜이다. 방향을 '논리 주소→물리 주소는 ARP, 물리 주소→논리 주소는 R(Reverse)ARP'로 기억하면 헷갈리지 않는다. 오늘날 RARP의 역할은 BOOTP·DHCP가 대신한다.","difficulty":"","point":"ARP와 RARP 구분","unordered":false},{"id":"past-2025-1-27","sourceNumber":7,"bucketLabel":"SQL","type":"code","language":"","question":"다음은 SQL 문제이다. 아래 두 테이블을 참고하여 보기에 쿼리 실행 결과를 작성하시오.","code":"SELECT name, incentive FROM emp, sal WHERE emp.id = sal.id and incentives >= 500","images":["imported-images/2025-1-q27-1.png"],"parts":[{"label":"정답","answers":["name  |  incentives\n이순신 | 1000"]}],"explanation":"FROM emp, sal에 WHERE emp.id = sal.id를 주면 두 테이블의 id가 같은 행끼리만 결합하는 동등 조인이 된다. 양쪽에 모두 있는 id는 1002(홍길동, 300), 1004(강감찬, 300), 1008(이순신, 1000)이고, 1001은 sal에, 1009는 emp에 없어 제외된다. 여기에 incentives >= 500 조건을 걸면 1008 이순신(1000)만 남는다. 따라서 결과는 name 이순신, incentives 1000의 한 행이다. 문제의 SELECT 절에 incentive로 적힌 것은 복원 과정의 오타로 보고 incentives 컬럼으로 해석했다.","difficulty":"","point":"SQL 동등 조인 결과"},{"id":"past-2025-1-28","sourceNumber":8,"bucketLabel":"데이터베이스","type":"short","language":"","question":"아래는 데이터베이스에 관련된 설명이다. 알맞는 용어를 보기에서 골라 괄호를 작성하시오.\n\n1. 릴레이션에서 속성의 개수를 의미 : ( 1 )\n\n2. 릴레이션에서 튜플의 개수를 의미 : ( 2 )\n\n3. 한 릴레이션의 속상이 다른 릴레이션의 기본 키를 참조할 때, 참조하는 속성을 의미 : ( 3 )\n\n4. 특정 속성에 대해 입력될 수 있는 값의 유형이나 범위를 의미하고 무결성을 보장하는 기준 : ( 4 )\n\n\nㄱ. domain   ㄴ. primary   ㄷ. degree    ㄹ. candidate   ㅁ. cardinality   ㅂ. attribute   ㅅ. foreign","code":"","images":[],"parts":[{"label":"(1)","answers":["ㄷ","ㄷ. degree","degree"]},{"label":"(2)","answers":["ㅁ","ㅁ. cardinality","cardinality"]},{"label":"(3)","answers":["ㅅ","ㅅ. foreign","foreign"]},{"label":"(4)","answers":["ㄱ","ㄱ. domain","domain"]}],"explanation":"릴레이션의 속성(열) 개수는 차수(degree), 튜플(행) 개수는 카디널리티(cardinality)이다. 다른 릴레이션의 기본키를 참조하는 속성은 외래키(foreign key)이고, 한 속성이 가질 수 있는 값의 타입·범위 집합은 도메인(domain)이다. 차수와 카디널리티는 자주 뒤바뀌므로 '차수=열의 수, 카디널리티=행의 수'로 정리해 둔다. 보기의 candidate(후보키)는 유일성과 최소성을 만족하는 키, primary(기본키)는 후보키 중 선택된 키이며 attribute는 속성 자체를 뜻하므로 답이 아니다. 따라서 (1) ㄷ, (2) ㅁ, (3) ㅅ, (4) ㄱ이다.","difficulty":"","point":"릴레이션 구성 용어","unordered":false},{"id":"past-2025-1-29","sourceNumber":9,"bucketLabel":"네트워크","type":"short","language":"","question":"IP 주소가 192.168.35.10, 서브넷 255.255.252.0인 PC에서 브로드캐스팅으로 다른 IP로 정보를 전달한다고 할 때 수신할 수 있는 알맞는 IP를 보기에서 골라 모두 작성하시오.\n\n[보기]\n\nㄱ. 192.168.34.1 \nㄴ. 192.168.32.19\nㄷ. 192.168.35.200\nㄹ. 192.168.33.138\nㅁ. 192.168.35.50","code":"","images":[],"parts":[{"label":"정답","answers":["ㄱ,ㄴ,ㄷ,ㄹ,ㅁ"]}],"explanation":"서브넷 마스크 255.255.252.0은 /22로, 세 번째 옥텟 252는 2진수 11111100이라 하위 2비트가 호스트 영역이다. IP 192.168.35.10의 세 번째 옥텟 35(00100011)와 252를 AND하면 32가 되므로 네트워크 주소는 192.168.32.0이다. 블록 크기가 4이므로 이 네트워크 범위는 192.168.32.0~192.168.35.255이고 브로드캐스트 주소는 192.168.35.255이다. 보기의 세 번째 옥텟은 34, 32, 35, 33, 35로 모두 32~35 사이에 있으므로 다섯 개 모두 같은 네트워크에 속해 브로드캐스트를 받는다.","difficulty":"","point":"서브넷 브로드캐스트 범위"},{"id":"past-2025-1-30","sourceNumber":10,"bucketLabel":"C 언어","type":"code","language":"","question":"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"#include \nchar Data[5] = {'B', 'A', 'D', 'E'};\nchar c;\n\nint main(){\n   int i, temp, temp2;\n\n   c = 'C';\n   printf(\"%dn\", Data[3]-Data[1]);\n\n   for(i=0;  i〈 5; i++)\n           if(Data[i]>c) break;\n   }\n\n   temp = Data[i];\n   Data[i] = c;\n   i++;\n\n   for(; i〈5; ++i){   \n       temp2 = Data[i];\n       Data[i] = temp;\n       temp = temp2;\n   }\n\n   for(i=0;  i〈 5; i++) {\n         printf(\"%c\", Data[i]);\n    }\n}","images":[],"parts":[{"label":"정답","answers":["4\nBACDE"]}],"explanation":"Data는 {'B','A','D','E'}로 초기화되고 남은 Data[4]는 널 문자(0)이다. 먼저 Data[3]-Data[1]은 'E'(69)-'A'(65)=4이므로 4와 줄바꿈이 출력된다. 첫 for문은 c='C'보다 큰 문자를 찾는데 i=0('B'), i=1('A')은 아니고 i=2('D')에서 break하므로 i=2이다. temp='D'를 보관하고 Data[2]='C'로 넣은 뒤 i=3부터 한 칸씩 밀어낸다: i=3에서 Data[3]='D'(temp='E'), i=4에서 Data[4]='E'(temp=0). 결과 배열은 B, A, C, D, E이므로 두 번째 줄에 BACDE가 출력된다(정렬이 아니라 'C보다 큰 첫 위치에 삽입' 로직이다). 문항 본문 코드는 복원 과정에서 for문의 여는 중괄호와 \\n 이 깨져 있으나 같은 문제의 원래 코드 의도대로 풀었다.","difficulty":"","point":"C 배열 삽입·밀어내기"},{"id":"past-2025-1-31","sourceNumber":11,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"#include \n#include \n \nvoid set(int** arr, int* data, int rows, int cols) {\n    for (int i = 0; i < rows * cols; ++i) {\n        arr[((i + 1) / rows) % rows][(i + 1) % cols] = data[i];\n    }\n}\n \nint main() {\n    int rows = 3, cols = 3, sum = 0;\n    int data[] = {5, 2, 7, 4, 1, 8, 3, 6, 9}; \n    int** arr;\n    arr = (int**) malloc(sizeof(int*) * rows);\n    for (int i = 0; i < cols; i++) {\n        arr[i] = (int*) malloc(sizeof(int) * cols);\n    }\n \n    set(arr, data, rows, cols);\n \n    for (int i = 0; i < rows * cols; i++) {\n        sum += arr[i / rows][i % cols] * (i % 2 == 0 ? 1 : -1);\n    }\n \n    for(int i = 0: i < rows: i++) {\n          free(arr [i]):\n     }\n\n     free(arr):\n     printf(\"\"d\", sum):\n}","images":[],"parts":[{"label":"정답","answers":["13"]}],"explanation":"set 함수는 data[i]를 arr[((i+1)/3)%3][(i+1)%3]에 넣으므로, 위치가 한 칸씩 밀려 저장된다. i=0~7은 차례로 (0,1)=5, (0,2)=2, (1,0)=7, (1,1)=4, (1,2)=1, (2,0)=8, (2,1)=3, (2,2)=6에 들어가고, 마지막 i=8은 (9/3)%3=0, 9%3=0이라 (0,0)=9가 된다. 그래서 arr는 [9,5,2], [7,4,1], [8,3,6]이다. 합계 루프는 i를 0~8로 돌며 arr[i/3][i%3]에 짝수 i는 +1, 홀수 i는 -1을 곱하므로 9-5+2-7+4-1+8-3+6을 계산한다. 누적값은 9, 4, 6, -1, 3, 2, 10, 7, 13으로 최종 출력은 13이다. 문항 본문 코드 끝부분의 콜론(:)과 \"\"d 는 복원 오타로, 각각 세미콜론과 \"%d\" 로 보고 풀었다.","difficulty":"","point":"C 2차원 동적 배열 인덱스"},{"id":"past-2025-1-32","sourceNumber":12,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 결합도와 관련된 내용이다. 보기에 알맞는 답을 골라 작성하시오.\n\n(1) 다른 모듈 내부에 있는 변수나 기능을 다른 모듈에서 사용하는 경우의 결합도\n\n(2) 모듈 간의 인터페이스로 배열이나 오브젝트, 자료구조 등이 전달되는 경우의 결합도\n\n(3) 파라미터가 아닌 모듈 밖에 선언되어 있는 전역 변수를 참조하고 전역 변수를 갱신하는 식으로 상호작용하는 경우의 결합도\n\nㄱ. 자료 결합도  ㄴ. 스탬프 결합도 ㄷ. 제어 결합도  ㄹ. 공통 결합도  ㅁ. 내용 결합도  ㅂ. 외부 결합도","code":"","images":[],"parts":[{"label":"(1)","answers":["ㅁ","ㅁ. 내용 결합도","ㅁ. 내용","내용 결합도","내용"]},{"label":"(2)","answers":["ㄴ","ㄴ. 스탬프 결합도","ㄴ. 스탬프","스탬프 결합도","스탬프"]},{"label":"(3)","answers":["ㄹ","ㄹ. 공통 결합도","ㄹ. 공통","공통 결합도","공통"]}],"explanation":"(1) 한 모듈이 다른 모듈의 내부 변수나 기능을 직접 참조·변경하는 것은 결합도가 가장 강한 내용 결합도(Content)이다. (2) 모듈 사이에 배열·객체·레코드 같은 자료구조를 통째로 넘기는 것은 스탬프 결합도(Stamp)이며, 단순한 값(스칼라)만 넘기는 자료 결합도(Data)와 구분된다. (3) 파라미터 대신 모듈 밖의 전역 변수를 함께 참조·갱신하는 것은 공통 결합도(Common)이다. 전역 변수가 아닌 외부에서 선언된 데이터(외부 파일·장치 형식 등)를 공유하면 외부 결합도, 플래그 같은 제어 신호를 넘기면 제어 결합도이다. 결합도 강도 순서는 내용 > 공통 > 외부 > 제어 > 스탬프 > 자료이다.","difficulty":"","point":"모듈 결합도 종류","unordered":false},{"id":"past-2025-1-33","sourceNumber":13,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"public class Main {\n    public static void main(String[] args) {\n        new Child();\n        System.out.println(Parent.total);\n    }\n}\n\nclass Parent {\n    static int total = 0;\n    int v = 1;\n \n    public Parent() {\n        total += (++v);\n        show();    \n    }\n \n    public void show() {\n        total += total;\n    }\n}\n \n \nclass Child extends Parent {\n    int v = 10;\n \n    public Child() {\n        v += 2;\n        total += v++;\n        show();\n    }\n \n    @Override\n    public void show() {\n        total += total * 2;\n    }\n}","images":[],"parts":[{"label":"정답","answers":["54"]}],"explanation":"new Child()를 하면 먼저 부모 생성자 Parent()가 실행된다. Parent의 v는 1이므로 ++v로 2가 되어 total=2가 되고, 이어서 호출되는 show()는 동적 바인딩 때문에 오버라이딩된 Child.show()가 실행되어 total = 2 + 2*2 = 6이 된다. 부모 생성자가 끝나면 Child의 필드 초기화(v=10)가 이루어지고, Child 생성자에서 v += 2로 v=12, total += v++로 total=6+12=18(이후 v=13)이 된다. 마지막 show()도 Child.show()이므로 total = 18 + 18*2 = 54이다. 부모와 자식의 v는 이름만 같은 별개의 필드(필드 하이딩)이며, 메서드만 오버라이딩된다는 점이 핵심이다.","difficulty":"","point":"Java 생성자 순서·동적 바인딩"},{"id":"past-2025-1-34","sourceNumber":14,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"아래는 디자인 패턴에 대한 설명이다. 알맞는 답을 보기에 골라 작성하시오.\n\n• 호환성이 없는 클래스들의 인터페이스를 다른 클래스가 이용할 수 있도록 변환해주는 패턴이다.\n• 기존의 클래스를 이용하고 싶지만 인터페이스가 일치하지 않을 때 이용한다.","code":"","images":["imported-images/2025-1-q34-1.png"],"parts":[{"label":"정답","answers":["Adapter"]}],"explanation":"호환되지 않는 클래스의 인터페이스를 다른 클래스가 쓸 수 있는 형태로 변환해 주는 구조 패턴은 어댑터(Adapter) 패턴이다. 기존 클래스를 재사용하고 싶지만 메서드 이름이나 형식이 맞지 않을 때, 중간에 변환 클래스를 두어 기존 코드 수정 없이 연결한다. 같은 구조 패턴 중 데코레이터(Decorator)는 인터페이스를 유지한 채 기능을 추가하고, 퍼사드(Facade)는 복잡한 하위 시스템에 단순한 통합 창구를 제공하며, 브리지(Bridge)는 추상과 구현을 분리한다는 점에서 구분된다. '인터페이스 변환'이라는 표현이 나오면 어댑터를 떠올리면 된다.","difficulty":"","point":"어댑터 패턴"},{"id":"past-2025-1-35","sourceNumber":15,"bucketLabel":"테스트","type":"short","language":"","question":"문장(Statement) 커버리지 테스트를 수행하려고 한다. 제시된 코드를 아래의 제어 흐름도 빈칸에 연결되도록 작성하고 문장 커버리지 순서대로 작성하시오.","code":"int Main(int b[], int m, int x) {\n    int a = 0;\n    while (a < m || b[a] < x) {\n        if (b[a] < 0)\n            b[a] = -b[a];\n        a++;\n    }\n    return 1;\n}\n\n1. (    ①    )    2. (    ②    )    3. (    ③    )    4. (    ④    )    5. (    ⑤    )  6. (    ⑥    )\n\n문장 커버리지 순서 1 → 2  → (          ⑦           )","images":["imported-images/2025-1-q35-1.png"],"parts":[{"label":"①","answers":["int a = 0"]},{"label":"②","answers":["a < m || b[a] < x","while (a < m || b[a] < x)"]},{"label":"③","answers":["b[a] < 0","if (b[a] < 0)"]},{"label":"④","answers":["b[a] = -b[a];"]},{"label":"⑤","answers":["a++;"]},{"label":"⑥","answers":["return 1;"]},{"label":"⑦","answers":["③ → ④ → ⑤ → ② → ⑥","3 → 4 → 5 → 2 → 6"]}],"explanation":"흐름도에서 1은 시작 문장 int a = 0, 2는 while 조건 a < m || b[a] < x, 3은 if 조건 b[a] < 0, 4는 b[a] = -b[a], 5는 a++, 6은 반복 종료 후의 return 1이다. 2의 조건이 거짓이면 6으로 빠져나가고, 3의 조건이 거짓이면 4를 건너뛰고 5로 가며, 5가 끝나면 다시 2로 돌아간다. 문장 커버리지는 모든 문장이 최소 한 번 실행되면 충족되므로, 3이 참이 되어 4를 거치는 경로가 반드시 포함되어야 한다. 따라서 1 → 2 → 3 → 4 → 5 → 2 → 6 경로 하나로 모든 문장을 실행할 수 있어 ⑦은 ③ → ④ → ⑤ → ② → ⑥이다. 결정의 참·거짓을 모두 거쳐야 하는 분기(결정) 커버리지와 달리, 문장 커버리지는 문장 실행 여부만 따진다.","difficulty":"","point":"문장 커버리지 흐름도","unordered":false},{"id":"past-2025-1-36","sourceNumber":16,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"public class Main {\n \n    public static void main(String[] args) {\n        int[] data = {3, 5, 8, 12, 17};\n        System.out.println(func(data, 0, data.length - 1));\n    }\n \n    static int func(int[] a, int st, int end) {\n        if (st >= end) return 0;\n        int mid = (st + end) / 2;\n        return a[mid] + Math.max(func(a, st, mid), func(a, mid + 1, end));\n    } \n \n}","images":[],"parts":[{"label":"정답","answers":["20"]}],"explanation":"func는 구간 [st, end]의 가운데 값 a[mid]에 왼쪽 절반과 오른쪽 절반 결과 중 큰 값을 더하는 재귀 함수이고, st >= end이면 0을 반환한다. func(0,4)는 mid=2라 a[2]=8 + max(func(0,2), func(3,4))이다. func(0,2)는 mid=1이라 5 + max(func(0,1), func(2,2))인데, func(0,1)은 mid=0이라 3 + max(0, 0) = 3이고 func(2,2)=0이므로 5+3=8이다. func(3,4)는 mid=3이라 12 + max(func(3,3), func(4,4)) = 12+0 = 12이다. 따라서 결과는 8 + max(8, 12) = 20이다.","difficulty":"","point":"Java 분할 재귀 최댓값"},{"id":"past-2025-1-37","sourceNumber":17,"bucketLabel":"Python","type":"short","language":"","question":"다음은 파이썬에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"class Node:\n    def __init__(self, value):\n        self.value = value\n        self.children = []\n \ndef tree(li):\n    nodes = [Node(i) for i in li]\n    for i in range(1, len(li)):\n        nodes[(i - 1) // 2].children.append(nodes[i])\n    return nodes[0]\n \ndef calc(node, level=0):\n    if node is None:\n        return 0\n    return (node.value if level % 2 == 1 else 0) + sum(calc(n, level + 1) for n in node.children)\n \nli = [3, 5, 8, 12, 15, 18, 21]\n \nroot = tree(li)\n \nprint(calc(root))","images":[],"parts":[{"label":"정답","answers":["13"]}],"explanation":"tree 함수는 리스트를 배열 기반 완전 이진트리처럼 연결한다: i번째 노드의 부모는 (i-1)//2번째 노드이다. 따라서 루트 3(레벨 0) 아래에 5, 8(레벨 1)이 있고, 5 아래에 12, 15, 8 아래에 18, 21(레벨 2)이 붙는다. calc는 레벨이 홀수인 노드의 값만 더하고 짝수 레벨은 0으로 처리하면서 자식들을 재귀로 합산한다. 홀수 레벨은 레벨 1뿐이므로 5 + 8 = 13이 출력된다. level 기본값 0에서 시작해 자식으로 내려갈 때마다 1씩 증가한다는 점을 놓치지 않아야 한다.","difficulty":"","point":"Python 트리 레벨별 합"},{"id":"past-2025-1-38","sourceNumber":18,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"#include    \n#include   \n \ntypedef struct Data {\n    int value;\n    struct Data *next;\n} Data;\n \nData* insert(Data* head, int value) {\n    Data* new_node = (Data*)malloc(sizeof(Data));\n    new_node->value = value;\n    new_node->next = head;\n    return new_node;\n}\n \nData* reconnect(Data* head, int value) {\n    if (head == NULL || head->value == value) return head;\n    Data *prev = NULL, *curr = head;\n    while (curr != NULL && curr->value != value) {\n        prev = curr;\n        curr = curr->next;\n    }\n \n    if (curr != NULL && prev != NULL) {\n        prev->next = curr->next;\n        curr->next = head;\n        head = curr;\n    }\n    return head;\n}\n \nint main() {\n \n    Data *head = NULL, *curr;\n    for (int i = 1; i next)\n        printf(\"%d\", curr->value);\n    return 0; \n}","images":[],"parts":[{"label":"정답","answers":["35421"]}],"explanation":"insert는 새 노드를 리스트 맨 앞에 붙이므로 1부터 5까지 넣으면 리스트는 5 → 4 → 3 → 2 → 1이 된다. reconnect(head, 3)은 head부터 값 3을 찾으며 prev=4, curr=3 위치에서 멈춘다. 이후 prev(4)의 next를 curr의 next(2)로 이어 3을 빼내고, 3의 next를 기존 head(5)로 연결한 뒤 head를 3으로 바꾼다. 결과 리스트는 3 → 5 → 4 → 2 → 1이며, 줄바꿈 없이 출력하므로 35421이다. 찾는 값이 이미 맨 앞이면(head->value == value) 아무것도 바꾸지 않는다는 조건도 함께 기억해 둔다. 문항 본문 main 의 for문 부분은 복원 과정에서 일부가 빠졌으며, 1~5 삽입 → reconnect(head, 3) → 순회 출력이라는 원래 코드 의도대로 풀었다.","difficulty":"","point":"C 연결 리스트 노드 이동"},{"id":"past-2025-1-39","sourceNumber":19,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"#include \n \ntypedef struct student {\n    char* name;\n    int score[3];\n} Student;\n \nint dec(int enc) {\n    return enc & 0xA5;\n}\n \nint sum(Student* p) {\n    return dec(p->score[0]) + dec(p->score[1]) + dec(p->score[2]);\n}\n \nint main() {\n    Student s[2] = { \"Kim\", {0xA0, 0xA5, 0xDB}, \"Lee\", {0xA0, 0xED, 0x81} };\n    Student* p = s;\n    int result = 0;\n \n    for (int i = 0; i < 2; i++) {\n        result += sum(&s[i]);\n    }\n    printf(\"%d\", result);\n    return 0;\n}","images":[],"parts":[{"label":"정답","answers":["908"]}],"explanation":"dec는 값과 0xA5(1010 0101)를 비트 AND 하므로, 0xA5에서 1인 비트만 남긴다. Kim의 점수는 0xA0(1010 0000)&0xA5=0xA0=160, 0xA5&0xA5=165, 0xDB(1101 1011)&0xA5=1000 0001=0x81=129로 합이 454이다. Lee의 점수는 0xA0→160, 0xED(1110 1101)&0xA5=1010 0101=165, 0x81(1000 0001)&0xA5=0x81=129로 역시 합이 454이다. 두 학생의 합을 더한 result는 454+454=908이며 %d로 출력된다. 비트 OR(|)나 XOR(^)과 혼동하지 않도록, AND는 두 비트가 모두 1일 때만 1이라는 점을 확인한다.","difficulty":"","point":"C 비트 AND 연산"},{"id":"past-2025-1-40","sourceNumber":20,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드에 대한 문제이다. 아래 코드를 확인하여 알맞는 출력값을 작성하시오.","code":"public class Main {\n\n    public static void main(String[] args) {\n        System.out.println(calc(\"5\"));\n    }\n\n    static int calc(int value) {\n        if (value 왼쪽꺽쇠= 1)\n            return value;\n\n        return calc(value - 1) + calc(value - 2);\n    }\n\n    static int calc(String str) {\n        int value = Integer.valueOf(str);\n\n        if (value 왼쪽꺽쇠= 1)\n            return value;\n\n        return calc(value - 1) + calc(value - 3);\n    }\n}","images":[],"parts":[{"label":"정답","answers":["4"]}],"explanation":"main에서 calc(\"5\")는 문자열 인자이므로 오버로딩된 calc(String)이 호출되고, value=5가 되어 calc(4) + calc(2)를 반환한다. 이때 4와 2는 int이므로 이후 호출은 모두 calc(int)이며, 이 메서드는 calc(n-1)+calc(n-2), n<=1이면 n을 돌려주는 피보나치 수열이다. calc(0)=0, calc(1)=1, calc(2)=1, calc(3)=2, calc(4)=3이므로 결과는 3 + 1 = 4이다. 오버로딩은 컴파일 시점에 인자 타입으로 호출할 메서드가 결정되므로, String 버전은 처음 한 번만 실행된다는 점이 함정이다. 문항 본문의 「왼쪽꺽쇠=」는 복원 과정에서 <= 가 깨진 것이다.","difficulty":"","point":"Java 메서드 오버로딩 재귀"}]},{"key":"past-2025-2","name":"2025년 2회 기출","questions":[{"id":"past-2025-2-1","sourceNumber":1,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 파일 구조와 관련된 설명이다. 설명을 읽고 괄호 안에 들어갈 가장 알맞은 용어를 작성하시오.\n\n데이터베이스의 물리 설계 시, 레코드에 접근하는 방법은 순차 접근 방법, [   ] 방법, 해싱 방법 등이 있다.\n\n \n\n이 중 [   ] 방법은 레코드의 키 값과 포인터를 쌍으로 묶어 저장하며 검색 시 키 값을 기준으로 빠르게 탐색할 수 있도록 설계되어 있다.\n\n \n\n이 방식은 검색 속도가 빠르며  쌍으로 구성된 자료 구조를 사용하여 해당 키가 가리키는 주소를 통해 원하는 레코드를 직접 찾을 수 있다.","code":"","images":["imported-images/2025-2-q01-1.png"],"parts":[{"label":"정답","answers":["인덱스","색인","Index","인덱스(색인)"]}],"explanation":"레코드 접근 방법은 크게 순차 접근, 인덱스(색인) 접근, 해싱 접근으로 나뉜다. 인덱스 방법은 레코드의 키 값과 그 레코드가 저장된 위치(포인터)를 한 쌍으로 묶은 별도의 구조를 두고, 검색할 때 이 구조에서 키를 먼저 찾은 뒤 포인터를 따라 레코드로 바로 이동한다. 그래서 처음부터 하나씩 훑는 순차 접근보다 빠르다. 해싱 접근도 직접 찾아가지만 키-포인터 쌍을 저장해 두는 것이 아니라 해시 함수로 주소를 계산한다는 점이 다르다. 따라서 빈칸은 인덱스(색인)이다.","difficulty":"","point":"레코드 접근 방법 인덱스","unordered":false},{"id":"past-2025-2-2","sourceNumber":2,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 데이터베이스 릴레이션의 구성 요소 중 하나에 대한 설명이다. 설명을 읽고 보기에서 알맞은 기호를 골라 작성하시오.\n\n릴레이션(Relation)에서 열(Column)을 의미하며 데이터 항목의 속성(Attribute) 또는 특성을 나타낸다.\n\n각 열은 고유한 이름을 가지며 특정 도메인(Domain)에서 정의된 값을 갖는다.\n\n\n예를 들어 \"학생\" 릴레이션에서 학번, 이름, 전공 등은 각각 하나의 열이며 이 열들은 학생의 고유한 속성을 나타낸다.\n\n이 개념은 파일 구조에서의 필드(Field)에 해당하며 릴레이션에서 행(Row, Tuple)의 구성 요소가 된다.\n\n[보기]\nㄱ. Cardinality\nㄴ. Domain\nㄷ. Attribute\nㅁ. Degree\nㅂ. Schema\nㅅ. Tuple","code":"","images":[],"parts":[{"label":"정답","answers":["ㄷ","ㄷ. Attribute"]}],"explanation":"릴레이션의 열(Column) 하나하나를 속성(Attribute)이라 하며, 파일 구조의 필드에 대응하고 튜플(행)을 이루는 구성 단위가 된다. 각 속성은 이름을 가지며 값은 그 속성의 도메인에서 정의된 범위 안에서만 올 수 있다. Domain은 속성이 가질 수 있는 값의 집합이고, Tuple은 행, Degree는 속성의 개수, Cardinality는 튜플의 개수, Schema는 릴레이션의 구조 정의이므로 열 자체를 가리키는 말이 아니다. 따라서 답은 ㄷ. Attribute이다.","difficulty":"","point":"릴레이션 구성 요소 속성","unordered":false},{"id":"past-2025-2-3","sourceNumber":3,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음은 정보보안 관련 문제이다. 아래 내용을 보고 알맞는 단어를 작성하시오.\n\n원격 접속과 관련된 보안 프로토콜이며 암호화된 통신을 제공하는 보안 접속용 프로토콜이다.\n공개키 기반의 인증 방식을 사용하며 암호화된 데이터 전송을 지원한다.\n주로 원격 서버에 안전하게 접속할 때 사용되며 기본 포트 번호는 22번이다.\nTelnet의 보안 취약점을 보완한 대안으로 널리 사용된다.","code":"","images":[],"parts":[{"label":"정답","answers":["SSH"]}],"explanation":"SSH(Secure Shell)는 원격 서버에 접속해 명령을 실행할 때 통신 전체를 암호화하는 보안 접속 프로토콜이며 기본 포트는 22번이다. 공개키 방식으로 서버와 사용자를 인증할 수 있고, 평문으로 계정과 명령이 오가던 Telnet(23번 포트)의 도청 취약점을 대체하기 위해 널리 쓰인다. 같은 원격 접속 계열이라도 Telnet·rlogin은 암호화가 없다는 점으로 구분한다. 따라서 답은 SSH이다.","difficulty":"","point":"원격 접속 보안 프로토콜"},{"id":"past-2025-2-4","sourceNumber":4,"bucketLabel":"운영체제","type":"short","language":"","question":"스케줄링 알고리즘에 관한 다음 설명을 읽고 (1)과 (2)에 알맞은 스케줄링 알고리즘의 명칭을 각각 쓰시오.\n\n(1) CPU burst 시간이 짧은 프로세스를 우선적으로 처리하는 스케줄링 방식이다. \"Shortest Next CPU Burst\"라고도 불리며 선점형 또는 비선점형으로 구현될 수 있다.\n\n(2) 위의 스케줄링 방식을 선점형으로 구현한 형태로 실행 중인 프로세스보다 더 짧은 burst 시간을 가진 프로세스가 도착하면 현재 CPU를 선점한다.","code":"","images":[],"parts":[{"label":"(1)","answers":["SJF","Shortest Job First","SJF(Shortest Job First)","최단 작업 우선"]},{"label":"(2)","answers":["SRT","SRTF","Shortest Remaining Time","Shortest Remaining Time First","SRT(Shortest Remaining Time)","SRTF(Shortest Remaining Time First)"]}],"explanation":"(1)은 다음 CPU 사용 시간(burst)이 가장 짧은 프로세스에 먼저 CPU를 주는 SJF(Shortest Job First)이다. 평균 대기 시간을 최소화하는 데 유리하지만 실행 시간이 긴 프로세스는 계속 밀려 기아 현상이 생길 수 있다. (2)는 SJF를 선점형으로 만든 SRT(Shortest Remaining Time, SRTF)로, 새로 도착한 프로세스의 남은 실행 시간이 현재 실행 중인 프로세스의 남은 시간보다 짧으면 즉시 CPU를 빼앗는다. 일반적으로 SJF라고만 하면 비선점형을 가리키고, 선점형은 SRT로 따로 부른다는 점을 구분한다.","difficulty":"","point":"SJF와 SRT 스케줄링","unordered":false},{"id":"past-2025-2-5","sourceNumber":5,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-2-q05-1.png"],"parts":[{"label":"정답","answers":["BB"]}],"explanation":"Java는 인자를 값으로 전달하지만 배열 변수의 값은 배열을 가리키는 참조이므로, change 안에서 data[0] = s 를 하면 main의 배열 원소가 실제로 \"B\"로 바뀐다. 반면 s = \"Z\" 는 change의 지역 변수 s가 다른 문자열을 가리키도록 바꿀 뿐이라 main의 s는 그대로 \"B\"이다. 따라서 data[0] + s 는 \"B\" + \"B\" 가 되어 BB가 출력된다. 배열 원소 변경(공유되는 객체 수정)과 매개변수 재대입(지역 변수만 변경)을 구분하는 것이 핵심이다.","difficulty":"","point":"Java 참조 전달과 문자열"},{"id":"past-2025-2-6","sourceNumber":6,"bucketLabel":"네트워크","type":"short","language":"","question":"다음은 IP 주소와 서브넷 마스크에 관한 문제이다. 주어진 정보를 참고하여 괄호 안에 들어갈 알맞은 값을 쓰시오.\n\n호스트의 IP 주소가 223.13.234.132이고 서브넷 마스크가 255.255.255.192일 때 다음 물음에 답하시오.\n\n이 호스트가 속한 네트워크 주소는 223.13.234.( ① )이다.\n\n이 네트워크에서 사용 가능한 호스트 수는 ( ② )개이다.\n\n(단, 네트워크 주소와 브로드캐스트 주소는 제외한다.)","code":"","images":[],"parts":[{"label":"①","answers":["128"]},{"label":"②","answers":["62","62개"]}],"explanation":"서브넷 마스크 255.255.255.192는 마지막 옥텟이 11000000으로, 호스트 부분이 6비트이고 블록 크기는 256-192=64이다. 마지막 옥텟 132를 2진수로 쓰면 10000100이고, 192(11000000)와 AND 하면 10000000=128이 되므로 네트워크 주소는 223.13.234.128이다(64 단위 블록 0, 64, 128, 192 중 132가 속한 블록의 시작). 호스트 비트가 6개이므로 주소는 2^6=64개이고, 네트워크 주소와 브로드캐스트 주소(223.13.234.191)를 빼면 사용 가능한 호스트는 62개이다.","difficulty":"","point":"서브넷 네트워크 주소 계산","unordered":false},{"id":"past-2025-2-7","sourceNumber":7,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 디자인 패턴에 관한 문제이다. 아래 내용을 보고 알맞는 단어를 작성하시오.\n\n어떤 객체에 대한 접근을 제어하거나 추가적인 기능을 부여하기 위해 해당 객체의 대리 객체를 사용하는 방식의 디자인 패턴이다.\n\n실제 객체에 대한 접근 전에 필요한 작업을 수행할 수 있으며 실제 객체의 생성을 지연시켜 메모리와 자원을 절약할 수 있다.\n\n또한, 실제 객체를 감추어 정보은닉을 강화할 수 있다는 장점이 있다.","code":"","images":[],"parts":[{"label":"정답","answers":["Proxy"]}],"explanation":"Proxy 패턴은 실제 객체 대신 같은 인터페이스를 가진 대리 객체를 두어, 클라이언트의 요청을 대리 객체가 먼저 받아 접근 제어·지연 생성·로깅 등 부가 작업을 한 뒤 실제 객체에 넘기는 구조 패턴이다. 실제 객체를 필요한 순간까지 만들지 않아 자원을 아낄 수 있고 실제 객체를 숨겨 정보 은닉도 강화된다. 기능을 덧붙인다는 점에서 Decorator와 비슷하지만, Decorator는 기능 확장이 목적이고 Proxy는 접근 제어·대리가 목적이라는 점으로 구분한다. 따라서 답은 Proxy이다.","difficulty":"","point":"Proxy 디자인 패턴"},{"id":"past-2025-2-8","sourceNumber":8,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"다음은 웹  데이터 교환 방식에 관한 문제이다. 아래 설명을 읽고 괄호 안에 들어갈 알맞은 용어를 작성하시오.\n\n(   )은/는 웹 페이지 전체를 다시 불러오지 않고 JavaScript와 XML(또는 JSON)을 이용하여 일부 콘텐츠만 비동기적으로 갱신할 수 있는 기술이다.\n\n(   )은/는 HTML만으로는 구현하기 어려운 동적인 기능들을 가능하게 하여 사용자가 웹 페이지와 보다 자유롭게 상호작용할 수 있도록 해주는 웹 개발 기법이다.","code":"","images":[],"parts":[{"label":"정답","answers":["AJAX"]}],"explanation":"AJAX(Asynchronous JavaScript and XML)는 JavaScript의 비동기 요청(XMLHttpRequest, fetch 등)으로 서버와 XML이나 JSON 데이터를 주고받아 페이지 전체를 새로 고치지 않고 필요한 부분만 갱신하는 기법이다. 사용자는 페이지 이동 없이 검색어 자동완성, 댓글 갱신 같은 동적인 상호작용을 할 수 있다. JSON이나 XML은 주고받는 데이터 형식일 뿐이고, 비동기 부분 갱신 기법 전체를 가리키는 이름이 AJAX라는 점을 구분한다.","difficulty":"","point":"AJAX 비동기 웹 기술"},{"id":"past-2025-2-9","sourceNumber":9,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java언어의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-2-q09-1.png"],"parts":[{"label":"정답","answers":["19"]}],"explanation":"run(f)에서 f.apply(3)이 호출되면 x=3이 조건 x > 2를 만족해 Exception이 던져지고, run의 catch 블록이 이를 잡아 7을 반환한다. 두 번째 run에는 람다 n -> n + 9가 전달되어 f.apply(3)이 3+9=12를 정상 반환한다. 두 결과는 int이므로 문자열 연결이 아니라 덧셈이 먼저 이루어져 7+12=19가 출력된다. 함수형 인터페이스 F의 apply에 throws Exception이 선언되어 있어 람다 안에서 검사 예외를 던질 수 있다는 점도 함께 확인한다.","difficulty":"","point":"Java 람다와 예외 처리"},{"id":"past-2025-2-10","sourceNumber":10,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java언어의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-2-q10-1.png"],"parts":[{"label":"정답","answers":["5P"]}],"explanation":"ref는 Parent 타입 변수이지만 실제 객체는 Child이다. 인스턴스 메서드 x(int)는 Child가 오버라이딩했으므로 동적 바인딩에 의해 Child의 x가 실행되어 2+3=5가 된다. 반면 static 메서드 id()는 오버라이딩이 아니라 숨김(hiding)이라 실제 객체가 아닌 변수의 선언 타입(Parent) 기준으로 결정되어 \"P\"를 반환한다. Child의 x(String)는 오버로딩이며 Parent 타입으로는 호출되지 않는다. 따라서 5 + \"P\" 는 문자열 연결로 5P가 출력된다.","difficulty":"","point":"Java 오버라이딩과 static 메서드"},{"id":"past-2025-2-11","sourceNumber":11,"bucketLabel":"테스트","type":"short","language":"","question":"다음 아래 제어 흐름 그래프가 분기 커버리지를 만족하기 위한 테스팅 순서를 쓰시오.","code":"","images":["imported-images/2025-2-q11-1.png"],"parts":[{"label":"정답","answers":["1234561, 124567","124567, 1234561","1234567, 124561","124561, 1234567"]}],"explanation":"분기 커버리지는 모든 결정(조건 분기)의 참과 거짓 결과를 최소 한 번씩 실행하도록 테스트 경로를 고르는 기준이다. 이 그래프의 결정은 ② X > K와 ⑥ RESULT > 1 두 개이므로 ②의 YES/NO, ⑥의 YES/NO 네 갈래가 모두 포함되어야 한다. 예를 들어 1→2→3→4→5→6→1은 ② YES와 ⑥ YES를, 1→2→4→5→6→7은 ② NO와 ⑥ NO를 지나므로 두 경로로 모든 분기가 실행된다. 같은 원리로 1234567과 124561 조합도 ②와 ⑥의 참·거짓을 모두 덮으므로 정답이 된다.","difficulty":"","point":"분기 커버리지 테스트 경로","unordered":false},{"id":"past-2025-2-12","sourceNumber":12,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-2-q12-1.png"],"parts":[{"label":"정답","answers":["2 그리고 3"]}],"explanation":"큐 q는 a={0,0,0}, front=0, rear=0으로 시작하고 rear·front는 SIZE(3)로 나눈 나머지로 돌아가는 원형 큐이다. enq(1)로 a[0]=1, rear=1, enq(2)로 a[1]=2, rear=2가 되고, deq()는 a[0]의 1을 꺼내며 front=1이 된다(반환값은 버려짐). enq(3)은 a[2]=3을 넣고 rear=(2+1)%3=0으로 돌아간다. 이후 first=deq()는 a[1]의 2(front=2), second=deq()는 a[2]의 3(front=0)이므로 \"2 그리고 3\"이 출력된다.","difficulty":"","point":"C 원형 큐 삽입·삭제"},{"id":"past-2025-2-13","sourceNumber":13,"bucketLabel":"운영체제","type":"short","language":"","question":"라운드로빈(RR) 방식을 이용하고 아래 내용을 참고하여 평균대기시간을 구하시오.\n\n운영체제에서 라운드로빈(Round Robin, RR) 스케줄링은 각 프로세스에 동일한 시간 할당량(타임 퀀텀)을 순차적으로 부여하며 CPU를 할당하는 방식이다.\n\n다음은 4개의 프로세스가 서로 다른 시간에 도착하며 각기 다른 실행 시간을 가지는 상황이다. 이때 시간 할당량은 4ms이고 컨텍스트 스위칭 시간은 무시한다고 가정한다.\n\n아래 정보를 바탕으로 라운드로빈(RR) 방식으로 CPU 스케줄링을 수행할 경우 모든 프로세스의 평균 대기시간(Average Waiting Time)은 얼마인가?","code":"","images":["imported-images/2025-2-q13-1.png"],"parts":[{"label":"정답","answers":["11.75ms","11.75"]}],"explanation":"시간 할당량 4ms로 도착 순서대로 큐를 돌린다. 0~4 P1 실행(남은 4), 그 사이 P2·P3·P4가 도착해 큐는 P2, P3, P4, P1 순이 된다. 4~8 P2 완료, 8~12 P3(남은 5), 12~16 P4(남은 1), 16~20 P1 완료, 20~24 P3(남은 1), 24~25 P4 완료, 25~26 P3 완료이다. 대기시간=종료시각-도착시각-실행시간이므로 P1=20-0-8=12, P2=8-1-4=3, P3=26-2-9=15, P4=25-3-5=17이고, 합 47을 4로 나눈 평균 대기시간은 11.75ms이다. 실행이 끝나지 않은 프로세스가 큐 뒤로 갈 때 그 시점까지 도착한 프로세스가 먼저 줄을 선다는 점에 유의한다.","difficulty":"","point":"라운드로빈 평균 대기시간","unordered":false},{"id":"past-2025-2-14","sourceNumber":14,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"#include \n \nstruct dat {\n    int x;\n    int y;\n};\n \nint main() {\n    struct dat a[] = {{1, 2}, {3, 4}, {5, 6}};\n    struct dat* ptr = a;\n    struct dat** pptr = &ptr;\n \n    (*pptr)[1] = (*pptr)[2];\n    printf(\"%d 그리고 %d\", a[1].x, a[1].y);\n \n    return 0;\n}","images":[],"parts":[{"label":"정답","answers":["5 그리고 6"]}],"explanation":"ptr은 구조체 배열 a의 시작 주소를, pptr은 ptr의 주소를 가리킨다. 따라서 *pptr은 ptr 자체이고, (*pptr)[1]은 ptr[1] 즉 a[1], (*pptr)[2]는 a[2]와 같다. 구조체끼리의 대입은 멤버 전체를 복사하므로 a[1]은 {5, 6}이 된다. 결과적으로 a[1].x=5, a[1].y=6이 되어 \"5 그리고 6\"이 출력된다. (*pptr)[1]에서 괄호가 없으면 *(pptr[1])로 해석되어 의미가 달라지므로 연산자 우선순위에 주의한다. 문제 코드의 #include 뒤 헤더 이름(stdio.h)은 복원 과정에서 빠진 것으로 본다.","difficulty":"","point":"C 이중 포인터와 구조체 배열"},{"id":"past-2025-2-15","sourceNumber":15,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java언어의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-2-q15-1.png"],"parts":[{"label":"정답","answers":["1a3b3"]}],"explanation":"arr에는 객체 a, b, c의 참조가 들어 있다. t=arr[0]은 a를 가리키고, arr[0]=arr[2]로 arr[0]이 c를, arr[2]=t로 arr[2]가 a를 가리키게 되어 배열 안의 참조만 바뀌고 a, b, c 변수 자체는 그대로이다. arr[1].v = arr[0].v 는 b.v에 c.v인 3을 넣는 것이다. 따라서 a.v=1, b.v=3, c.v=3이고, 숫자와 문자열이 섞인 연결로 1a3b3이 출력된다.","difficulty":"","point":"Java 객체 참조 배열 교환"},{"id":"past-2025-2-16","sourceNumber":16,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-2-q16-1.png"],"parts":[{"label":"정답","answers":["3 1 2"]}],"explanation":"포인터 대입은 순서대로 덮어쓰므로 마지막 값만 남는다. 첫 줄에서 a.n=&b, b.n=&c, c.n=NULL이 되지만, 두 번째 줄에서 c.n=&a, a.n=&b, b.n=NULL로 바뀐다. 최종 연결은 c → a → b → NULL이다. head=&c이므로 head->p=3, head->n->p는 a.p=1, head->n->n->p는 b.p=2이며 \"3 1 2\"가 출력된다.","difficulty":"","point":"C 연결 리스트 포인터 변경"},{"id":"past-2025-2-17","sourceNumber":17,"bucketLabel":"Python","type":"short","language":"","question":"다음은 Pyhon언어의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-2-q17-1.png"],"parts":[{"label":"정답","answers":["2"]}],"explanation":"lst=[1,2,3]으로 딕셔너리 컴프리헨션을 만들면 dst={1:2, 2:4, 3:6}이고, s=set(dst.values())는 {2, 4, 6}이다. lst[0]=99는 이미 만들어진 dst에 영향을 주지 않는다. dst[2]=7로 dst의 값은 {2, 7, 6}이 되지만 s는 이전에 따로 만든 집합이라 바뀌지 않고, s.add(99)로 s={2, 4, 6, 99}가 된다. s와 set(dst.values())={2, 6, 7}의 교집합(&)은 {2, 6}이므로 len은 2이다.","difficulty":"","point":"Python 집합 교집합 크기"},{"id":"past-2025-2-18","sourceNumber":18,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어의 문제이다. 아래 코드를 보고 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2025-2-q18-1.png"],"parts":[{"label":"정답","answers":["TSEB"]}],"explanation":"func는 문자열 \"BEST\"를 한 글자씩 읽어 새 노드를 만들고, 새 노드의 p가 이전 머리 h를 가리키게 한 뒤 h를 새 노드로 바꾼다. 즉 맨 앞에 계속 삽입하는 스택 구조라서 B, E, S, T 순으로 넣으면 리스트는 T → S → E → B → NULL이 된다. main에서는 머리부터 p를 따라가며 putchar로 출력하고 노드를 해제하므로 TSEB가 출력된다. *s++는 현재 문자를 읽은 뒤 포인터를 다음 글자로 옮긴다는 점을 확인한다.","difficulty":"","point":"C 연결 리스트 스택 순서"},{"id":"past-2025-2-19","sourceNumber":19,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음은 TCP 통신 과정에서 발생할 수 있는 보안 취약점에 대한 설명이다. 이를 이용한 공격 기법으로 옳은 것은?\n\nTCP는 연결을 수립하기 위해 클라이언트가 서버에 SYN 패킷을 보내고 서버는 SYN-ACK 패킷으로 응답한 후 클라이언트가 다시 ACK 패킷을 보내는 3-way-handshake 과정을 거친다.\n\n이때 공격자는 클라이언트 역할로 수많은 SYN 패킷을 서버에 전송한 뒤 마지막 ACK를 고의로 보내지 않아 서버가 연결 대기 상태를 계속 유지하게 만든다.\n\n이로 인해 서버의 연결 대기 큐가 가득 차면서 정상적인 접속 요청을 처리하지 못하게 되어 서비스 거부 상태가 발생한다.","code":"","images":[],"parts":[{"label":"정답","answers":["SYN Flooding"]}],"explanation":"SYN Flooding은 TCP 3-way handshake의 반열림(half-open) 상태를 악용하는 서비스 거부 공격이다. 공격자가 SYN을 대량으로 보내고 서버의 SYN-ACK에 마지막 ACK를 보내지 않으면, 서버는 연결 대기(백로그) 큐에 요청을 붙잡아 두다가 큐가 가득 차 정상 접속을 받지 못한다. 출발지 IP를 위조해 반복하면 효과가 커지며, SYN 쿠키나 대기 시간 단축 등으로 대응한다. 대량 ICMP를 쓰는 Smurf나 UDP를 쓰는 UDP Flooding과는 TCP 연결 수립 단계를 노린다는 점으로 구분한다.","difficulty":"","point":"SYN Flooding 공격"},{"id":"past-2025-2-20","sourceNumber":20,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음 테이블에서 πTTL(employee)에 대한 연산 결과 값을 작성하시오.","code":"","images":["imported-images/2025-2-q20-1.png"],"parts":[{"label":"①","answers":["TTL"]},{"label":"②","answers":["부장"]},{"label":"③","answers":["대리"]},{"label":"④","answers":["과장"]},{"label":"⑤","answers":["차장"]}],"explanation":"프로젝션(π)은 릴레이션에서 지정한 속성(열)만 골라내는 관계대수 연산이며, 조건에 맞는 행을 고르는 셀렉션(σ)과 구분된다. π
