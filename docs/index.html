"선택","셀렉트(Select)","Selection","셀렉션","선택 연산","Select 연산","선택(Select)","셀렉트 연산"]},{"label":"②","answers":["Project","프로젝트","추출","프로젝트(Project)","Projection","프로젝션","투영","추출 연산","Project 연산","추출(Project)","프로젝트 연산"]},{"label":"③","answers":["Division","디비전","나누기","디비전(Division)","Division 연산","디비전 연산","나누기 연산","나눗셈","나눗셈 연산","나누기(Division)"]}],"explanation":"관계대수의 순수 관계 연산자는 Select(σ), Project(π), Join(⋈), Division(÷) 네 가지이다. σ는 조건을 만족하는 튜플(행)을 골라내므로 수평적 부분집합을, π는 지정한 속성(열)만 뽑으므로 수직적 부분집합을 만든다. ÷(Division)는 R÷S에서 S의 모든 튜플과 연관된 R의 튜플을 찾은 뒤 S의 속성을 제외한 속성만 남긴다. ⋈(Join)는 공통 속성을 기준으로 두 릴레이션의 튜플을 결합하며, 합집합(∪)·교집합(∩)·차집합(-)·카티션 프로덕트(×)는 일반 집합 연산자로 분류된다. SQL의 WHERE 절이 Select, SELECT 절의 열 목록이 Project에 대응한다는 점을 기억하면 혼동을 줄일 수 있다.","difficulty":"중","point":"관계대수 순수 관계 연산자"},{"id":"c-n3","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nint main() {\n    int i = 0, a = 0, b = 0, c = 0;\n    do {\n        i++;\n        if (i % 4 == 0)\n            continue;\n        switch (i % 3) {\n            case 0:\n                a += i;\n            case 1:\n                b += i;\n                break;\n            case 2:\n                c += i;\n                if (c > 5)\n                    break;\n                a++;\n        }\n        if (a + b + c > 40)\n            break;\n    } while (i < 10);\n    printf(\"%d %d %d\\n\", a, b, c);\n    printf(\"%d\\n\", i);\n    return 0;\n}\n","parts":[{"label":"출력 결과","answers":["19 26 7\n9"]}],"explanation":"do-while 에서 continue 는 조건식 검사로 바로 넘어가므로 i 가 4, 8 일 때는 switch 와 합계 검사를 건너뛴다. case 0 에는 break 가 없어 a += i 후 case 1 의 b += i 까지 실행되는 fallthrough 가 일어난다. case 2 의 if 안에 있는 break 는 switch 만 빠져나가므로 c 가 5 를 넘는 i=5 부터는 a++ 가 실행되지 않는다. 추적하면 i=1: b=1, i=2: c=2,a=1, i=3: a=4,b=4, i=5: c=7, i=6: a=10,b=10, i=7: b=17, i=9: a=19,b=26 이 되고 합이 52 로 40 을 넘어 switch 밖의 break 로 반복문을 종료한다. 따라서 a b c 는 19 26 7, i 는 9 이다.","difficulty":"상","point":"do-while 안의 continue·break 와 switch-case fallthrough 흐름"},{"id":"sql-n1","bucketLabel":"SQL","type":"short","language":"SQL","question":"다음은 〈사원〉 테이블과 〈참여〉 테이블이다. 아래 SQL 문 ①, ②, ③을 각각 실행했을 때 출력되는 결과를 쓰시오.\n\n〈사원〉\n\n| 사번 | 이름 | 부서코드 |\n|---|---|---|\n| E01 | 김민 | D1 |\n| E02 | 이수 | D2 |\n| E03 | 박준 | D1 |\n| E04 | 최아 | D3 |\n| E05 | 정현 | D2 |\n| E06 | 한빛 | D3 |\n\n〈참여〉\n\n| 사번 | 프로젝트코드 |\n|---|---|\n| E01 | P1 |\n| E01 | P2 |\n| E03 | P1 |\n| E05 | P2 |\n| E05 | P3 |\n| E06 | P1 |\n\n```sql\n-- ①\nSELECT COUNT(*) FROM 사원\n WHERE 사번 NOT IN (SELECT 사번 FROM 참여);\n\n-- ②\nSELECT 이름 FROM 사원 S\n WHERE EXISTS (SELECT * FROM 참여 P\n                WHERE P.사번 = S.사번 AND P.프로젝트코드 = 'P3');\n\n-- ③\nSELECT COUNT(*) FROM 사원 S\n WHERE NOT EXISTS (SELECT * FROM 참여 P\n                    WHERE P.사번 = S.사번 AND P.프로젝트코드 = 'P1');\n```","code":"","parts":[{"label":"①","answers":["2","2명","2행","2개"]},{"label":"②","answers":["정현"]},{"label":"③","answers":["3","3명","3행","3개"]}],"explanation":"①의 서브쿼리 (SELECT 사번 FROM 참여)는 E01, E03, E05, E06 을 반환하므로 여기에 포함되지 않는 사원은 E02(이수), E04(최아) 2명이다. ②는 외부 질의의 사원마다 그 사번으로 프로젝트 P3 에 참여한 행이 존재하는지 검사하는 상관 서브쿼리로, P3 참여 행은 E05 하나뿐이므로 결과는 정현이다. ③은 NOT EXISTS 로 P1 참여 행이 하나도 없는 사원을 고른다. P1 참여자는 E01, E03, E06 이므로 나머지 E02, E04, E05 의 3명이 결과가 된다. NOT IN 은 서브쿼리가 돌려준 값 집합과 열 값을 비교하고, EXISTS/NOT EXISTS 는 상관 조건을 만족하는 행의 존재 여부만 판단한다는 차이를 구분한다.","difficulty":"중","point":"서브쿼리(NOT IN / EXISTS / NOT EXISTS) 실행 결과"},{"id":"test-1","bucketLabel":"테스트","type":"short","language":"","question":"다음 설명에 해당하는 블랙박스 테스트 기법을 쓰시오.\n\n입력 조건과 그에 따른 출력 사이의 논리적 관계를 AND, OR, NOT 등의 기호를 사용한 그래프로 표현한 뒤, 이 그래프를 결정 테이블로 변환하여 효용성이 높은 테스트 케이스를 선정하는 기법이다. 입력 조건들 사이의 제약(배타, 포함, 요구 등)을 함께 분석할 수 있다는 점에서 단순 분할 기법과 구별된다.","code":"","parts":[{"label":"정답","answers":["원인-효과 그래프","원인 효과 그래프","원인-효과 그래프 검사","원인-결과 그래프","Cause-Effect Graph","Cause Effect Graphing","Cause-Effect Graphing","원인-효과 그래프 기법","원인 효과 그래프 기법","원인 효과 그래프 검사","원인-결과 그래프 검사","원인-결과 그래프 기법","Cause Effect Graph","원인-효과 그래프 테스트","원인 결과 그래프","원인 효과 그래프 테스트","Cause-Effect Graph Testing","Cause Effect Graph Testing","Cause-Effect Graphing Technique"]}],"explanation":"원인-효과 그래프(Cause-Effect Graph) 기법은 입력 데이터 간의 관계와 출력에 영향을 미치는 상황을 논리 그래프(AND·OR·NOT)로 표현한 뒤 결정 테이블로 변환하여 테스트 케이스를 도출하는 블랙박스 기법이다. 지문의 「논리 그래프 → 결정 테이블 변환」이 이 기법만의 핵심 단서다. 결정 테이블 테스트는 조건·행동 조합을 표로 직접 나열하는 것이지 그래프를 먼저 그리지 않으며, 동등 분할은 입력을 유효·무효 클래스로 나누어 대표값만 고르는 기법이고, 상태 전이 테스트는 이벤트에 따른 상태 변화를 그래프로 그리지만 입력 조건의 논리 관계가 아니라 상태 변화를 다룬다는 점에서 구별된다.","difficulty":"중","point":"블랙박스 테스트 기법"},{"id":"java-n2","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"public class Main {\n    public static void main(String[] args) {\n        int[][] a = { {1, 2, 3}, {4, 5, 6} };\n        int[][] t = new int[a[0].length][a.length];\n        for (int i = 0; i < a.length; i++)\n            for (int j = 0; j < a[i].length; j++)\n                t[j][i] = a[i][j] * (i + j);\n        int diag = 0, rowMax = 0;\n        String sep = \"\";\n        for (int[] row : t) {\n            int s = 0;\n            for (int v : row) s += v;\n            if (s > rowMax) rowMax = s;\n            System.out.print(sep + s);\n            sep = \" \";\n        }\n        System.out.println();\n        for (int i = 0; i < t.length && i < t[i].length; i++)\n            diag += t[i][i];\n        System.out.println(rowMax + \" \" + diag + \" \" + t.length + \"x\" + t[0].length);\n    }\n}","parts":[{"label":"출력 결과","answers":["4 12 24\n24 10 3x2"]}],"explanation":"a 는 2행 3열, t 는 a[0].length x a.length 즉 3행 2열로 생성되고 t[j][i] = a[i][j] * (i + j) 로 전치하면서 가중치를 곱한다. i=0: t[0][0]=1*0=0, t[1][0]=2*1=2, t[2][0]=3*2=6. i=1: t[0][1]=4*1=4, t[1][1]=5*2=10, t[2][1]=6*3=18. 따라서 t = {{0,4},{2,10},{6,18}} 이고 향상된 for 문으로 구한 각 행의 합은 4, 12, 24 이며 sep 변수 덕분에 끝 공백 없이 \"4 12 24\" 로 출력된다. rowMax 는 24 이다. 대각선 합 반복문은 i < t.length && i < t[i].length 조건이므로 i=0,1 만 수행되어(i=2 에서 t[2].length=2 이므로 종료) diag = t[0][0] + t[1][1] = 0 + 10 = 10 이다. 마지막 줄은 rowMax, diag, 그리고 \"3x2\" 를 출력한다.","difficulty":"중","point":"2차원 배열 전치와 향상된 for 문"},{"id":"misc-n2","bucketLabel":"운영체제","type":"short","language":"","question":"다음 표는 비선점(Non-preemptive) SJF(Shortest Job First) 스케줄링 기법으로 처리할 4개 프로세스의 도착 시간과 실행 시간(단위: ms)이다. 이 기법으로 스케줄링했을 때 ① 평균 대기 시간과 ② 평균 반환 시간을 구하시오. (문맥 교환 시간은 무시한다.)\n\n| 프로세스 | 도착 시간 | 실행 시간 |\n|---|---|---|\n| P1 | 0 | 8 |\n| P2 | 1 | 4 |\n| P3 | 2 | 10 |\n| P4 | 3 | 6 |","code":"","parts":[{"label":"① 평균 대기 시간","answers":["8","8ms","8 ms","8밀리초","8(ms)"]},{"label":"② 평균 반환 시간","answers":["15","15ms","15 ms","15밀리초","15(ms)"]}],"explanation":"비선점 SJF는 실행 중인 프로세스를 중단하지 않고, CPU가 비는 시점에 준비 큐에 도착해 있는 프로세스 중 실행 시간이 가장 짧은 것을 선택한다. t=0에는 P1만 도착해 있으므로 P1이 0~8 실행된다. t=8에는 P2(4), P3(10), P4(6)가 모두 도착해 있으므로 가장 짧은 P2가 8~12, 이어서 P4가 12~18, 마지막으로 P3가 18~28 실행된다. 대기 시간 = 실행 시작 시각 - 도착 시간이므로 P1=0, P2=7, P3=16, P4=9, 합계 32 → 평균 32/4 = 8ms이다. 반환 시간 = 종료 시각 - 도착 시간이므로 P1=8, P2=11, P3=26, P4=15, 합계 60 → 평균 60/4 = 15ms이다. 도착 시간을 무시하고 실행 시간 순(P2→P4→P1→P3)으로 계산하거나 선점형(SRTF)으로 풀면 다른 값이 나오므로 주의한다.","difficulty":"중","point":"프로세스 스케줄링 계산"},{"id":"design-n3","bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 모듈의 응집도(Cohesion) 종류를 순서 없이 나열한 것이다. 응집도가 가장 강한(높은) 것부터 가장 약한(낮은) 것 순서로 기호를 나열하시오.\n\nㄱ. 시간적 응집도\nㄴ. 기능적 응집도\nㄷ. 논리적 응집도\nㄹ. 순차적 응집도\nㅁ. 교환적(통신적) 응집도\nㅂ. 우연적 응집도\nㅅ. 절차적 응집도","code":"","parts":[{"label":"정답","answers":["ㄴ → ㄹ → ㅁ → ㅅ → ㄱ → ㄷ → ㅂ","ㄴ, ㄹ, ㅁ, ㅅ, ㄱ, ㄷ, ㅂ","ㄴㄹㅁㅅㄱㄷㅂ","ㄴ > ㄹ > ㅁ > ㅅ > ㄱ > ㄷ > ㅂ","ㄴ ⇒ ㄹ ⇒ ㅁ ⇒ ㅅ ⇒ ㄱ ⇒ ㄷ ⇒ ㅂ","ㄴ / ㄹ / ㅁ / ㅅ / ㄱ / ㄷ / ㅂ","ㄴ · ㄹ · ㅁ · ㅅ · ㄱ · ㄷ · ㅂ","ㄴ ＞ ㄹ ＞ ㅁ ＞ ㅅ ＞ ㄱ ＞ ㄷ ＞ ㅂ"]}],"explanation":"응집도는 모듈 내부 구성 요소들이 서로 얼마나 밀접하게 관련되어 있는가를 나타내며, 강할수록 좋은 설계이다(결합도는 약할수록 좋음). 강한 것부터 순서는 기능적 → 순차적 → 교환적(통신적) → 절차적 → 시간적 → 논리적 → 우연적이다. 기능적 응집도는 모듈의 모든 요소가 단일 기능 수행에 기여하는 경우, 순차적은 한 활동의 출력이 다음 활동의 입력으로 쓰이는 경우, 교환적(통신적)은 동일한 입력·출력 데이터를 사용하는 요소들이 모인 경우, 절차적은 여러 활동을 정해진 순서대로 수행하되 데이터는 공유하지 않는 경우이다. 시간적은 특정 시점에 함께 실행되는 활동(초기화 모듈 등), 논리적은 유사한 성격의 처리를 하나로 묶어 분기로 선택하는 경우, 우연적은 요소 간 아무 관련이 없는 경우이다. 절차적과 시간적의 순서(절차적이 더 강함), 순차적과 교환적의 순서(순차적이 더 강함)를 혼동하지 않도록 주의한다.","difficulty":"중","point":"응집도 7종 강약 순서"},{"id":"c-n4","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nint add(int a, int b) { return a + b; }\nint mul(int a, int b) { return a * b; }\nint sub(int a, int b) { return a - b; }\n\nint apply(int (*f)(int, int), int x, int y) {\n    return f(x, y);\n}\n\nint main() {\n    int (*ops[3])(int, int) = { add, mul, sub };\n    int data[6] = { 2, 5, 1, 4, 3, 7 };\n    int cnt[3] = { 0, 0, 0 };\n    int r = 1, i;\n    for (i = 0; i < 6; i++) {\n        int k = data[i] % 3;\n        r = apply(ops[k], r, data[i]);\n        cnt[k]++;\n    }\n    printf(\"%d\\n\", r);\n    printf(\"%d %d %d\\n\", cnt[0], cnt[1], cnt[2]);\n    return 0;\n}\n","parts":[{"label":"출력 결과","answers":["-147\n1 3 2"]}],"explanation":"int (*ops[3])(int, int) 는 int 두 개를 받아 int 를 반환하는 함수 포인터 3개짜리 배열이며, ops[k] 를 apply 에 넘기면 f(x, y) 로 해당 함수가 호출된다. 선택 기준은 data[i] % 3 으로 0이면 add, 1이면 mul, 2이면 sub 이다. r 은 1 에서 시작하여 sub(1,2)=-1, sub(-1,5)=-6, mul(-6,1)=-6, mul(-6,4)=-24, add(-24,3)=-21, mul(-21,7)=-147 로 변한다. 사용된 k 는 2,2,1,1,0,1 이므로 cnt 는 1 3 2 이다. 배열 초기화 순서가 add, mul, sub 이지 add, sub, mul 이 아니라는 점에 주의해야 한다.","difficulty":"중","point":"함수 포인터 배열로 연산 선택 호출"},{"id":"network-n2","bucketLabel":"네트워크","type":"short","language":"","question":"다음은 IPv4 네트워크에서 IPv6 네트워크로 전환(이행)하는 과도기에 두 프로토콜을 공존시키기 위해 사용하는 세 가지 기술에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 용어를 쓰시오.\n\n- ( ① ): 하나의 호스트나 라우터가 IPv4와 IPv6 두 프로토콜을 모두 구현하여 함께 운용하며, 통신 상대가 사용하는 프로토콜에 맞추어 둘 중 하나를 선택해 통신하는 방식이다.\n- ( ② ): IPv6 패킷을 IPv4 패킷 안에 캡슐화하여 IPv4 네트워크 구간을 통과시킨 뒤 반대편 끝에서 다시 꺼내는 방식으로, 6to4, ISATAP, Teredo 등이 대표적이다.\n- ( ③ ): IPv4 전용 호스트와 IPv6 전용 호스트가 직접 통신할 수 있도록 중간에 놓인 게이트웨이가 두 프로토콜의 패킷 헤더를 서로 바꾸어 주는 방식으로, NAT-PT가 대표적이다.","code":"","parts":[{"label":"①","answers":["듀얼 스택","Dual Stack","이중 스택","듀얼 스택(Dual Stack)","듀얼 스택 기법","이중 스택(Dual Stack)","듀얼 스택 방식","Dual Stack 기법"]},{"label":"②","answers":["터널링","Tunneling","터널링(Tunneling)","터널링 기법","터널링 방식","터널링 기술","Tunneling 기법"]},{"label":"③","answers":["주소 변환","Address Translation","헤더 변환","Header Translation","주소 변환(Address Translation)","헤더 변환(Header Translation)","프로토콜 변환","변환 기법","변환","Translation","변환(Translation)","주소 변환 기법","헤더 변환 기법","프로토콜 변환 기법","주소/헤더 변환","IP 헤더 변환","변환 방식","주소 변환 방식","헤더 변환 방식","프로토콜 변환(Protocol Translation)","Protocol Translation"]}],"explanation":"IPv4에서 IPv6로 한꺼번에 바꿀 수 없으므로 과도기에 두 프로토콜을 공존시키는 세 가지 전환 기술이 사용된다. 듀얼 스택은 장비가 두 프로토콜을 모두 구현해 상대에 따라 골라 쓰는 가장 단순한 방식이지만 모든 장비가 두 종류의 주소를 가져야 한다. 터널링은 IPv6 패킷을 IPv4 헤더로 감싸 IPv4 망을 터널처럼 통과시키는 방식으로 6to4·ISATAP·Teredo가 대표적이며, 양 끝 호스트는 모두 IPv6를 사용한다. 주소 변환(헤더 변환)은 IPv4 전용 호스트와 IPv6 전용 호스트 사이에서 NAT-PT 같은 게이트웨이가 헤더를 상호 변환해 직접 통신하게 하는 방식으로, 한쪽만 IPv6여도 된다는 점에서 터널링과 구분된다.","difficulty":"중","point":"IPv6 전환(공존) 기술 3종 빈칸"},{"id":"python-n3","bucketLabel":"Python","type":"code","language":"Python","question":"다음 Python 코드의 출력 결과를 쓰시오.","code":"count = 0\ntotal = 10\n\ndef step(n):\n    global count\n    count += 1\n    total = n * 2\n    return total + count\n\ndef search(limit):\n    i = 1\n    while i <= limit:\n        if step(i) % 7 == 0:\n            break\n        i += 1\n    else:\n        return -1\n    return i\n\nr1 = search(3)\nr2 = search(10)\nq, m = divmod(2 ** count + total, 7)\nprint(r1, r2)\nprint(count, total)\nprint(q, m)","parts":[{"label":"출력 결과","answers":["-1 6\n9 10\n74 4"]}],"explanation":"step 안의 count는 global 선언 덕분에 전역 변수를 직접 증가시키지만, total은 global 선언이 없으므로 함수 안에서만 쓰이는 지역 변수가 되어 전역 total = 10은 끝까지 바뀌지 않는다. search(3)은 step(1), step(2), step(3)이 각각 3, 6, 9를 반환하여 7의 배수가 없고, break 없이 while 조건이 거짓이 되어 끝났으므로 else 절이 실행되어 -1을 반환한다. search(10)은 count가 3부터 이어지며 step(1)~step(6)이 6, 9, 12, 15, 18, 21을 반환하고, 21이 7의 배수이므로 i = 6에서 break되어 else 절을 건너뛰고 6을 반환한다. step은 총 9번 호출되어 count = 9, total = 10이며, 2 ** 9 + 10 = 522를 7로 나눈 divmod는 몫 74, 나머지 4이다. while의 else는 반복이 break 없이 정상 종료될 때만 실행된다는 점이 핵심이다.","difficulty":"중","point":"global 키워드와 함수 안 지역변수 섀도잉, while-else 와 break, divmod 와 거듭제곱"},{"id":"misc-n0","bucketLabel":"통합·패키징","type":"short","language":"","question":"다음은 웹 서비스(Web Service)의 구성 요소에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 용어를 쓰시오.\n\n- ( ① ): HTTP, HTTPS, SMTP 등의 프로토콜을 이용하여 XML 기반의 메시지를 네트워크 상에서 교환하기 위한 통신 규약으로, 메시지는 봉투(Envelope)·헤더(Header)·본문(Body) 구조로 이루어진다.\n- ( ② ): 웹 서비스명, 제공 위치, 메시지 포맷, 사용 프로토콜 등 웹 서비스에 대한 상세 정보를 XML 형식으로 기술한 서비스 명세 언어이다.\n- ( ③ ): ( ② )로 기술된 웹 서비스 정보를 등록·저장·검색할 수 있도록 하는 웹 서비스 레지스트리(저장소)로, 서비스 제공자가 서비스를 공개하고 서비스 요청자가 이를 찾을 수 있게 한다.","code":"","parts":[{"label":"①","answers":["SOAP","Simple Object Access Protocol","소프","SOAP(Simple Object Access Protocol)","단순 객체 접근 프로토콜"]},{"label":"②","answers":["WSDL","Web Services Description Language","Web Service Description Language","웹 서비스 기술 언어","WSDL(Web Services Description Language)","WSDL(Web Service Description Language)","웹 서비스 기술 언어(WSDL)"]},{"label":"③","answers":["UDDI","Universal Description, Discovery and Integration","Universal Description Discovery and Integration","UDDI(Universal Description, Discovery and Integration)","UDDI(Universal Description Discovery and Integration)","Universal Description, Discovery, and Integration"]}],"explanation":"웹 서비스는 네트워크에 분산된 애플리케이션을 표준 기술로 연동하기 위한 것으로, 메시지 교환 프로토콜·서비스 기술 언어·서비스 레지스트리의 세 요소로 구성된다. ①은 Envelope·Header·Body 구조의 XML 메시지를 HTTP 등으로 주고받는 프로토콜인 SOAP이다. ②는 서비스의 이름·위치·메시지 형식·프로토콜을 XML로 기술한 WSDL이고, ③은 WSDL 문서를 등록·검색하는 레지스트리인 UDDI이다. 동작 흐름은 제공자가 WSDL을 UDDI에 등록(Publish) → 요청자가 UDDI에서 검색(Find) → WSDL을 참조하여 SOAP으로 호출(Bind) 순이다. REST는 이들 없이 HTTP 메서드와 URI로 자원을 다루는 아키텍처 스타일이므로 구분한다.","difficulty":"하","point":"웹 서비스 구성 요소 3가지"},{"id":"java-n5","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"public class Main {\n    static int score(String grade) {\n        int s = 0;\n        switch (grade) {\n            case \"A\": s += 10;\n            case \"B\": s += 5; break;\n            case \"C\": s += 3;\n            default: s += 1;\n        }\n        return s;\n    }\n    public static void main(String[] args) {\n        String[] gs = { \"B\", \"A\", \"C\", \"D\", \"A\" };\n        int total = 0;\n        StringBuilder sb = new StringBuilder();\n        for (String g : gs) {\n            int v = score(g);\n            total += v;\n            sb.append(g).append(v);\n        }\n        System.out.println(sb + \" \" + total);\n        int n = 0;\n        for (int i = 1; i <= 5; i++) {\n            switch (i % 3) {\n                case 0: n += i;\n                case 1: n += 1; break;\n                case 2: n -= 1;\n            }\n        }\n        System.out.println(n);\n        char op = '*';\n        int acc = 2;\n        switch (op) {\n            case '+': acc += 3; break;\n            case '*': acc *= 3;\n            case '-': acc -= 1;\n            case '/': acc /= 2; break;\n            default: acc = 0;\n        }\n        System.out.println(acc);\n    }\n}","parts":[{"label":"출력 결과","answers":["B5A15C4D1A15 40\n4\n2"]}],"explanation":"switch 문은 일치하는 case 부터 실행을 시작하며 break 를 만나기 전까지 아래 case 로 계속 흘러내린다(fallthrough). score(): \"A\" 는 s+=10 후 break 가 없어 \"B\" 의 s+=5 까지 실행되어 15, \"B\" 는 5, \"C\" 는 s+=3 후 default 의 s+=1 까지 실행되어 4, \"D\" 는 default 만 실행되어 1 이다. 따라서 sb 는 B5A15C4D1A15, total 은 5+15+4+1+15=40 이다. 두 번째 switch: i=1(나머지 1) n=1, i=2(나머지 2) n=0, i=3(나머지 0) n+=3 후 흘러내려 n+=1 로 4, i=4 n=5, i=5 n=4 가 되어 4 를 출력한다. 세 번째 switch: op='*' 에서 acc=2*3=6, break 가 없어 acc-=1 로 5, acc/=2 로 2(정수 나눗셈) 가 된 뒤 break 되어 2 를 출력한다.","difficulty":"하","point":"switch 문 fallthrough"},{"id":"security-2","bucketLabel":"정보 보안","type":"short","language":"","question":"다음 설명에 해당하는 암호 알고리즘을 쓰시오.\n\n1999년 한국인터넷진흥원(KISA)이 개발하여 국내 표준(TTA)으로 제정된 대칭키 블록 암호 알고리즘으로, 128비트 블록 크기와 128비트 키 길이를 사용하며 16라운드의 Feistel 구조로 동작한다. 전자상거래, 금융, 무선 통신 등의 기밀성 보장에 활용되며 ISO/IEC 국제 표준으로도 등록되어 있다.","code":"","parts":[{"label":"정답","answers":["SEED","시드","SEED 알고리즘","시드 알고리즘","SEED 암호","SEED 블록 암호","시드 암호","SEED 암호 알고리즘","SEED(시드)","시드(SEED)","SEED-128"]}],"explanation":"SEED는 1999년 KISA(당시 한국정보보호센터)가 개발한 국산 대칭키 블록 암호로, 128비트 블록·128비트 키·16라운드 Feistel 구조가 핵심 식별 단서이다. 같은 국산 블록 암호인 ARIA는 2004년 국가정보원과 ETRI 등이 개발했고 128/192/256비트 키에 12/14/16라운드의 SPN(Involutional SPN) 구조를 사용하므로 연도·개발 기관·구조에서 구분된다. 경량 환경용 국산 암호 LEA(2013년, ARX 구조)와 국산 해시 HAS-160도 혼동하기 쉬운 용어이다. 미국 표준 AES(Rijndael)는 128비트 블록에 128/192/256비트 키, SPN 구조, DES는 64비트 블록·56비트 키·16라운드 Feistel 구조이므로 DES와는 라운드 수와 구조가 같지만 블록·키 길이가 다르다.","difficulty":"중","point":"암호 알고리즘"},{"id":"sql-2","bucketLabel":"SQL","type":"short","language":"SQL","question":"다음은 데이터 제어어(DCL) 문장이다. 첫 번째 문장은 사용자 KIM 에게 STUDENT 테이블의 조회·갱신 권한을 부여하면서 KIM 이 그 권한을 다른 사용자에게 다시 부여할 수 있도록 하는 문장이고, 두 번째 문장은 KIM 의 조회 권한을 회수하면서 KIM 이 다른 사용자에게 부여했던 조회 권한까지 연쇄적으로 함께 회수하는 문장이다. 괄호 ( ① ), ( ② )에 들어갈 알맞은 구문을 쓰시오.\n\n```sql\nGRANT SELECT, UPDATE ON STUDENT TO KIM ( ① );\n\nREVOKE SELECT ON STUDENT FROM KIM ( ② );\n```","code":"","parts":[{"label":"①","answers":["WITH GRANT OPTION","WITH GRANT OPTION;"]},{"label":"②","answers":["CASCADE","CASCADE;"]}],"explanation":"GRANT 문 끝에 WITH GRANT OPTION 을 붙이면 권한을 받은 사용자가 그 권한을 제3자에게 다시 부여할 수 있다. REVOKE 문 끝의 CASCADE 는 회수 대상 사용자가 WITH GRANT OPTION 으로 다른 사용자에게 전파한 권한까지 연쇄적으로 함께 회수하라는 옵션이다. 반대로 RESTRICT 는 전파된 권한이 있으면 회수를 거부한다. REVOKE 에서 GRANT OPTION FOR 를 쓰면 권한 자체는 남기고 재부여 권한만 회수하므로 지문의 「조회 권한을 회수」와 맞지 않는다. DROP TABLE ... CASCADE 의 CASCADE 가 참조 객체를 연쇄 삭제하는 것과 같은 의미로, 뒤따르는 종속 항목을 함께 처리한다고 기억하면 된다.","difficulty":"중","point":"DCL GRANT WITH GRANT OPTION / REVOKE CASCADE 빈칸"}]}];
const NOTES = [{"key":"lang","area":"프로그래밍 언어","intro":"실기 20문항 중 7~9문항이 코드 출력 문제다. C·Java·Python 모두 「손으로 추적」이 기본이고, 함정은 언어별 규칙 차이에서 나온다.","cards":[{"title":"세 언어의 정수 나눗셈·나머지","kind":"table","head":["식","C / Java","Python"],"rows":[["7 / 2","3 (0 방향 절삭)","3.5 (/ 는 실수), 7 // 2 = 3"],["-7 / 2","-3","-7 // 2 = -4 (내림)"],["-7 % 3","-1 (피제수 부호)","2 (제수 부호)"],["7 % -3","1","-2"]],"note":"Python 의 % 결과는 항상 나누는 수와 같은 부호. a == (a // b) * b + a % b 가 항상 성립한다."},{"title":"C 포인터·배열 핵심","kind":"list","items":["배열 이름은 첫 원소의 주소. a[i] 와 *(a + i) 는 같다. p + 1 은 다음 원소(자료형 크기만큼) 이동.","함수에 배열을 넘기면 포인터로 전달되므로 함수 안의 변경이 원본에 반영된다. p + 1 을 넘기면 함수 안의 *(p + i) 는 원래 배열의 a[1 + i].","2차원 배열 a[2][3] 에서 a[1][2] 는 1*3 + 2 = 5번째(0부터) 원소. *(a[1] + 2), *(*(a + 1) + 2) 모두 같은 값.","구조체 포인터는 p->member, 구조체 변수는 s.member. 구조체 배열 arr[i].member.","static 지역변수는 프로그램 시작 시 한 번만 초기화되고 호출 사이에 값이 유지된다. 일반 지역변수는 호출마다 새로 만들어진다.","문자열은 '\\0' 으로 끝난다. strlen 은 '\\0' 을 세지 않고, 배열 크기는 '\\0' 포함.","문자와 정수: 'A' = 65, 'a' = 97, '0' = 48. 소문자 → 대문자는 c - 32, 숫자 문자 → 값은 c - '0'.","전위 ++i 는 증가 후 사용, 후위 i++ 는 사용 후 증가. 한 식에서 같은 변수를 두 번 바꾸는 코드는 시험에 안 나온다(미정의 동작)."]},{"title":"C 비트 연산","kind":"table","head":["연산","의미","예 (44=101100, 27=011011)"],"rows":[["&","둘 다 1일 때 1","44 & 27 = 001000 = 8"],["|","하나라도 1이면 1","44 | 27 = 111111 = 63"],["^","서로 다를 때 1","44 ^ 27 = 110111 = 55"],["~","비트 반전 (~x = -x-1)","~5 = -6"],["<<","왼쪽 이동 = ×2ⁿ","44 << 2 = 176"],[">>","오른쪽 이동 = ÷2ⁿ (몫)","27 >> 3 = 3"]],"note":"n & 1 은 최하위 비트, n >>= 1 을 반복하면 1인 비트 개수를 셀 수 있다."},{"title":"Java 객체지향 함정","kind":"list","items":["오버라이딩된 메서드는 참조 타입이 아니라 실제 객체 타입으로 결정된다(동적 바인딩). 부모 메서드 안에서 호출한 메서드도 자식 것이 실행된다.","필드(멤버 변수)는 참조 타입 기준(정적). Parent p = new Child(); p.x 는 Parent 의 x. static 메서드도 참조 타입 기준.","생성자 첫 줄에 super() 또는 this() 가 없으면 컴파일러가 super() 를 넣는다. 부모 생성자 → 자식 생성자 순으로 실행.","실행 순서: static 블록(클래스 로딩 시 1회) → 인스턴스 초기화 블록 → 생성자. 객체를 만들 때마다 뒤 두 개가 반복된다.","오버로딩은 매개변수 타입·개수로 컴파일 시점에 결정. int 인자는 int → long → float → double → (박싱) Integer → Object 순으로 가까운 것을 고른다.","static 변수는 클래스당 하나라 모든 객체가 공유한다. 생성자에서 static 을 ++ 하면 객체 수를 셀 수 있다.","추상 클래스는 new 불가, 추상 메서드는 자식이 반드시 구현. 인터페이스 변수는 public static final, 메서드는 public abstract (default/static 메서드 예외)."]},{"title":"Java 문자열·예외·연산","kind":"list","items":["+ 연산은 왼쪽부터: 1 + 2 + \"a\" = \"3a\", \"a\" + 1 + 2 = \"a12\". char + int 는 정수 덧셈('A' + 1 = 66), 문자열로 만들려면 \"\" + 를 붙인다.","substring(2, 5) 는 인덱스 2·3·4(끝 미포함). indexOf 는 첫 위치, 없으면 -1. charAt(i) 는 char. length() 메서드(배열은 length 필드).","StringBuilder 는 가변: append·insert·reverse·deleteCharAt. String 은 불변이라 메서드 결과를 다시 대입해야 바뀐다.","try 에서 return 해도 finally 는 실행된다. catch 가 없는 예외는 호출한 쪽으로 전파되고, 전파되면 그 문장의 나머지(덧셈 등)는 수행되지 않는다.","ArithmeticException(0 으로 나눔), ArrayIndexOutOfBoundsException, NullPointerException, NumberFormatException 은 모두 RuntimeException(unchecked).","삼항 연산자 a > b ? a : b. 정수 나눗셈 7 / 2 = 3, (double) 7 / 2 = 3.5, (int) 3.9 = 3.","&& || 는 단락 평가(앞이 결정되면 뒤를 실행하지 않음), & | 는 둘 다 평가. 뒤쪽에 i++ 같은 부수효과가 있으면 결과가 달라진다."]},{"title":"Python 핵심","kind":"list","items":["슬라이싱 a[start:end:step] 은 end 미포함. a[::-1] 은 역순, a[-3:] 은 뒤에서 3개, a[1::2] 는 홀수 인덱스.","리스트 print 는 [1, 2, 3] (쉼표+공백), 튜플은 (1, 2), 딕셔너리는 {'a': 1}. 문자열은 따옴표 없이 출력. True / False / None 은 대문자로 시작.","print(a, b) 는 공백으로 구분, 끝에 줄바꿈. sep=, end= 로 바꿀 수 있다.","딕셔너리는 삽입 순서를 유지한다. d.get(k, 0) 은 없으면 기본값. d.items() 는 (키, 값) 쌍.","리스트는 가변: b = a 는 같은 객체(별칭), b = a[:] 또는 list(a) 는 복사. 문자열·튜플은 불변.","함수 안에서 전역 변수를 바꾸려면 global 선언이 필요하다. 읽기만 하면 선언 없이 가능.","lambda x: x * 2, map(f, L), filter(f, L), sorted(L, key=..., reverse=True). map/filter 결과는 list() 로 감싸야 리스트로 출력된다.","** 거듭제곱, // 몫, divmod(7, 2) = (3, 1), abs, len, range(start, stop, step) 는 stop 미포함.","클래스: __init__(self, ...) 생성자, self 로 속성 접근, 상속 class B(A):, super().__init__() 로 부모 생성자 호출."]}]},{"key":"sql","area":"SQL","intro":"매회 1~2문항. 실행 결과(행 수·값)를 묻거나 빈칸을 채운다. WHERE 와 HAVING, COUNT(*) 와 COUNT(열), 조인 종류를 구분한다.","cards":[{"title":"SQL 분류","kind":"table","head":["분류","명령","용도"],"rows":[["DDL","CREATE, ALTER, DROP, TRUNCATE","구조 정의"],["DML","SELECT, INSERT, UPDATE, DELETE","데이터 조작"],["DCL","GRANT, REVOKE","권한 제어"],["TCL","COMMIT, ROLLBACK, SAVEPOINT","트랜잭션 제어 (DCL 에 포함시키기도 함)"]]},{"title":"SELECT 실행 순서와 함정","kind":"list","items":["실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY. WHERE 는 그룹화 전 개별 행, HAVING 은 그룹화 후 집계값을 거른다.","COUNT(*) 는 NULL 포함 전체 행, COUNT(열) 은 NULL 제외, COUNT(DISTINCT 열) 은 중복·NULL 제외. SUM/AVG/MAX/MIN 도 NULL 을 무시한다.","NULL 비교는 = 이 아니라 IS NULL / IS NOT NULL. NULL 과의 산술·비교 결과는 NULL(거짓 취급).","LIKE: % 는 0개 이상 문자, _ 는 한 글자. '김%' 김으로 시작, '%수' 수로 끝남, '_준%' 두 번째 글자가 준.","BETWEEN a AND b 는 양 끝 포함. IN (...) 은 목록 중 하나. ORDER BY 기본 ASC, DESC 내림차순, 여러 열이면 앞 열 우선.","INNER JOIN 은 양쪽에 짝이 있는 행만, LEFT OUTER JOIN 은 왼쪽 전체 + 짝 없는 오른쪽은 NULL. 조인 후 WHERE 로 오른쪽 열을 걸면 NULL 행이 빠져 INNER 처럼 된다.","서브쿼리: IN (SELECT ...) 은 목록 비교, EXISTS 는 행 존재 여부, NOT IN 목록에 NULL 이 있으면 결과가 비게 된다."]},{"title":"DDL·DCL 구문 빈칸 단골","kind":"table","head":["구문","의미"],"rows":[["PRIMARY KEY / UNIQUE / NOT NULL / CHECK / DEFAULT","열 제약조건"],["FOREIGN KEY (열) REFERENCES 테이블(열) ON DELETE CASCADE | SET NULL | NO ACTION","참조 무결성, 부모 삭제 시 동작"],["ALTER TABLE t ADD 열 자료형 / MODIFY 열 / DROP COLUMN 열","구조 변경"],["DROP TABLE t CASCADE | RESTRICT","참조 객체 함께 삭제 | 참조 있으면 거부"],["CREATE VIEW v AS SELECT ... WITH CHECK OPTION","뷰 조건에 맞지 않는 갱신 거부"],["CREATE [UNIQUE] INDEX idx ON t(열)","인덱스 생성"],["GRANT 권한 ON 객체 TO 사용자 WITH GRANT OPTION","재부여 권한까지 부여"],["REVOKE [GRANT OPTION FOR] 권한 ON 객체 FROM 사용자 CASCADE","연쇄 회수 (GRANT OPTION FOR 는 재부여 권한만 회수)"],["UPDATE t SET 열 = 값 WHERE 조건 / DELETE FROM t WHERE 조건","WHERE 없으면 전체 행"],["INSERT INTO t(열,...) VALUES (...) / INSERT INTO t SELECT ...","행 삽입"]]},{"title":"절차형 SQL","kind":"list","items":["프로시저: CALL/EXECUTE 로 호출, 반환값 없음(OUT 매개변수 가능).","사용자 정의 함수: SELECT 문 안에서 호출, RETURN 으로 값 하나 반환.","트리거: INSERT·UPDATE·DELETE 이벤트 시 DBMS 가 자동 실행, BEFORE/AFTER, 직접 호출 불가.","커서: 결과 집합을 한 행씩 처리. OPEN → FETCH → CLOSE."]}]},{"key":"design","area":"소프트웨어 설계","intro":"디자인 패턴, 응집도·결합도, UML 은 거의 매회 나온다. 「설명 → 이름」 형식이라 각 항목의 고유 단서를 외운다.","cards":[{"title":"GoF 디자인 패턴 23종","kind":"table","head":["분류","패턴","한 줄 단서"],"rows":[["생성","싱글톤 Singleton","인스턴스 하나만, 전역 접근점"],["생성","팩토리 메서드 Factory Method","생성을 서브클래스에 위임, 가상 생성자"],["생성","추상 팩토리 Abstract Factory","관련 객체 군(family)을 묶어 생성"],["생성","빌더 Builder","복잡한 객체를 단계별로 조립, 표현과 생성 분리"],["생성","프로토타입 Prototype","원본을 복제(clone)해서 생성"],["구조","어댑터 Adapter","인터페이스 변환으로 호환, 래퍼"],["구조","브리지 Bridge","추상과 구현을 분리해 독립 확장"],["구조","컴포지트 Composite","트리 구조, 부분-전체를 동일하게 취급"],["구조","데코레이터 Decorator","객체에 동적으로 기능 추가(포장)"],["구조","퍼사드 Facade","서브시스템에 단일 창구 인터페이스"],["구조","플라이웨이트 Flyweight","공유로 메모리 절약(인스턴스 재사용)"],["구조","프록시 Proxy","대리 객체, 접근 제어·지연 로딩"],["행위","책임 연쇄 Chain of Responsibility","요청을 처리자 사슬로 전달"],["행위","커맨드 Command","요청을 객체로 캡슐화, 실행 취소"],["행위","인터프리터 Interpreter","언어 문법을 클래스로 표현"],["행위","반복자 Iterator","내부 구조 노출 없이 순차 접근"],["행위","중재자 Mediator","객체 간 상호작용을 한 객체(중재자)에 캡슐화, M:N → 1:N"],["행위","메멘토 Memento","상태 저장 후 복원(undo)"],["행위","옵저버 Observer","상태 변화를 여러 객체에 자동 통지, 1:N"],["행위","상태 State","상태에 따라 행위 변경, 상태를 객체로"],["행위","전략 Strategy","알고리즘 군을 교체 가능하게 캡슐화"],["행위","템플릿 메서드 Template Method","골격은 부모, 세부는 자식이 재정의"],["행위","방문자 Visitor","구조는 두고 연산을 분리·추가"]],"note":"생성 5 · 구조 7 · 행위 11. 퍼사드(단순화 창구)·어댑터(변환)·프록시(대리)·데코레이터(기능 추가)는 서로 구분 단서를 꼭 확인."},{"title":"응집도(높을수록 좋음) · 결합도(낮을수록 좋음)","kind":"table","head":["응집도 (강 → 약)","단서","결합도 (약 → 강)","단서"],"rows":[["기능적 Functional","단일 기능 수행","자료 Data","필요한 값만 매개변수로"],["순차적 Sequential","한 요소의 출력이 다음의 입력","스탬프 Stamp","자료 구조(배열·레코드) 전체를 전달, 일부만 사용"],["통신적 Communicational","같은 입력·출력 사용, 서로 다른 기능","제어 Control","플래그·제어 신호 전달"],["절차적 Procedural","정해진 순서로 수행, 데이터는 공유 안 함","외부 External","다른 모듈에서 외부로 선언한 변수(반환값)를 참조"],["시간적 Temporal","같은 시간대에 수행(초기화 등)","공통 Common","전역 변수 공유"],["논리적 Logical","유사한 성격을 모아 놓음(선택적)","내용 Content","다른 모듈 내부 자료·기능을 직접 참조·수정"],["우연적 Coincidental","아무 관련 없음","",""]],"note":"암기: 응집도 「기순통절시논우」, 결합도 「자스제외공내」."},{"title":"UML 다이어그램과 관계","kind":"table","head":["구분","항목"],"rows":[["구조(정적) 6","클래스, 객체, 컴포넌트, 배치, 복합 구조, 패키지"],["행위(동적) 7","유스케이스, 시퀀스, 커뮤니케이션(협동), 상태, 활동, 상호작용 개요, 타이밍"],["연관 Association","실선, 서로 참조 (다중성 1, *, 0..1)"],["집합 Aggregation","빈 마름모, 부분이 독립적으로 존재 가능"],["합성 Composition","채운 마름모, 전체가 사라지면 부분도 사라짐"],["일반화 Generalization","빈 삼각 화살표 실선, 상속(is-a)"],["의존 Dependency","점선 화살표, 일시적 사용"],["실체화 Realization","점선 + 빈 삼각, 인터페이스 구현"]],"note":"시퀀스 다이어그램 요소: 생명선, 활성 상자, 메시지. 유스케이스 관계: 포함 <<include>>, 확장 <<extend>>, 일반화."},{"title":"설계 원칙·분석 도구·아키텍처","kind":"list","items":["SOLID: 단일 책임(SRP), 개방-폐쇄(OCP: 확장에 열리고 수정에 닫힘), 리스코프 치환(LSP), 인터페이스 분리(ISP), 의존 역전(DIP: 추상에 의존).","럼바우 분석: 객체 모델링(객체 다이어그램) → 동적 모델링(상태 다이어그램) → 기능 모델링(자료 흐름도 DFD). 「객동기」.","DFD 구성요소: 프로세스(원), 자료 흐름(화살표), 자료 저장소(평행선), 단말(사각형). 자료 사전 기호: = 정의, + 연결, ( ) 생략, [ | ] 선택, { } 반복, ** 주석.","아키텍처 패턴: 계층(Layered), 클라이언트-서버, 파이프-필터(데이터 스트림 단계 처리), 브로커(분산 중개), MVC(모델·뷰·컨트롤러), 마스터-슬레이브.","미들웨어: RPC(원격 프로시저 호출), MOM(메시지 지향, 비동기), TP-Monitor(트랜잭션 처리), ORB(객체 요청 브로커, CORBA), WAS(웹 애플리케이션 서버), DB 미들웨어.","EAI 유형: 포인트 투 포인트(1:1 직접), 허브 앤 스포크(중앙 허브), 메시지 버스(ESB, 미들웨어 버스), 하이브리드(그룹 내 허브, 그룹 간 버스).","생명주기: 폭포수(단계 순차), 프로토타입(견본), 나선형(계획 → 위험 분석 → 개발 → 고객 평가 반복), 애자일(XP 5가치: 용기·단순성·의사소통·피드백·존중; 스크럼: 스프린트·백로그·번다운 차트).","코드 설계: 순차, 블록(구분), 10진, 그룹 분류, 연상(기억하기 쉬운 문자), 표의 숫자(길이·무게 등 물리값), 합성."]}]},{"key":"db","area":"데이터베이스","intro":"정규화·트랜잭션·키·무결성·회복 기법이 핵심. 단계와 종류의 이름을 정확한 용어로 쓴다.","cards":[{"title":"정규화 단계","kind":"table","head":["단계","제거하는 것","조건"],"rows":[["1NF","도메인이 원자값이 아닌 것(반복 그룹)","모든 속성이 원자값"],["2NF","부분 함수 종속","기본키 전체에 완전 종속"],["3NF","이행적 함수 종속 (A→B, B→C ⇒ A→C)","비키 속성 간 종속 없음"],["BCNF","후보키가 아닌 결정자","모든 결정자가 후보키"],["4NF","다치 종속 (→→)",""],["5NF","조인 종속","후보키를 통하지 않는 조인 종속 제거"]],"note":"암기 「도부이결다조」. 이상 현상 3종: 삽입·삭제·갱신 이상. 반정규화는 성능을 위해 의도적으로 정규화를 되돌리는 것(테이블 통합·분할·중복 열 추가)."},{"title":"트랜잭션","kind":"list","items":["ACID: 원자성 Atomicity(All or Nothing), 일관성 Consistency, 독립성(격리성) Isolation, 지속성(영속성) Durability.","상태: 활동(Active) → 부분 완료(Partially Committed) → 완료(Committed) / 실패(Failed) → 철회(Aborted).","병행 제어: 로킹(로킹 단위가 크면 로크 수 적고 병행성 낮음), 2단계 로킹(확장 단계·축소 단계), 타임스탬프, 낙관적 검증, 다중 버전.","병행 제어 안 하면: 갱신 분실, 모순성, 연쇄 복귀(Cascading Rollback), 비완료 의존성.","회복 기법: 즉시 갱신(Undo·Redo 모두), 지연 갱신(Redo 만), 검사점(Checkpoint), 그림자 페이징(로그 없음, 페이지 테이블 복사), 미디어 회복(덤프).","REDO: 완료된 트랜잭션을 다시 반영. UNDO: 미완료 트랜잭션을 취소."]},{"title":"키·무결성·스키마·관계대수","kind":"list","items":["키: 슈퍼키(유일성) ⊃ 후보키(유일성+최소성) → 기본키(선택된 후보키, NULL 불가) / 대체키(나머지 후보키). 외래키는 다른 릴레이션의 기본키 참조.","무결성: 개체(기본키 NULL·중복 불가), 참조(외래키는 참조 기본키 값이거나 NULL), 도메인(값 범위), 키, NULL, 사용자 정의.","3단계 스키마: 외부(사용자 뷰) - 개념(전체 논리 구조) - 내부(물리 저장). 논리적 독립성(외부↔개념), 물리적 독립성(개념↔내부).","관계대수: σ 셀렉트(행 선택), π 프로젝트(열 선택), ⋈ 조인, ÷ 디비전, ∪ ∩ − × 집합 연산. 관계해석은 비절차적(튜플·도메인 해석).","분산 DB 투명성: 위치, 중복(복제), 병행, 장애, 분할. 파티셔닝: 범위, 해시, 리스트, 컴포지트.","인덱스: 검색 속도 향상, 갱신 비용 증가. 뷰: 가상 테이블, 독립적 인덱스 불가, 삽입·갱신 제약. 클러스터: 자주 조인되는 테이블을 물리적으로 인접 저장.","데이터 모델 구성요소: 구조, 연산, 제약조건. 모델링 순서: 개념(ER) → 논리(릴레이션) → 물리(저장 구조)."]}]},{"key":"network","area":"네트워크","intro":"OSI 7계층과 프로토콜의 「계층·역할·장비」, 라우팅 프로토콜, 서브네팅 계산이 반복 출제된다.","cards":[{"title":"OSI 7계층","kind":"table","head":["계층","역할","PDU","장비 / 프로토콜"],"rows":[["7 응용","사용자 인터페이스","데이터","HTTP, FTP, SMTP, DNS, Telnet"],["6 표현","암호화·압축·코드 변환","데이터","JPEG, MPEG, ASCII"],["5 세션","대화 제어, 동기점","데이터","NetBIOS, RPC"],["4 전송","종단 간 신뢰성, 흐름·오류 제어","세그먼트","TCP, UDP / 게이트웨이"],["3 네트워크","경로 설정(라우팅), 논리 주소","패킷","IP, ICMP, ARP, IGMP / 라우터"],["2 데이터링크","인접 노드 간 전송, 물리 주소, 오류 검출","프레임","HDLC, PPP, Ethernet / 브리지, 스위치"],["1 물리","비트 전송, 전기·기계적 특성","비트","RS-232C / 리피터, 허브"]],"note":"TCP/IP 4계층: 응용(7·6·5) - 전송(4) - 인터넷(3) - 네트워크 액세스(2·1)."},{"title":"주요 프로토콜과 포트","kind":"table","head":["프로토콜","기능 / 포트"],"rows":[["ARP / RARP","IP → MAC 주소 / MAC → IP"],["ICMP","오류 보고·진단 메시지(ping, Echo Request/Reply), IP 에 캡슐화"],["IGMP","멀티캐스트 그룹 관리"],["DHCP","IP 자동 할당 (Discover → Offer → Request → Ack), UDP 67/68"],["DNS","도메인 ↔ IP, 53"],["FTP / SFTP / TFTP","20·21 / 22(SSH) / 69(UDP, 인증 없음)"],["SSH / Telnet","22(암호화) / 23(평문)"],["SMTP / POP3 / IMAP","25 메일 송신 / 110 수신(다운로드 후 삭제) / 143 수신(서버 보관)"],["HTTP / HTTPS","80 / 443(TLS)"],["SNMP","네트워크 장비 관리, 161/162"],["TCP","연결형, 신뢰성, 3-way handshake(SYN → SYN+ACK → ACK), 흐름·혼잡 제어"],["UDP","비연결형, 비신뢰, 헤더 8바이트, 실시간(스트리밍·DNS)"]]},{"title":"라우팅·IP·서브네팅","kind":"list","items":["IGP(AS 내부): RIP(거리 벡터, 벨만-포드, 홉 수 최대 15, 30초 갱신), OSPF(링크 상태, 다익스트라, Area, 대규모), IGRP/EIGRP. EGP(AS 간): BGP(경로 벡터).","IPv4 32비트, 클래스 A(0~127, /8) B(128~191, /16) C(192~223, /24) D(멀티캐스트) E(실험). 사설 IP: 10.x, 172.16~31.x, 192.168.x.","IPv6 128비트, 16진수 8그룹, 헤더 단순화·확장 헤더, 유니캐스트·멀티캐스트·애니캐스트(브로드캐스트 없음), 전환: 듀얼 스택·터널링·주소 변환.","서브네팅: /n 에서 호스트 비트 = 32 − n, 서브넷당 주소 2^(32−n), 할당 가능 호스트 = 2^(32−n) − 2. 빌린 비트 b 개면 서브넷 수 2^b. 블록 크기 = 256 − 마스크 마지막 옥텟.","예: /27 (255.255.255.224) → 블록 32, 서브넷 8개, 호스트 30개. 세 번째 서브넷 .64~.95, 브로드캐스트 .95.","FLSM 은 같은 크기로, VLSM 은 필요한 호스트 수에 맞춰 다른 크기로 분할. CIDR 은 클래스 없이 접두어 길이로 표기.","오류 제어 ARQ: 정지-대기(1개씩), Go-Back-N(오류 이후 전부 재전송), 선택적 재전송(오류 프레임만), 적응적(프레임 길이 동적). 흐름 제어: 정지-대기, 슬라이딩 윈도우.","오류 검출: 패리티(1비트 오류), CRC(다항식, 버스트 오류), 해밍 코드(오류 정정), 체크섬.","교환 방식: 회선 교환(전용 경로, 전화), 패킷 교환 - 데이터그램(독립 경로, 순서 보장 X)·가상 회선(논리 경로 설정, 순서 보장).","전송 방식: 유니캐스트 1:1, 브로드캐스트 1:전체, 멀티캐스트 1:그룹, 애니캐스트 1:가장 가까운 하나(IPv6)."]}]},{"key":"os","area":"운영체제","intro":"스케줄링·페이지 교체·메모리 배치는 계산 문제로, 교착 상태·유닉스 명령어는 용어 문제로 나온다.","cards":[{"title":"프로세스 스케줄링","kind":"table","head":["기법","구분","기준"],"rows":[["FCFS (FIFO)","비선점","도착 순서"],["SJF","비선점","실행 시간 짧은 순, 기아 발생 가능"],["HRN","비선점","우선순위 = (대기 + 서비스) / 서비스, 큰 값 먼저. SJF 기아 보완"],["우선순위","비선점/선점","에이징으로 기아 해결"],["RR (Round Robin)","선점","시간 할당량(time quantum) 순환, 시분할"],["SRT","선점","남은 시간 가장 짧은 것, SJF 의 선점형"],["다단계 큐 / 피드백 큐","선점","큐 여러 개, 피드백 큐는 큐 간 이동 허용"]],"note":"반환(turnaround) 시간 = 종료 − 도착, 대기 시간 = 반환 − 실행. 평균은 프로세스 수로 나눈다."},{"title":"메모리·가상 메모리","kind":"list","items":["배치 전략: 최초 적합 First Fit(처음 맞는 곳), 최적 적합 Best Fit(남는 공간 최소), 최악 적합 Worst Fit(남는 공간 최대). 내부 단편화 = 영역 − 프로그램 크기.","페이지 교체: FIFO(가장 먼저 들어온 것), LRU(가장 오래 사용 안 한 것), LFU(사용 횟수 최소), OPT(앞으로 가장 오래 안 쓸 것, 이론 최적), NUR(참조·변형 비트), SCR(2차 기회).","페이지 부재 횟수는 참조열을 따라 프레임 표를 그려 센다. 적중(hit)이면 LRU 에서는 최근 사용 순서만 갱신.","스래싱: 페이지 부재가 너무 잦아 CPU 이용률이 떨어지는 현상. 워킹 셋(일정 시간 참조 페이지 집합)·PFF(페이지 부재 빈도)로 방지. 지역성(시간·공간)이 근거.","페이징은 고정 크기 → 내부 단편화, 세그먼테이션은 가변 크기 → 외부 단편화.","교착 상태 4조건: 상호 배제, 점유와 대기, 비선점, 환형 대기(순환 대기). 해결: 예방(조건 제거), 회피(은행원 알고리즘), 발견(자원 할당 그래프), 회복(프로세스 종료·자원 선점).","프로세스 상태: 준비 → (디스패치) → 실행 → (타임아웃) → 준비 / 실행 → (대기, 입출력) → 대기 → (웨이크업) → 준비. PCB 가 상태 정보 저장.","디스크 스케줄링: FCFS, SSTF(가장 가까운 트랙), SCAN(한 방향 끝까지 왕복, 엘리베이터), C-SCAN(한 방향만, 끝에서 처음으로), LOOK/C-LOOK(요청 끝까지만)."]},{"title":"유닉스/리눅스","kind":"table","head":["명령","의미"],"rows":[["chmod 숫자/기호","권한 변경. r=4 w=2 x=1, 소유자·그룹·기타 순. rwxr-xr-- = 754"],["chown / chgrp","소유자 / 그룹 변경"],["ls -l / cat / cp / mv / rm / mkdir","목록 상세 / 출력 / 복사 / 이동 / 삭제 / 디렉터리 생성"],["ps / kill / top","프로세스 목록 / 종료(시그널) / 실시간 상태"],["fork / exec / wait / exit","프로세스 생성 / 프로그램 교체 / 자식 대기 / 종료"],["uname -a / who / pwd","시스템 정보 / 접속 사용자 / 현재 경로"],["grep / find / | (파이프)","문자열 검색 / 파일 찾기 / 출력 연결"],["커널 / 쉘","자원 관리 핵심 / 명령 해석기(bash, sh, csh)"]],"note":"i-node 는 파일 소유자·권한·크기·시간·블록 주소를 저장하는 자료구조(파일 이름은 디렉터리에)."}]},{"key":"security","area":"정보 보안","intro":"공격 유형·암호 알고리즘·보안 솔루션의 「설명 → 용어」. 영문 그대로 쓰는 경우가 많으니 철자를 정확히.","cards":[{"title":"DoS / DDoS 유형","kind":"table","head":["공격","단서"],"rows":[["SYN Flooding","3-way handshake 의 SYN 만 보내 백로그 큐 고갈"],["Smurf","출발지를 피해자로 위조한 ICMP Echo 를 브로드캐스트 → 증폭"],["Fraggle","Smurf 의 UDP 버전(echo·chargen)"],["Ping of Death","규정(65,535바이트) 초과 ICMP 패킷 분할 전송"],["Land","출발지 IP = 목적지 IP 로 위조"],["Teardrop","IP 단편화 오프셋을 겹치게 조작"],["UDP / HTTP GET Flooding","대량 UDP / HTTP 요청"],["Slowloris / RUDY","HTTP 헤더·본문을 느리게 보내 연결 점유(Slow HTTP)"],["DRDoS","반사 서버를 이용한 분산 반사 공격, 출발지 위조"],["봇넷 / 좀비 PC","C&C 서버가 감염 PC 를 조종"]]},{"title":"기타 공격 유형","kind":"list","items":["SQL Injection: 입력값에 SQL 삽입 → 인증 우회·데이터 유출. 대응: 바인딩 변수(PreparedStatement), 입력 검증.","XSS(크로스 사이트 스크립팅): 악성 스크립트를 페이지에 삽입해 다른 사용자 브라우저에서 실행. CSRF: 인증된 사용자가 의도치 않은 요청을 보내게 함.","버퍼 오버플로: 입력이 버퍼 크기를 넘어 반환 주소 덮어씀. 대응: 스택 가드, ASLR, 안전 함수(strncpy).","스니핑(도청)·스푸핑(위장: ARP·IP·DNS)·세션 하이재킹(세션 ID 탈취)·중간자 공격(MITM)·리플레이 공격.","피싱(가짜 사이트 유도), 파밍(DNS 변조로 정상 주소에서 가짜 사이트), 스미싱(SMS), 큐싱(QR), 스피어 피싱(특정 대상).","악성코드: 바이러스(숙주 필요, 자기 복제), 웜(독립 전파, 네트워크), 트로이 목마(정상 가장, 자기 복제 X), 랜섬웨어(암호화 후 금전 요구), 스파이웨어, 키로거, 루트킷(은폐), 백도어, 논리 폭탄.","APT(지능형 지속 위협), 제로데이(패치 전 취약점), 레이스 컨디션(실행 순서 틈), 디렉터리 트래버설(../ 경로 조작), 사회 공학, 워터링 홀, 블루스나프/블루재킹(블루투스), 이블 트윈(가짜 AP), 타이포스쿼팅."]},{"title":"암호 알고리즘","kind":"table","head":["구분","알고리즘","특징"],"rows":[["대칭키 (블록)","DES","64비트 블록, 56비트 키, 16라운드 Feistel, 미국 (취약)"],["대칭키 (블록)","3DES","DES 3회, 키 112/168비트"],["대칭키 (블록)","AES","128비트 블록, 키 128/192/256, SPN, Rijndael, 미국 표준"],["대칭키 (블록)","SEED","128비트 블록·키, 16라운드 Feistel, 1999 KISA"],["대칭키 (블록)","ARIA","128비트 블록, 키 128/192/256, ISPN, 2004 국가정보원·산학연(Academy·Research Institute·Agency)"],["대칭키 (블록)","IDEA / LEA","64비트 블록 128비트 키 / 경량 ARX 2013 국산"],["대칭키 (스트림)","RC4, A5","비트 단위 XOR"],["비대칭키","RSA","소인수분해, 전자서명·키 교환"],["비대칭키","ECC","타원 곡선, 짧은 키로 같은 강도"],["비대칭키","ElGamal / DSA / Diffie-Hellman","이산대수 / 전자서명 전용 / 키 교환"],["해시","MD5 / SHA-1 / SHA-2(256·512) / HAS-160","128 / 160 / 256·512 / 160 비트, 일방향"]],"note":"대칭키: 빠름, 키 분배 문제, 키 수 n(n−1)/2. 비대칭키: 느림, 공개키로 암호화·개인키로 복호화, 전자서명은 개인키로 서명·공개키로 검증. 솔트(Salt)는 해시 전 임의 값 추가."},{"title":"접근 통제·인증·보안 솔루션","kind":"list","items":["접근 통제 방식: DAC(소유자 재량, ACL), MAC(보안 등급, 강제), RBAC(역할 기반). 모델: 벨-라파듈라(기밀성, No Read Up·No Write Down), 비바(무결성, No Read Down·No Write Up), 클락-윌슨(상업용 무결성, 직무 분리), 만리장성(이해 충돌 방지).","인증 요소: 지식(비밀번호), 소유(OTP 토큰·카드), 존재(생체), 행위(서명·걸음), 위치. 2개 이상 결합이 다중 인증.","보안 3요소 CIA: 기밀성(인가자만 접근), 무결성(변조 방지), 가용성(필요 시 접근). + 부인 방지(전자서명), 인증.","방화벽(패킷 필터링·상태 검사·프록시), IDS(탐지: 오용 탐지=시그니처, 이상 탐지=통계), IPS(차단), WAF(웹 전용), DMZ(내부·외부 사이 완충 구역), NAC(단말 접근 통제), VPN(터널링 암호화), ESM/SIEM(로그 통합 분석), DLP(정보 유출 방지), DRM(디지털 저작권), SSO(한 번 인증), 허니팟(유인), 샌드박스(격리 실행).","네트워크 보안 프로토콜: IPSec(AH 인증·ESP 암호화, 전송/터널 모드, 3계층), SSL/TLS(4~7계층, HTTPS 443), SSH(22), S/MIME·PGP(메일), Kerberos(티켓 기반 인증), WPA2/WPA3(무선, WEP 는 취약).","시큐어 코딩 7항목: 입력 데이터 검증 및 표현, 보안 기능, 시간 및 상태, 에러 처리, 코드 오류, 캡슐화, API 오용.","취약점 관리: CVE(공개 취약점 식별자), CWE(약점 분류), CVSS(심각도 점수). 로그: utmp(현재 로그인), wtmp(로그인 이력), btmp(실패 이력), lastlog(마지막 로그인)."]}]},{"key":"test","area":"애플리케이션 테스트","intro":"블랙박스·화이트박스 기법 이름, 테스트 단계·종류, 순환 복잡도 계산이 핵심.","cards":[{"title":"테스트 기법","kind":"table","head":["구분","기법","단서"],"rows":[["블랙박스","동등 분할 Equivalence Partitioning","입력을 유효·무효 클래스로 나눠 대표값"],["블랙박스","경계값 분석 Boundary Value","경계와 그 바로 안팎 값(min−1, min, max, max+1)"],["블랙박스","결정 테이블 Decision Table","조건·행동 조합을 표로"],["블랙박스","상태 전이 State Transition","이벤트에 따른 상태 변화"],["블랙박스","원인-효과 그래프 Cause-Effect Graph","입력·출력 논리 관계를 그래프 → 결정 테이블"],["블랙박스","유스케이스 / 페어와이즈 / 분류 트리 / 비교 테스트","시나리오 / 2개 조합 / 트리 분류 / 여러 버전 비교"],["블랙박스","오류 추정 Error Guessing","경험으로 오류 가능 지점 추정"],["화이트박스","구문(문장) 커버리지","모든 문장 1회 이상 실행"],["화이트박스","결정(분기) 커버리지","모든 분기의 참·거짓"],["화이트박스","조건 커버리지","각 개별 조건식의 참·거짓"],["화이트박스","조건/결정 커버리지","조건 + 결정 모두"],["화이트박스","변경 조건/결정 커버리지 MC/DC","각 조건이 독립적으로 결정에 영향"],["화이트박스","다중 조건 커버리지","모든 조건 조합"],["화이트박스","기본 경로(Basis Path) 테스트","순환 복잡도만큼 독립 경로"],["화이트박스","제어 구조 / 루프 / 데이터 흐름 테스트","조건·루프·변수 정의-사용"]],"note":"맥케이브 순환 복잡도 V(G) = E − N + 2 = 결정 노드 수 + 1 = 영역 수. 10 초과면 복잡."},{"title":"테스트 단계·종류·용어","kind":"list","items":["V 모델: 요구 분석 ↔ 인수 테스트, 시스템 설계 ↔ 시스템 테스트, 상세 설계 ↔ 통합 테스트, 구현 ↔ 단위 테스트.","통합 테스트: 하향식(상위부터, 스텁 필요, 깊이·너비 우선), 상향식(하위부터, 드라이버 필요, 클러스터), 빅뱅(한 번에), 샌드위치(혼합). 회귀 테스트는 수정 후 기존 기능 재확인.","인수 테스트: 알파(개발자 환경에서 사용자가), 베타(사용자 환경에서). 테스트 종류: 회복·안전(보안)·강도(스트레스)·성능·구조·회귀·병행.","테스트 오라클: 참(모든 입력 기대 결과), 샘플링(특정 입력만), 휴리스틱(추정), 일관성 검사(변경 전후 동일).","테스트 하네스: 드라이버, 스텁, 슈트, 케이스, 스크립트, 목 오브젝트. 테스트 케이스 = 입력·실행 조건·기대 결과.","테스트 원리 7: 결함 존재 증명(완벽 불가), 완벽한 테스트 불가능, 초기 집중, 결함 집중(파레토 80:20), 살충제 패러독스(같은 케이스 반복은 새 결함 못 찾음), 정황 의존, 오류-부재의 궤변(결함 없어도 요구 불만족이면 실패).","정적 테스트: 실행 없이 코드·문서 검토(워크스루·인스펙션·동료 검토·정적 분석 도구). 동적 테스트: 실행하며 확인(블랙·화이트박스).","성능 지표: 처리량(Throughput), 응답 시간, 경과 시간(Turnaround), 자원 사용률. 결함 심각도(치명·주요·보통·경미) ↔ 우선순위.","클린 코드 원칙: 가독성, 단순성, 의존성 배제, 중복 제거, 추상화. 배드 코드: 스파게티 코드, 외계인 코드."]}]},{"key":"integration","area":"통합 구현·패키징·형상관리","intro":"인터페이스 기술 용어, DRM·릴리스 노트 항목, 형상 관리·빌드 도구가 「빈칸 채우기」로 나온다.","cards":[{"title":"인터페이스·웹 서비스","kind":"list","items":["웹 서비스 3요소: SOAP(XML 기반 메시지 프로토콜), WSDL(서비스 기술 언어), UDDI(서비스 등록·검색 저장소).","데이터 포맷: JSON(키-값, 경량, AJAX 와 함께), XML(태그 기반, 스키마), YAML. REST 는 HTTP 메서드(GET·POST·PUT·DELETE)로 자원 조작.","EAI(기업 내 통합, 허브 중심) vs ESB(버스 기반, 서비스 중심, 느슨한 결합). 미들웨어는 두 시스템 사이에서 연결·변환을 담당.","인터페이스 보안: 네트워크 구간 IPSec·SSL/TLS·S-HTTP, 애플리케이션 구간 시큐어 코딩, DB 구간 암호화. 데이터 무결성 검증 도구: Tripwire, AIDE, Samhain.","인터페이스 검증 도구: xUnit(단위), STAF(분산 환경 데몬), FitNesse(위키 기반 협업), NTAF(STAF+FitNesse, NHN), Selenium(웹 브라우저 자동화), watir(Ruby 웹 테스트)."]},{"title":"패키징·형상 관리","kind":"list","items":["패키징 순서: 기능 식별 → 모듈화 → 빌드 진행 → 사용자 환경 분석 → 패키징 및 적용 시험 → 패키징 변경 개선 → 배포.","릴리스 노트 항목: 헤더(머리말), 개요, 목적, 문제 요약(이슈), 재현 항목, 수정·개선 내용, 사용자 영향도, SW 지원 영향도, 노트, 면책 조항, 연락처.","DRM 구성요소: 콘텐츠 제공자, 콘텐츠 분배자, 패키저(묶고 암호화), 보안 컨테이너(유통 중 보호), DRM 컨트롤러(이용 권한 통제), 클리어링 하우스(라이선스·과금 정산). 기술: 암호화, 키 관리, 식별, 저작권 표현, 정책 관리, 크랙 방지, 인증.","형상 관리 절차: 형상 식별 → (버전 제어) → 형상 통제(변경 통제, CCB 승인) → 형상 감사 → 형상 기록(상태 보고). 베이스라인은 공식 변경 통제 기준점.","버전 관리 도구 방식: 공유 폴더(RCS·SCCS), 클라이언트/서버(CVS·SVN), 분산(Git·Mercurial). 용어: 저장소(Repository), 체크아웃, 체크인/커밋, 업데이트, 브랜치, 머지, 트렁크, 태그, 롤백.","빌드 도구: Ant(XML, 생명주기 없음), Maven(XML pom.xml, 의존성·생명주기), Gradle(Groovy DSL, 증분 빌드, 안드로이드), Jenkins(CI 서버, 빌드 자동 실행).","품질 표준: ISO/IEC 9126 특성 6(기능성·신뢰성·사용성·효율성·유지보수성·이식성), 25010(9126 개정, 8특성), 12207(생명주기 프로세스), 14598(제품 평가), 15504 SPICE(수준 0~5), CMMI(초기·관리·정의·정량적 관리·최적화).","배치 프로그램 필수 요소: 대용량 데이터, 자동화, 견고성, 안정성/신뢰성, 성능. 스케줄러: cron(분 시 일 월 요일), Quartz, Spring Batch."]}]},{"key":"req","area":"요구사항·기타 단골 용어","intro":"요구사항 분석, 품질, 개발 방법론에서 1~2문항씩 용어가 나온다. 자주 나온 것만 모았다.","cards":[{"title":"자주 나온 용어","kind":"table","head":["용어","뜻"],"rows":[["요구사항 개발 프로세스","도출 → 분석 → 명세 → 확인(검증)"],["기능 / 비기능 요구사항","시스템이 하는 일 / 성능·보안·품질 등 제약"],["요구사항 명세 기법","정형(수학적 표기, Z·VDM) / 비정형(자연어·다이어그램)"],["CASE 도구","상위(분석·설계) / 하위(코딩·테스트) / 통합"],["HIPO","가시적 도표(목차), 총체적 도표(입력-처리-출력), 세부적 도표"],["N-S 차트 (Nassi-Shneiderman)","논리 기술 중심 박스 도표, goto 없음, 순차·선택·반복"],["소프트웨어 재공학","분석 → 재구성 → 역공학 → 이식"],["COCOMO","LOC 기반 비용 산정: 조직형(5만 라인 이하)·반분리형·내장형"],["기능 점수 FP","입력·출력·질의·파일·인터페이스 가중치 합"],["Putnam / Rayleigh-Norden","생명주기 노력 분포 곡선 기반 비용 산정"],["델파이 기법","전문가 감정 반복으로 합의"],["CPM / PERT","임계 경로 / 낙관·비관·확률 일정"],["리팩토링","기능 변화 없이 구조 개선"],["모듈화 지표","팬인(자신을 호출하는 상위 모듈 수, 많으면 재사용 좋음), 팬아웃(자신이 호출하는 하위 모듈 수, 적을수록 좋음)"],["객체지향 5개념","객체(속성+메서드), 클래스, 캡슐화, 상속, 다형성(+추상화·정보 은닉)"],["제어의 역전 IoC / DI","프레임워크가 흐름을 제어 / 의존 객체를 외부에서 주입"],["소프트웨어 아키텍처 4+1 뷰","논리·구현(개발)·프로세스·배치 + 유스케이스"],["Secure OS / TCB / 참조 모니터","커널 보안 강화 / 신뢰 컴퓨팅 기반 / 모든 접근을 검사하는 추상 기계"]]}]}];

const POINTS = 5;
const ICON_BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const ICON_CLOSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const PASS = 60;
const TIME_LIMIT_MIN = 150;

// ---------- 유틸 ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normShort = s => String(s ?? '').normalize('NFC').toLowerCase().replace(/[\s ]/g, '').replace(/[.\-_·/()\[\]{}'"‘’“”,:;!?~→⇒>]/g, '');
const normCode = s => String(s ?? '').normalize('NFC').replace(/\r/g, '').split('\n').map(l => l.replace(/[ \t\u00a0]+/g, ' ').trim().replace(/\s*([,\[\](){}:])\s*/g, '$1')).filter(l => l.length).join('\n');
function isMatch(q, part, value) {
  const v = String(value ?? '');
  if (!v.trim()) return false;
  if (q.type === 'code') { const a = normCode(v); return part.answers.some(x => normCode(x) === a); }
  const a = normShort(v); if (!a) return false;
  return part.answers.some(x => normShort(x) === a);
}
const fmtDate = ts => { const d = new Date(ts); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fmtSec = s => { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), h = Math.floor(m / 60); return (h ? h + ':' : '') + String(m % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const setOf = key => SETS.find(s => s.key === key) || SETS[0];
const inlineMd = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

function renderText(text) {
  const lines = String(text ?? '').replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) { const buf = []; i++; while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; } i++;
      out.push('<div class="code-wrap"><pre class="code">' + buf.map(l => '<span class="ln">' + esc(l) + '</span>').join('') + '</pre></div>'); continue; }
    if (/^\s*\|/.test(line)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
      if (body.length) { let html = '<div class="tbl-wrap"><table class="data"><thead><tr>' + cells(body[0]).map(c => '<th>' + inlineMd(c) + '</th>').join('') + '</tr></thead><tbody>';
        for (const r of body.slice(1)) html += '<tr>' + cells(r).map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>';
        out.push(html + '</tbody></table></div>'); } continue; }
    if (/^\s*[-*•]\s+/.test(line)) { const items = []; while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*•]\s+/, '')); i++; }
      out.push('<ul>' + items.map(t => '<li>' + inlineMd(t) + '</li>').join('') + '</ul>'); continue; }
    if (!line.trim()) { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() && !/^\s*(```|\||[-*•]\s)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + buf.map(inlineMd).join('<br>') + '</p>');
  }
  return out.join('');
}
function renderCode(q) {
  if (!q.code) return '';
  return '<div class="code-lang">' + esc(q.language || 'code') + '</div><div class="code-wrap"><pre class="code">' + String(q.code).replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(l => '<span class="ln">' + esc(l) + '</span>').join('') + '</pre></div>';
}
function firstLine(q) { const t = String(q.question).split('\n').find(l => l.trim() && !/^\s*[|`#-]/.test(l)) || ''; return t.length > 80 ? t.slice(0, 80) + '…' : t; }

// ---------- 저장소 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const K = { att: k => 'ipe2.attempt.' + k, hist: 'ipe2.history', ui: 'ipe2.ui' };
let ui = Object.assign({ view: 'home', setKey: SETS[0].key, qi: 0, keySet: SETS[0].key, keyFilter: 'all', notesArea: NOTES[0] ? NOTES[0].key : '' }, store.get(K.ui, {}));
if (!SETS.find(s => s.key === ui.setKey)) ui.setKey = SETS[0].key;
if (!SETS.find(s => s.key === ui.keySet)) ui.keySet = SETS[0].key;
if (!NOTES.find(n => n.key === ui.notesArea)) ui.notesArea = NOTES[0] ? NOTES[0].key : '';
const saveUi = () => store.set(K.ui, ui);

const newAttempt = () => ({ answers: {}, locked: {}, revealed: {}, submitted: false, startedAt: Date.now(), elapsed: 0, result: null });
function getAttempt(setKey) { let a = store.get(K.att(setKey), null); if (!a || typeof a !== 'object') { a = newAttempt(); store.set(K.att(setKey), a); } return a; }
const saveAttempt = (setKey, a) => store.set(K.att(setKey), a);

function gradeQ(q, a, qi) {
  const vals = a.answers[qi] || []; const locked = !!a.locked[qi];
  const parts = q.parts.map((p, pi) => locked && isMatch(q, p, vals[pi]));
  return { answered: locked, correct: locked && parts.every(Boolean), parts };
}
function summarize(set, a) {
  const per = set.questions.map((q, i) => gradeQ(q, a, i));
  const locked = per.filter(r => r.answered).length, correct = per.filter(r => r.correct).length;
  return { per, locked, correct, score: correct * POINTS, total: set.questions.length };
}
function cellState(set, a, i) {
  if (a.submitted) { const g = gradeQ(set.questions[i], a, i); return g.correct ? 'correct' : 'wrong'; }
  if (a.locked[i]) return 'locked';
  if (a.revealed[i]) return 'shown';
  return '';
}

// ---------- 타이머 ----------
let sessionStart = null, tickTimer = null;
function startTimer() { if (sessionStart) return; sessionStart = Date.now(); clearInterval(tickTimer); tickTimer = setInterval(renderTimer, 1000); }
function flushTimer() {
  if (!sessionStart) return;
  const a = getAttempt(ui.setKey);
  if (!a.submitted) { a.elapsed = (a.elapsed || 0) + Math.floor((Date.now() - sessionStart) / 1000); saveAttempt(ui.setKey, a); }
  sessionStart = null; clearInterval(tickTimer); tickTimer = null;
}
function elapsedOf(a) { return (a.elapsed || 0) + (sessionStart && !a.submitted ? Math.floor((Date.now() - sessionStart) / 1000) : 0); }
function renderTimer() { const el = document.getElementById('timer'); if (!el) return; const a = getAttempt(ui.setKey); const s = elapsedOf(a); el.textContent = fmtSec(s); el.style.color = s >= TIME_LIMIT_MIN * 60 ? 'var(--pen)' : ''; }
document.addEventListener('visibilitychange', () => { if (document.hidden) flushTimer(); else if (ui.view === 'exam') startTimer(); });
window.addEventListener('pagehide', flushTimer);

// ---------- 라우팅 ----------
const $ = s => document.querySelector(s);
const viewEl = $('#view'), topEl = $('#top'), tabEl = $('#tabbar'), sheetEl = $('#sheet');
function go(view, patch) {
  if (ui.view === 'exam' && view !== 'exam') flushTimer();
  ui.view = view; Object.assign(ui, patch || {}); saveUi();
  const h = '#' + view; if (location.hash !== h) { try { history.pushState(null, '', h); } catch (e) {} }
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { const v = (location.hash || '#home').slice(1); if (['home', 'exam', 'key', 'notes', 'result'].includes(v) && v !== ui.view) { if (ui.view === 'exam') flushTimer(); ui.view = v; saveUi(); render(); } });

function render() {
  closeSheet();
  const v = ui.view;
  tabEl.hidden = v === 'exam';
  tabEl.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === (v === 'result' || v === 'exam' ? 'home' : v))));
  if (v === 'exam') renderExam(); else if (v === 'result') renderResult(); else if (v === 'key') renderKey(); else if (v === 'notes') renderNotes(); else renderHome();
}

// ---------- 홈 ----------
function renderHome() {
  topEl.innerHTML = '<div class="top-in"><div class="top-title">정보처리기사 실기</div><span class="top-sub">필답형 · 20문항 · 60점 합격</span></div>';
  const hist = store.get(K.hist, []);
  const cards = SETS.map(set => {
    const a = getAttempt(set.key); const s = summarize(set, a);
    const last = hist.find(h => h.set === set.key);
    let status, bar = '';
    if (a.submitted) status = '<span class="pill ' + (s.score >= PASS ? 'pass' : 'fail') + '">' + s.score + '점 · ' + (s.score >= PASS ? '합격' : '불합격') + '</span><span>' + fmtDate(a.submittedAt) + '</span>';
    else if (s.locked || Object.keys(a.revealed).length) { status = '<span class="pill live">진행 중</span><span>답 입력 ' + s.locked + ' / ' + s.total + '</span><span>' + fmtSec(elapsedOf(a)) + ' 경과</span>'; bar = '<div class="progress"><i style="width:' + Math.round(100 * s.locked / s.total) + '%"></i></div>'; }
    else status = '<span class="pill">미응시</span>' + (last ? '<span>최근 ' + last.score + '점 · ' + fmtDate(last.date) + '</span>' : '');
    const btns = a.submitted
      ? '<button class="btn primary" data-act="result" data-set="' + set.key + '">결과 보기</button><button class="btn" data-act="restart" data-set="' + set.key + '">다시 풀기</button>'
      : '<button class="btn primary" data-act="start" data-set="' + set.key + '">' + (s.locked || Object.keys(a.revealed).length ? '이어서 풀기' : '시작') + '</button>' + (s.locked || Object.keys(a.revealed).length ? '<button class="btn" data-act="restart" data-set="' + set.key + '">처음부터</button>' : '');
    return '<article class="set-card"><div class="name">' + esc(set.name) + '</div><div class="stat">' + status + '</div>' + bar + '<div class="btn-row">' + btns + '</div></article>';
  }).join('');
  const histHtml = hist.length
    ? '<div class="hist">' + hist.slice(0, 15).map(h => '<div class="hist-row"><div>' + esc(h.name) + '<div class="d">' + fmtDate(h.date) + (h.elapsed ? ' · ' + fmtSec(h.elapsed) : '') + '</div></div><b>' + h.score + '점</b><span class="pill ' + (h.score >= PASS ? 'pass' : 'fail') + '">' + (h.score >= PASS ? '합격' : '불합격') + '</span></div>').join('') + '</div>'
    : '<div class="empty">제출한 시험이 아직 없습니다</div>';
  viewEl.className = 'view';
  viewEl.innerHTML = '<div class="eyebrow">국가기술자격 실기시험 · 필답형 모의고사</div><h1 class="h-display" style="margin-top:4px">정보처리기사 실기</h1><p class="muted" style="margin:6px 0 0">20문항 × 5점, 100점 만점. 60점 이상 합격. 실제 시험시간은 150분.</p>'
    + '<div class="section" style="margin-top:18px">' + cards + '</div>'
    + '<div class="section"><div class="section-h"><h2>응시 기록</h2>' + (hist.length ? '<button class="link-btn" data-act="clear-hist">기록 지우기</button>' : '') + '</div>' + histHtml + '</div>'
    + '<p class="foot">출제 기준(NCS 기반, 2020년 개정)과 기출 유형을 참고해 새로 작성한 문항입니다. 실제 기출문제를 그대로 옮기지 않았습니다. 답안·점수·기록은 이 기기의 브라우저에만 저장됩니다.</p>';
}

// ---------- 시험 ----------
function renderExam() {
  const set = setOf(ui.setKey), a = getAttempt(ui.setKey);
  if (a.submitted) { ui.view = 'result'; saveUi(); return renderResult(); }
  startTimer();
  const n = set.questions.length; ui.qi = Math.min(Math.max(0, ui.qi | 0), n - 1);
  const qi = ui.qi, q = set.questions[qi];
  const s = summarize(set, a);
  topEl.innerHTML = '<div class="top-in"><button class="icon-btn" data-act="home" aria-label="홈으로">' + ICON_BACK + '</button><div class="top-title">' + esc(set.name) + '</div><span class="top-sub" id="timer">' + fmtSec(elapsedOf(a)) + '</span><button class="icon-btn primary" data-act="submit-ask">제출</button></div>';

  const locked = !!a.locked[qi], revealed = !!a.revealed[qi];
  const g = gradeQ(q, a, qi);
  const vals = a.answers[qi] || [];
  const ro = locked || revealed;
  const parts = q.parts.map((p, pi) => {
    const id = 'q' + qi + 'p' + pi; const val = esc(vals[pi] || '');
    const label = q.parts.length === 1 && p.label === '정답' ? '답' : p.label;
    const field = q.type === 'code'
      ? '<textarea id="' + id + '" data-p="' + pi + '" placeholder="출력 결과를 그대로 입력 (여러 줄이면 줄바꿈)" spellcheck="false" autocomplete="off" autocapitalize="off"' + (ro ? ' readonly' : '') + '>' + val + '</textarea>'
      : '<input id="' + id + '" data-p="' + pi + '" type="text" placeholder="답안 기재" value="' + val + '" autocomplete="off" spellcheck="false" autocapitalize="off" enterkeyhint="done"' + (ro ? ' readonly' : '') + '>';
    return '<div class="part"><label class="part-label" for="' + id + '">' + esc(label) + '</label>' + field + '</div>';
  }).join('');

  let actions, status = '', state = '';
  if (!locked && !revealed) {
    const has = vals.some(v => v && v.trim());
    actions = '<button class="btn primary block" data-act="lock"' + (has ? '' : ' disabled') + '>답 입력</button><div class="row2"><button class="btn" data-act="lock-reveal"' + (has ? '' : ' disabled') + '>답 입력 + 정답보기</button><button class="btn quiet" data-act="reveal">정답보기</button></div>';
  } else if (locked && !revealed) {
    status = '<span class="pill live">답 입력 완료</span>';
    actions = '<div class="row2"><button class="btn" data-act="unlock">답 수정</button><button class="btn" data-act="reveal">정답보기</button></div>';
  } else {
    state = locked ? (g.correct ? 'correct' : 'wrong') : 'shown';
    status = locked
      ? '<span class="mark ' + (g.correct ? 'correct' : 'wrong') + '"><span class="glyph"></span>' + (g.correct ? '정답 · ' + POINTS + '점' : '오답 · 0점') + '</span>'
      : '<span class="mark none">미응답 · 정답 확인</span>';
    actions = '';
  }
  const key = revealed ? keyHtml(q, locked ? g.parts : null) : '';

  viewEl.className = 'view exam';
  viewEl.innerHTML = '<article class="q" data-state="' + state + '"><div class="q-head"><span class="q-num">' + (qi + 1) + '.</span><span class="chip">' + esc(q.bucketLabel) + '</span><span class="q-points">배점 ' + POINTS + '점</span></div>'
    + '<div class="q-text">' + renderText(q.question) + '</div>' + renderCode(q)
    + '<div class="answers">' + parts + '</div>'
    + '<div class="status-line" style="margin-top:12px">' + status + '</div>'
    + (actions ? '<div class="q-actions">' + actions + '</div>' : '') + key + '</article>'
    + '<div class="exam-bar"><div class="exam-bar-in"><button class="btn" data-act="prev"' + (qi === 0 ? ' disabled' : '') + '>‹ 이전</button><button class="btn grid-btn" data-act="grid">' + (qi + 1) + ' / ' + n + ' · 입력 ' + s.locked + '</button><button class="btn" data-act="next"' + (qi === n - 1 ? ' disabled' : '') + '>다음 ›</button></div></div>';
}
function keyHtml(q, verdictByPart, myVals) {
  const rows = q.parts.map((p, pi) => {
    const alts = p.answers.slice(1).filter(x => normShort(x) !== normShort(p.answers[0]));
    const label = q.parts.length === 1 && p.label === '정답' ? '정답' : p.label + ' 정답';
    const v = verdictByPart ? (verdictByPart[pi] ? ' <span class="mark correct" style="font-size:12px"><span class="glyph" style="width:16px;height:16px;border-width:2px"></span></span>' : ' <span class="mark wrong" style="font-size:12px"><span class="glyph" style="width:16px;height:16px"></span></span>') : '';
    const mine = myVals && myVals[pi] && myVals[pi].trim() ? '<div class="key-alt">내 답: <span class="my-answer">' + esc(myVals[pi]) + '</span></div>' : '';
    return '<div class="key-row"><span class="k">' + esc(label) + '</span><span><span class="key-answer">' + esc(p.answers[0]) + '</span>' + v + (alts.length ? '<div class="key-alt">인정 답안: ' + alts.map(esc).join(' · ') + '</div>' : '') + mine + '</span></div>';
  }).join('');
  const point = q.point ? '<div class="key-row"><span class="k">출제 포인트</span><span>' + esc(q.point) + '</span></div>' : '';
  return '<div class="key">' + rows + '<div class="key-row"><span class="k">해설</span><div class="key-exp">' + inlineMd(q.explanation) + '</div></div>' + point + '</div>';
}

// 시트
function openSheet(html) { sheetEl.innerHTML = '<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>'; sheetEl.hidden = false; }
function closeSheet() { sheetEl.hidden = true; sheetEl.innerHTML = ''; }
function openGrid() {
  const set = setOf(ui.setKey), a = getAttempt(ui.setKey);
  const cells = set.questions.map((q, i) => '<button class="cell" type="button" data-act="goto" data-i="' + i + '" data-state="' + cellState(set, a, i) + '"' + (i === ui.qi ? ' aria-current="true"' : '') + '>' + (i + 1) + '</button>').join('');
  openSheet('<div class="sheet-h"><h3>문항 이동</h3><button class="icon-btn" data-act="close-sheet" aria-label="닫기">' + ICON_CLOSE + '</button></div><div class="cells">' + cells + '</div><div class="legend"><span><i class="l-locked"></i>답 입력</span><span><i class="l-shown"></i>정답 확인(미응답)</span><span><i></i>미입력</span></div>');
}
function openSubmitAsk() {
  const set = setOf(ui.setKey), a = getAttempt(ui.setKey), s = summarize(set, a);
  const missing = s.total - s.locked;
  openSheet('<div class="sheet-h"><h3>제출할까요?</h3><button class="icon-btn" data-act="close-sheet" aria-label="닫기">' + ICON_CLOSE + '</button></div><p class="muted" style="margin:0">답 입력 ' + s.locked + '문항' + (missing ? ' · 미입력 ' + missing + '문항은 0점 처리' : '') + '. 제출 후에는 답을 바꿀 수 없습니다.</p><div class="btn-row"><button class="btn quiet" data-act="close-sheet">계속 풀기</button><button class="btn primary" data-act="submit">제출</button></div>');
}
function submit() {
  flushTimer();
  const set = setOf(ui.setKey), a = getAttempt(ui.setKey);
  const s = summarize(set, a);
  a.submitted = true; a.submittedAt = Date.now(); a.result = { correct: s.correct, score: s.score, total: s.total };
  saveAttempt(ui.setKey, a);
  const hist = store.get(K.hist, []);
  hist.unshift({ set: set.key, name: set.name, date: a.submittedAt, score: s.score, correct: s.correct, total: s.total, elapsed: a.elapsed || 0 });
  store.set(K.hist, hist.slice(0, 50));
  go('result');
}

// ---------- 결과 ----------
function renderResult() {
  const set = setOf(ui.setKey), a = getAttempt(ui.setKey);
  if (!a.submitted) { ui.view = 'exam'; saveUi(); return renderExam(); }
  const s = summarize(set, a); const pass = s.score >= PASS;
  topEl.innerHTML = '<div class="top-in"><button class="icon-btn" data-act="home" aria-label="홈으로">' + ICON_BACK + '</button><div class="top-title">' + esc(set.name) + ' 결과</div></div>';
  const byTopic = {};
  set.questions.forEach((q, i) => { const k = q.bucketLabel; byTopic[k] = byTopic[k] || { n: 0, c: 0 }; byTopic[k].n++; if (s.per[i].correct) byTopic[k].c++; });
  const cells = set.questions.map((q, i) => '<button class="cell" type="button" data-act="key-goto" data-i="' + i + '" data-state="' + (s.per[i].correct ? 'correct' : 'wrong') + '" aria-label="' + (i + 1) + '번 해설">' + (i + 1) + '</button>').join('');
  viewEl.className = 'view';
  viewEl.innerHTML = '<div class="result-card"><div><div class="score">' + s.score + '<small>/ 100점</small></div><div style="margin-top:8px"><span class="verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '합격' : '불합격') + '</span></div></div>'
    + '<div class="muted">' + s.total + '문항 중 ' + s.correct + '문항 정답 · 미응답 ' + (s.total - s.locked) + '문항 · 소요 ' + fmtSec(a.elapsed || 0) + ' · ' + fmtDate(a.submittedAt) + '</div>'
    + '<div class="by-topic">' + Object.entries(byTopic).map(([k, v]) => '<div><span>' + esc(k) + '</span><b>' + v.c + ' / ' + v.n + '</b></div>').join('') + '</div></div>'
    + '<div class="section"><div class="section-h"><h2>문항별 결과</h2><span class="muted" style="font-size:12.5px">번호를 누르면 해설</span></div><div class="result-cells">' + cells + '</div></div>'
    + '<div class="section"><div class="btn-row"><button class="btn primary" data-act="key-wrong">오답 해설 보기</button><button class="btn" data-act="restart" data-set="' + set.key + '">다시 풀기</button></div></div>';
}

// ---------- 해설집 ----------
function renderKey() {
  const set = setOf(ui.keySet), a = getAttempt(set.key); const s = summarize(set, a);
  topEl.innerHTML = '<div class="top-in"><div class="top-title">해설집</div><span class="top-sub">' + set.questions.length + '문항</span></div>';
  const seg = '<div class="seg">' + SETS.map(x => '<button data-act="key-set" data-set="' + x.key + '" aria-selected="' + (x.key === set.key) + '">' + esc(x.name.replace(' 모의고사', '')) + '</button>').join('') + '</div>';
  const hasResult = a.submitted;
  const filter = '<div class="seg" style="margin-top:8px"><button data-act="key-filter" data-f="all" aria-selected="' + (ui.keyFilter === 'all') + '">전체</button><button data-act="key-filter" data-f="wrong" aria-selected="' + (ui.keyFilter === 'wrong') + '"' + (hasResult ? '' : ' disabled') + '>오답·미응답' + (hasResult ? ' ' + (s.total - s.correct) : '') + '</button></div>';
  const items = set.questions.map((q, i) => ({ q, i })).filter(({ i }) => ui.keyFilter !== 'wrong' || !hasResult || !s.per[i].correct);
  const list = items.length ? items.map(({ q, i }) => {
    const g = hasResult ? s.per[i] : null;
    const badge = g ? (g.correct ? '<span class="mark correct" style="font-size:12px"><span class="glyph" style="width:18px;height:18px;border-width:2px"></span></span>' : g.answered ? '<span class="mark wrong" style="font-size:12px"><span class="glyph" style="width:18px;height:18px"></span></span>' : '<span class="pill">미응답</span>') : '';
    return '<details class="key-item" id="k' + i + '"' + (ui.keyOpen === i ? ' open' : '') + '><summary><span class="n">' + (i + 1) + '</span><span class="t"><small>' + esc(q.bucketLabel) + (q.point ? ' · ' + esc(q.point) : '') + '</small>' + esc(firstLine(q)) + '</span>' + badge + '</summary>'
      + '<div class="body"><div class="q-text">' + renderText(q.question) + '</div>' + renderCode(q) + keyHtml(q, g && g.answered ? g.parts : null, hasResult ? (a.answers[i] || []) : null) + '</div></details>';
  }).join('') : '<div class="empty">표시할 문항이 없습니다</div>';
  viewEl.className = 'view';
  viewEl.innerHTML = seg + filter + (hasResult ? '' : '<p class="muted" style="margin:10px 0 0;font-size:13px">제출한 시험이 있으면 오답만 모아 볼 수 있습니다.</p>') + '<div class="section" style="margin-top:14px">' + list + '</div>';
  if (ui.keyOpen != null) { const el = document.getElementById('k' + ui.keyOpen); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 0); ui.keyOpen = null; saveUi(); }
}

// ---------- 개념정리 ----------
function renderNotes() {
  const area = NOTES.find(n => n.key === ui.notesArea) || NOTES[0];
  topEl.innerHTML = '<div class="top-in"><div class="top-title">개념정리</div><span class="top-sub">' + NOTES.length + '개 영역</span></div>';
  const chips = '<div class="chips">' + NOTES.map(n => '<button data-act="notes-area" data-k="' + n.key + '" aria-selected="' + (n.key === area.key) + '">' + esc(n.area) + '</button>').join('') + '</div>';
  const cards = area.cards.map((c, ci) => {
    let body = '';
    if (c.kind === 'table') body = '<div class="tbl-wrap"><table class="data"><thead><tr>' + c.head.map(h => '<th>' + inlineMd(h) + '</th>').join('') + '</tr></thead><tbody>' + c.rows.map(r => '<tr>' + r.map(x => '<td>' + inlineMd(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    else if (c.kind === 'list') body = '<ul>' + c.items.map(x => '<li>' + inlineMd(x) + '</li>').join('') + '</ul>';
    else body = '<p>' + inlineMd(c.text || '') + '</p>';
    if (c.note) body += '<div class="note">' + inlineMd(c.note) + '</div>';
    return '<details class="note-card" open><summary>' + esc(c.title) + '</summary><div class="body">' + body + '</div></details>';
  }).join('');
  viewEl.className = 'view';
  viewEl.innerHTML = chips + '<h2 class="h-display" style="font-size:22px;margin-top:14px">' + esc(area.area) + '</h2>' + (area.intro ? '<p class="intro" style="margin:8px 0 0">' + inlineMd(area.intro) + '</p>' : '') + '<div class="section">' + cards + '</div>';
}

// ---------- 이벤트 ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-tab]'); if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  const act = t.dataset.act;
  const set = setOf(ui.setKey); let a = getAttempt(ui.setKey);
  switch (act) {
    case 'home': go('home'); break;
    case 'start': { const key = t.dataset.set; const att = getAttempt(key); let qi = 0; for (let i = 0; i < setOf(key).questions.length; i++) { if (!att.locked[i] && !att.revealed[i]) { qi = i; break; } } go('exam', { setKey: key, qi }); break; }
    case 'restart': { const key = t.dataset.set; const nm = setOf(key).name; openSheet('<div class="sheet-h"><h3>' + esc(nm) + ' 다시 풀기</h3><button class="icon-btn" data-act="close-sheet" aria-label="닫기">' + ICON_CLOSE + '</button></div><p class="muted" style="margin:0">지금까지의 답안은 지워집니다. 제출한 점수는 응시 기록에 남습니다.</p><div class="btn-row"><button class="btn quiet" data-act="close-sheet">취소</button><button class="btn primary" data-act="restart-confirm" data-set="' + key + '">새로 시작</button></div>'); break; }
    case 'restart-confirm': { const key = t.dataset.set; flushTimer(); saveAttempt(key, newAttempt()); go('exam', { setKey: key, qi: 0 }); break; }
    case 'result': go('result', { setKey: t.dataset.set }); break;
    case 'clear-hist': openSheet('<div class="sheet-h"><h3>응시 기록 지우기</h3><button class="icon-btn" data-act="close-sheet" aria-label="닫기">' + ICON_CLOSE + '</button></div><p class="muted" style="margin:0">제출한 점수 기록을 모두 지웁니다. 진행 중인 답안은 그대로 둡니다.</p><div class="btn-row"><button class="btn quiet" data-act="close-sheet">취소</button><button class="btn danger" data-act="clear-hist-confirm">지우기</button></div>'); break;
    case 'clear-hist-confirm': store.del(K.hist); render(); break;
    case 'prev': flushTimer(); ui.qi = Math.max(0, ui.qi - 1); saveUi(); renderExam(); window.scrollTo(0, 0); break;
    case 'next': flushTimer(); ui.qi = Math.min(set.questions.length - 1, ui.qi + 1); saveUi(); renderExam(); window.scrollTo(0, 0); break;
    case 'grid': openGrid(); break;
    case 'goto': flushTimer(); ui.qi = +t.dataset.i; saveUi(); renderExam(); window.scrollTo(0, 0); break;
    case 'close-sheet': if (e.target === t || t.classList.contains('icon-btn') || t.classList.contains('btn')) closeSheet(); break;
    case 'lock': a.locked[ui.qi] = true; saveAttempt(ui.setKey, a); renderExam(); break;
    case 'lock-reveal': a.locked[ui.qi] = true; a.revealed[ui.qi] = true; saveAttempt(ui.setKey, a); renderExam(); break;
    case 'reveal': a.revealed[ui.qi] = true; saveAttempt(ui.setKey, a); renderExam(); break;
    case 'unlock': delete a.locked[ui.qi]; saveAttempt(ui.setKey, a); renderExam(); { const f = viewEl.querySelector('input, textarea'); if (f) f.focus(); } break;
    case 'submit-ask': openSubmitAsk(); break;
    case 'submit': submit(); break;
    case 'key-goto': go('key', { keySet: ui.setKey, keyFilter: 'all', keyOpen: +t.dataset.i }); break;
    case 'key-wrong': go('key', { keySet: ui.setKey, keyFilter: 'wrong' }); break;
    case 'key-set': ui.keySet = t.dataset.set; saveUi(); renderKey(); break;
    case 'key-filter': ui.keyFilter = t.dataset.f; saveUi(); renderKey(); break;
    case 'notes-area': ui.notesArea = t.dataset.k; saveUi(); renderNotes(); window.scrollTo(0, 0); break;
  }
});
viewEl.addEventListener('input', e => {
  const el = e.target; if (!el.matches('input, textarea') || ui.view !== 'exam') return;
  const a = getAttempt(ui.setKey); const p = +el.dataset.p;
  a.answers[ui.qi] = a.answers[ui.qi] || []; a.answers[ui.qi][p] = el.value; saveAttempt(ui.setKey, a);
  const has = (a.answers[ui.qi] || []).some(v => v && v.trim());
  viewEl.querySelectorAll('[data-act="lock"], [data-act="lock-reveal"]').forEach(b => { b.disabled = !has; });
});
viewEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input') && ui.view === 'exam') { e.preventDefault(); const fs = [...viewEl.querySelectorAll('.answers input, .answers textarea')]; const nx = fs[fs.indexOf(e.target) + 1]; if (nx) nx.focus(); else e.target.blur(); }
});

document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input, textarea')) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => document.body.classList.remove('typing'));

// 시작
(function boot() {
  const h = (location.hash || '').slice(1);
  if (['home', 'exam', 'key', 'notes', 'result'].includes(h)) ui.view = h;
  if (ui.view === 'exam' || ui.view === 'result') { const a = getAttempt(ui.setKey); ui.view = a.submitted ? 'result' : 'exam'; }
  saveUi(); render();
  try { if (PWA && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
})();
</script>
</body>
</html>
