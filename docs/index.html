lthrough 흐름"},{"id":"sql-n1","bucketLabel":"SQL","type":"short","language":"SQL","question":"다음은 〈사원〉 테이블과 〈참여〉 테이블이다. 아래 SQL 문 ①, ②, ③을 각각 실행했을 때 출력되는 결과를 쓰시오.\n\n〈사원〉\n\n| 사번 | 이름 | 부서코드 |\n|---|---|---|\n| E01 | 김민 | D1 |\n| E02 | 이수 | D2 |\n| E03 | 박준 | D1 |\n| E04 | 최아 | D3 |\n| E05 | 정현 | D2 |\n| E06 | 한빛 | D3 |\n\n〈참여〉\n\n| 사번 | 프로젝트코드 |\n|---|---|\n| E01 | P1 |\n| E01 | P2 |\n| E03 | P1 |\n| E05 | P2 |\n| E05 | P3 |\n| E06 | P1 |\n\n```sql\n-- ①\nSELECT COUNT(*) FROM 사원\n WHERE 사번 NOT IN (SELECT 사번 FROM 참여);\n\n-- ②\nSELECT 이름 FROM 사원 S\n WHERE EXISTS (SELECT * FROM 참여 P\n                WHERE P.사번 = S.사번 AND P.프로젝트코드 = 'P3');\n\n-- ③\nSELECT COUNT(*) FROM 사원 S\n WHERE NOT EXISTS (SELECT * FROM 참여 P\n                    WHERE P.사번 = S.사번 AND P.프로젝트코드 = 'P1');\n```","code":"","parts":[{"label":"①","answers":["2","2명","2행","2개"]},{"label":"②","answers":["정현"]},{"label":"③","answers":["3","3명","3행","3개"]}],"explanation":"①의 서브쿼리 (SELECT 사번 FROM 참여)는 E01, E03, E05, E06 을 반환하므로 여기에 포함되지 않는 사원은 E02(이수), E04(최아) 2명이다. ②는 외부 질의의 사원마다 그 사번으로 프로젝트 P3 에 참여한 행이 존재하는지 검사하는 상관 서브쿼리로, P3 참여 행은 E05 하나뿐이므로 결과는 정현이다. ③은 NOT EXISTS 로 P1 참여 행이 하나도 없는 사원을 고른다. P1 참여자는 E01, E03, E06 이므로 나머지 E02, E04, E05 의 3명이 결과가 된다. NOT IN 은 서브쿼리가 돌려준 값 집합과 열 값을 비교하고, EXISTS/NOT EXISTS 는 상관 조건을 만족하는 행의 존재 여부만 판단한다는 차이를 구분한다.","difficulty":"중","point":"서브쿼리(NOT IN / EXISTS / NOT EXISTS) 실행 결과"},{"id":"test-1","bucketLabel":"테스트","type":"short","language":"","question":"다음 설명에 해당하는 블랙박스 테스트 기법을 쓰시오.\n\n입력 조건과 그에 따른 출력 사이의 논리적 관계를 AND, OR, NOT 등의 기호를 사용한 그래프로 표현한 뒤, 이 그래프를 결정 테이블로 변환하여 효용성이 높은 테스트 케이스를 선정하는 기법이다. 입력 조건들 사이의 제약(배타, 포함, 요구 등)을 함께 분석할 수 있다는 점에서 단순 분할 기법과 구별된다.","code":"","parts":[{"label":"정답","answers":["원인-효과 그래프","원인 효과 그래프","원인-효과 그래프 검사","원인-결과 그래프","Cause-Effect Graph","Cause Effect Graphing","Cause-Effect Graphing","원인-효과 그래프 기법","원인 효과 그래프 기법","원인 효과 그래프 검사","원인-결과 그래프 검사","원인-결과 그래프 기법","Cause Effect Graph","원인-효과 그래프 테스트","원인 결과 그래프","원인 효과 그래프 테스트","Cause-Effect Graph Testing","Cause Effect Graph Testing","Cause-Effect Graphing Technique"]}],"explanation":"원인-효과 그래프(Cause-Effect Graph) 기법은 입력 데이터 간의 관계와 출력에 영향을 미치는 상황을 논리 그래프(AND·OR·NOT)로 표현한 뒤 결정 테이블로 변환하여 테스트 케이스를 도출하는 블랙박스 기법이다. 지문의 「논리 그래프 → 결정 테이블 변환」이 이 기법만의 핵심 단서다. 결정 테이블 테스트는 조건·행동 조합을 표로 직접 나열하는 것이지 그래프를 먼저 그리지 않으며, 동등 분할은 입력을 유효·무효 클래스로 나누어 대표값만 고르는 기법이고, 상태 전이 테스트는 이벤트에 따른 상태 변화를 그래프로 그리지만 입력 조건의 논리 관계가 아니라 상태 변화를 다룬다는 점에서 구별된다.","difficulty":"중","point":"블랙박스 테스트 기법"},{"id":"java-n2","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"public class Main {\n    public static void main(String[] args) {\n        int[][] a = { {1, 2, 3}, {4, 5, 6} };\n        int[][] t = new int[a[0].length][a.length];\n        for (int i = 0; i < a.length; i++)\n            for (int j = 0; j < a[i].length; j++)\n                t[j][i] = a[i][j] * (i + j);\n        int diag = 0, rowMax = 0;\n        String sep = \"\";\n        for (int[] row : t) {\n            int s = 0;\n            for (int v : row) s += v;\n            if (s > rowMax) rowMax = s;\n            System.out.print(sep + s);\n            sep = \" \";\n        }\n        System.out.println();\n        for (int i = 0; i < t.length && i < t[i].length; i++)\n            diag += t[i][i];\n        System.out.println(rowMax + \" \" + diag + \" \" + t.length + \"x\" + t[0].length);\n    }\n}","parts":[{"label":"출력 결과","answers":["4 12 24\n24 10 3x2"]}],"explanation":"a 는 2행 3열, t 는 a[0].length x a.length 즉 3행 2열로 생성되고 t[j][i] = a[i][j] * (i + j) 로 전치하면서 가중치를 곱한다. i=0: t[0][0]=1*0=0, t[1][0]=2*1=2, t[2][0]=3*2=6. i=1: t[0][1]=4*1=4, t[1][1]=5*2=10, t[2][1]=6*3=18. 따라서 t = {{0,4},{2,10},{6,18}} 이고 향상된 for 문으로 구한 각 행의 합은 4, 12, 24 이며 sep 변수 덕분에 끝 공백 없이 \"4 12 24\" 로 출력된다. rowMax 는 24 이다. 대각선 합 반복문은 i < t.length && i < t[i].length 조건이므로 i=0,1 만 수행되어(i=2 에서 t[2].length=2 이므로 종료) diag = t[0][0] + t[1][1] = 0 + 10 = 10 이다. 마지막 줄은 rowMax, diag, 그리고 \"3x2\" 를 출력한다.","difficulty":"중","point":"2차원 배열 전치와 향상된 for 문"},{"id":"misc-n2","bucketLabel":"운영체제","type":"short","language":"","question":"다음 표는 비선점(Non-preemptive) SJF(Shortest Job First) 스케줄링 기법으로 처리할 4개 프로세스의 도착 시간과 실행 시간(단위: ms)이다. 이 기법으로 스케줄링했을 때 ① 평균 대기 시간과 ② 평균 반환 시간을 구하시오. (문맥 교환 시간은 무시한다.)\n\n| 프로세스 | 도착 시간 | 실행 시간 |\n|---|---|---|\n| P1 | 0 | 8 |\n| P2 | 1 | 4 |\n| P3 | 2 | 10 |\n| P4 | 3 | 6 |","code":"","parts":[{"label":"① 평균 대기 시간","answers":["8","8ms","8 ms","8밀리초","8(ms)"]},{"label":"② 평균 반환 시간","answers":["15","15ms","15 ms","15밀리초","15(ms)"]}],"explanation":"비선점 SJF는 실행 중인 프로세스를 중단하지 않고, CPU가 비는 시점에 준비 큐에 도착해 있는 프로세스 중 실행 시간이 가장 짧은 것을 선택한다. t=0에는 P1만 도착해 있으므로 P1이 0~8 실행된다. t=8에는 P2(4), P3(10), P4(6)가 모두 도착해 있으므로 가장 짧은 P2가 8~12, 이어서 P4가 12~18, 마지막으로 P3가 18~28 실행된다. 대기 시간 = 실행 시작 시각 - 도착 시간이므로 P1=0, P2=7, P3=16, P4=9, 합계 32 → 평균 32/4 = 8ms이다. 반환 시간 = 종료 시각 - 도착 시간이므로 P1=8, P2=11, P3=26, P4=15, 합계 60 → 평균 60/4 = 15ms이다. 도착 시간을 무시하고 실행 시간 순(P2→P4→P1→P3)으로 계산하거나 선점형(SRTF)으로 풀면 다른 값이 나오므로 주의한다.","difficulty":"중","point":"프로세스 스케줄링 계산"},{"id":"design-n3","bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 모듈의 응집도(Cohesion) 종류를 순서 없이 나열한 것이다. 응집도가 가장 강한(높은) 것부터 가장 약한(낮은) 것 순서로 기호를 나열하시오.\n\nㄱ. 시간적 응집도\nㄴ. 기능적 응집도\nㄷ. 논리적 응집도\nㄹ. 순차적 응집도\nㅁ. 교환적(통신적) 응집도\nㅂ. 우연적 응집도\nㅅ. 절차적 응집도","code":"","parts":[{"label":"정답","answers":["ㄴ → ㄹ → ㅁ → ㅅ → ㄱ → ㄷ → ㅂ","ㄴ, ㄹ, ㅁ, ㅅ, ㄱ, ㄷ, ㅂ","ㄴㄹㅁㅅㄱㄷㅂ","ㄴ > ㄹ > ㅁ > ㅅ > ㄱ > ㄷ > ㅂ","ㄴ ⇒ ㄹ ⇒ ㅁ ⇒ ㅅ ⇒ ㄱ ⇒ ㄷ ⇒ ㅂ","ㄴ / ㄹ / ㅁ / ㅅ / ㄱ / ㄷ / ㅂ","ㄴ · ㄹ · ㅁ · ㅅ · ㄱ · ㄷ · ㅂ","ㄴ ＞ ㄹ ＞ ㅁ ＞ ㅅ ＞ ㄱ ＞ ㄷ ＞ ㅂ"]}],"explanation":"응집도는 모듈 내부 구성 요소들이 서로 얼마나 밀접하게 관련되어 있는가를 나타내며, 강할수록 좋은 설계이다(결합도는 약할수록 좋음). 강한 것부터 순서는 기능적 → 순차적 → 교환적(통신적) → 절차적 → 시간적 → 논리적 → 우연적이다. 기능적 응집도는 모듈의 모든 요소가 단일 기능 수행에 기여하는 경우, 순차적은 한 활동의 출력이 다음 활동의 입력으로 쓰이는 경우, 교환적(통신적)은 동일한 입력·출력 데이터를 사용하는 요소들이 모인 경우, 절차적은 여러 활동을 정해진 순서대로 수행하되 데이터는 공유하지 않는 경우이다. 시간적은 특정 시점에 함께 실행되는 활동(초기화 모듈 등), 논리적은 유사한 성격의 처리를 하나로 묶어 분기로 선택하는 경우, 우연적은 요소 간 아무 관련이 없는 경우이다. 절차적과 시간적의 순서(절차적이 더 강함), 순차적과 교환적의 순서(순차적이 더 강함)를 혼동하지 않도록 주의한다.","difficulty":"중","point":"응집도 7종 강약 순서"},{"id":"c-n4","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nint add(int a, int b) { return a + b; }\nint mul(int a, int b) { return a * b; }\nint sub(int a, int b) { return a - b; }\n\nint apply(int (*f)(int, int), int x, int y) {\n    return f(x, y);\n}\n\nint main() {\n    int (*ops[3])(int, int) = { add, mul, sub };\n    int data[6] = { 2, 5, 1, 4, 3, 7 };\n    int cnt[3] = { 0, 0, 0 };\n    int r = 1, i;\n    for (i = 0; i < 6; i++) {\n        int k = data[i] % 3;\n        r = apply(ops[k], r, data[i]);\n        cnt[k]++;\n    }\n    printf(\"%d\\n\", r);\n    printf(\"%d %d %d\\n\", cnt[0], cnt[1], cnt[2]);\n    return 0;\n}\n","parts":[{"label":"출력 결과","answers":["-147\n1 3 2"]}],"explanation":"int (*ops[3])(int, int) 는 int 두 개를 받아 int 를 반환하는 함수 포인터 3개짜리 배열이며, ops[k] 를 apply 에 넘기면 f(x, y) 로 해당 함수가 호출된다. 선택 기준은 data[i] % 3 으로 0이면 add, 1이면 mul, 2이면 sub 이다. r 은 1 에서 시작하여 sub(1,2)=-1, sub(-1,5)=-6, mul(-6,1)=-6, mul(-6,4)=-24, add(-24,3)=-21, mul(-21,7)=-147 로 변한다. 사용된 k 는 2,2,1,1,0,1 이므로 cnt 는 1 3 2 이다. 배열 초기화 순서가 add, mul, sub 이지 add, sub, mul 이 아니라는 점에 주의해야 한다.","difficulty":"중","point":"함수 포인터 배열로 연산 선택 호출"},{"id":"network-n2","bucketLabel":"네트워크","type":"short","language":"","question":"다음은 IPv4 네트워크에서 IPv6 네트워크로 전환(이행)하는 과도기에 두 프로토콜을 공존시키기 위해 사용하는 세 가지 기술에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 용어를 쓰시오.\n\n- ( ① ): 하나의 호스트나 라우터가 IPv4와 IPv6 두 프로토콜을 모두 구현하여 함께 운용하며, 통신 상대가 사용하는 프로토콜에 맞추어 둘 중 하나를 선택해 통신하는 방식이다.\n- ( ② ): IPv6 패킷을 IPv4 패킷 안에 캡슐화하여 IPv4 네트워크 구간을 통과시킨 뒤 반대편 끝에서 다시 꺼내는 방식으로, 6to4, ISATAP, Teredo 등이 대표적이다.\n- ( ③ ): IPv4 전용 호스트와 IPv6 전용 호스트가 직접 통신할 수 있도록 중간에 놓인 게이트웨이가 두 프로토콜의 패킷 헤더를 서로 바꾸어 주는 방식으로, NAT-PT가 대표적이다.","code":"","parts":[{"label":"①","answers":["듀얼 스택","Dual Stack","이중 스택","듀얼 스택(Dual Stack)","듀얼 스택 기법","이중 스택(Dual Stack)","듀얼 스택 방식","Dual Stack 기법"]},{"label":"②","answers":["터널링","Tunneling","터널링(Tunneling)","터널링 기법","터널링 방식","터널링 기술","Tunneling 기법"]},{"label":"③","answers":["주소 변환","Address Translation","헤더 변환","Header Translation","주소 변환(Address Translation)","헤더 변환(Header Translation)","프로토콜 변환","변환 기법","변환","Translation","변환(Translation)","주소 변환 기법","헤더 변환 기법","프로토콜 변환 기법","주소/헤더 변환","IP 헤더 변환","변환 방식","주소 변환 방식","헤더 변환 방식","프로토콜 변환(Protocol Translation)","Protocol Translation"]}],"explanation":"IPv4에서 IPv6로 한꺼번에 바꿀 수 없으므로 과도기에 두 프로토콜을 공존시키는 세 가지 전환 기술이 사용된다. 듀얼 스택은 장비가 두 프로토콜을 모두 구현해 상대에 따라 골라 쓰는 가장 단순한 방식이지만 모든 장비가 두 종류의 주소를 가져야 한다. 터널링은 IPv6 패킷을 IPv4 헤더로 감싸 IPv4 망을 터널처럼 통과시키는 방식으로 6to4·ISATAP·Teredo가 대표적이며, 양 끝 호스트는 모두 IPv6를 사용한다. 주소 변환(헤더 변환)은 IPv4 전용 호스트와 IPv6 전용 호스트 사이에서 NAT-PT 같은 게이트웨이가 헤더를 상호 변환해 직접 통신하게 하는 방식으로, 한쪽만 IPv6여도 된다는 점에서 터널링과 구분된다.","difficulty":"중","point":"IPv6 전환(공존) 기술 3종 빈칸"},{"id":"python-n3","bucketLabel":"Python","type":"code","language":"Python","question":"다음 Python 코드의 출력 결과를 쓰시오.","code":"count = 0\ntotal = 10\n\ndef step(n):\n    global count\n    count += 1\n    total = n * 2\n    return total + count\n\ndef search(limit):\n    i = 1\n    while i <= limit:\n        if step(i) % 7 == 0:\n            break\n        i += 1\n    else:\n        return -1\n    return i\n\nr1 = search(3)\nr2 = search(10)\nq, m = divmod(2 ** count + total, 7)\nprint(r1, r2)\nprint(count, total)\nprint(q, m)","parts":[{"label":"출력 결과","answers":["-1 6\n9 10\n74 4"]}],"explanation":"step 안의 count는 global 선언 덕분에 전역 변수를 직접 증가시키지만, total은 global 선언이 없으므로 함수 안에서만 쓰이는 지역 변수가 되어 전역 total = 10은 끝까지 바뀌지 않는다. search(3)은 step(1), step(2), step(3)이 각각 3, 6, 9를 반환하여 7의 배수가 없고, break 없이 while 조건이 거짓이 되어 끝났으므로 else 절이 실행되어 -1을 반환한다. search(10)은 count가 3부터 이어지며 step(1)~step(6)이 6, 9, 12, 15, 18, 21을 반환하고, 21이 7의 배수이므로 i = 6에서 break되어 else 절을 건너뛰고 6을 반환한다. step은 총 9번 호출되어 count = 9, total = 10이며, 2 ** 9 + 10 = 522를 7로 나눈 divmod는 몫 74, 나머지 4이다. while의 else는 반복이 break 없이 정상 종료될 때만 실행된다는 점이 핵심이다.","difficulty":"중","point":"global 키워드와 함수 안 지역변수 섀도잉, while-else 와 break, divmod 와 거듭제곱"},{"id":"misc-n0","bucketLabel":"통합·패키징","type":"short","language":"","question":"다음은 웹 서비스(Web Service)의 구성 요소에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 용어를 쓰시오.\n\n- ( ① ): HTTP, HTTPS, SMTP 등의 프로토콜을 이용하여 XML 기반의 메시지를 네트워크 상에서 교환하기 위한 통신 규약으로, 메시지는 봉투(Envelope)·헤더(Header)·본문(Body) 구조로 이루어진다.\n- ( ② ): 웹 서비스명, 제공 위치, 메시지 포맷, 사용 프로토콜 등 웹 서비스에 대한 상세 정보를 XML 형식으로 기술한 서비스 명세 언어이다.\n- ( ③ ): ( ② )로 기술된 웹 서비스 정보를 등록·저장·검색할 수 있도록 하는 웹 서비스 레지스트리(저장소)로, 서비스 제공자가 서비스를 공개하고 서비스 요청자가 이를 찾을 수 있게 한다.","code":"","parts":[{"label":"①","answers":["SOAP","Simple Object Access Protocol","소프","SOAP(Simple Object Access Protocol)","단순 객체 접근 프로토콜"]},{"label":"②","answers":["WSDL","Web Services Description Language","Web Service Description Language","웹 서비스 기술 언어","WSDL(Web Services Description Language)","WSDL(Web Service Description Language)","웹 서비스 기술 언어(WSDL)"]},{"label":"③","answers":["UDDI","Universal Description, Discovery and Integration","Universal Description Discovery and Integration","UDDI(Universal Description, Discovery and Integration)","UDDI(Universal Description Discovery and Integration)","Universal Description, Discovery, and Integration"]}],"explanation":"웹 서비스는 네트워크에 분산된 애플리케이션을 표준 기술로 연동하기 위한 것으로, 메시지 교환 프로토콜·서비스 기술 언어·서비스 레지스트리의 세 요소로 구성된다. ①은 Envelope·Header·Body 구조의 XML 메시지를 HTTP 등으로 주고받는 프로토콜인 SOAP이다. ②는 서비스의 이름·위치·메시지 형식·프로토콜을 XML로 기술한 WSDL이고, ③은 WSDL 문서를 등록·검색하는 레지스트리인 UDDI이다. 동작 흐름은 제공자가 WSDL을 UDDI에 등록(Publish) → 요청자가 UDDI에서 검색(Find) → WSDL을 참조하여 SOAP으로 호출(Bind) 순이다. REST는 이들 없이 HTTP 메서드와 URI로 자원을 다루는 아키텍처 스타일이므로 구분한다.","difficulty":"하","point":"웹 서비스 구성 요소 3가지"},{"id":"java-n5","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"public class Main {\n    static int score(String grade) {\n        int s = 0;\n        switch (grade) {\n            case \"A\": s += 10;\n            case \"B\": s += 5; break;\n            case \"C\": s += 3;\n            default: s += 1;\n        }\n        return s;\n    }\n    public static void main(String[] args) {\n        String[] gs = { \"B\", \"A\", \"C\", \"D\", \"A\" };\n        int total = 0;\n        StringBuilder sb = new StringBuilder();\n        for (String g : gs) {\n            int v = score(g);\n            total += v;\n            sb.append(g).append(v);\n        }\n        System.out.println(sb + \" \" + total);\n        int n = 0;\n        for (int i = 1; i <= 5; i++) {\n            switch (i % 3) {\n                case 0: n += i;\n                case 1: n += 1; break;\n                case 2: n -= 1;\n            }\n        }\n        System.out.println(n);\n        char op = '*';\n        int acc = 2;\n        switch (op) {\n            case '+': acc += 3; break;\n            case '*': acc *= 3;\n            case '-': acc -= 1;\n            case '/': acc /= 2; break;\n            default: acc = 0;\n        }\n        System.out.println(acc);\n    }\n}","parts":[{"label":"출력 결과","answers":["B5A15C4D1A15 40\n4\n2"]}],"explanation":"switch 문은 일치하는 case 부터 실행을 시작하며 break 를 만나기 전까지 아래 case 로 계속 흘러내린다(fallthrough). score(): \"A\" 는 s+=10 후 break 가 없어 \"B\" 의 s+=5 까지 실행되어 15, \"B\" 는 5, \"C\" 는 s+=3 후 default 의 s+=1 까지 실행되어 4, \"D\" 는 default 만 실행되어 1 이다. 따라서 sb 는 B5A15C4D1A15, total 은 5+15+4+1+15=40 이다. 두 번째 switch: i=1(나머지 1) n=1, i=2(나머지 2) n=0, i=3(나머지 0) n+=3 후 흘러내려 n+=1 로 4, i=4 n=5, i=5 n=4 가 되어 4 를 출력한다. 세 번째 switch: op='*' 에서 acc=2*3=6, break 가 없어 acc-=1 로 5, acc/=2 로 2(정수 나눗셈) 가 된 뒤 break 되어 2 를 출력한다.","difficulty":"하","point":"switch 문 fallthrough"},{"id":"security-2","bucketLabel":"정보 보안","type":"short","language":"","question":"다음 설명에 해당하는 암호 알고리즘을 쓰시오.\n\n1999년 한국인터넷진흥원(KISA)이 개발하여 국내 표준(TTA)으로 제정된 대칭키 블록 암호 알고리즘으로, 128비트 블록 크기와 128비트 키 길이를 사용하며 16라운드의 Feistel 구조로 동작한다. 전자상거래, 금융, 무선 통신 등의 기밀성 보장에 활용되며 ISO/IEC 국제 표준으로도 등록되어 있다.","code":"","parts":[{"label":"정답","answers":["SEED","시드","SEED 알고리즘","시드 알고리즘","SEED 암호","SEED 블록 암호","시드 암호","SEED 암호 알고리즘","SEED(시드)","시드(SEED)","SEED-128"]}],"explanation":"SEED는 1999년 KISA(당시 한국정보보호센터)가 개발한 국산 대칭키 블록 암호로, 128비트 블록·128비트 키·16라운드 Feistel 구조가 핵심 식별 단서이다. 같은 국산 블록 암호인 ARIA는 2004년 국가정보원과 ETRI 등이 개발했고 128/192/256비트 키에 12/14/16라운드의 SPN(Involutional SPN) 구조를 사용하므로 연도·개발 기관·구조에서 구분된다. 경량 환경용 국산 암호 LEA(2013년, ARX 구조)와 국산 해시 HAS-160도 혼동하기 쉬운 용어이다. 미국 표준 AES(Rijndael)는 128비트 블록에 128/192/256비트 키, SPN 구조, DES는 64비트 블록·56비트 키·16라운드 Feistel 구조이므로 DES와는 라운드 수와 구조가 같지만 블록·키 길이가 다르다.","difficulty":"중","point":"암호 알고리즘"},{"id":"sql-2","bucketLabel":"SQL","type":"short","language":"SQL","question":"다음은 데이터 제어어(DCL) 문장이다. 첫 번째 문장은 사용자 KIM 에게 STUDENT 테이블의 조회·갱신 권한을 부여하면서 KIM 이 그 권한을 다른 사용자에게 다시 부여할 수 있도록 하는 문장이고, 두 번째 문장은 KIM 의 조회 권한을 회수하면서 KIM 이 다른 사용자에게 부여했던 조회 권한까지 연쇄적으로 함께 회수하는 문장이다. 괄호 ( ① ), ( ② )에 들어갈 알맞은 구문을 쓰시오.\n\n```sql\nGRANT SELECT, UPDATE ON STUDENT TO KIM ( ① );\n\nREVOKE SELECT ON STUDENT FROM KIM ( ② );\n```","code":"","parts":[{"label":"①","answers":["WITH GRANT OPTION","WITH GRANT OPTION;"]},{"label":"②","answers":["CASCADE","CASCADE;"]}],"explanation":"GRANT 문 끝에 WITH GRANT OPTION 을 붙이면 권한을 받은 사용자가 그 권한을 제3자에게 다시 부여할 수 있다. REVOKE 문 끝의 CASCADE 는 회수 대상 사용자가 WITH GRANT OPTION 으로 다른 사용자에게 전파한 권한까지 연쇄적으로 함께 회수하라는 옵션이다. 반대로 RESTRICT 는 전파된 권한이 있으면 회수를 거부한다. REVOKE 에서 GRANT OPTION FOR 를 쓰면 권한 자체는 남기고 재부여 권한만 회수하므로 지문의 「조회 권한을 회수」와 맞지 않는다. DROP TABLE ... CASCADE 의 CASCADE 가 참조 객체를 연쇄 삭제하는 것과 같은 의미로, 뒤따르는 종속 항목을 함께 처리한다고 기억하면 된다.","difficulty":"중","point":"DCL GRANT WITH GRANT OPTION / REVOKE CASCADE 빈칸"}]},{"key":"past-2020-1","name":"2020년 1회 기출","questions":[{"id":"past-2020-1-1","sourceNumber":1,"bucketLabel":"통합·패키징","type":"short","language":"","question":"다음 (         ) 안에 들어갈 단어를 쓰시오.\n\n(         )은(는) 웹브라우저 간 HTML 문법이 호환되지 않는 문제와 SGML의 복잡함을 해결하기 위하여 개발된 다목적 마크업 언어이다.","code":"","images":[],"parts":[{"label":"정답","answers":["XML"]}],"explanation":"XML(eXtensible Markup Language)은 SGML의 복잡한 기능을 덜어 내고, 미리 정해진 태그만 쓰는 HTML의 한계를 넘기 위해 만든 마크업 언어이다. 사용자가 태그를 직접 정의할 수 있어 문서 구조와 데이터를 함께 표현할 수 있고, 시스템 간 데이터 교환 형식으로 널리 쓰인다. HTML은 화면 표현용 태그가 고정되어 있고, SGML은 XML·HTML의 상위 규격으로 범용성이 크지만 너무 복잡하다는 점으로 구분한다. 문제의 「HTML 호환 문제」와 「SGML의 복잡함 해결」이라는 두 단서가 모두 XML을 가리킨다.","difficulty":"","point":"XML 마크업 언어 정의"},{"id":"past-2020-1-2","sourceNumber":2,"bucketLabel":"통합·패키징","type":"short","language":"","question":"다음 (         ) 안에 들어갈 단어를 쓰시오.\n\n(        )은 속성-값 쌍(attribute-value pairs)으로 이루어진 데이터 오브젝트를 전달하기 위해 사용하는 개방형 표준 포맷이다. AJAX에서 많이 사용되고 XML을 대체하는 주요 데이터 포맷이다. 언어 독립형 데이터 포맷으로 다양한 프로그래밍 언어에서 사용되고 있다.​","code":"","images":[],"parts":[{"label":"정답","answers":["JSON"]}],"explanation":"JSON(JavaScript Object Notation)은 이름과 값의 쌍, 즉 속성-값 쌍으로 데이터 객체를 표현하는 경량 텍스트 형식이다. 자바스크립트 객체 표기법에서 출발했지만 특정 언어에 묶이지 않아 대부분의 언어가 파싱 라이브러리를 제공한다. 태그로 감싸는 XML보다 문법이 간결하고 데이터 크기가 작아, AJAX 통신과 REST API에서 XML을 대신하는 주된 형식이 되었다. 「속성-값 쌍」, 「AJAX에서 사용」, 「XML 대체」가 핵심 단서이다.","difficulty":"","point":"JSON 데이터 포맷"},{"id":"past-2020-1-3","sourceNumber":3,"bucketLabel":"통합·패키징","type":"short","language":"","question":"다음은 릴리즈 노트의 구성 항목에 관한 설명이다. 설명하는 항목은 무엇인가?\n\n릴리즈 노트 이름, 소프트웨어 이름, 릴리즈 버전, 릴리즈 날짜, 릴리즈 노트 날짜, 릴리즈 노트 버전 등의 기존정보가 포함된다.","code":"","images":[],"parts":[{"label":"정답","answers":["헤더","머릿말","머리말","Header","헤더(머릿말)"]}],"explanation":"릴리즈 노트는 배포되는 소프트웨어의 변경 사항과 정보를 사용자에게 알리는 문서이며, 맨 앞의 헤더(머릿말)에 문서와 제품을 식별하는 기본 정보를 적는다. 헤더에는 릴리즈 노트 이름, 소프트웨어 이름, 릴리즈 버전과 날짜, 노트 작성 날짜와 버전 등이 들어간다. 그 뒤로 개요, 목적, 이슈 요약, 재현 항목, 수정·개선 내용, 사용자 영향도, SW 지원 영향도, 노트, 면책 조항, 연락처 등이 이어진다. 버전·날짜 같은 식별 정보 묶음이면 헤더, 제품과 변경에 대한 간단한 소개면 개요로 구분한다.","difficulty":"","point":"릴리즈 노트 헤더 항목","unordered":false},{"id":"past-2020-1-4","sourceNumber":4,"bucketLabel":"테스트","type":"short","language":"","question":"애플리케이션 테스트의 기본 원리 중 살충제 패러독스(Pesticide Paradox)의 의미를 설명하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["동일한 살충제의 반복 사용 시 벌레에게서 내성이 생기는 것에 비유하여, 동일한 테스트 전략, 기법을 적용할 시 장애가 도출되지 않음을 의미"]}],"explanation":"살충제 패러독스는 같은 살충제를 계속 뿌리면 벌레가 내성을 가져 효과가 떨어지듯, 같은 테스트 케이스와 기법을 반복하면 더 이상 새로운 결함을 찾지 못하게 되는 현상이다. 그래서 테스트 케이스를 주기적으로 검토·개선하고 다양한 기법과 관점으로 테스트해야 한다는 원리로 이어진다. 채점 포인트는 「동일한 테스트(케이스·기법)의 반복」과 「새로운 결함을 발견하지 못함」 두 가지이다. 결함이 특정 모듈에 몰린다는 결함 집중(파레토 법칙), 결함을 다 없애도 요구에 맞지 않으면 쓸모없다는 오류-부재의 궤변과 구분해 둔다.","difficulty":"","point":"테스트 원리 살충제 패러독스"},{"id":"past-2020-1-5","sourceNumber":5,"bucketLabel":"데이터베이스","type":"short","language":"","question":"데이터 마이닝이란 무엇인지 설명하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["많은 데이터 가운데 숨겨져 있는 유용한 상관관계를 발견하여, 미래에 실행 가능한 정보를 추출해 내고 의사 결정에 이용하는 과정"]}],"explanation":"데이터 마이닝은 대량의 데이터 속에 숨어 있는 규칙, 패턴, 상관관계를 찾아내어 의사결정에 쓸 수 있는 유용한 정보를 추출하는 과정이다. 연관 규칙, 분류, 군집, 순차 패턴 같은 기법이 대표적이다. 채점 포인트는 「대량 데이터」, 「숨겨진 패턴·상관관계 발견」, 「의사결정에 활용할 정보 추출」이다. 데이터를 모아 두는 저장소인 데이터 웨어하우스나, 다차원으로 조회·분석하는 OLAP과 달리 데이터 마이닝은 미리 알지 못한 관계를 찾아내는 데 초점이 있다.","difficulty":"","point":"데이터 마이닝 정의"},{"id":"past-2020-1-6","sourceNumber":6,"bucketLabel":"네트워크","type":"short","language":"","question":"프로토콜을 구성하는 대표적인 세가지 요소를 적으시오.","code":"","images":[],"parts":[{"label":"1","answers":["구문","Syntax","구문(Syntax)"]},{"label":"2","answers":["의미","Semantics","의미(Semantics)"]},{"label":"3","answers":["타이밍","Timing","타이밍(Timing)"]}],"explanation":"프로토콜은 통신하는 개체끼리 지켜야 할 약속이며 구문, 의미, 타이밍 세 요소로 이루어진다. 구문(Syntax)은 데이터의 형식, 부호화, 신호 레벨처럼 「어떤 모양으로 보내는가」를 정한다. 의미(Semantics)는 제어 정보와 오류 처리처럼 「각 비트가 무엇을 뜻하는가」를 정한다. 타이밍(Timing)은 통신 속도를 맞추고 순서를 제어하는 것으로 「언제, 얼마나 빨리 보내는가」를 정한다.","difficulty":"","point":"프로토콜 구성 3요소","unordered":true},{"id":"past-2020-1-7","sourceNumber":7,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음에서 설명하는 해시 함수는?\n\n128비트 암호화 해시 함수로 RFC 1321로 지정되어 있으며, 주로 프로그램이나 파일이 원본 그대로인지를 확인하는 무결성 검사 등에 사용된다. 1991년에 로널드 라이베스트(Ronald Rivest)가 예전에 쓰이던 MD4를 대체하기 위해 고안하였다.","code":"","images":[],"parts":[{"label":"정답","answers":["MD5"]}],"explanation":"MD5(Message Digest 5)는 임의 길이의 입력으로 128비트 해시값을 만드는 함수로, RFC 1321에 정의되어 있다. 로널드 라이베스트가 MD4의 약점을 보완하려고 1991년에 설계했으며, 파일이 내려받는 도중 바뀌지 않았는지 확인하는 무결성 검사에 많이 쓰였다. 지금은 충돌 공격이 알려져 보안 용도로는 권장되지 않는다. 160비트를 출력하는 SHA-1, 256비트 이상인 SHA-2 계열과는 출력 길이로 구분한다.","difficulty":"","point":"MD5 해시 함수 특징"},{"id":"past-2020-1-8","sourceNumber":8,"bucketLabel":"운영체제","type":"short","language":"","question":"비선점형 스케줄링 HRN의 우선순위 계산식을 작성하시오.​","code":"","images":[],"parts":[{"label":"정답","answers":["(대기 시간 + 서비스 시간) / 서비스 시간"]}],"explanation":"HRN(Highest Response-ratio Next)은 비선점 스케줄링으로, 응답률이 가장 높은 프로세스를 먼저 실행한다. 우선순위는 (대기 시간 + 서비스 시간) / 서비스 시간으로 계산하며 값이 클수록 먼저 실행된다. 서비스 시간이 짧으면 분모가 작아 유리하므로 SJF처럼 짧은 작업을 우대하면서도, 오래 기다린 작업은 분자가 커져 우선순위가 올라가므로 SJF의 기아 현상을 줄인다. 분자를 대기 시간만으로 쓰거나 분모를 대기 시간으로 쓰는 실수를 주의한다.","difficulty":"","point":"HRN 우선순위 계산식"},{"id":"past-2020-1-9","sourceNumber":9,"bucketLabel":"데이터베이스","type":"short","language":"","question":"아래는 데이터베이스 트랜잭션의 4가지 속성이다. (가) , (나)에 들어가 단어를 적으시오.\n\n  \n    속성\n    설명\n  \n\n\n  \n    (가)\n    트랜잭션은 연산들을 전부 실행하든지 전혀 실행하지 않아야 한다. 일부만 실행해서는 안 된다.\n  \n  \n    일관성\n    트랜잭션이 성공적으로 실행되면 데이터베이스 상태는 모순되지 않고 일관된 상태가 된다.\n  \n  \n    (나)\n    트랜잭션 실행 도중의 연산 결과는 다른 트랜잭션에서 접근할 수 없다.\n  \n  \n    지속성\n    트랜잭션이 성공했을 경우 영구적으로 반영되어야 한다.\n  ","code":"","images":[],"parts":[{"label":"(가)","answers":["원자성","Atomicity","원자성(Atomicity)"]},{"label":"(나)","answers":["독립성","격리성","Isolation","독립성(Isolation)","격리성(Isolation)"]}],"explanation":"트랜잭션의 ACID 특성은 원자성(Atomicity), 일관성(Consistency), 독립성(Isolation), 지속성(Durability)이다. (가)는 연산을 모두 반영하거나 하나도 반영하지 않는 All or Nothing 성질이므로 원자성이다. (나)는 실행 중인 트랜잭션의 중간 결과를 다른 트랜잭션이 볼 수 없다는 성질이므로 독립성이며, 격리성이라고도 부른다. 원자성은 Commit과 Rollback으로, 독립성은 병행 제어(로킹 등)로 보장한다는 점도 함께 기억한다.","difficulty":"","point":"트랜잭션 ACID 특성","unordered":false},{"id":"past-2020-1-10","sourceNumber":10,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음에서 설명하는 서비스 거부 공격은?\n\n패킷의 출발지 주소(Address)나 포트(port)를 임의로 변경하여 출발지와 목적지 주소(또는 포트)를 동일하게 함으로써, 공격 대상 컴퓨터의 실행 속도를 느리게 하거나 동작을 마비시켜 서비스 거부 상태에 빠지도록 하는 공격","code":"","images":[],"parts":[{"label":"정답","answers":["랜드 어택","Land Attack","랜드 어택(Land Attack)","랜드 공격","Land"]}],"explanation":"랜드 어택(Land Attack)은 출발지 IP·포트를 목적지와 똑같이 위조한 패킷을 보내, 공격 대상이 자기 자신에게 응답을 계속 보내도록 만드는 서비스 거부 공격이다. 시스템은 끝없는 자기 응답 루프에 빠져 느려지거나 멈춘다. 방어는 출발지와 목적지 주소가 같은 패킷을 걸러 버리는 것이다. 출발지를 공격 대상으로 위조하고 브로드캐스트로 ICMP를 뿌리는 스머프(Smurf), 큰 ICMP 패킷을 보내는 죽음의 핑과 구분하며, 「출발지와 목적지를 동일하게」가 랜드 어택의 결정적 단서이다.","difficulty":"","point":"DoS 공격 랜드 어택","unordered":false},{"id":"past-2020-1-11","sourceNumber":11,"bucketLabel":"네트워크","type":"short","language":"","question":"OSI 7계층 중 다음에서 설명하는 계층은?\n\n전송에 필요한 두 장치 간의 실제 접속과 절단 등 기계적, 전기적, 기능적, 절차적 특성에 대한 규칙을 정의한다. 단위(PDU)는 '비트'를 사용한다.","code":"","images":[],"parts":[{"label":"정답","answers":["물리 계층"]}],"explanation":"물리 계층은 OSI 7계층의 가장 아래 계층으로, 장치 사이의 실제 연결과 해제에 필요한 기계적·전기적·기능적·절차적 특성을 정의한다. 케이블, 커넥터, 전압, 신호 방식 같은 하드웨어 규격을 다루며 전송 단위는 비트이다. 바로 위 데이터 링크 계층은 프레임 단위로 인접 노드 사이의 오류·흐름 제어를 맡으므로 PDU로 구분할 수 있다. PDU는 물리 계층 비트, 데이터 링크 프레임, 네트워크 패킷, 전송 세그먼트 순으로 정리해 둔다.","difficulty":"","point":"OSI 물리 계층 특성"},{"id":"past-2020-1-12","sourceNumber":12,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"LoC 기법으로 개발을 해야 하는 프로젝트의 총 라인이 30000 라인이고, 개발자가 5명, 그리고 인당 월평균 300라인의 개발이 가능할 때, 개발하는데 소요될 것으로 예상되는 시간의 계산식과 그 결과를 작성하시오.","code":"","images":[],"parts":[{"label":"계산식","answers":["(30000 / 5) / 300","30000 / (5 × 300)","30000 / (5 * 300)","30000 / (300 × 5)","30000 / (300 * 5)","30000 / 1500","(30000 / 300) / 5"]},{"label":"결과","answers":["20개월","20"]}],"explanation":"LoC(Line of Code) 기법은 예상 코드 라인 수를 기준으로 노력과 기간을 추정한다. 개발 기간은 총 라인 수를 「개발자 수 × 1인당 월 생산성」으로 나누어 구한다. 팀 전체가 한 달에 만드는 라인은 5명 × 300라인 = 1,500라인이다. 따라서 30,000 / 1,500 = 20개월이며, 저장된 계산식 (30000 / 5) / 300 도 1인당 6,000라인을 월 300라인으로 나눈 것이라 같은 결과가 된다. 노력(인월)을 묻는다면 30,000 / 300 = 100인월이 되므로, 기간과 노력을 혼동하지 않는다.","difficulty":"","point":"LoC 기법 개발 기간 계산","unordered":false},{"id":"past-2020-1-13","sourceNumber":13,"bucketLabel":"테스트","type":"short","language":"","question":"아래는 애플리케이션 성능을 측정하기 위한 요소들이다. (가), (나),(다)에 들어갈 단어를 적으시오.\n\n  \n    속성\n    설명\n  \n\n\n  \n    (가)\n    일정 시간 내에 애플리케이션이 처리하는 일의 양\n  \n  \n    (나)\n    애플리케이션에 요청을 전달한 시간부터 응답이 도착할 때까지 걸린 시간\n  \n  \n    (다)\n    애플리케이션에 작업을 의뢰한 시간부터 처리가 완료될 때까지 걸린 시간\n  \n  \n    자원 사용률\n    애플리케이션이 의뢰한 작업을 처리하는 동안의 CPU 사용량, 메모리 사용량, 네트워크 사용량 등\n  ","code":"","images":[],"parts":[{"label":"(가)","answers":["처리량","Throughput","처리량(Throughput)"]},{"label":"(나)","answers":["응답 시간","Response Time","응답 시간(Response Time)"]},{"label":"(다)","answers":["경과 시간","Turnaround Time","경과 시간(Turnaround Time)"]}],"explanation":"애플리케이션 성능 측정 지표는 처리량, 응답 시간, 경과 시간, 자원 사용률 네 가지이다. (가) 처리량(Throughput)은 정해진 시간 안에 처리하는 작업의 양이다. (나) 응답 시간(Response Time)은 요청을 보낸 뒤 첫 응답이 돌아올 때까지의 시간이다. (다) 경과 시간(Turnaround Time)은 작업을 맡긴 시점부터 처리가 완전히 끝날 때까지의 시간이다. 응답 시간은 「응답 도착」까지, 경과 시간은 「처리 완료」까지라는 끝 지점의 차이로 구분한다.","difficulty":"","point":"애플리케이션 성능 측정 지표","unordered":false},{"id":"past-2020-1-14","sourceNumber":14,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 소프트웨어 모듈화에 관한 설명이다. (가), (나)에 들어갈 단어를 각각 적으시오.\n\n모듈의 기능적 독립성은 소프트웨어를 구성하는 각 모듈의 기능이 서로 독립됨을 의미하는 것으로, 모듈이 하나의 기능만을 수행하고 다른 모듈과의 과도한 상호작용을 배제함으로써 이루어진다. 모듈의 독립성을 높이기 위해서는 ( 가 )는 약하게, ( 나 )는 강하게 만들어야 한다.","code":"","images":[],"parts":[{"label":"(가)","answers":["결합도","Coupling","결합도(Coupling)"]},{"label":"(나)","answers":["응집도","Cohesion","응집도(Cohesion)"]}],"explanation":"모듈 독립성은 결합도와 응집도로 측정한다. 결합도(Coupling)는 모듈과 모듈 사이의 의존 정도이므로 낮을수록, 즉 약할수록 좋다. 응집도(Cohesion)는 한 모듈 안의 구성 요소가 하나의 기능을 위해 얼마나 밀접하게 모여 있는지이므로 높을수록, 즉 강할수록 좋다. 「모듈 간」이면 결합도, 「모듈 내부」면 응집도로 구분하면 헷갈리지 않는다.","difficulty":"","point":"모듈 결합도와 응집도","unordered":false},{"id":"past-2020-1-15","sourceNumber":15,"bucketLabel":"데이터베이스","type":"short","language":"","question":"데이터베이스 성능 개선과 관련하여 '데이터베이스 반정규화'란 무엇인지 설명하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["시스템의 성능 향상, 개발 및 운영의 편의성 등을 위해 정규화된 데이터 모델을 통합, 중복, 분리하는 과정으로, 의도적으로 정규화 원칙을 위배하는 행위"]}],"explanation":"반정규화(De-normalization)는 정규화된 모델이 조인 증가 등으로 성능이 떨어질 때, 성능 향상과 개발·운영 편의를 위해 의도적으로 정규화 원칙을 깨는 작업이다. 테이블 통합·분할, 중복 테이블이나 중복 칼럼 추가, 파생 칼럼 추가 같은 방법을 쓴다. 채점 포인트는 「성능 향상(조회 속도)」과 「의도적으로 정규화 원칙을 위배(통합·중복·분리)」이다. 데이터 중복이 생기므로 무결성 저하라는 대가가 있다는 점에서 정규화와 반대 방향의 작업으로 이해한다.","difficulty":"","point":"데이터베이스 반정규화"},{"id":"past-2020-1-16","sourceNumber":16,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음의 시스템 구조도에서 팬인(Fan-in)이 2 이상인 것은?","code":"","images":["imported-images/2020-1-q16-1.png"],"parts":[{"label":"1","answers":["F"]},{"label":"2","answers":["J"]}],"explanation":"팬인(Fan-in)은 어떤 모듈을 호출하는, 즉 그 모듈로 들어오는 화살표의 수이고 팬아웃(Fan-out)은 그 모듈이 호출하는 하위 모듈의 수이다. 구조도에서 들어오는 화살표를 세면 B·C·D는 A에서 1개, E는 B에서 1개, F는 B와 C에서 2개, G는 C에서 1개, H는 D에서 1개, I는 F에서 1개, J는 G와 H에서 2개이다. 따라서 팬인이 2 이상인 모듈은 F와 J이다. 나가는 화살표를 세면 팬아웃이 되므로 화살표 방향을 반드시 확인한다.","difficulty":"","point":"시스템 구조도 팬인 계산","unordered":true},{"id":"past-2020-1-17","sourceNumber":17,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어로 작성된 코드이다. 코드의 실행 결과를 쓰시오. (단, 출력문의 출력 서식을 준수하시오.)","code":"#include \nvoid align(int a[ ]) {\nint temp;\nfor (int i = 0; i < 4; i++) {\n  for (int j=0; j < 4 - i; j++)  {\n    if (a[j]> a[j+1]) {\n      temp = a[j];\n      a[j] = a[j+1];\n      a[j+1] = temp;\n    }\n  }\n}\n\nmain( ) {\n    int a[ ] = { 85, 75, 50, 100, 95 };\n    align(a);\n     for (int i = 0; i < 5; i++) printf(\"%d \", a[i]);\n}","images":[],"parts":[{"label":"정답","answers":["50 75 85 95 100"]}],"explanation":"align 함수는 인접한 두 값을 비교해 앞이 크면 바꾸는 오름차순 버블 정렬이다. 바깥 i가 0일 때 j는 0~3까지 돌며 85·75, 85·50을 교환하고 100·95를 교환해 75 50 85 95 100이 되며, 가장 큰 100이 맨 끝에 자리 잡는다. i가 1일 때 75·50을 교환해 50 75 85 95 100이 되고, i가 2·3일 때는 더 바뀌지 않는다. 배열은 함수에 주소로 넘어가므로 main의 a가 직접 정렬되고, 출력은 \"%d \" 서식이라 각 값 뒤에 공백이 붙어 50 75 85 95 100 이 된다. 복원 과정에서 #include 뒤의 헤더 이름과 align 함수의 닫는 중괄호가 빠졌으나 의도대로 stdio.h와 닫는 괄호가 있다고 보고 풀었다.","difficulty":"","point":"C 버블 정렬 결과"},{"id":"past-2020-1-18","sourceNumber":18,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어로 작성된 코드이다. 코드의 실행 결과를 쓰시오. (단, 출력문의 출력 서식을 준수하시오.)","code":"#include \nmain( ) {\n   int c = 1;\n   switch (3) {\n      case 1: c += 3;\n      case 2: c++;\n      case 3: c = 0;\n      case 4: c += 3;\n      case 5: c -= 10;\n      default: c--;\n   }\n   printf(\"%d\", c);\n}","images":[],"parts":[{"label":"정답","answers":["-8"]}],"explanation":"switch(3)이므로 case 3부터 실행되며, break가 하나도 없어 그 아래 case가 모두 이어서 실행되는 폴스루가 일어난다. c는 1에서 시작해 case 3에서 c = 0, case 4에서 c += 3으로 3, case 5에서 c -= 10으로 -7, default에서 c--로 -8이 된다. case 1과 case 2는 진입 지점보다 위에 있으므로 실행되지 않는다. 따라서 printf(\"%d\", c)는 -8을 출력한다. break가 있었다면 case 3에서 0이 출력되었을 것이므로 break 유무를 먼저 확인하는 것이 핵심이다.","difficulty":"","point":"C switch 폴스루"},{"id":"past-2020-1-19","sourceNumber":19,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java언어로 작성된 코드이다. 코드의 실행 결과를 쓰시오. (단, 출력문의 출력 서식을 준수하시오.)","code":"public class Test {\n   static int[ ] arr( ) {\n     int a[ ] = new int[4];\n     int b = a.length;\n     for(int i = 0; i < b; i++)\n        a[i] = i;\n     return a;\n  }\n\n  public static void main(String[ ] args) {\n     int a[ ] = arr( );\n     for(int i = 0; i < a.length; i++)\n        System.out.print(a[i] + \" \");\n  }\n}","images":[],"parts":[{"label":"정답","answers":["0 1 2 3"]}],"explanation":"arr 메서드는 크기 4인 int 배열을 만들고 b = a.length 즉 4번 반복하며 a[i] = i를 넣으므로 배열은 {0, 1, 2, 3}이 된다. 메서드는 이 배열의 참조를 반환하고 main의 a가 같은 배열을 가리킨다. main의 반복문은 각 원소 뒤에 공백 한 칸을 붙여 print로 출력하므로 결과는 0 1 2 3 이다. 자바 배열의 length는 메서드가 아니라 필드이므로 괄호 없이 쓴다는 점도 함께 확인해 둔다.","difficulty":"","point":"Java 배열 반환과 출력"},{"id":"past-2020-1-20","sourceNumber":20,"bucketLabel":"SQL","type":"short","language":"","question":"학생 테이블에 전기과 학생이 50명, 전산과 학생이 100명, 전자과 학생이 50명 있다고 할 때, 다음 SQL문 ①, ②, ③의 실행 결과로 표시되는 튜플의 수를 쓰시오. (단, DEPT 필드는 학과를 의미)​","code":"1) SELECT 학과 FROM 학생;\n2) SELECT DISTINCT 학과 FROM 학생;\n3) SELECT COUNT(DISTINCT 학과) FROM 학생 WHERE 학과='전산과';","images":[],"parts":[{"label":"①","answers":["200","200개"]},{"label":"②","answers":["3","3개"]},{"label":"③","answers":["1","1개"]}],"explanation":"학생 테이블의 전체 튜플은 50 + 100 + 50 = 200개이다. ①은 조건 없이 학과 칼럼만 뽑으므로 중복을 포함한 200개 행이 모두 나온다. ②는 DISTINCT로 중복을 제거하므로 전기과, 전산과, 전자과 3개 행이 나온다. ③은 집계 함수 COUNT가 결과를 하나의 값으로 만들므로 표시되는 튜플은 1개이며, 그 값은 전산과 하나뿐이라 1이다. 문제의 「DEPT 필드」는 복원 과정에서 남은 표기로, SQL의 학과 칼럼을 뜻한다고 보고 풀었다.","difficulty":"","point":"SQL DISTINCT와 COUNT 결과 수","unordered":false}]},{"key":"past-2020-2","name":"2020년 2회 기출","questions":[{"id":"past-2020-2-1","sourceNumber":1,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음 보기는 네트워크 인프라 서비스 관리 실무와 관련된 사례이다. 괄호안에 들어갈 가장 적합한 용어를 한글 또는 영문으로 쓰시오.\n\n귀하는 IT회사의 보안관제실에서 근무하고 있다. 정보시스템 운영 중 자연재해나 시스템 장애 등의 이유로 대고객 서비스가 불가능한 경우가 종종 발생한다. 이를 대비하여 백업 및 복구 솔루션을 도입하고자 한다.\n백업 및 복구 솔루션은 (            )와 복구 목표 시점(RPO) 기준을 충족할 수 있는 제품으로 선정해야 한다. (           )는 “비상사태 또는 업무중단 시점으로부터 업무가 복구되어 다시 정상가동 될 때까지의 시간” 을 의미하고 복구 목표 시점(RPO)는 \"업무 중단 시 각 업무에 필요한 데이터를 여러 백업 수단을 이용하여 복구할 수 있는 기준점\"을 의미한다.","code":"","images":[],"parts":[{"label":"정답","answers":["목표 복구 시간","RTO","Recovery Time Objective","목표 복구 시간(RTO)","RTO(Recovery Time Objective)","복구 목표 시간","복구 목표 시간(RTO)","목표 복구 시간(RTO; Recovery Time Objective)"]}],"explanation":"RTO(Recovery Time Objective, 목표 복구 시간)는 장애나 재해로 업무가 멈춘 시점부터 복구되어 다시 정상 가동될 때까지 허용되는 최대 시간이다. RPO(Recovery Point Objective, 목표 복구 시점)는 데이터를 어느 시점까지 되살릴 수 있어야 하는지, 즉 허용 가능한 데이터 손실 범위를 나타내는 기준점이다. 둘 다 백업·재해 복구 솔루션을 고를 때 쓰는 핵심 지표이다. 「얼마나 빨리 다시 돌아가는가」는 RTO, 「어느 시점의 데이터로 돌아가는가」는 RPO로 구분한다.","difficulty":"","point":"재해 복구 RTO와 RPO","unordered":false},{"id":"past-2020-2-2","sourceNumber":2,"bucketLabel":"Python","type":"short","language":"","question":"다음 파이썬(Python) 스크립트의 실행 결과를 적으시오.","code":">>> asia={\"한국\", \"중국\", \"일본\"}\n>>> asia.add(\"베트남\")\n>>> asia.add(\"중국\")\n>>> asia.remove(\"일본\")\n>>> asia.update([\"홍콩\", \"한국\", \"태국\"])\n>>> print(asia)","images":[],"parts":[{"label":"원소 1","answers":["한국","중국","베트남","홍콩","태국"]},{"label":"원소 2","answers":["중국","베트남","홍콩","태국","한국"]},{"label":"원소 3","answers":["베트남","홍콩","태국","한국","중국"]},{"label":"원소 4","answers":["홍콩","태국","한국","중국","베트남"]},{"label":"원소 5","answers":["태국","한국","중국","베트남","홍콩"]}],"explanation":"중괄호에 값을 나열하면 집합(set)이 만들어지며, 집합은 중복을 허용하지 않고 순서가 없다. 처음 {한국, 중국, 일본}에 add(\"베트남\")으로 베트남이 추가되고, add(\"중국\")은 이미 있으므로 변화가 없다. remove(\"일본\")으로 일본이 빠져 {한국, 중국, 베트남}이 된다. update는 리스트의 원소를 하나씩 추가하는데 한국은 중복이라 무시되고 홍콩과 태국만 더해져 원소는 5개가 된다. 실제 print는 {'한국', '중국', '베트남', '홍콩', '태국'}처럼 작은따옴표로 표시되며, 집합은 순서가 보장되지 않아 출력 순서는 실행마다 달라질 수 있다.","difficulty":"","point":"Python 집합 연산 결과","unordered":true},{"id":"past-2020-2-3","sourceNumber":3,"bucketLabel":"통합·패키징","type":"short","language":"","question":"다음에서 설명하는 기술을 영문 약어로 쓰시오.\n\n'비동기식 자바스크립트 XML'을 의미하는 용어로, 클라이언트와 웹서버 간에 XML 데이트를 내부적으로 통신하는 대화식 웹 애플리케이션의 제작을 위해 사용된다. 클라이언트의 요청에 의해 웹서버에서 로딩된 데이터를 웹 브라우저의 페이지에 보여주기 위해 웹 페이지 전체를 '새로고침'할 필요 없이 즉, 현재 페이지에서 필요한 일부만 로딩되도록 하는 웹 개발 기법을 의미한다.","code":"","images":[],"parts":[{"label":"정답","answers":["AJAX","AJAX(Asynchronous Javascript And XML)"]}],"explanation":"AJAX(Asynchronous JavaScript and XML)는 자바스크립트로 서버와 비동기 통신을 해, 페이지 전체를 새로고침하지 않고 필요한 부분만 갱신하는 웹 개발 기법이다. 브라우저의 XMLHttpRequest 객체로 요청을 보내고 받은 데이터로 DOM의 일부만 바꾸므로 사용자는 화면 멈춤 없이 작업을 이어 갈 수 있다. 이름에 XML이 들어 있지만 요즘은 주로 JSON을 주고받는다. 「비동기식 자바스크립트 XML」과 「전체 새로고침 없이 일부만 로딩」이 핵심 단서이다.","difficulty":"","point":"AJAX 비동기 통신","unordered":false},{"id":"past-2020-2-4","sourceNumber":4,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"다음에서 설명하는 개발방법론은 무엇인지 적으시오.\n\n고객의 요구사항 변화에 유연하게 대응하기 위해 일정한 주기를 반복하면서 개발하며 고객에게 시제품을 지속적으로 제공하며 고객의 요구사항이 정확하게 반영되고 있는지 점검한다. 폭포수 모형에 대비되는 유연한 방법론으로 비교적 소규모 개발 프로젝트에서 각광받고 있는 개발 방법론이다.","code":"","images":[],"parts":[{"label":"정답","answers":["애자일","애자일 방법론","애자일 기법","Agile","애자일(Agile)"]}],"explanation":"애자일(Agile)은 짧은 주기를 반복하며 동작하는 소프트웨어를 자주 내놓고, 고객의 피드백을 받아 요구사항 변화에 유연하게 대응하는 개발 방법론이다. 절차와 문서보다 개인과 상호작용, 동작하는 소프트웨어, 고객 협력, 변화 대응을 중시한다. 대표적인 방식으로 스크럼, XP, 칸반 등이 있다. 단계를 차례로 한 번만 거치는 폭포수 모형과 대비되며, 「반복 주기」, 「지속적인 시제품 제공」, 「폭포수와 대비」가 핵심 단서이다.","difficulty":"","point":"애자일 개발 방법론","unordered":false},{"id":"past-2020-2-5","sourceNumber":5,"bucketLabel":"Java","type":"short","language":"","question":"다음에 제시된 자바(Java) 프로그램이 [처리 결과]와 같은 결과를 출력할 때, 자바 프로그램의 ( ? )에 들어갈 표현을 대소문자를 구별하여 쓰시오.","code":"[처리결과] \nChild\n\nclass Parent {\n    void show() {\n        System.out.println(\"Parent\");\n    }\n}\nclass Child extends Parent {\n    void show() {\n        System.out.println(\"Child\");\n    }\n}\npublic class Exam {\n    public static void main(String[] args) {\n        Parent pa = (  ?  ) Child();\n        pa.show();\n    }\n}","images":[],"parts":[{"label":"정답","answers":["new"]}],"explanation":"자바에서 객체를 생성하려면 new 연산자로 생성자를 호출해야 하므로 빈칸에는 소문자 new가 들어간다. Parent pa = new Child();는 부모 타입 참조 변수가 자식 객체를 가리키는 업캐스팅이다. Child가 show()를 재정의(오버라이딩)했으므로, pa.show()를 호출하면 참조 변수 타입이 아니라 실제 객체 타입의 메서드가 실행되는 동적 바인딩이 일어나 Child가 출력된다. 대소문자를 구별하라고 했으므로 New나 NEW로 쓰면 틀린다.","difficulty":"","point":"Java 객체 생성과 오버라이딩"},{"id":"past-2020-2-6","sourceNumber":6,"bucketLabel":"SQL","type":"short","language":"","question":"다음과 같은 \"학생\"테이블을 대상으로, 3학년과 4학년의 학번과 이름을 출력하는 SQL문을 작성하시오. (단, in 구문을 반드시 사용할 것)\n\n학번이름학년\n1111홍길동1\n2222임꺽정2\n3333유관순3\n4444안중근3\n5555홍범도4","code":"","images":[],"parts":[{"label":"정답","answers":["SELECT 학번,이름 FROM 학생 WHERE 학년 IN (3,4);"]}],"explanation":"IN 연산자는 칼럼 값이 괄호 안 목록 중 하나와 같으면 참이 되므로, WHERE 학년 IN (3, 4)는 학년 = 3 OR 학년 = 4와 같은 조건이다. SELECT 절에 학번, 이름만 적고 FROM 학생으로 테이블을 지정하면 된다. 실행하면 유관순·안중근(3학년)과 홍범도(4학년)의 학번과 이름 3행이 나온다. BETWEEN 3 AND 4도 같은 결과를 내지만 문제에서 IN 사용을 요구했으므로 IN으로 써야 한다.","difficulty":"","point":"SQL IN 조건 조회"},{"id":"past-2020-2-7","sourceNumber":7,"bucketLabel":"SQL","type":"short","language":"","question":"SQL 제어어(DCL)에는 COMMIT, ROLLBACK, GRANT, REVOKE 가 있다. 그 중 ROLLBACK에 대해 약술하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["트랜잭션의 실패로 작업을 취소하고, 이전 상태로 되돌리는 데이터 제어어"]}],"explanation":"ROLLBACK은 트랜잭션 수행 중 오류가 나거나 작업을 취소해야 할 때, 그 트랜잭션이 한 변경을 모두 취소하고 트랜잭션 시작 전(또는 SAVEPOINT) 상태로 되돌리는 명령이다. 채점 포인트는 「작업(변경) 취소」와 「이전 상태로 복구」이다. COMMIT은 변경을 영구 반영해 확정하는 명령이므로 반대 역할이며, GRANT와 REVOKE는 권한을 주고 회수하는 명령이다. 원자성을 보장하는 수단이 COMMIT과 ROLLBACK이라는 점과 연결해 기억한다.","difficulty":"","point":"DCL ROLLBACK"},{"id":"past-2020-2-8","sourceNumber":8,"bucketLabel":"정보 보안","type":"short","language":"","question":"네트워크 계층(network layer, 3계층)인 인터넷 프로토콜(IP)에서 '암호화', '인증', '키 관리'를 통해 보안성을 제공해 주는 표준화된 기술","code":"","images":[],"parts":[{"label":"정답","answers":["IPSec"]}],"explanation":"IPSec(IP Security)은 네트워크 계층에서 IP 패킷 단위로 암호화, 인증, 키 관리를 제공하는 보안 프로토콜 모음이다. 인증과 무결성을 담당하는 AH, 암호화까지 제공하는 ESP, 키를 교환하는 IKE로 구성되며 전송 모드와 터널 모드가 있다. VPN 구축에 널리 쓰인다. 전송 계층 위에서 동작하는 SSL/TLS와는 동작 계층으로 구분하며, 「3계층」과 「IP에서 보안 제공」이 핵심 단서이다.","difficulty":"","point":"IPSec 네트워크 계층 보안"},{"id":"past-2020-2-9","sourceNumber":9,"bucketLabel":"테스트","type":"short","language":"","question":"애플리케이션을 실행하지 않고, 소스 코드에 대한 코딩 표준, 코딩 스타일, 코드 복잡도 및 남은 결함을 발견하기 위하여 사용하는 테스트 자동화 도구 유형은?","code":"","images":[],"parts":[{"label":"정답","answers":["정적 분석 도구","정적 분석 툴","정적 테스팅 도구","코드 검사 도구","코드 인스펙션 툴"]}],"explanation":"정적 분석 도구는 프로그램을 실행하지 않고 소스 코드만 분석해 코딩 표준 위반, 코딩 스타일, 코드 복잡도, 남아 있는 결함 등을 찾아내는 테스트 자동화 도구이다. 대표적으로 pmd, cppcheck, SonarQube, checkstyle 등이 있다. 프로그램을 실제로 실행하면서 메모리 누수나 성능 문제를 찾는 동적 분석 도구와는 「실행 여부」로 구분한다. 「애플리케이션을 실행하지 않고」라는 문구가 핵심 단서이다.","difficulty":"","point":"정적 분석 테스트 도구","unordered":false},{"id":"past-2020-2-10","sourceNumber":10,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음에서 설명하는  소프트웨어  디자인 패턴을 영문으로 쓰시오.\n\n한 객체의 상태가 바뀌면 그 객체에 의존하는 다른 객체들한테 연락이 가고 자동으로 내용이 갱신되는 방식으로 일 대 다(one-to-many) 의존성을 가지는 디자인 패턴. \n서로 상호작용을 하는 객체 사이에서는 가능하면 느슨하게 결합(Loose coupling)하는 디자인을 사용해야 한다.","code":"","images":[],"parts":[{"label":"정답","answers":["Observer","Observer Pattern"]}],"explanation":"옵저버(Observer) 패턴은 한 객체(주체)의 상태가 바뀌면 그 객체를 구독하는 여러 객체(옵저버)에게 자동으로 알려 갱신하게 하는 행위 패턴이다. 주체는 옵저버의 구체 클래스를 몰라도 공통 인터페이스로만 통지하므로 둘 사이가 느슨하게 결합된다. 이벤트 리스너, 발행-구독 구조가 이 패턴의 응용이다. 여러 객체 사이에 중재자를 두어 상호작용을 한곳에 모으는 Mediator와 달리, Observer는 「일 대 다 의존」과 「상태 변화 통지」가 핵심이다.","difficulty":"","point":"옵저버 디자인 패턴","unordered":false},{"id":"past-2020-2-11","sourceNumber":11,"bucketLabel":"운영체제","type":"short","language":"","question":"리눅스 커널을 기반으로 동작하며 자바의 코틀린 언어로 개발된, 모바일 기기에 주로 사용되는 오픈소스 플랫폼인 운영체제는 무엇인지 쓰시오.","code":"","images":[],"parts":[{"label":"정답","answers":["안드로이드","Android","안드로이드(Android)"]}],"explanation":"안드로이드(Android)는 리눅스 커널 위에서 동작하는 모바일 기기용 오픈소스 운영체제이며, 구글이 개발을 주도한다. 앱은 주로 자바와 코틀린으로 개발하며 ART 런타임에서 실행된다. 리눅스 커널 기반이 아닌 애플의 iOS와는 커널과 오픈소스 여부로 구분한다. 문제의 「자바의 코틀린 언어로 개발된」은 복원 과정의 어색한 표현으로, 앱을 자바·코틀린으로 개발한다는 뜻으로 보면 된다.","difficulty":"","point":"안드로이드 운영체제","unordered":false},{"id":"past-2020-2-12","sourceNumber":12,"bucketLabel":"SQL","type":"short","language":"","question":"다음 주어진 student 테이블의 name 속성에 idx_name를 인덱스 명으로 하는 인덱스를 생성하는 SQL문을 작성하시오.\n\nidnamegrade\n1111홍길동1\n2222임꺽정2\n3333유관순3\n4444안중근3\n5555홍범도4","code":"","images":[],"parts":[{"label":"정답","answers":["CREATE INDEX idx_name ON student(name);"]}],"explanation":"인덱스 생성 문법은 CREATE INDEX 인덱스명 ON 테이블명(칼럼명);이다. 따라서 student 테이블의 name 칼럼에 idx_name 인덱스를 만들려면 CREATE INDEX idx_name ON student(name);로 쓴다. 중복을 허용하지 않는 인덱스라면 CREATE UNIQUE INDEX로 쓰고, 삭제는 DROP INDEX를 쓴다. 인덱스는 검색 속도를 높이지만 삽입·수정 시 인덱스도 갱신해야 하므로 비용이 늘어난다는 점을 함께 기억한다.","difficulty":"","point":"CREATE INDEX 문"},{"id":"past-2020-2-13","sourceNumber":13,"bucketLabel":"통합·패키징","type":"short","language":"","question":"다음 괄호안에 들어갈 프로토콜의 이름을 적으시오.\n\n(              )은(는) HTTP 등의 프로토콜을 이용하여 XML 기반의 메시지를 교환하는 프로토콜로, Envelope-Header-Body 주요 3요소로 구성된다. (              )은(는) 유사한 기능을 하는 RESTful로 대체될 수 있다.","code":"","images":[],"parts":[{"label":"정답","answers":["SOAP","Simple Object Access Protocol","SOAP(Simple Object Access Protocol)"]}],"explanation":"SOAP(Simple Object Access Protocol)는 HTTP, SMTP 같은 프로토콜 위에서 XML 형식의 메시지를 주고받아 원격 서비스를 호출하는 프로토콜이다. 메시지는 전체를 감싸는 Envelope, 부가 정보를 담는 Header, 실제 내용을 담는 Body로 구성된다. 웹 서비스 구성 요소로는 서비스를 기술하는 WSDL, 서비스를 등록·검색하는 UDDI와 함께 쓰인다. 규격이 무겁고 복잡해, HTTP 메서드와 URI로 자원을 다루는 가벼운 REST(RESTful) 방식으로 많이 대체되었다.","difficulty":"","point":"SOAP 메시지 프로토콜","unordered":false},{"id":"past-2020-2-14","sourceNumber":14,"bucketLabel":"정보 보안","type":"short","language":"","question":"소프트웨어 보안 취약점 중 하나인 SQL Injection에 대해 간략히 설명하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["웹 페이지의 입력값을 통해서 SQL명령어를 주입하여 오동작을 일으키는 해킹방법"]}],"explanation":"SQL 삽입(SQL Injection)은 웹 애플리케이션의 입력값에 악의적인 SQL 구문을 넣어, 데이터베이스가 의도하지 않은 쿼리를 실행하게 만드는 공격이다. 이를 통해 인증을 우회하거나 데이터를 조회·변조·삭제할 수 있다. 채점 포인트는 「입력값(입력 폼·URL)」, 「SQL 구문 삽입」, 「DB 비정상 조작」이다. 대응은 입력값 검증, 바인딩 변수를 쓰는 PreparedStatement 같은 매개변수화 쿼리이며, 스크립트를 삽입해 사용자 브라우저에서 실행시키는 XSS와는 공격 대상(DB 대 브라우저)으로 구분한다.","difficulty":"","point":"SQL Injection 정의"},{"id":"past-2020-2-15","sourceNumber":15,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 사용자 인터페이스 설계 원칙에 대한 설명이다. 괄호안에 들어갈 설계 원칙을 적으시오.\n\nㅇ 직관성: 누구나 쉽게 이해하고 사용할 수 있어야 한다. \nㅇ (        ): 사용자의 목적을 정확하게 달성하여야 한다. \nㅇ 학습성: 누구나 쉽게 배우고 익힐 수 있어야 한다. \nㅇ 유연성: 사용자의 요구사항을 최대한 수용하며, 오류를 최소화하여야 한다.","code":"","images":[],"parts":[{"label":"정답","answers":["유효성"]}],"explanation":"사용자 인터페이스 설계 원칙은 직관성, 유효성, 학습성, 유연성 네 가지이다. 유효성은 사용자가 원하는 목적을 정확하고 완벽하게 달성할 수 있어야 한다는 원칙으로, 빈칸 설명과 일치한다. 직관성은 누구나 쉽게 이해하고 사용, 학습성은 쉽게 배우고 익힘, 유연성은 요구를 최대한 수용하고 오류를 최소화하는 것이다. 「목적 달성」은 유효성, 「쉽게 이해」는 직관성으로 구분한다.","difficulty":"","point":"UI 설계 원칙 유효성"},{"id":"past-2020-2-16","sourceNumber":16,"bucketLabel":"운영체제","type":"short","language":"","question":"리눅스 운영체제에서 현재 디렉터리에 위치한 \"a.txt\"에 아래의 조건대로 권한을 부여하고자 한다. 실행해야 하는 명령어를 적으시오.\n\nㅇ 사용자에게 읽기,쓰기 실행 권한 부여\nㅇ 그룹에게 읽기, 실행 권한 부여\nㅇ 그 외에게 실행 권한 부여\nㅇ 한 줄의 명령어로 작성하며, 아라비안 숫자를 사용하여 8진수 권한으로 부여","code":"","images":[],"parts":[{"label":"정답","answers":["chmod 751 a.txt","chmod 751 ./a.txt"]}],"explanation":"리눅스 권한은 사용자(owner), 그룹(group), 그 외(others) 순으로 각각 읽기 r=4, 쓰기 w=2, 실행 x=1을 더한 8진수 한 자리로 표현한다. 사용자는 읽기·쓰기·실행이므로 4+2+1=7, 그룹은 읽기·실행이므로 4+1=5, 그 외는 실행만이므로 1이다. 따라서 권한값은 751이고 명령은 chmod 751 a.txt이다. 소유자를 바꾸는 chown과 혼동하지 않으며, 기호 방식으로는 rwxr-x--x에 해당한다.","difficulty":"","point":"chmod 8진수 권한 설정","unordered":false},{"id":"past-2020-2-17","sourceNumber":17,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"다음에서 설명하는 용어를 영문 완전 이름(Full-name)으로 적으시오.\n\nㅇ 전세계 오픈된 정보를 하나로 묶는 방식\nㅇ Linked data와 Open data의 합성어\nㅇ URI(Uniform Resource Identifier)를 사용\nㅇ RESTful 방식으로 볼 수 있으며, 링크 기능이 강조된 시멘틱 웹에 속하는 기술","code":"","images":[],"parts":[{"label":"정답","answers":["Linked Open Data"]}],"explanation":"LOD(Linked Open Data)는 누구나 쓸 수 있게 공개된 데이터(Open Data)를 웹에서 서로 연결된 형태(Linked Data)로 발행하는 방식이다. 각 데이터를 URI로 식별하고 RDF 같은 표준 형식으로 표현해 다른 데이터와 링크하므로, 전 세계 데이터를 하나의 거대한 데이터 망처럼 묶을 수 있다. 시맨틱 웹을 실현하는 기반 기술로 분류된다. 문제가 영문 완전 이름을 요구했으므로 약어 LOD가 아니라 Linked Open Data로 써야 한다.","difficulty":"","point":"Linked Open Data"},{"id":"past-2020-2-18","sourceNumber":18,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 데이터베이스 설계(모델링) 과정을 간략히 표현한 것이다. 괄호 안에 들어갈 내용을 순서대로 나열하시오.\n\n요구사항 분석 -> (    ) -> (     ) -> (       ) -> 구현","code":"","images":[],"parts":[{"label":"1","answers":["개념적 설계","개념 설계","개념적"]},{"label":"2","answers":["논리적 설계","논리 설계","논리적"]},{"label":"3","answers":["물리적 설계","물리 설계","물리적"]}],"explanation":"데이터베이스 설계는 요구사항 분석, 개념적 설계, 논리적 설계, 물리적 설계, 구현 순서로 진행한다. 개념적 설계는 요구사항을 E-R 다이어그램 같은 DBMS 독립적인 개념 모델로 표현하는 단계이다. 논리적 설계는 이를 관계형 같은 특정 데이터 모델의 스키마로 바꾸고 정규화를 수행하는 단계이다. 물리적 설계는 특정 DBMS에 맞춰 저장 구조, 인덱스, 접근 경로를 정하는 단계이며, 「DBMS 독립 → 데이터 모델 종속 → DBMS 종속」 흐름으로 순서를 기억한다.","difficulty":"","point":"데이터베이스 설계 순서","unordered":false},{"id":"past-2020-2-19","sourceNumber":19,"bucketLabel":"Java","type":"short","language":"","question":"다음 자바(Java) 프로그램을 실행한 출력 결과를 쓰시오.","code":"class A {\n  int a;\n  public A(int n) {\n      a = n;\n  }\n\n  public void print() {\n    System.out.println(\"a=\" +  a);\n  }\n}\n\nclass B extends A {\n  public B(int n) {\n    super(n);\n    super.print();\n  }\n}\n\npublic class Exam {\n  public static void main(String[] args) {\n    B obj = new B(10);\n  }\n}","images":[],"parts":[{"label":"정답","answers":["a=10"]}],"explanation":"main에서 new B(10)으로 객체를 만들면 B의 생성자가 호출된다. B 생성자의 첫 문장 super(n)이 부모 A의 생성자 A(10)을 호출해 필드 a에 10을 저장한다. 이어서 super.print()가 부모 클래스의 print를 호출해 \"a=\" 문자열과 a 값을 이어 붙인 a=10을 출력한다. obj로 다른 메서드를 호출하지 않으므로 출력은 이 한 줄뿐이며, super()는 부모 생성자, super.메서드()는 부모 메서드 호출이라는 차이를 구분해 둔다.","difficulty":"","point":"Java super 생성자 호출"},{"id":"past-2020-2-20","sourceNumber":20,"bucketLabel":"통합·패키징","type":"short","language":"","question":"다음 보기에서 설명하는 것으로 가장 적절한 것은?\n\n소프트웨어 개발 과정에서 산출물 등의 변경에 대비하기 위해 반드시 필요하다. 소프트웨어 리사이클 기간 동안 개발되는 제품의 무결성을 유지하고 소프트웨어의 식별, 편성 및 수정을 통제하는 프로세스를 제공한다. 실수를 최소화하고 생산성의 최대화가 궁극적인 목적이다. 관련 도구로는 CVS, SVN, Clear Case 등이 있다.","code":"","images":[],"parts":[{"label":"정답","answers":["형상 관리"]}],"explanation":"형상 관리(SCM, Software Configuration Management)는 개발 과정에서 생기는 소스 코드와 문서 등 산출물의 변경을 식별하고 통제하고 기록해 무결성을 유지하는 활동이다. 형상 식별, 형상 통제, 형상 감사, 형상 기록(보고)으로 이루어진다. CVS, SVN, Git, ClearCase 같은 버전 관리 도구가 이를 지원한다. 형상 관리는 변경 전체를 통제하는 관리 활동이고 버전 관리는 그중 이력을 저장하는 기능이라는 점에서 범위가 다르며, 「변경 통제」와 「CVS·SVN」이 핵심 단서이다.","difficulty":"","point":"소프트웨어 형상 관리"}]},{"key":"past-2020-3","name":"2020년 3회 기출","questions":[{"id":"past-2020-3-1","sourceNumber":1,"bucketLabel":"소프트웨어 설계","type":"code","language":"","question":"리팩토링의 목적에 대한 설명을 작성하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["- 소프트웨어를 보다 이해하기 쉽고, 수정하기 쉽도록 개선함\n- 결과의 변경없이 코드의 구조를 재조정하는 것으로 가독성을 높이고, 유지보수를 쉽게하기 위한 목적\n- 코드의 외부 행위는 바꾸지 않고 내부 구조를 개선시켜 소프트웨어를 보다 이해하기 쉽고, 수정하기 쉽도록 만드는 것"]}],"explanation":"리팩토링은 프로그램이 내놓는 결과(외부 동작)는 그대로 두고 내부 코드 구조만 다듬는 작업이다. 목적은 코드를 읽고 이해하기 쉽게 만들고, 이후 기능 추가나 수정을 쉽게 하여 유지보수 비용을 줄이는 데 있다. 중복 코드 제거, 긴 메서드 분리, 의미 있는 이름으로 바꾸기 등이 대표적인 활동이다. 기능을 새로 넣거나 버그를 고치는 것과는 구분되며, 「외부 동작 불변」이 핵심 조건이다. 답안에는 「외부 동작(결과)은 유지」, 「내부 구조 개선」, 「이해·수정 용이성(가독성·유지보수성) 향상」이 들어가야 한다.","difficulty":"","point":"리팩토링의 목적"},{"id":"past-2020-3-2","sourceNumber":2,"bucketLabel":"C 언어","type":"short","language":"","question":"다음의 출력 결과를 쓰시오.","code":"#include <stdio.h>\nvoid main() {\n    int c=0;\n    int i=0;\n        while(i<10) {\n    \ti++;\n        c *= i;\n    }\n    printf(\"%d\", c);\n}","images":[],"parts":[{"label":"정답","answers":["0"]}],"explanation":"c 는 0 으로 시작하고, 반복마다 i 를 1 증가시킨 뒤 c 에 i 를 곱한다. i 가 1, 2, …, 10 이 되는 동안 c 는 0×1, 0×2, … 0×10 으로 계속 0 이다. 0 에 어떤 수를 곱해도 0 이므로 반복이 끝나면 c = 0 이 출력된다. 곱셈 누적 변수를 1 이 아니라 0 으로 초기화했을 때 생기는 전형적인 함정 문제이다.","difficulty":"","point":"C 반복문 곱셈 누적","unordered":false},{"id":"past-2020-3-3","sourceNumber":3,"bucketLabel":"SQL","type":"short","language":"","question":"다음 학생 테이블에서 이름이 민수인 튜플을 삭제하도록 결과를 작성하시오.\n\n- 테이블명: 학생\n- 필드명: 이름","code":"","images":[],"parts":[{"label":"정답","answers":["DELETE FROM 학생 WHERE 이름 = '민수'"]}],"explanation":"튜플(행)을 지우는 DML 은 DELETE 이며 형식은 「DELETE FROM 테이블 WHERE 조건」이다. 학생 테이블에서 이름이 '민수'인 행만 지워야 하므로 WHERE 이름 = '민수' 를 붙인다. 문자열 값은 작은따옴표로 감싼다. WHERE 를 빼면 테이블의 모든 행이 삭제되므로 주의한다. 테이블 자체를 없애는 DROP TABLE, 구조는 남기고 전체 데이터를 비우는 TRUNCATE 와 구분해야 한다.","difficulty":"","point":"SQL DELETE 문"},{"id":"past-2020-3-4","sourceNumber":4,"bucketLabel":"네트워크","type":"short","language":"","question":"TCP/IP에서 신뢰성없는 IP를 대신하여 송신측으로 네트워크의 IP 상태 및 에러 메시지를 전달해주는 프로토콜을 (   )이라 한다.","code":"","images":[],"parts":[{"label":"정답","answers":["ICMP"]}],"explanation":"IP 는 비연결형·비신뢰성 프로토콜이라 전송 중 문제가 생겨도 스스로 알려 주지 않는다. ICMP(Internet Control Message Protocol)는 이를 보완해 목적지 도달 불가, 시간 초과 같은 오류와 네트워크 상태 정보를 송신 측에 전달하는 네트워크 계층 프로토콜이다. ping(Echo Request/Reply)과 traceroute 가 ICMP 를 이용한다. IP 주소를 MAC 주소로 바꾸는 ARP, 멀티캐스트 그룹을 관리하는 IGMP 와 구분한다.","difficulty":"","point":"ICMP 프로토콜"},{"id":"past-2020-3-5","sourceNumber":5,"bucketLabel":"Java","type":"short","language":"","question":"다음의 출력 결과를 쓰시오.","code":"public class Test{\n    public static void main(String []args){\n        int i=0;\n        int sum=0;\n        while (i<10){\n            i++;\n            if(i%2==1)\n              continue;\n        sum += i;\n        }\n    System.out.print(sum);\n    }\n}","images":[],"parts":[{"label":"정답","answers":["30"]}],"explanation":"while 안에서 i 를 먼저 1 증가시키고, i 가 홀수(i%2==1)이면 continue 로 sum 누적을 건너뛴다. 따라서 짝수인 i 만 sum 에 더해진다. i 는 1 부터 10 까지 변하므로 더해지는 값은 2, 4, 6, 8, 10 이다. sum 은 2 → 6 → 12 → 20 → 30 으로 변하고, i 가 10 이 되면 조건 i<10 이 거짓이 되어 종료하며 30 을 출력한다.","difficulty":"","point":"Java continue 짝수 합"},{"id":"past-2020-3-6","sourceNumber":6,"bucketLabel":"네트워크","type":"short","language":"","question":"심리학자 톰 마릴은 컴퓨터가 메시지를 전달하고 메시지가 제대로 도착했는지 확인하며 도착하지 않았을 경우 메시지를 재전송하는 일련의 방법을 '기술적 은어'를 뜻하는 (   )이라는 용어로 정의하였다. (   )안에 들어갈 용어는?","code":"","images":[],"parts":[{"label":"정답","answers":["프로토콜"]}],"explanation":"프로토콜은 통신하는 양쪽이 데이터를 어떻게 주고받을지 미리 정한 규약이다. 문제 설명처럼 메시지 전달, 도착 확인, 미도착 시 재전송 등의 절차를 정의한 것이 프로토콜이며, 원래 외교 의례를 뜻하던 말을 톰 마릴이 컴퓨터 통신에 적용했다. 프로토콜의 기본 요소는 구문(형식), 의미(제어 정보), 타이밍(속도·순서)이다. 특정 프로토콜 이름(TCP 등)이 아니라 일반 용어인 「프로토콜」을 쓰는 것이 답이다.","difficulty":"","point":"프로토콜의 정의"},{"id":"past-2020-3-7","sourceNumber":7,"bucketLabel":"테스트","type":"short","language":"","question":"다음 아래 제어 흐름 그래프가 분기 커버리지를 만족하기 위한 테스팅 순서를 쓰시오.","code":"","images":["imported-images/2020-3-q07-1.png"],"parts":[{"label":"정답","answers":["1234561, 124567","124567, 1234561","1234567, 124561","124561, 1234567"]}],"explanation":"분기 커버리지는 모든 결정 노드의 참과 거짓 분기를 적어도 한 번씩 지나가게 하는 기준이다. 결정 노드는 ②(X>K?)와 ⑥(RESULT>1?) 두 개이다. 한 경로에서 ②의 YES(→③)와 ⑥의 YES(→①로 복귀)를 지나고, 다른 경로에서 ②의 NO(→④)와 ⑥의 NO(→⑦)를 지나면 네 분기를 모두 덮는다. 그래서 1→2→3→4→5→6→1 과 1→2→4→5→6→7 의 두 경로가 답이 되며, 분기 조합을 바꾼 1234567 과 124561 도 같은 기준을 만족한다. 문장(구문) 커버리지는 모든 노드만, 조건 커버리지는 결정 안의 개별 조건식 참·거짓을 기준으로 한다는 점에서 구분된다.","difficulty":"","point":"분기 커버리지 경로","unordered":false},{"id":"past-2020-3-8","sourceNumber":8,"bucketLabel":"SQL","type":"short","language":"","question":"다음 조건을 만족하면서, 과목별 점수의 평균이 90이 상인 과목이름, 최소점수, 최대점수를 구하는 SQL문을 작성하시오.\n\n- 대소문자를 구분하지 않는다.\n- WHERE 구분을 사용하지 않는다.\n- GROUP BY, HAVING구문을 반드시 사용한다.\n- 세미콜론(;)은 생략 가능하다.\n- 별칭(AS)을 사용해야 한다.\n\n[성적]\n\n\n  \n    과목코드\n    과목이름\n    학점\n    점수\n  \n\n\n  \n    1000\n    컴퓨터과학\n    A+\n    95\n  \n  \n    2000\n    운영체제\n    B+\n    85\n  \n  \n    1000\n    컴퓨터과학\n    B+\n    85\n  \n  \n    2000\n    운영체제\n    B\n    80\n  \n\n\n\n[결과]\n\n\n  \n    과목코드\n    과목이름\n    학점\n    점수\n  \n\n\n  \n    1000\n    컴퓨터과학\n    A+\n    95\n  \n  \n    2000\n    운영체제\n    B+\n    85\n  \n  \n    1000\n    컴퓨터과학\n    B+\n    85\n  \n  \n    2000\n    운영체제\n    B\n    80\n  ","code":"","images":[],"parts":[{"label":"정답","answers":["SELECT 과목이름, MIN(점수) AS 최소점수, MAX(점수) AS 최대점수 FROM 성적 GROUP BY 과목이름 HAVING AVG(점수) >= 90;"]}],"explanation":"과목별로 묶어야 하므로 GROUP BY 과목이름 을 쓰고, 묶은 그룹에 대한 조건(평균 90 이상)은 WHERE 가 아니라 HAVING AVG(점수) >= 90 으로 건다. SELECT 절에는 과목이름과 MIN(점수) AS 최소점수, MAX(점수) AS 최대점수 를 둔다. 컴퓨터과학은 점수 95, 85 로 평균 90 이라 조건을 만족해 최소 85, 최대 95 가 나오고, 운영체제는 평균 82.5 라 빠진다. WHERE 는 그룹화 전 개별 행을, HAVING 은 그룹화 후 집계 결과를 거른다는 차이가 핵심이다. 복원 자료의 [결과] 표는 원본 표가 반복되어 있으나, 의도된 결과는 「컴퓨터과학, 85, 95」 한 행이다.","difficulty":"","point":"GROUP BY와 HAVING"},{"id":"past-2020-3-9","sourceNumber":9,"bucketLabel":"SQL","type":"short","language":"","question":"학생 테이블에서 이름이 민수인 튜플을 삭제하는 SQL문을 작성하시오\n\n[학생]\n\n\n  \n    학번\n    이름\n    점수\n    과목이름\n  \n\n\n  \n    1000\n    김정미\n    90\n    알고리즘\n  \n  \n    2000\n    강은미\n    95\n    데이터베이스\n  \n  \n    3000\n    홍길동\n    90\n    전산수학\n  \n  \n    4000\n    민수\n    95\n    운영체제\n  ","code":"","images":[],"parts":[{"label":"정답","answers":["DELETE FROM 학생 WHERE 이름 = '민수';"]}],"explanation":"행을 삭제하는 명령은 DELETE 이고 「DELETE FROM 학생 WHERE 조건」 형태로 쓴다. 이름 컬럼 값이 '민수'인 행만 지워야 하므로 WHERE 이름 = '민수' 를 붙이며, 문자열은 작은따옴표로 감싼다. 실행하면 학번 4000 인 행 하나가 삭제되고 나머지 세 행은 남는다. 테이블 구조까지 없애는 DROP 이나 전체 행을 비우는 TRUNCATE 와 혼동하지 않는다.","difficulty":"","point":"SQL DELETE 문"},{"id":"past-2020-3-10","sourceNumber":10,"bucketLabel":"데이터베이스","type":"short","language":"","question":"릴레이션 A, B가 있을 때 릴레이션 B 조건에 맞는 것들만 릴레이션 A에서 튜플을 꺼내 프로젝션하는 관계대수의 기호는 무엇인가?","code":"","images":[],"parts":[{"label":"정답","answers":["÷"]}],"explanation":"디비전(÷)은 릴레이션 A 가 릴레이션 B 의 모든 튜플 값을 함께 가지고 있는 경우, 그 A 튜플에서 B 의 속성을 뺀 나머지 속성만 뽑아내는 관계대수 연산이다. 「B 의 조건에 맞는 것만 A 에서 꺼내 프로젝션한다」는 설명이 바로 이 동작이다. 실렉트(σ)는 조건에 맞는 행을 고르고, 프로젝트(π)는 열을 고르며, 조인(⋈)은 공통 속성으로 두 릴레이션을 합친다는 점에서 구분된다. 디비전은 순수 관계 연산자 네 가지(σ, π, ⋈, ÷) 중 하나이다.","difficulty":"","point":"관계대수 디비전"},{"id":"past-2020-3-11","sourceNumber":11,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"다음 중 헝가리안 표기법(Hungarian Notation)에 대해서 서술하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["식별자 표기 시 접두어에 자료형을 붙이는 표기법"]}],"explanation":"헝가리안 표기법은 변수·함수 같은 식별자 이름 앞에 자료형이나 용도를 나타내는 접두어를 붙이는 명명 규칙이다. 예를 들어 정수형 개수는 nCount, 문자열은 strName, 포인터는 pBuffer 처럼 쓴다. 이름만 보고도 자료형을 알 수 있다는 장점이 있지만, 자료형이 바뀌면 이름도 고쳐야 하는 단점이 있다. 단어 경계를 대문자로 표시하는 카멜 표기법, 밑줄로 구분하는 스네이크 표기법과는 「자료형 접두어」 유무로 구분된다.","difficulty":"","point":"헝가리안 표기법"},{"id":"past-2020-3-12","sourceNumber":12,"bucketLabel":"테스트","type":"short","language":"","question":"테스트의 종류 중, 동치 분할 테스트, 경계값 분석 테스트 등의 종류가 있는 테스트 기법을 쓰시오.","code":"","images":[],"parts":[{"label":"정답","answers":["블랙박스 테스트","명세 기반 테스트","블랙박스 테스트(명세 기반 테스트)","블랙박스","Black Box Test","Black Box Testing","블랙박스 테스팅"]}],"explanation":"블랙박스 테스트는 내부 코드를 보지 않고 요구사항 명세의 입력과 출력만으로 기능을 검증하는 기법이라 명세 기반 테스트라고도 한다. 동치 분할(입력 범위를 같은 결과를 내는 구간으로 나누어 대표값 선택), 경계값 분석(구간 경계 주변 값 선택), 원인-결과 그래프, 오류 예측, 비교 검사 등이 여기에 속한다. 반면 화이트박스 테스트는 내부 구조를 보고 기초 경로, 조건·분기 커버리지, 루프 검사 등을 수행한다. 동치 분할·경계값은 블랙박스, 커버리지·기초 경로는 화이트박스로 묶어 기억하면 된다.","difficulty":"","point":"블랙박스 테스트 기법","unordered":false},{"id":"past-2020-3-13","sourceNumber":13,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어 소스 코드이다. 출력 결과를 쓰시오.","code":"#include <studio.h>\nint r1(){\n\treturn 4;\n}\nint r10(){\n\treturn (30+r1());\n}\nint r100(){\n\treturn (200+r10());\n}\nint main(){\n\tprintf(\"%dn\", r100());\n    return 0;\n}","images":[],"parts":[{"label":"정답","answers":["234"]}],"explanation":"main 이 r100() 을 호출하면 r100 은 200 + r10() 을 계산하려고 r10 을 호출하고, r10 은 30 + r1() 을 위해 r1 을 호출한다. r1 이 4 를 돌려주면 r10 은 30 + 4 = 34, r100 은 200 + 34 = 234 를 반환한다. 따라서 234 가 출력된다. 복원 코드의 「studio.h」는 stdio.h, 「%dn」은 「%d\\n」의 역슬래시가 빠진 것으로 보고 풀었으며, 줄바꿈은 출력값에 영향이 없다.","difficulty":"","point":"C 함수 중첩 호출"},{"id":"past-2020-3-14","sourceNumber":14,"bucketLabel":"데이터베이스","type":"short","language":"","question":"데이터베이스에서 스키마(Schema)에 대해 간략히 설명하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["데이터베이스의 전체적인 구조와 제약조건에 대한 명세로, 내부 스키마와 개념 스키마, 외부 스키마로 나뉜다."]}],"explanation":"스키마는 데이터베이스에 저장될 데이터의 구조(개체, 속성, 관계)와 제약 조건을 정의한 명세, 즉 데이터베이스의 설계도이다. 관점에 따라 사용자·응용 프로그램이 보는 외부 스키마, 조직 전체의 논리 구조인 개념 스키마, 물리적 저장 방식을 정의한 내부 스키마의 3계층으로 나뉜다. 스키마는 데이터 사전(시스템 카탈로그)에 저장되며 자주 바뀌지 않는다. 특정 시점에 실제로 저장된 값의 집합인 인스턴스와 구분해야 한다. 답안 핵심어는 「구조와 제약 조건에 대한 명세」와 「외부·개념·내부」이다.","difficulty":"","point":"데이터베이스 스키마"},{"id":"past-2020-3-15","sourceNumber":15,"bucketLabel":"Java","type":"short","language":"","question":"다음은 자바(Java) 코드이다. 출력 결과를 쓰시오.","code":"abstract class vehicle{\n    private String name;\n    abstract public String getName(String val);\n    public String getName(){\n    \treturn \"vehicle name:\" + name;\n    }\n\tpublic void setName(String val){\n    \tname = val;\n    }\n}\n\nclass Car extends Vehicle{\n\tpublic Car(String val){\n    \tsetName(val);\n   }\npublic String getName(String val){\n\treturn \"Car name : \" + val;\n   }\npublic String getName(byte val[]){\n\treturn \"Car name : \" + val;\n   }\n}\n\npublic class good {\n\tpublic Static void main(String[] args){\n    Vehicle obj = new Car(\"Spark\");\n    System.out.print(obj.getName());\n    }\n}","images":[],"parts":[{"label":"정답","answers":["vehicle name : Spark"]}],"explanation":"new Car(\"Spark\") 생성 시 Car 생성자가 부모의 setName(\"Spark\") 을 호출해 private 필드 name 에 \"Spark\" 가 저장된다. obj 는 Vehicle 타입이지만 인자 없는 getName() 을 호출했으므로, Car 에 정의된 getName(String)·getName(byte[]) 이 아니라 Vehicle 의 getName() 이 실행된다. 이 메서드는 \"vehicle name:\" 과 name 을 이어 붙여 반환하므로 결과는 vehicle name 뒤에 Spark 가 붙은 문자열이다. Car 의 두 getName 은 매개변수가 달라 오버라이딩이 아니라 오버로딩이며, 인자 없는 호출과는 무관하다는 점이 핵심이다. 복원 코드의 vehicle/Vehicle 대소문자, Static 표기는 오타로 보고 풀었다. 주어진 코드를 그대로 실행하면 콜론 앞뒤 공백 없이 「vehicle name:Spark」가 출력되어, 저장된 답의 공백 표기와 다르다.","difficulty":"","point":"Java 오버로딩과 상속"},{"id":"past-2020-3-16","sourceNumber":16,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"UI 설계 원칙 중 직관성에 대해 설명하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["누구나 쉽게 이해하고, 쉽게 사용할 수 있어야 한다는 원칙"]}],"explanation":"UI 설계 원칙의 직관성은 사용자가 별도 학습 없이도 화면을 보고 바로 이해하고 쉽게 사용할 수 있어야 한다는 원칙이다. 익숙한 아이콘, 일관된 배치, 명확한 용어를 쓰는 것이 직관성을 높이는 방법이다. 함께 묻는 원칙으로 유효성(사용자 목적을 정확히 달성), 학습성(누구나 쉽게 배우고 익힘), 유연성(사용자 요구를 최대한 수용하고 실수를 방지)이 있다. 직관성은 「쉽게 이해·사용」, 학습성은 「쉽게 배움」이라는 점으로 구분한다.","difficulty":"","point":"UI 설계 원칙 직관성"},{"id":"past-2020-3-17","sourceNumber":17,"bucketLabel":"Java","type":"short","language":"","question":"다음은 자바(Java) 코드이다. 출력 결과를 쓰시오.","code":"public class Test{\n    public static void main(String []args){\n        int i=0;\n        int sum=0;\n        while (i＜10){\n            i++;\n            if(i%2==1)\n              continue;\n        sum += i;\n        }\n    System.out.print(sum);\n    }\n}","images":[],"parts":[{"label":"정답","answers":["30"]}],"explanation":"i 를 먼저 1 증가시킨 뒤 i 가 홀수이면 continue 로 아래 sum += i 를 건너뛰므로 짝수만 더해진다. i 는 1 부터 10 까지 변하고, 더해지는 값은 2, 4, 6, 8, 10 이다. sum 은 2, 6, 12, 20, 30 순으로 늘어나며, i 가 10 이 된 뒤 조건 i<10 이 거짓이 되어 반복을 마치고 30 을 출력한다. 복원 코드의 전각 부등호(＜)는 일반 < 로 보고 풀었다.","difficulty":"","point":"Java continue 짝수 합"},{"id":"past-2020-3-18","sourceNumber":18,"bucketLabel":"통합·패키징","type":"short","language":"","question":"EAI 유형에는 메세지 버스(Message bus) 유형, 하이브리드(Hybrid) 유형, ( A ) 유형, ( B ) 유형이 있다. 괄호안에 들어갈 말을 적으시오.","code":"","images":[],"parts":[{"label":"A","answers":["포인트 투 포인트","Point-to-point","포인트 투 포인트(Point-to-point)"]},{"label":"B","answers":["허브 앤 스포크","Hub & Spoke","Hub and Spoke","허브 앤 스포크(Hub & Spoke)"]}],"explanation":"EAI(기업 애플리케이션 통합)의 구축 유형은 네 가지이다. 포인트 투 포인트는 애플리케이션끼리 1:1 로 직접 연결하는 방식으로 단순하지만 연결이 늘면 관리가 어렵고 재사용이 어렵다. 허브 앤 스포크는 중앙 허브를 거쳐 연결하는 방식으로 관리가 쉽지만 허브 장애가 전체 장애로 이어진다. 메시지 버스는 애플리케이션 사이에 미들웨어(버스)를 두어 확장성이 좋고, 하이브리드는 그룹 내부는 허브 앤 스포크, 그룹 간은 메시지 버스를 쓰는 혼합형이다. 문제에서 메시지 버스와 하이브리드가 주어졌으므로 나머지 둘이 답이다.","difficulty":"","point":"EAI 구축 유형","unordered":true},{"id":"past-2020-3-19","sourceNumber":19,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"C++에서 생성자란 무엇인지 쓰시오.","code":"","images":[],"parts":[{"label":"정답","answers":["해당 클래스의 객체가 생성될 때 자동으로 호출되는 특수한 종류의 메서드"]}],"explanation":"생성자는 클래스의 객체가 만들어질 때 자동으로 호출되어 멤버 변수 초기화 등 준비 작업을 하는 특수한 멤버 함수이다. C++ 에서는 클래스 이름과 같은 이름을 쓰고 반환형을 적지 않으며, 매개변수를 달리해 여러 개를 오버로딩할 수 있다. 정의하지 않으면 컴파일러가 기본 생성자를 만들어 준다. 객체가 소멸될 때 자동 호출되어 자원을 정리하는 소멸자(~클래스명)와 구분된다. 답안 핵심어는 「객체 생성 시 자동 호출」과 「초기화」이다.","difficulty":"","point":"C++ 생성자"},{"id":"past-2020-3-20","sourceNumber":20,"bucketLabel":"SQL","type":"short","language":"","question":"학생 테이블에 주소 속성을 추가하는 SQL문을 작성하려고 한다. 빈 칸을 채우시오.\n\n(    A    ) TABLE 학생   (   B   ) 주소 VARCHAR(20);","code":"","images":[],"parts":[{"label":"A","answers":["ALTER"]},{"label":"B","answers":["ADD"]}],"explanation":"이미 만들어진 테이블의 구조를 바꾸는 DDL 은 ALTER TABLE 이다. 새 속성(열)을 추가할 때는 ADD, 기존 열 정의를 바꿀 때는 MODIFY(DBMS 에 따라 ALTER COLUMN), 열을 지울 때는 DROP 을 쓴다. 따라서 「ALTER TABLE 학생 ADD 주소 VARCHAR(20);」이 완성된 문장이다. 데이터 값을 바꾸는 DML 인 UPDATE 와 혼동하지 않아야 한다.","difficulty":"","point":"ALTER TABLE ADD","unordered":false}]},{"key":"past-2020-4","name":"2020년 4회 기출","questions":[{"id":"past-2020-4-1","sourceNumber":1,"bucketLabel":"네트워크","type":"short","language":"","question":"현재 IPv4의 확장형으로 IPv4가 가지고 있는 주소 고갈, 보안성, 이동성 지원 등의 문제점을 해결하기 위해서 개발된 128비트 주소체계를 갖는 차세대 인터넷 프로콜은 무엇인가?","code":"","images":[],"parts":[{"label":"정답","answers":["IPv6"]}],"explanation":"IPv6 는 32비트 IPv4 의 주소 고갈 문제를 해결하려고 만든 128비트 주소 체계의 차세대 인터넷 프로토콜이다. 16비트씩 8부분으로 나누어 16진수와 콜론(:)으로 표기한다. IPsec 기반 보안 기능, 이동성 지원, 단순화된 고정 길이 헤더, 자동 주소 설정 등이 특징이다. 주소 유형은 유니캐스트, 멀티캐스트, 애니캐스트이며 IPv4 의 브로드캐스트는 없다는 점도 함께 구분해 둔다.","difficulty":"","point":"IPv6 특징"},{"id":"past-2020-4-2","sourceNumber":2,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"목적에 따른 디자인 패턴의 유형에는 생성(Creational) 패턴, 구조(Structural) 패턴, (   괄호   ) 패턴이 있다. 괄호에 들어갈 알맞은 패턴 유형을 쓰시오.","code":"","images":[],"parts":[{"label":"정답","answers":["행위","행위(Behavioral)","Behavioral","행위 패턴","Behavioral Pattern"]}],"explanation":"GoF 디자인 패턴은 목적에 따라 생성, 구조, 행위의 세 가지로 나뉜다. 생성 패턴은 객체 생성 방식을 다루고(싱글톤, 팩토리 메서드, 빌더 등), 구조 패턴은 클래스·객체를 조합해 더 큰 구조를 만든다(어댑터, 컴포지트, 프록시 등). 행위 패턴은 객체 간 책임 분배와 상호작용 방식을 다룬다(옵서버, 전략, 커맨드, 반복자 등). 따라서 빈칸은 행위(Behavioral) 패턴이다.","difficulty":"","point":"디자인 패턴 분류","unordered":false},{"id":"past-2020-4-3","sourceNumber":3,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 어떤 UML 다이어그램에 관한 예시이다. 어떤 종류의 다이어그램인가?","code":"","images":["imported-images/2020-4-q03-1.png"],"parts":[{"label":"정답","answers":["패키지 다이어그램"]}],"explanation":"그림은 「쇼핑몰」, 「인터넷서점」, 「인터넷의류」, 「영화예매」처럼 탭이 달린 폴더 모양 기호로 요소들을 묶고, 묶음 사이를 점선 화살표(의존 관계)로 연결하고 있다. 이렇게 관련 있는 요소들을 패키지로 그룹화하고 패키지 간 의존 관계를 보여 주는 것이 패키지 다이어그램이다. 패키지 다이어그램은 클래스·컴포넌트 다이어그램과 같은 구조(정적) 다이어그램에 속한다. 사각형 안에 속성·연산을 적는 클래스 다이어그램, 실행 모듈과 인터페이스를 표현하는 컴포넌트 다이어그램과 구분된다.","difficulty":"","point":"UML 패키지 다이어그램"},{"id":"past-2020-4-4","sourceNumber":4,"bucketLabel":"데이터베이스","type":"short","language":"","question":"데이터베이스의 회복(Recovery) 기법 중 Rollback 시 Redo, Undo가 모두 실행되는 트랜잭션 처리법으로 트랜잭션 수행 중 갱신 결과를 바로 DB에 반영하는 기법은 무엇인가?","code":"","images":[],"parts":[{"label":"정답","answers":["즉시 갱신 회복 기법","즉시갱신 회복 기법(Immediate Update)","즉시 갱신 기법","즉시 갱신","Immediate Update"]}],"explanation":"즉시 갱신 기법은 트랜잭션이 끝나기 전이라도 갱신 내용을 곧바로 데이터베이스에 반영하고, 그 내용을 로그에 함께 기록한다. 그래서 장애가 나면 완료(commit)된 트랜잭션은 Redo 로 다시 반영하고, 완료되지 않은 트랜잭션은 이미 반영된 변경을 Undo 로 되돌려야 하므로 둘 다 필요하다. 지연 갱신 기법은 commit 전까지 DB 에 반영하지 않으므로 Undo 가 필요 없고 Redo 만 수행한다는 점에서 구분된다. 이 밖에 체크포인트 기법, 그림자 페이징 기법(로그 없이 Undo 불필요)도 회복 기법에 속한다.","difficulty":"","point":"즉시 갱신 회복 기법","unordered":false},{"id":"past-2020-4-5","sourceNumber":5,"bucketLabel":"Java","type":"short","language":"","question":"다음은 n이 10일 때, 10을 2진수로 변환하는 자바 소스 코드이다. A, B 괄호 안에 알맞은 값을 적으시오.","code":"class good {\n    public static void main (String[] args) {\n    \tint[]a = new int[8];\n        int i=0; int n=10;\n        while (   괄호 A    ) {\n          a[i++] = (    괄호 B    );\n          n /= 2;\n       }\n      for(i=7; i>=0; i--){\n          System.out.print(a[i]);\n      }\n   }\n}","images":[],"parts":[{"label":"A","answers":["n > 0","n >= 1","i < 8","i <= 7"]},{"label":"B","answers":["n % 2","n & 1"]}],"explanation":"10진수를 2진수로 바꾸려면 2 로 나눈 나머지를 차례로 구하고 몫으로 계속 나누면 된다. 그래서 (B)는 나머지 n%2(또는 마지막 비트를 꺼내는 n&1), (A)는 몫이 남아 있는 동안 반복하는 n>0 이다. n=10 일 때 a[0]=0(n→5), a[1]=1(n→2), a[2]=0(n→1), a[3]=1(n→0)이 저장되고 n 이 0 이 되어 반복이 끝난다. 이후 for 문이 a[7] 부터 a[0] 까지 거꾸로 출력하므로 00001010 이 찍힌다. (A)를 i<8 로 써도 8칸을 채우는 동안 n 이 0 이 된 뒤에는 0 만 저장되므로 같은 결과가 나온다.","difficulty":"","point":"Java 10진수 2진 변환","unordered":false},{"id":"past-2020-4-6","sourceNumber":6,"bucketLabel":"Java","type":"short","language":"","question":"다음은 자바 소스 코드이다. 출력 결과를 보고 괄호 A, B에 알맞은 값을 적으시오.","code":"public class good {\n    public static void main(String[] args) {\n    int[][]a = new int[( 괄호A )][( 괄호B )];\n    for(int i = 0; i < 3; i++){\n        for(int j=0; j < 5; j++){\n        a[i][j] = j*3+(i+1);\n        System.out.print(a[i][j]+\"\");\n      }\n      System.out.println();\n      }\n   }\n} ","images":[],"parts":[{"label":"A","answers":["3"]},{"label":"B","answers":["5"]}],"explanation":"바깥 for 문은 i 를 0~2(3번), 안쪽 for 문은 j 를 0~4(5번) 돌며 a[i][j] 에 값을 넣으므로, 배열은 행 3개·열 5개가 필요해 new int[3][5] 가 된다. 각 원소 값은 j*3+(i+1) 이므로 i=0 행은 1, 4, 7, 10, 13, i=1 행은 2, 5, 8, 11, 14, i=2 행은 3, 6, 9, 12, 15 이다. 원소 사이에 빈 문자열을 붙여 출력하므로 각 행은 1471013, 2581114, 3691215 처럼 붙어서 찍히고 행마다 줄바꿈된다. 크기를 이보다 작게 잡으면 ArrayIndexOutOfBoundsException 이 발생한다.","difficulty":"","point":"Java 2차원 배열 크기","unordered":false},{"id":"past-2020-4-7","sourceNumber":7,"bucketLabel":"정보 보안","type":"short","language":"","question":"해킹 공격의 종류 중 하나인 스니핑(Sniffing)에 대하여 설명하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["네트워크상에 흘러다니는 트래픽을 훔쳐보는 행위. 주로 자신에게 와야할 정보가 아닌 정보를 자신이 받도록 조작하는 행위"]}],"explanation":"스니핑(Sniffing)은 「냄새를 맡다」는 뜻처럼, 네트워크를 지나가는 패킷을 몰래 엿들어 계정·비밀번호 같은 정보를 가로채는 수동적 공격이다. 랜 카드를 무차별 모드(Promiscuous Mode)로 두면 자신에게 오지 않은 패킷도 받아 볼 수 있고, 스위치 환경에서는 ARP 스푸핑 등으로 트래픽을 자기 쪽으로 오게 만든다. 데이터를 위조하거나 신원을 속이는 스푸핑(능동적 공격)과 달리 스니핑은 「도청」이 핵심이다. 대응책으로는 전송 구간 암호화(SSL/TLS, SSH 등)가 있다.","difficulty":"","point":"스니핑 공격"},{"id":"past-2020-4-8","sourceNumber":8,"bucketLabel":"네트워크","type":"short","language":"","question":"IP 패킷에서 외부의 공인 IP주소와 포트 주소에 해당하는 내부 IP주소를 재기록하여 라우터를 통해 네트워크 트래픽을 주고받는 기술을 무엇이라고 하는가?","code":"","images":[],"parts":[{"label":"정답","answers":["NAT","NAT(Network Address Translation)","Network Address Translation","네트워크 주소 변환"]}],"explanation":"NAT(Network Address Translation)는 사설 IP 와 공인 IP 를 서로 바꿔 주는 주소 변환 기술이다. 내부 호스트가 밖으로 나갈 때 라우터가 출발지 사설 IP·포트를 공인 IP·포트로 바꾸고, 응답이 돌아오면 변환표를 보고 다시 내부 주소로 재기록한다. 이를 통해 적은 공인 IP 로 여러 내부 호스트가 인터넷을 쓸 수 있고, 내부 주소가 외부에 드러나지 않아 보안에도 도움이 된다. 포트까지 함께 바꾸는 방식을 PAT(NAPT)라고 하며, 주소를 자동 할당하는 DHCP 와는 역할이 다르다.","difficulty":"","point":"NAT 주소 변환","unordered":false},{"id":"past-2020-4-9","sourceNumber":9,"bucketLabel":"Python","type":"code","language":"","question":"다음은 파이썬 소스 코드이다. 출력 결과를 쓰시오.\n\nlol = [[1,2,3],[4,5],[6,7,8,9]]\nprint(lol[0])\nprint(lol[2][1])\nfor sub in lol:\n    for item in sub:\n        print(item, end = '')\n    print()","code":"","images":[],"parts":[{"label":"정답","answers":["[1, 2, 3]\n7\n123\n45\n6789"]}],"explanation":"lol 은 길이가 다른 리스트 세 개를 담은 2차원 리스트이다. print(lol[0]) 은 첫 번째 리스트를 리스트 형식 그대로 [1, 2, 3] 으로 출력한다. lol[2][1] 은 세 번째 리스트 [6,7,8,9] 의 두 번째 원소이므로 7 이다. 이중 for 문은 각 하위 리스트의 원소를 end='' 로 공백 없이 이어 찍고, 하위 리스트가 끝날 때마다 print() 로 줄을 바꾼다. 그래서 이어서 123, 45, 6789 가 한 줄씩 출력된다.","difficulty":"","point":"Python 2차원 리스트"},{"id":"past-2020-4-10","sourceNumber":10,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"분산 컴퓨팅 기술 기반의  데이터 위변조 방지 기술로 P2P방식을 기반으로 하여 소규모 데이터들이 연결되어 형성된 '블록'이라는 분산 데이터 저장 환경에 관리 대상 데이터를 저장함으로써 누구도 임의로 수정할 수 없고 누구나 변경의 결과를 열람할 수 있게끔 만드는 기술은 무엇인가?","code":"","images":[],"parts":[{"label":"정답","answers":["블록체인"]}],"explanation":"블록체인은 거래 데이터를 묶은 블록을 이전 블록의 해시값과 연결해 체인 형태로 만들고, 이를 P2P 네트워크의 여러 참여자가 나누어 보관하는 분산 원장 기술이다. 한 블록을 고치면 뒤따르는 모든 블록의 해시가 어긋나고 다른 참여자의 사본과도 달라지므로 임의 수정이 사실상 불가능하다. 동시에 원장이 공유되므로 누구나 변경 기록을 열람할 수 있다. 중앙 서버 없이 「위변조 방지」와 「투명한 열람」을 동시에 제공한다는 점이 핵심이다.","difficulty":"","point":"블록체인"},{"id":"past-2020-4-11","sourceNumber":11,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"오픈 소스 기반으로 한 분산 컴퓨팅 플랫폼으로, 일반 PC급 컴퓨터들로 가상화된 대형 스토리지를 형성하고 그 안에 보관된 거대한 데이터 세트를 병렬로 처리할 수 있도록 개발된 자바 소프트웨어 프레임워크로 구글, 야후 등에 적용한 기술은 무엇인가?","code":"","images":[],"parts":[{"label":"정답","answers":["하둡","하둡(Hadoop)","Hadoop"]}],"explanation":"하둡(Hadoop)은 일반 PC 급 서버 여러 대를 묶어 하나의 대용량 저장소처럼 쓰고, 그 안의 거대한 데이터를 병렬로 처리하는 오픈 소스 자바 기반 분산 처리 프레임워크이다. 데이터를 나누어 여러 노드에 복제 저장하는 분산 파일 시스템 HDFS 와, 작업을 나누어 처리한 뒤 합치는 맵리듀스(MapReduce)가 핵심 구성 요소이다. 정형 데이터를 하둡으로 옮기는 스쿱(Sqoop), 비정형 데이터를 수집하는 척와·플럼 같은 주변 도구와 구분해 둔다. 빅데이터 처리 플랫폼의 대표 예로 자주 출제된다.","difficulty":"","point":"하둡 분산 처리","unordered":false},{"id":"past-2020-4-12","sourceNumber":12,"bucketLabel":"데이터베이스","type":"short","language":"","question":"데이터베이스 이상 현상(Anomaly)의 종류 3가지를 쓰시오.","code":"","images":[],"parts":[{"label":"1","answers":["삽입 이상","삽입 이상(Insertion Anomaly)","Insertion Anomaly","삽입"]},{"label":"2","answers":["삭제 이상","삭제 이상(Delete Anomaly)","Delete Anomaly","Deletion Anomaly","삭제"]},{"label":"3","answers":["갱신 이상","갱신 이상(Update Anomaly)","Update Anomaly","수정 이상","Modification Anomaly","갱신"]}],"explanation":"이상 현상은 정규화가 덜 된 릴레이션에 데이터 중복이 있어 조작할 때 생기는 부작용이다. 삽입 이상은 원하지 않는 값까지 함께 넣어야만 데이터를 삽입할 수 있는 현상이다. 삭제 이상은 한 튜플을 지울 때 보존해야 할 다른 정보까지 함께 지워지는 연쇄 삭제 현상이다. 갱신 이상은 중복된 값 중 일부만 수정되어 데이터가 서로 불일치하게 되는 현상이다. 이 세 가지를 없애기 위해 함수 종속을 기준으로 릴레이션을 분해하는 것이 정규화이다.","difficulty":"","point":"데이터베이스 이상 현상","unordered":true},{"id":"past-2020-4-13","sourceNumber":13,"bucketLabel":"운영체제","type":"short","language":"","question":"다음은 프로세스 상태 전이도이다. 1, 2, 3에 알맞은 상태를 쓰시오.","code":"","images":["imported-images/2020-4-q13-1.png"],"parts":[{"label":"①","answers":["준비","준비(Ready)","Ready","준비 상태"]},{"label":"②","answers":["실행","실행(Run)","Run","Running","실행 상태"]},{"label":"③","answers":["대기","대기(Wait)","Wait","Waiting","Block","Blocked","대기 상태"]}],"explanation":"생성된 프로세스는 먼저 CPU 를 기다리는 준비(Ready) 상태로 들어가므로 ①은 준비이다. 준비 상태에서 디스패치되어 CPU 를 할당받으면 실행(Run) 상태가 되므로 ②는 실행이며, 실행 중 할당 시간이 끝나면(Timer Runout) 다시 준비로 돌아가고 작업을 마치면 종료된다. 실행 중 입출력 등 사건을 기다려야 하면 대기(Wait, Block) 상태로 가므로 ③은 대기이고, 사건이 끝나면 Wake Up 으로 준비 상태에 복귀한다. 대기에서 곧바로 실행으로 가지 않고 반드시 준비를 거친다는 점이 핵심이다.","difficulty":"","point":"프로세스 상태 전이","unordered":false},{"id":"past-2020-4-14","sourceNumber":14,"bucketLabel":"테스트","type":"short","language":"","question":"테스트 오라클 중 특정한 몇 개의 입력값에 대해서만 기대하는 결과를 제공해주는 오라클은 무엇인가?","code":"","images":[],"parts":[{"label":"정답","answers":["샘플링 오라클"]}],"explanation":"테스트 오라클은 테스트 결과가 맞는지 판단하는 기준(기대값)이다. 샘플링 오라클은 특정 몇 개의 입력값에 대해서만 기대 결과를 제공하는 오라클로, 나머지 입력에 대해서는 검증하지 않는다. 모든 입력에 대해 기대 결과를 제공하는 참(True) 오라클, 특정 입력에는 정확한 값을 주고 나머지는 추정(휴리스틱)으로 판단하는 추정 오라클, 결과가 일관되게 유지되는지를 이전 결과와 비교해 보는 일관성 검사 오라클과 구분된다. 「특정한 몇 개 입력만」이라는 표현이 샘플링 오라클의 핵심어이다.","difficulty":"","point":"테스트 오라클 종류"},{"id":"past-2020-4-15","sourceNumber":15,"bucketLabel":"테스트","type":"short","language":"","question":"점수에 따른 성적 부여가 잘 되었는지 테스트하고자 한다. 아래에 알맞는 테스트 기법은 무엇인가?\n\n  \n    점수\n    성적\n  \n\n\n  \n    0 ~ 59\n    가\n  \n  \n    60 ~ 69\n    양\n  \n  \n    70 ~ 79\n    미\n  \n  \n    80 ~ 89\n    우\n  \n  \n    90 ~ 100\n    수\n  \n\n\n[테스트 값] : -10점 / 30점 / 65점 / 75점 / 85점 / 95점 / 110점","code":"","images":[],"parts":[{"label":"정답","answers":["동치 분할 테스트"]}],"explanation":"동치 분할 테스트는 입력 범위를 같은 결과를 내는 구간(동치 클래스)으로 나누고, 각 구간에서 대표값을 하나씩 골라 검사하는 블랙박스 기법이다. 문제의 테스트 값은 -10(유효 범위 미만), 30(가), 65(양), 75(미), 85(우), 95(수), 110(범위 초과)처럼 각 구간 안쪽의 대표값이다. 경계값 분석이라면 59, 60, 69, 70 처럼 구간 경계와 그 바로 앞뒤 값을 골랐을 것이다. 값이 구간의 경계가 아니라 「구간마다 하나씩」 고른 대표값이라는 점이 동치 분할로 판단하는 근거이다.","difficulty":"","point":"동치 분할 테스트"},{"id":"past-2020-4-16","sourceNumber":16,"bucketLabel":"SQL","type":"short","language":"","question":"다음 조건을 만족하면서 학과별로 튜플 수가 얼마인지 구하는 SQL문을 작성하시오.\n\n- WHERE 구문을 사용하지 않는다.\n- GROUP BY 를 사용한다.\n- 별칭(AS)을 사용한다.\n- 집계 함수를 사용한다.\n\n[학생]\n\n\n  \n    학과\n    학생\n  \n\n\n  \n    전기\n    이순신\n  \n  \n    컴퓨터\n    안중근\n  \n  \n    컴퓨터\n    윤봉길\n  \n  \n    전자\n    이봉창\n  \n  \n    전자\n    강우규\n  \n\n\n\n[결과]\n\n\n  \n    학과\n    학과별튜플수\n  \n\n\n  \n    전기\n    1\n  \n  \n    컴퓨터\n    2\n  \n  \n    전자\n    2\n  ","code":"","images":[],"parts":[{"label":"정답","answers":["SELECT 학과, COUNT(학과) AS 학과별튜플수 FROM 학생 GROUP BY 학과;"]}],"explanation":"학과별 튜플 수를 구하려면 GROUP BY 학과 로 같은 학과끼리 묶고, 각 그룹의 행 개수를 COUNT 집계 함수로 센다. 결과 열 이름이 「학과별튜플수」이므로 COUNT(학과) AS 학과별튜플수 처럼 별칭을 붙인다. COUNT(*) 를 써도 NULL 이 없으므로 같은 결과이다. 실행하면 전기 1, 컴퓨터 2, 전자 2 가 나온다. 그룹 조건이 없으므로 HAVING 은 필요 없고, 결과 행 순서는 ORDER BY 가 없으면 DBMS 에 따라 달라질 수 있다.","difficulty":"","point":"GROUP BY와 COUNT"},{"id":"past-2020-4-17","sourceNumber":17,"bucketLabel":"운영체제","type":"short","language":"","question":"데니스 리치와 켄톰슨 등이 함께 벨 연구소를 통해 만든 운영체제이며, 90% 이상 C언어로 구현되어 있고, 시스템 프로그램이 모듈화되어 있어서 다른 하드웨어 기종으로 쉽게 이식 가능하며 계층적 트리 구조를 가짐으로써 통합적인 파일 관리가 용이한 운영체제는 무엇인가?","code":"","images":[],"parts":[{"label":"정답","answers":["유닉스","유닉스(UNIX)","UNIX"]}],"explanation":"유닉스(UNIX)는 벨 연구소에서 켄 톰슨과 데니스 리치 등이 개발한 운영체제로, 대부분이 C 언어로 작성되어 이식성이 높다. 커널, 셸, 유틸리티로 구성되며 시스템 프로그램이 모듈화되어 있고, 루트(/)부터 시작하는 계층적 트리 구조 파일 시스템을 쓴다. 다중 사용자·다중 작업(멀티태스킹)을 지원한다는 점도 특징이다. 리눅스는 유닉스를 바탕으로 리누스 토르발스가 만든 공개 운영체제라는 점에서 구분된다.","difficulty":"","point":"유닉스 운영체제 특징","unordered":false},{"id":"past-2020-4-18","sourceNumber":18,"bucketLabel":"C 언어","type":"code","language":"","question":"다음은 C언어 소스 코드이다. 출력 값을 쓰시오.","code":"#include \n\nint main() {\n   char *p = \"KOREA\";\n   printf(\"%sn\", p);\n   printf(\"%sn\", p + 3);\n   printf(\"%cn\", *p);\n   printf(\"%cn\", *(p + 3));\n   printf(\"%cn\", *p + 2);\n   return 0;\n}","images":[],"parts":[{"label":"정답","answers":["KOREA\nEA\nK\nE\nM"]}],"explanation":"p 는 문자열 \"KOREA\" 의 첫 글자를 가리키는 포인터이다. %s 로 p 를 출력하면 널 문자 전까지 KOREA, p+3 은 네 번째 글자부터라 EA 가 출력된다. %c 로 *p 는 첫 글자 K, *(p+3) 은 네 번째 글자 E 이다. *p+2 는 괄호가 없어 역참조가 먼저 일어나므로 'K' 의 문자 코드(75)에 2 를 더한 77, 즉 M 이 출력된다. *(p+2) 였다면 R 이 되므로 괄호 위치를 구분하는 것이 핵심이다. 복원 코드의 「%sn」, 「%cn」은 「\\n」에서 역슬래시가 빠진 것으로 보고 한 줄씩 출력된다고 풀었다.","difficulty":"","point":"C 포인터와 문자열"},{"id":"past-2020-4-19","sourceNumber":19,"bucketLabel":"Java","type":"short","language":"","question":"다음은 자바(Java) 소스 코드이다. 출력 결과를 쓰시오.","code":"class Parent {\n  public int compute(int num){\n    if(num <=1) return num;\n    return compute(num-1) + compute(num-2);\n  }\n}\n\nclass Child extends Parent {\n  public int compute(int num){\n    if(num<=1) return num;\n    return compute(num-1) + compute(num-3);\n  }\n}\n\nclass Good {\n  public static void main (String[] args){\n    parent obj = new Child();\n    System.out.print(obj.compute(4));\n  }\n}","images":[],"parts":[{"label":"정답","answers":["1"]}],"explanation":"obj 는 Parent 타입이지만 실제 객체는 Child 이므로, 동적 바인딩에 의해 compute 는 재귀 호출까지 모두 Child 의 compute(num-1) + compute(num-3) 이 실행된다. num 이 1 이하이면 num 을 그대로 반환하므로 c(1)=1, c(0)=0, c(-1)=-1 이다. c(2)=c(1)+c(-1)=1+(-1)=0, c(3)=c(2)+c(0)=0+0=0, c(4)=c(3)+c(1)=0+1=1 이 되어 1 이 출력된다. Parent 의 피보나치식 compute 로 계산하면 3 이 나오지만, 오버라이딩된 Child 메서드가 쓰인다는 점이 함정이다. 복원 코드의 「parent obj」는 Parent 의 오타로 보고 풀었다.","difficulty":"","point":"Java 오버라이딩 재귀"},{"id":"past-2020-4-20","sourceNumber":20,"bucketLabel":"정보 보안","type":"short","language":"","question":"정보 보안의 3요소 중 가용성(Availability)에 대하여 설명하시오.","code":"","images":[],"parts":[{"label":"정답","answers":["인가된 사용자는 원할 때 정보에 접근이 가능해야 함"]}],"explanation":"가용성은 권한을 가진 사용자가 필요할 때 언제든 정보와 시스템에 접근해 사용할 수 있어야 한다는 보안 요소이다. 서비스 거부(DoS) 공격은 이 가용성을 해치는 대표적 위협이며, 백업·이중화·장애 대비가 대응 수단이다. 기밀성은 인가된 사용자만 정보에 접근할 수 있게 하는 것, 무결성은 인가된 사용자만 정보를 정해진 방식으로 수정할 수 있게 하는 것이라는 점에서 구분된다. 답안 핵심어는 「인가된 사용자」와 「원할 때 언제든 사용 가능」이다.","difficulty":"","point":"정보 보안 가용성"}]},{"key":"past-2021-1","name":"2021년 1회 기출","questions":[{"id":"past-2021-1-1","sourceNumber":1,"bucketLabel":"네트워크","type":"short","language":"","question":"물리 네트워크(MAC) 주소에 해당하는 IP 주소를 알려주는 프로토콜로 역순 주소 결정 프로토콜을 무엇이라고 하는지 쓰시오.","code":"","images":[],"parts":[{"label":"정답","answers":["RARP","RARP(역주소해석프로토콜)","역주소해석프로토콜","Reverse Address Resolution Protocol"]}],"explanation":"RARP(Reverse Address Resolution Protocol)는 자신의 MAC 주소는 알지만 IP 주소를 모르는 호스트가 네트워크에 MAC 주소를 알리고 그에 대응하는 IP 주소를 받아 오는 프로토콜이다. 디스크가 없는 단말이 부팅할 때 자기 IP를 얻는 용도로 쓰였다. ARP는 반대로 IP 주소를 알고 있을 때 그 IP에 해당하는 MAC 주소를 알아내는 프로토콜이다. 문제에서 'MAC 주소에 해당하는 IP 주소', '역순 주소 결정'이라는 표현이 곧 RARP를 가리킨다.","difficulty":"","point":"RARP와 ARP 구분","unordered":false},{"id":"past-2021-1-2","sourceNumber":2,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 DB 설계 절차에 관한 설명이다. 다음 빈칸에 들어갈 알맞은 용어를 쓰시오.\n\n(   A   )은/는 특정 DBMS의 특성 및 성능을 고려하여 데이터베이스 저장 구조로 변환하는 과정으로 결과로 나오는 명세서는 테이블 정의서 등이 있다.\n\n(   B   )은/는 현실 세계에 대한 인식을 추상적, 개념적으로 표현하여 개념적 구조를 도출하는 과정으로 주요 산출물에는 E-R 다이어그램이 있다.\n\n(    C   )은/는 목표 DBMS에 맞는 스키마 설계, 트랜잭션 인터페이스를 설계하는 정규화 과정을 수행한다.\n\n[보기] : 구현 / 개념적 설계 / 논리적 설계 / 요구사항 분석 / 물리적 설계","code":"","images":[],"parts":[{"label":"A","answers":["물리적 설계","물리적"]},{"label":"B","answers":["개념적 설계","개념적"]},{"label":"C","answers":["논리적 설계","논리적"]}],"explanation":"데이터베이스 설계는 요구사항 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현 순으로 진행된다. 개념적 설계는 현실 세계를 DBMS와 무관하게 추상화해 E-R 다이어그램 같은 개념 스키마를 만드는 단계이므로 B이다. 논리적 설계는 목표 DBMS의 데이터 모델(예: 관계형)에 맞춰 테이블 스키마로 변환하고 정규화와 트랜잭션 인터페이스 설계를 하는 단계이므로 C이다. 물리적 설계는 특정 DBMS의 저장 구조, 인덱스, 접근 경로 등 성능을 고려해 실제 저장 형태를 정하는 단계로, 테이블 정의서 같은 명세가 나오므로 A이다. '특정 DBMS 성능·저장 구조'는 물리, '목표 DBMS 스키마·정규화'는 논리로 구분하면 된다.","difficulty":"","point":"DB 설계 단계 구분","unordered":false},{"id":"past-2021-1-3","sourceNumber":3,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"다음은 요구사항의 분류에 대한 설명이다. 괄호 (   ) 안에 들어갈 요구사항의 유형에 대해서 쓰시오.\n\n(   A   ) 요구사항은 시스템이 제공하는 기능, 서비스에 대한 요구사항이다.\n(   B   ) 요구사항은 시스템이 수행하는 기능 이외의 사항, 시스템 구축에 대한 제약사항에 관한 요구사항이다.","code":"","images":[],"parts":[{"label":"A","answers":["기능적","기능","기능적 요구사항","Functional"]},{"label":"B","answers":["비기능적","비기능","비기능적 요구사항","Non-functional"]}],"explanation":"기능적 요구사항은 시스템이 무엇을 해야 하는지, 즉 제공해야 할 기능과 서비스(입력, 처리, 출력 등)에 대한 요구이다. 비기능적 요구사항은 기능 외적인 품질과 제약에 관한 요구로 성능, 보안, 가용성, 사용성, 구축 환경과 같은 제약 조건이 여기에 속한다. 예를 들어 '회원 가입을 할 수 있어야 한다'는 기능적, '응답 시간이 3초 이내여야 한다'는 비기능적 요구사항이다. 따라서 A는 기능적, B는 비기능적 요구사항이다.","difficulty":"","point":"기능·비기능 요구사항","unordered":false},{"id":"past-2021-1-4","sourceNumber":4,"bucketLabel":"통합·패키징","type":"short","language":"","question":"웹 서비스명, 제공 위치, 메세지 포맷, 프로토콜 정보 등 웹 서비스에 대한 상세 정보가 기술된 XML 형식으로 구성된 언어를 무엇이라고 하는지 쓰시오.","code":"","images":[],"parts":[{"label":"정답","answers":["WSDL"]}],"explanation":"WSDL(Web Services Description Language)은 웹 서비스의 이름, 제공 위치(URL), 사용하는 메시지 형식과 프로토콜 바인딩 등을 XML로 기술하는 언어이다. 서비스를 호출하려는 쪽은 WSDL을 읽고 어떤 연산을 어떤 형식으로 호출하는지 알 수 있다. SOAP은 실제 메시지를 주고받는 XML 기반 통신 프로토콜이고, UDDI는 웹 서비스 정보를 등록하고 검색하는 저장소이다. '상세 정보를 기술한 XML 언어'라는 설명은 WSDL에 해당한다.","difficulty":"","point":"웹 서비스 WSDL"},{"id":"past-2021-1-5","sourceNumber":5,"bucketLabel":"Python","type":"short","language":"","question":"다음 파이썬 코드의 출력 결과를 쓰시오. (제공 HTML에서 자동 번역으로 깨진 코드와 문자열을 복원함)","code":"class Good:\n    li = [\"Seoul\", \"Korea\", \"Incheon\", \"Daejeon\", \"Daegu\", \"Pusan\"]\n\ng = Good()\nresult = ''\nfor city in g.li:\n    result += city[0]\nprint(result)","images":[],"parts":[{"label":"정답","answers":["SKIDDP"]}],"explanation":"class Good 안에 클래스 변수로 리스트 li 를 두고, g = Good() 으로 만든 객체를 통해 g.li 에 접근한다. for 문은 리스트 원소를 앞에서부터 하나씩 꺼내고, city[0] 은 각 문자열의 첫 글자(인덱스 0)이다. \"Seoul\", \"Korea\", \"Incheon\", \"Daejeon\", \"Daegu\", \"Pusan\" 의 첫 글자 S, K, I, D, D, P 가 빈 문자열 result 에 차례로 이어 붙으므로 SKIDDP 가 출력된다. 문자열 인덱싱은 0부터 시작한다는 점과, += 로 문자열을 이어 붙인다는 점이 핵심이다.","difficulty":"","point":"Python 문자열 인덱싱 누적"},{"id":"past-2021-1-6","sourceNumber":6,"bucketLabel":"SQL","type":"short","language":"","question":"다음 SQL 실행 결과를 숫자만 쓰시오.","code":"SELECT COUNT(*) FROM 급여\nEMPNO > 100 및 SAL >= 3000 또는 EMPNO = 200인 경우;\n\n\n\n  \n    엠프노\n    일 것이다\n  \n\n\n  \n    100\n    1000\n  \n  \n    200\n    3000\n  \n  \n    300\n    1500\n  ","images":[],"parts":[{"label":"정답","answers":["1"]}],"explanation":"지문이 깨져 있으나 원래 SQL은 SELECT COUNT(*) FROM 급여 WHERE EMPNO > 100 AND SAL >= 3000 OR EMPNO = 200; 이고 테이블 열은 EMPNO와 SAL이다. SQL에서 AND가 OR보다 우선하므로 조건은 (EMPNO > 100 AND SAL >= 3000) OR EMPNO = 200으로 묶인다. 100번 행은 EMPNO > 100이 거짓이고 EMPNO = 200도 아니므로 제외된다. 200번 행은 앞 조건(200 > 100, 3000 >= 3000)이 참이라 포함된다. 300번 행은 SAL이 1500이라 앞 조건이 거짓이고 EMPNO도 200이 아니므로 제외되어 결과는 1이다.","difficulty":"","point":"SQL AND·OR 우선순위"},{"id":"past-2021-1-7","sourceNumber":7,"bucketLabel":"Java","type":"code","language":"","question":"다음 Java 프로그램 결과를 쓰시오.","code":"public class QfranTest{\n     public static void main(String []args){\n        int a[][] = {{45, 50, 75}, {89}};\n        System.out.println(a[0].length);\n        System.out.println(a[1].length);\n        System.out.println(a[0][0]);\n        System.out.println(a[0][1]);\n        System.out.println(a[1][0]);\n     }\n}","images":[],"parts":[{"label":"정답","answers":["3\n1\n45\n50\n89"]}],"explanation":"Java의 2차원 배열은 '배열의 배열'이라 행마다 길이가 달라도 된다(가변 배열). a[0]은 {45, 50, 75}로 길이 3, a[1]은 {89}로 길이 1이므로 a[0].length는 3, a[1].length는 1이다. a[0][0]은 첫 행 첫 원소 45, a[0][1]은 첫 행 두 번째 원소 50, a[1][0]은 둘째 행 첫 원소 89이다. println이므로 3, 1, 45, 50, 89가 한 줄씩 출력된다.","difficulty":"","point":"Java 가변 2차원 배열"},{"id":"past-2021-1-8","sourceNumber":8,"bucketLabel":"데이터베이스","type":"short","language":"","question":"정규화된 엔티티, 속성, 관계에 대해 성능 향상과 개발 운영의 단순화를 위해 중복, 통합, 분리 등을 수행하는  데이터 모델링의 기법을 무엇이라고 하는지 쓰시오.","code":"","images":[],"parts":[{"label":"정답","answers":["반정규화"]}],"explanation":"반정규화(역정규화, De-normalization)는 정규화로 잘게 나뉜 엔티티·속성·관계를 성능 향상과 개발·운영 단순화를 위해 의도적으로 중복, 통합, 분리하는 기법이다. 조인이 지나치게 많아 조회 성능이 떨어질 때 테이블 통합, 테이블 분할, 중복 테이블 추가, 중복 칼럼(파생 칼럼) 추가 등을 적용한다. 정규화가 이상 현상을 막기 위해 중복을 제거하는 것이라면, 반정규화는 성능을 위해 중복을 감수하는 반대 방향이다. 대신 데이터 일관성 관리 부담이 커진다는 점이 단점이다.","difficulty":"","point":"반정규화 개념"},{"id":"past-2021-1-9","sourceNumber":9,"bucketLabel":"테스트","type":"short","language":"","question":"다음은 블랙박스 기법에 대한 예제이다. 블랙박스 기법 두 가지를 쓰시오.\n\n1. 0 ≤ x ≤ 10이면 -1, 0, 10, 11 검사\n2. 입력 데이터의 영역을 유사한 도메인별로 유효값과 무효값을 그룹핑하여 나누어서 검사","code":"","images":[],"parts":[{"label":"1","answers":["경계값 분석","경곗값 분석","경계값 분석 테스트","Boundary Value Analysis"]},{"label":"2","answers":["동치 분할 테스트","동치 분할","동치 분할 기법","동등 분할 테스트","동등 분할","Equival
