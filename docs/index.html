<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정처기 실기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="정보처리기사 실기 필답형 모의고사와 회차별 기출 풀이">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>정보처리기사 실기 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 모바일 우선 단일 열. 상단 고정 바 + 본문 + 하단 탭바(홈·해설집·개념정리). 시험 중에는 탭바 대신 이전/다음 바. 데스크톱은 720px 중앙 정렬. */
:root {
  --paper: #f8f8f5; --paper-2: #efefe9; --paper-3: #e6e7e0;
  --ink: #1d2433; --ink-2: #4b5468; --ink-3: #8a91a3; --rule: #d4d6cf;
  --accent: #1f4e8c; --accent-ink: #ffffff; --accent-soft: #e4ecf7;
  --pen: #c8322b; --pen-soft: #fbe9e7;
  --ok: #2d7a4f; --ok-soft: #e3f2e8;
  --code-bg: #f1f2ef; --focus: #3b82f6; --shadow: 0 -1px 0 var(--rule);
  --display: 'Gowun Batang', 'Nanum Myeongjo', serif;
  --body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'IBM Plex Mono', 'D2Coding', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15181f; --paper-2: #1d212b; --paper-3: #262b38; --ink: #e8e9ee; --ink-2: #b3b8c6; --ink-3: #7c8396; --rule: #2e3340;
    --accent: #8db4ea; --accent-ink: #0f1a2b; --accent-soft: #1f2b3f; --pen: #f07a72; --pen-soft: #3a2220;
    --ok: #7fcf9b; --ok-soft: #1f3327; --code-bg: #0f1218; --focus: #7fb0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15181f; --paper-2: #1d212b; --paper-3: #262b38; --ink: #e8e9ee; --ink-2: #b3b8c6; --ink-3: #7c8396; --rule: #2e3340;
  --accent: #8db4ea; --accent-ink: #0f1a2b; --accent-soft: #1f2b3f; --pen: #f07a72; --pen-soft: #3a2220;
  --ok: #7fcf9b; --ok-soft: #1f3327; --code-bg: #0f1218; --focus: #7fb0ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; overscroll-behavior-y: none; }
button { font: inherit; cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app { max-width: 720px; margin: 0 auto; min-height: 100%; }

/* 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top::before { content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: env(safe-area-inset-top, 0px); background: var(--paper); }
.top-in { display: flex; align-items: center; gap: 8px; min-height: 52px; padding-inline: 12px; }
.top-title { font-weight: 700; font-size: 16px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-sub { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.icon-btn { border: 1px solid var(--rule); background: var(--paper-2); border-radius: 8px; min-width: 40px; height: 38px; padding: 0 10px; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active { background: var(--paper-3); }
.icon-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }

/* 본문 */
.view { padding-inline: 16px; padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
.view.exam { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--ink-2); text-transform: uppercase; }
.h-display { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.25; }
.muted { color: var(--ink-2); font-size: 14px; }
.section { display: grid; gap: 10px; margin-top: 22px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section-h h2 { font-size: 15px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
.link-btn { border: none; background: none; color: var(--accent); font-size: 13.5px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

/* 버튼 */
.btn { min-height: 44px; border: 1px solid var(--rule); background: var(--paper-2); color: var(--ink); padding: 11px 14px; border-radius: 10px; font-size: 15px; line-height: 1.2; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { background: var(--paper-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--pen); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row .btn { flex: 1 1 auto; }

/* 카드 (세트) */
.set-card { border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; background: var(--paper-2); }
.set-card .name { font-family: var(--display); font-size: 20px; font-weight: 700; }
.set-card .stat { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); }
.pill.pass { color: var(--ok); background: var(--ok-soft); border-color: var(--ok); }
.pill.fail { color: var(--pen); background: var(--pen-soft); border-color: var(--pen); }
.pill.live { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.progress { height: 6px; background: var(--paper-3); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; }

/* 기록 */
.hist { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.hist-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--rule); font-size: 14px; font-variant-numeric: tabular-nums; background: var(--paper-2); }
.hist-row:first-child { border-top: none; }
.hist-row .d { color: var(--ink-3); font-size: 12.5px; }
.hist-row b { font-size: 16px; }
.empty { border: 1px dashed var(--rule); border-radius: 12px; padding: 18px; text-align: center; color: var(--ink-3); font-size: 14px; }

/* 문항 */
.q-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 10px; }
.q-num { font-family: var(--display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1; }
.chip { font-size: 12px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 9px; background: var(--paper-2); }
.q-points { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.q-text { font-size: 16px; }
.q-text p { margin: 0 0 8px; }
.q-text p:last-child { margin-bottom: 0; }
.q-text code, .key code { font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.q-text ul { margin: 4px 0 8px; padding-left: 20px; }
.tbl-wrap, .code-wrap { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
table.data { border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; margin: 6px 0 10px; }
table.data th, table.data td { border: 1px solid var(--rule); padding: 5px 10px; text-align: left; white-space: nowrap; }
table.data th { background: var(--paper-2); font-weight: 500; }
pre.code { margin: 8px 0 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 12px; font-family: var(--mono); font-size: 13px; line-height: 1.55; tab-size: 4; counter-reset: ln; }
pre.code .ln { display: block; white-space: pre; }
pre.code .ln::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 2em; margin-right: .9em; text-align: right; color: var(--ink-3); user-select: none; }
.code-lang { font-size: 11px; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; margin-top: 12px; font-family: var(--mono); }

/* 답안란 */
.answers { display: grid; gap: 10px; margin-top: 16px; }
.part { display: grid; gap: 4px; }
.part-label { font-size: 13px; color: var(--ink-2); }
.part input, .part textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink-3); border-radius: 10px; padding: 11px 12px; }
.part textarea { font-family: var(--mono); font-size: 15px; line-height: 1.5; min-height: 84px; resize: vertical; }
.part input:read-only, .part textarea:read-only { background: var(--paper-2); border-color: var(--rule); }
.part input::placeholder, .part textarea::placeholder { color: var(--ink-3); }
.q[data-state="correct"] .part input, .q[data-state="correct"] .part textarea { border-color: var(--ok); }
.q[data-state="wrong"] .part input, .q[data-state="wrong"] .part textarea { border-color: var(--pen); }
.q-actions { display: grid; gap: 8px; margin-top: 14px; }
.q-actions .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status-line { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); min-height: 24px; }

/* 채점 표시 */
.mark { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; }
.mark .glyph { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 50%; position: relative; }
.mark.correct { color: var(--pen); }
.mark.correct .glyph { border: 2.5px solid var(--pen); }
.mark.wrong { color: var(--pen); }
.mark.wrong .glyph::before { content: ''; position: absolute; left: 50%; top: 2px; bottom: 2px; width: 2.5px; background: var(--pen); transform: rotate(30deg); border-radius: 2px; }
.mark.none { color: var(--ink-3); font-weight: 500; }

/* 정답·해설 */
.key { border-left: 3px solid var(--accent); background: var(--paper-2); padding: 12px 14px; display: grid; gap: 10px; border-radius: 0 10px 10px 0; margin-top: 14px; }
.key-row { display: grid; gap: 2px; font-size: 14.5px; }
.key-row .k { color: var(--ink-2); font-size: 12.5px; }
.key-answer { font-weight: 700; font-family: var(--mono); white-space: pre-wrap; word-break: break-word; font-size: 15px; }
.key-alt { color: var(--ink-3); font-size: 12.5px; }
.key-exp { white-space: pre-wrap; }
.q-image { display: block; max-width: 100%; height: auto; margin: 12px auto; border-radius: 6px; }
.my-answer { font-family: var(--mono); white-space: pre-wrap; word-break: break-word; }

/* 시험 하단 바 */
.exam-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--rule); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
.exam-bar-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.exam-bar .btn { height: 46px; }
.exam-bar .grid-btn { min-width: 110px; font-variant-numeric: tabular-nums; font-weight: 500; }

/* 하단 탭바 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { border: none; background: none; padding: 9px 4px 8px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--ink-3); }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); font-weight: 700; }

/* 시트(문항 번호판·확인) */
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); display: grid; align-items: end; }
.sheet { background: var(--paper); border-radius: 16px 16px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-width: 720px; width: 100%; margin: 0 auto; max-height: 80vh; overflow: auto; display: grid; gap: 12px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-h h3 { font-size: 16px; }
.cells { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cell { height: 48px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper-2); color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.cell[data-state="locked"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); font-weight: 500; }
.cell[data-state="shown"] { border-style: dashed; color: var(--ink-3); }
.cell[data-state="correct"] { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); font-weight: 700; }
.cell[data-state="wrong"] { background: var(--pen-soft); color: var(--pen); border-color: var(--pen); font-weight: 700; }
.cell[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--rule); border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.legend .l-locked { background: var(--accent-soft); border-color: var(--accent); }
.legend .l-shown { border-style: dashed; }
.legend .l-correct { background: var(--ok-soft); border-color: var(--ok); }
.legend .l-wrong { background: var(--pen-soft); border-color: var(--pen); }

/* 결과 */
.result-card { border: 1px solid var(--ink); border-radius: 14px; padding: 18px; display: grid; gap: 12px; background: var(--paper-2); }
.score { font-family: var(--display); font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 18px; font-family: var(--body); font-weight: 400; color: var(--ink-2); margin-left: 4px; }
.verdict { font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 8px; display: inline-block; }
.verdict.pass { color: var(--ok); background: var(--ok-soft); }
.verdict.fail { color: var(--pen); background: var(--pen-soft); }
.by-topic { display: grid; gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
.by-topic div { display: grid; grid-template-columns: 1fr auto; gap: 10px; border-bottom: 1px dotted var(--rule); padding-block: 4px; }
.result-cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.result-cells .cell { height: 34px; font-size: 13px; border-radius: 7px; }

/* 세그먼트·칩 */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--rule); background: var(--paper-2); border-radius: 999px; padding: 6px 13px; font-size: 14px; color: var(--ink-2); }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 500; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: 0 0 auto; border: 1px solid var(--rule); background: var(--paper-2); border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.chips button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }

/* 해설집 항목 */
.key-item { scroll-margin-top: calc(64px + env(safe-area-inset-top, 0px)); border: 1px solid var(--rule); border-radius: 12px; background: var(--paper-2); overflow: hidden; }
.key-item > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
.key-item > summary::-webkit-details-marker { display: none; }
.key-item .n { font-family: var(--display); font-weight: 700; font-size: 18px; min-width: 1.6em; }
.key-item .t { font-size: 14.5px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.key-item .t small { display: block; color: var(--ink-3); font-size: 12px; margin-bottom: 2px; }
.key-item .body { padding: 0 14px 14px; border-top: 1px solid var(--rule); background: var(--paper); }
.key-item .body .q-text { margin-top: 12px; }
.key-item .key { margin-top: 12px; }

/* 개념정리 */
.note-card { border: 1px solid var(--rule); border-radius: 12px; background: var(--paper-2); overflow: hidden; }
.note-card > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: 15.5px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.note-card > summary::-webkit-details-marker { display: none; }
.note-card > summary::after { content: '▾'; color: var(--ink-3); font-size: 14px; transition: transform .15s; }
.note-card[open] > summary::after { transform: rotate(180deg); }
.note-card .body { padding: 0 14px 14px; background: var(--paper); border-top: 1px solid var(--rule); }
.note-card ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }
.note-card .note { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--accent); padding-left: 10px; }
.note-card table.data { margin-top: 12px; }
.note-card table.data td, .note-card table.data th { white-space: normal; min-width: 72px; }
.note-card table.data td:first-child { white-space: nowrap; font-weight: 500; }
.intro { font-size: 14.5px; color: var(--ink-2); border-left: 3px solid var(--rule); padding-left: 10px; }

.foot { margin-top: 36px; font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
@media (pointer: coarse) { body.typing .exam-bar { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 420px) { pre.code { font-size: 12.5px; padding: 10px; } pre.code .ln::before { width: 1.6em; margin-right: .7em; } }
@media (min-width: 600px) { .cells { grid-template-columns: repeat(10, 1fr); } .cell { height: 44px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="주 메뉴">
    <div class="tabbar-in">

<script>
const SETS = [{"key":"r1","name":"제1회 모의고사","questions":[{"id":"security-1","bucketLabel":"정보 보안","type":"short","language":"","question":"다음 설명에 해당하는 DoS 공격 유형을 쓰시오.\n\n공격자가 출발지 IP 주소를 공격 대상의 주소로 위조한 ICMP Echo Request 패킷을 특정 네트워크의 브로드캐스트 주소로 전송하면, 해당 네트워크의 모든 호스트가 공격 대상에게 ICMP Echo Reply를 보내게 되어 대량의 트래픽이 집중되는 증폭형 공격이다. 라우터에서 다이렉트 브로드캐스트 패킷을 차단하거나 호스트가 브로드캐스트 주소로 온 ICMP 요청에 응답하지 않도록 설정하여 대응할 수 있다.","code":"","parts":[{"label":"정답","answers":["Smurf","스머프","스머프 공격","Smurf Attack","Smurf Attacking","스머프 어택","스머핑","Smurfing","Smurf 공격","스머프 공격(Smurf)","Smurf(스머프)","Smurf 어택","스머프(Smurf)"]}],"explanation":"Smurf 공격은 IP 스푸핑과 ICMP 브로드캐스트를 결합한 증폭형 서비스 거부 공격이다. 출발지를 피해자 주소로 위조한 ICMP Echo Request를 브로드캐스트 주소로 보내면 네트워크의 모든 호스트가 피해자에게 Echo Reply를 보내므로, 공격자는 패킷 하나로 수십~수백 배의 트래픽을 만들어 낼 수 있다. 같은 증폭 구조라도 UDP(echo, chargen 포트)를 이용하면 Fraggle 공격이고, ICMP를 쓰되 규정 크기(65,535바이트)를 초과하는 패킷을 보내는 것은 Ping of Death이며, 출발지와 목적지 IP를 동일하게 위조하는 것은 Land 공격이므로 구분해야 한다. 대응은 라우터의 다이렉트 브로드캐스트 차단(no ip directed-broadcast)과 호스트의 브로드캐스트 ICMP 응답 금지 설정이다.","difficulty":"중","point":"DoS/DDoS 공격 유형"},{"id":"c-1","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nvoid rotate(int *p, int n) {\n    int t = *p;\n    for (int i = 0; i < n - 1; i++) {\n        *(p + i) = *(p + i + 1);\n    }\n    *(p + n - 1) = t;\n}\n\nint main() {\n    int a[5] = {3, 7, 1, 9, 4};\n    int *p = a;\n    rotate(p, 5);\n    rotate(p + 1, 3);\n    for (int i = 0; i < 5; i++) {\n        printf(\"%d\", *(p + i));\n        if (i < 4) printf(\" \");\n    }\n    printf(\"\\n\");\n    printf(\"%d\\n\", *(p + 2) - *p);\n    return 0;\n}","parts":[{"label":"출력 결과","answers":["7 9 4 1 3\n-3"]}],"explanation":"rotate 함수는 포인터 p부터 n개 원소를 왼쪽으로 한 칸씩 회전시킨다(첫 원소를 저장해 두고 뒤 원소를 앞으로 당긴 뒤 마지막 칸에 넣는다). 첫 호출 rotate(p, 5)는 배열 전체를 회전시켜 {7, 1, 9, 4, 3}이 된다. 두 번째 호출 rotate(p + 1, 3)은 a[1]부터 3개({1, 9, 4})만 회전시켜 {9, 4, 1}이 되므로 배열은 {7, 9, 4, 1, 3}이다. p + 1은 a[1]의 주소이므로 함수 안의 *(p + i)는 a[1 + i]를 가리킨다는 점이 핵심이다. 마지막 줄은 a[2] - a[0] = 4 - 7 = -3이다.","difficulty":"중","point":"포인터와 배열"},{"id":"design-1","bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음 설명에 해당하는 GoF 디자인 패턴의 이름을 쓰시오.\n\n- 행위(Behavioral) 패턴에 속한다.\n- 여러 객체가 서로를 직접 참조하여 통신하면 객체 간 결합도가 높아지고 M:N 관계가 복잡해지므로, 객체들 사이의 상호작용을 하나의 객체에 캡슐화하여 정의한다.\n- 각 객체는 다른 객체를 직접 호출하지 않고 이 객체를 통해서만 메시지를 주고받으며, 이로써 객체 간 관계가 1:N 형태로 단순해진다.\n- 채팅방에서 참가자들이 서로 직접 메시지를 보내지 않고 채팅방 객체를 통해 메시지를 전달하는 구조가 대표적인 예이다.","code":"","parts":[{"label":"정답","answers":["중재자(Mediator)","중재자","Mediator","중재자 패턴","Mediator 패턴","Mediator Pattern","미디에이터","미디에이터 패턴","중재자(Mediator) 패턴","Mediator(중재자)","미디에이터(Mediator)","중재자 패턴(Mediator)","중재자 패턴(Mediator Pattern)","메디에이터","메디에이터 패턴","중재자 (Mediator)"]}],"explanation":"객체 간의 복잡한 상호작용을 하나의 중재 객체에 캡슐화하여 객체들이 서로 직접 참조하지 않도록 하는 패턴은 중재자(Mediator) 패턴이다. 객체들은 중재자를 통해서만 통신하므로 M:N 관계가 1:N로 단순해지고 결합도가 낮아진다. 퍼사드(Facade) 패턴도 복잡한 관계를 단순화하지만 구조 패턴이며 서브시스템에 대한 단일 진입 인터페이스를 제공하는 것이 목적이고, 옵저버(Observer) 패턴은 한 객체의 상태 변화를 여러 객체에 통지하는 1:N 통보 구조라는 점에서 구분된다. 지문의 '행위 패턴', '상호작용 캡슐화', '채팅방 예시'는 중재자 패턴의 고유 단서이다.","difficulty":"중","point":"GoF 디자인 패턴"},{"id":"java-1","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"class Shape {\n    int w = 2;\n    int area() { return w * w; }\n    String info() { return \"Shape:\" + area(); }\n}\nclass Rect extends Shape {\n    int h = 3;\n    int area() { return w * h; }\n}\nclass Cube extends Rect {\n    int area() { return super.area() * 2; }\n    String info() { return \"Cube:\" + area(); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Shape[] arr = { new Shape(), new Rect(), new Cube() };\n        int sum = 0;\n        for (Shape s : arr) {\n            System.out.println(s.info());\n            sum += s.area();\n        }\n        System.out.println(sum);\n    }\n}","parts":[{"label":"출력 결과","answers":["Shape:4\nShape:6\nCube:12\n22"]}],"explanation":"배열 원소는 모두 Shape 타입 참조이지만, 오버라이딩된 메서드는 실제 객체 타입을 기준으로 동적 바인딩된다. Shape 객체는 info()와 area() 모두 자기 것을 써서 2*2=4, 'Shape:4'가 된다. Rect는 info()를 재정의하지 않아 Shape의 info()가 실행되지만, 그 안에서 호출되는 area()는 Rect의 것으로 바인딩되어 2*3=6, 'Shape:6'이 출력된다. Cube는 info()와 area()를 모두 재정의했고 area()에서 super.area()는 바로 위 부모인 Rect의 area()(6)를 호출하므로 6*2=12, 'Cube:12'가 된다. 합계는 4+6+12=22이다. 부모 메서드 안에서 호출한 메서드도 자식 쪽이 실행된다는 점이 핵심이다.","difficulty":"중","point":"상속·오버라이딩·다형성"},{"id":"network-1","bucketLabel":"네트워크","type":"short","language":"","question":"IP 주소 203.230.7.0/24 네트워크에 서브넷 마스크 255.255.255.224 를 적용하여 FLSM(고정 길이 서브넷 마스크) 방식으로 서브네팅 하였다. 다음 물음에 답하시오.\n\n① 생성되는 서브넷의 개수를 쓰시오.\n② 각 서브넷에서 호스트에 실제로 할당 가능한 IP 주소의 개수를 쓰시오.\n③ 세 번째 서브넷의 브로드캐스트 주소를 쓰시오.","code":"","parts":[{"label":"①","answers":["8","8개"]},{"label":"②","answers":["30","30개"]},{"label":"③","answers":["203.230.7.95"]}],"explanation":"서브넷 마스크 255.255.255.224 는 마지막 옥텟이 11100000 이므로 프리픽스 /27 이고, 원래 /24 에서 3비트를 서브넷 ID 로 빌린 것이다. 따라서 서브넷 개수는 2^3 = 8개이다. 호스트 비트는 32 - 27 = 5비트이므로 서브넷당 주소는 2^5 = 32개이고, 네트워크 주소와 브로드캐스트 주소를 제외하면 할당 가능한 호스트 주소는 30개이다. 블록 크기가 32 이므로 서브넷은 203.230.7.0, .32, .64, .96, .128, .160, .192, .224 순으로 나뉘며, 세 번째 서브넷은 203.230.7.64 ~ 203.230.7.95 범위이다. 그 범위의 마지막 주소인 203.230.7.95 가 브로드캐스트 주소이다. 첫 번째 서브넷(.0~.31)을 0번이 아닌 1번으로 세는 것이 시험의 관례이므로 세 번째는 .64 블록임에 유의한다.","difficulty":"중","point":"서브네팅 계산"},{"id":"python-1","bucketLabel":"Python","type":"code","language":"Python","question":"다음 Python 코드의 출력 결과를 쓰시오.","code":"def pick(data, step):\n    result = []\n    for i in range(0, len(data), step):\n        result.append(data[i])\n    return result\n\nnums = [3, 8, 1, 9, 4, 7, 2, 6]\na = nums[2:6]\nb = nums[::-1]\nc = nums[-3:]\nd = pick(b, 3)\nprint(a[1] + c[0])\nprint(b[1:4])\nprint(d)\nprint(nums[1::2][::-1])","parts":[{"label":"출력 결과","answers":["16\n[2, 7, 4]\n[6, 4, 8]\n[6, 7, 9, 8]"]}],"explanation":"nums[2:6]은 인덱스 2부터 5까지이므로 a = [1, 9, 4, 7]이고, nums[::-1]은 전체를 역순으로 뒤집어 b = [6, 2, 7, 4, 9, 1, 8, 3]이 된다. nums[-3:]은 뒤에서 3개이므로 c = [7, 2, 6]이다. pick(b, 3)은 range(0, 8, 3)으로 인덱스 0, 3, 6의 원소를 모아 [6, 4, 8]을 돌려준다. 첫 줄은 a[1] + c[0] = 9 + 7 = 16, 둘째 줄은 b[1:4] = [2, 7, 4]이다. 마지막 줄은 nums[1::2]로 홀수 인덱스 원소 [8, 9, 7, 6]을 뽑은 뒤 [::-1]로 뒤집어 [6, 7, 9, 8]이 된다. 슬라이싱의 끝 인덱스는 포함되지 않는다는 점과, 리스트를 print하면 대괄호와 쉼표+공백 형식으로 출력된다는 점에 주의한다.","difficulty":"중","point":"리스트 슬라이싱과 음수 인덱스"},{"id":"db-1","bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 데이터베이스 정규화 과정에 대한 설명이다. 괄호 ( ① ), ( ② )에 들어갈 알맞은 용어를 쓰시오.\n\n제2정규형(2NF)을 만족하는 릴레이션에서 기본키가 아닌 속성이 다른 기본키가 아닌 속성을 거쳐 기본키에 종속되는 ( ① ) 함수 종속을 제거하면 제3정규형(3NF)이 된다. 제3정규형을 만족하는 릴레이션에서 함수 종속 X→Y의 모든 ( ② )가 후보키가 되도록 하면 보이스-코드 정규형(BCNF)이 된다.","code":"","parts":[{"label":"①","answers":["이행적","이행적 함수 종속","이행 함수 종속","이행적 종속","이행 종속","Transitive Dependency","Transitive","Transitive Functional Dependency","이행적 함수적 종속","이행 함수적 종속","이행적 종속성","Transitive FD","이행","이행 종속성"]},{"label":"②","answers":["결정자","Determinant","결정자(Determinant)","결정자 X","determinant"]}],"explanation":"정규화 단계별로 제거하는 종속을 구분하는 문제이다. 1NF→2NF는 기본키의 일부에만 종속되는 부분 함수 종속을 제거하고, 2NF→3NF는 A→B, B→C일 때 A→C가 성립하는 이행적 함수 종속을 제거한다. 3NF→BCNF는 함수 종속 X→Y에서 왼쪽에 오는 결정자(determinant) X가 후보키가 아닌 경우를 제거하여 모든 결정자가 후보키가 되게 한다. 지문의 ①은 «기본키가 아닌 속성을 거쳐 종속»이라는 단서로 부분 종속이 아니라 이행적 종속임을 알 수 있고, ②는 «X→Y의 왼쪽»이라는 단서로 종속자가 아닌 결정자임을 알 수 있다. 4NF는 다치 종속, 5NF는 조인 종속을 제거하므로 혼동하지 않도록 한다.","difficulty":"중","point":"정규화 단계"},{"id":"c-2","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nint cnt = 0;\n\nint f(int n) {\n    cnt++;\n    if (n <= 1) return 1;\n    if (n % 2 == 0) return f(n / 2) + 2;\n    return f(n - 1) * 2;\n}\n\nint main() {\n    int a = f(10);\n    int b = f(7);\n    printf(\"%d %d %d\\n\", a, b, cnt);\n    return 0;\n}","parts":[{"label":"출력 결과","answers":["12 16 10"]}],"explanation":"f(n)은 n이 짝수이면 f(n/2)+2, 홀수이면 f(n-1)*2를 반환하고, n이 1 이하이면 1을 반환하는 재귀 함수이다. f(10)은 f(5)+2 → f(5)=f(4)*2 → f(4)=f(2)+2 → f(2)=f(1)+2=3 순으로 풀려 f(4)=5, f(5)=10, f(10)=12가 된다. f(7)은 f(6)*2 → f(6)=f(3)+2 → f(3)=f(2)*2=6 → f(6)=8 → f(7)=16이다. 전역 변수 cnt는 함수가 호출될 때마다 1씩 증가하는데, f(10)은 10,5,4,2,1의 5회, f(7)은 7,6,3,2,1의 5회 호출되어 총 10이 된다. 재귀 문제는 반환값을 바깥에서 안쪽으로 세운 뒤 안쪽 결과부터 거꾸로 채워 넣는 방식으로 추적한다.","difficulty":"상","point":"재귀 함수"},{"id":"sql-1","bucketLabel":"SQL","type":"short","language":"SQL","question":"다음은 테이블 ORDERS 의 데이터이다. 아래 SQL문을 실행했을 때 출력되는 행의 수( ① )와 첫 번째 행의 KIND 값( ② )을 쓰시오.\n\n[ORDERS]\n\n| ONO | CUST | ITEM | QTY | PRICE |\n|---|---|---|---|---|\n| 1 | C1 | A | 2 | 100 |\n| 2 | C2 | B | 1 | 300 |\n| 3 | C1 | B | 3 | 300 |\n| 4 | C3 | A | 1 | 100 |\n| 5 | C2 | C | 2 | 200 |\n| 6 | C1 | C | 1 | 200 |\n| 7 | C3 | C | 1 | 200 |\n\n```sql\nSELECT CUST, COUNT(DISTINCT ITEM) AS KIND, SUM(QTY * PRICE) AS AMT\nFROM ORDERS\nGROUP BY CUST\nHAVING SUM(QTY * PRICE) >= 500\nORDER BY AMT DESC;\n```","code":"","parts":[{"label":"①","answers":["2","2행","2개"]},{"label":"②","answers":["3","3개","3종"]}],"explanation":"GROUP BY CUST 로 고객별 그룹을 만들면 C1, C2, C3 세 그룹이 생긴다. 그룹별 SUM(QTY*PRICE) 는 C1 = 2*100 + 3*300 + 1*200 = 1300, C2 = 1*300 + 2*200 = 700, C3 = 1*100 + 1*200 = 300 이다. HAVING 은 그룹화 이후의 조건이므로 합계가 500 이상인 C1, C2 두 그룹만 남아 출력 행 수는 2이다. ORDER BY AMT DESC 로 금액이 큰 C1 이 첫 행이 되고, C1 의 ITEM 은 A, B, C 세 종류이므로 COUNT(DISTINCT ITEM) 은 3이다. WHERE 는 그룹화 전 개별 행을 거르고 HAVING 은 그룹화 후 집계값으로 거른다는 점, 그리고 COUNT(*) 였다면 C1 의 주문 건수 3이 아니라 중복을 제거한 품목 종류 수를 세는 것이 COUNT(DISTINCT) 라는 점을 구분해야 한다.","difficulty":"중","point":"GROUP BY / HAVING / COUNT(DISTINCT) / ORDER BY 실행 결과"},{"id":"test-3","bucketLabel":"테스트","type":"short","language":"","question":"다음은 통합 테스트에 관한 설명이다. 괄호 ( ① ), ( ② )에 들어갈 알맞은 용어를 쓰시오.\n\n하향식(Top-Down) 통합 테스트는 메인 제어 모듈부터 아래 방향으로 통합하면서 테스트한다. 아직 개발되지 않은 하위 모듈의 역할을 임시로 대신하도록 만든 모듈을 ( ① )(이)라고 하며, 인터페이스만 갖추고 실제 기능 대신 정해진 값을 반환한다.\n상향식(Bottom-Up) 통합 테스트는 최하위 모듈부터 위 방향으로 통합하면서 테스트한다. 아직 개발되지 않은 상위 모듈을 대신하여 하위 모듈을 호출하고 테스트 데이터를 전달하는 가상의 모듈을 ( ② )(이)라고 한다.","code":"","parts":[{"label":"①","answers":["스텁","Stub","테스트 스텁","Test Stub"]},{"label":"②","answers":["드라이버","Driver","테스트 드라이버","Test Driver"]}],"explanation":"하향식 통합 테스트는 상위 모듈이 먼저 완성되므로 아직 없는 하위 모듈을 대신할 스텁(Stub)이 필요하다. 스텁은 호출되는 쪽을 흉내 내며 실제 로직 없이 미리 정해진 값을 돌려준다. 상향식 통합 테스트는 하위 모듈이 먼저 완성되므로 이를 호출해 줄 상위 모듈 역할의 드라이버(Driver)가 필요하다. 드라이버는 호출하는 쪽을 흉내 내어 테스트 데이터를 넘기고 결과를 받아 비교한다. 「하향식-스텁, 상향식-드라이버」로 짝지어 기억하면 되고, 상향식에서 하위 모듈 묶음을 클러스터(Cluster)라고 부르는 것과 혼동하지 않도록 한다.","difficulty":"하","point":"통합 테스트 - 스텁과 드라이버"},{"id":"java-2","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"class Counter {\n    static int total = 0;\n    int id;\n    Counter() {\n        this(10);\n        total++;\n    }\n    Counter(int v) {\n        id = v + total;\n        total += 2;\n    }\n    static int get() { return total; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Counter a = new Counter();\n        Counter b = new Counter(5);\n        Counter c = new Counter();\n        System.out.println(a.id + \" \" + b.id + \" \" + c.id);\n        System.out.println(Counter.get());\n    }\n}","parts":[{"label":"출력 결과","answers":["10 8 15\n8"]}],"explanation":"total은 static 변수이므로 모든 Counter 객체가 하나의 값을 공유하며, 생성자가 호출될 때마다 누적된다. 기본 생성자 Counter()는 this(10)으로 먼저 Counter(int)를 실행한 뒤 total++를 수행한다. a: Counter(10)에서 id=10+0=10, total=2, 이어서 total++로 3. b: Counter(5)에서 id=5+3=8, total=5. c: Counter(10)에서 id=10+5=15, total=7, 이어서 total++로 8. 따라서 첫 줄은 '10 8 15', Counter.get()은 8을 반환한다. this() 호출은 생성자 첫 줄에서 먼저 실행되고 그 뒤에 나머지 본문이 실행된다는 순서가 핵심이다.","difficulty":"중","point":"생성자 호출 순서(this())와 static 변수 공유"},{"id":"os-1","bucketLabel":"운영체제","type":"short","language":"","question":"HRN(Highest Response-ratio Next) 스케줄링 기법에서 현재 준비 상태에 있는 프로세스의 대기 시간과 서비스(실행) 시간이 다음과 같을 때, 프로세스가 실행되는 순서를 쓰시오.\n\n| 프로세스 | 대기 시간 | 서비스 시간 |\n|---|---|---|\n| A | 6 | 3 |\n| B | 8 | 8 |\n| C | 10 | 2 |\n| D | 5 | 4 |","code":"","parts":[{"label":"실행 순서","answers":["C → A → D → B","C, A, D, B","C-A-D-B","CADB","C A D B","C->A->D->B","C>A>D>B","C→A→D→B","C,A,D,B","C⇒A⇒D⇒B","C=>A=>D=>B","C → A → D → B 순"]}],"explanation":"HRN은 SJF의 긴 작업 기아(starvation) 문제를 보완하기 위해 우선순위를 (대기 시간 + 서비스 시간) / 서비스 시간으로 계산하고, 값이 큰 프로세스부터 실행하는 비선점 기법이다. 각 프로세스의 우선순위는 A = (6+3)/3 = 3, B = (8+8)/8 = 2, C = (10+2)/2 = 6, D = (5+4)/4 = 2.25이다. 따라서 값이 큰 순서대로 C(6) → A(3) → D(2.25) → B(2)가 실행 순서가 된다. SJF였다면 서비스 시간이 짧은 C → A → D → B로 우연히 같지만, HRN은 대기 시간이 길어질수록 우선순위가 올라가 긴 작업도 결국 실행된다는 점이 차이다. 우선순위 값은 항상 1 이상이며, 서비스 시간이 짧거나 대기 시간이 길수록 커진다.","difficulty":"중","point":"프로세스 스케줄링 계산"},{"id":"design-2","bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 모듈 간 결합도(Coupling)에 대한 설명이다. 괄호 ( ① ), ( ② )에 들어갈 알맞은 결합도의 종류를 쓰시오.\n\n- ( ① ) 결합도: 한 모듈이 다른 모듈의 내부 기능이나 자료를 직접 참조하거나 수정하는 경우로, 결합도 중 가장 강하여 가장 바람직하지 않다.\n- ( ② ) 결합도: 모듈 간에 배열이나 레코드 같은 자료 구조 전체를 매개변수로 전달하지만, 받은 모듈은 그 자료 구조의 일부 필드만 사용하는 경우이다.","code":"","parts":[{"label":"①","answers":["내용 결합도","내용","내용결합도","Content Coupling","Content","컨텐츠 결합도","콘텐츠 결합도","내용(Content) 결합도","내용(Content)","Content(내용) 결합도","내용 결합도(Content Coupling)","내용결합도(Content Coupling)","Content Coupling(내용 결합도)"]},{"label":"②","answers":["스탬프 결합도","스탬프","스탬프결합도","Stamp Coupling","Stamp","스탬프(Stamp) 결합도","스탬프(Stamp)","Stamp(스탬프) 결합도","스탬프 결합도(Stamp Coupling)","스탬프결합도(Stamp Coupling)","Stamp Coupling(스탬프 결합도)","스탬프 (Stamp) 결합도"]}],"explanation":"결합도는 약한 순서로 자료 < 스탬프 < 제어 < 외부 < 공통 < 내용 결합도이며, 결합도는 약할수록 좋다. ①은 다른 모듈의 내부 자료나 기능을 직접 참조·수정하는 가장 강한 결합도이므로 내용(Content) 결합도이다. ②는 배열·레코드 등 자료 구조 전체를 전달하는데 일부만 사용하는 경우로 스탬프(Stamp) 결합도이며, 필요한 데이터 항목만 매개변수로 넘기는 자료(Data) 결합도와 구분된다. 공통(Common) 결합도는 전역 변수를 공유하는 경우이고, 제어(Control) 결합도는 플래그 같은 제어 요소를 전달하는 경우이므로 혼동하지 않도록 한다.","difficulty":"중","point":"결합도 6종"},{"id":"c-n1","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nvoid rotate(int m[][3]) {\n    int i, j, t;\n    for (i = 0; i < 3; i++) {\n        for (j = i + 1; j < 3; j++) {\n            t = m[i][j];\n            m[i][j] = m[j][i];\n            m[j][i] = t;\n        }\n    }\n    for (i = 0; i < 3; i++) {\n        t = m[i][0];\n        m[i][0] = m[i][2];\n        m[i][2] = t;\n    }\n}\n\nint main() {\n    int m[3][3] = { {3, 1, 4}, {1, 5, 9}, {2, 6, 5} };\n    int i, d1 = 0, d2 = 0;\n    rotate(m);\n    for (i = 0; i < 3; i++) {\n        d1 += m[i][i];\n        d2 += m[i][2 - i];\n    }\n    printf(\"%d\", m[1][0]);\n    for (i = 1; i < 3; i++)\n        printf(\" %d\", m[1][i]);\n    printf(\"\\n\");\n    printf(\"%d %d\\n\", d1, d2);\n    return 0;\n}\n","parts":[{"label":"출력 결과","answers":["6 5 1\n11 13"]}],"explanation":"rotate 의 첫 번째 이중 반복은 j 가 i+1 부터 시작하므로 주대각선 위쪽 원소만 아래쪽과 교환하여 전치(transpose)를 수행한다. 전치 결과는 {3,1,2},{1,5,6},{4,9,5} 이다. 두 번째 반복은 각 행의 0열과 2열을 바꾸므로 {2,1,3},{6,5,1},{5,9,4} 가 되며, 이는 원본을 시계 방향으로 90도 회전한 것과 같다. 2차원 배열은 함수에 전달해도 원본이 직접 수정된다. 1행은 6 5 1 이고, 주대각선 합 d1 = 2+5+4 = 11, 반대각선 합 d2 = m[0][2]+m[1][1]+m[2][0] = 3+5+5 = 13 이다.","difficulty":"하","point":"2차원 배열 전치·행 반전으로 회전 후 대각선 합"},{"id":"network-3","bucketLabel":"네트워크","type":"short","language":"","question":"다음 설명에 해당하는 데이터 링크 계층의 오류 제어 기법을 쓰시오.\n\n송신 측은 수신 측의 확인 응답을 기다리지 않고 윈도우 크기만큼 프레임을 연속적으로 전송한다. 수신 측은 오류가 검출된 프레임에 대해서만 NAK 를 보내고, 송신 측은 그 프레임 이후의 프레임을 모두 재전송하는 것이 아니라 오류가 발생한 해당 프레임만 선별하여 재전송한다. 재전송되는 프레임의 수가 적어 전송 효율이 높으나, 수신 측이 순서가 뒤바뀐 프레임을 원래 순서대로 재조립하기 위한 버퍼와 복잡한 논리 회로가 필요하다.","code":"","parts":[{"label":"정답","answers":["선택적 재전송 ARQ","Selective Repeat ARQ","SR ARQ","선택적 재전송","Selective Repeat","선택 재전송 ARQ","선택적 반복 ARQ","Selective Reject ARQ","SREJ ARQ","Selective-Repeat ARQ","SR-ARQ","선택 재전송","선택적 반복","Selective Repeat 방식","선택적 재전송 방식","Selective-Repeat","Selective Reject","SREJ","선택 재전송 방식","선택적 재전송 ARQ(Selective Repeat ARQ)","Selective Repeat ARQ(선택적 재전송 ARQ)","선택적 재전송(Selective Repeat) ARQ"]}],"explanation":"ARQ(Automatic Repeat reQuest)는 오류 검출 시 재전송을 요구하는 오류 제어 방식으로 정지-대기, Go-Back-N, 선택적 재전송, 적응적 ARQ 로 나뉜다. 선택적 재전송(Selective Repeat) ARQ 는 연속 전송 중 오류가 난 프레임 하나만 다시 보내므로 재전송량이 가장 적고 효율이 높지만, 수신 측에서 순서를 맞추기 위한 버퍼와 복잡한 제어가 필요하다. 정지-대기(Stop-and-Wait) ARQ 는 프레임 하나를 보내고 ACK/NAK 를 받을 때까지 기다리므로 연속 전송이라는 지문과 맞지 않는다. Go-Back-N ARQ 는 연속 전송은 같지만 오류 프레임 이후의 모든 프레임을 다시 보내므로 「해당 프레임만 선별 재전송」이라는 단서로 구분된다. 적응적(Adaptive) ARQ 는 회선 상태에 따라 프레임 길이를 동적으로 바꾸는 방식이므로 역시 해당하지 않는다.","difficulty":"하","point":"오류 제어"},{"id":"python-2","bucketLabel":"Python","type":"code","language":"Python","question":"다음 Python 코드의 출력 결과를 쓰시오.","code":"text = \"red blue red green blue red\"\nwords = text.split()\ncount = {}\nfor w in words:\n    count[w] = count.get(w, 0) + 1\n\nresult = []\nfor k, v in count.items():\n    if v >= 2:\n        result.append(k.upper() + str(v))\n    else:\n        result.append(k.replace(\"e\", \"E\"))\n\nprint(count[\"red\"], len(count))\nprint(\"-\".join(result))\nprint(text.find(\"blue\"), text.count(\"re\"))","parts":[{"label":"출력 결과","answers":["3 3\nRED3-BLUE2-grEEn\n4 4"]}],"explanation":"split()은 공백 기준으로 단어를 나누어 ['red','blue','red','green','blue','red']를 만들고, count.get(w, 0) + 1로 등장 횟수를 세면 삽입 순서대로 {'red': 3, 'blue': 2, 'green': 1}이 된다. 첫 줄은 count['red']=3과 키 개수 len(count)=3을 공백으로 구분해 출력한다. items() 순회에서 red와 blue는 2회 이상이므로 upper()와 횟수를 붙여 'RED3', 'BLUE2'가 되고, green은 replace('e','E')로 모든 e가 바뀌어 'grEEn'이 된다. '-'.join으로 이으면 'RED3-BLUE2-grEEn'이다. text.find('blue')는 'red ' 다음인 인덱스 4를 돌려주고, text.count('re')는 red 3개와 green 안의 re까지 겹치지 않게 세어 4이다. replace는 첫 번째만이 아니라 모든 일치 부분을 바꾼다는 점이 자주 헷갈린다.","difficulty":"중","point":"딕셔너리 get·items 순회와 문자열 메서드"},{"id":"integration-1","bucketLabel":"통합·패키징","type":"short","language":"","question":"다음은 디지털 저작권 관리(DRM) 구성요소에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 용어를 쓰시오.\n\n- ( ① ) : 저작권에 대한 사용 권한, 라이선스 발급, 사용량에 따른 결제 및 과금을 관리하는 정산·관리 주체이다.\n- ( ② ) : 콘텐츠를 메타데이터와 함께 배포 가능한 단위로 묶고 암호화하는 프로그램이다.\n- ( ③ ) : 콘텐츠가 유통 과정에서 불법으로 유출되지 않도록 원본을 안전하게 보호하는 전자적 보안 장치이다.","code":"","parts":[{"label":"①","answers":["클리어링 하우스","Clearing House","클리어링하우스","정산소","Clearinghouse","클리어링 하우스(Clearing House)"]},{"label":"②","answers":["패키저","Packager","패키저(Packager)"]},{"label":"③","answers":["보안 컨테이너","Secure Container","보안컨테이너","시큐어 컨테이너","시큐어컨테이너","보안 컨테이너(Secure Container)"]}],"explanation":"DRM 구성요소는 콘텐츠 제공자, 콘텐츠 분배자, 패키저, 보안 컨테이너, DRM 컨트롤러, 클리어링 하우스의 6가지로 정리된다. ①은 '라이선스 발급·결제·과금'이라는 단서가 핵심으로, 키 관리와 정산을 맡는 클리어링 하우스이다. ②는 콘텐츠와 메타데이터를 묶어 암호화하는 패키저이며, 암호화된 콘텐츠를 실제로 전달하는 콘텐츠 분배자(Distributor)와 혼동하기 쉽다. ③은 유통 중 원본을 보호하는 저장·전달 단위인 보안 컨테이너이고, 배포된 콘텐츠의 이용 권한을 단말에서 통제하는 쪽은 DRM 컨트롤러이므로 구분해야 한다.","difficulty":"중","point":"패키징 - DRM 구성요소"},{"id":"java-3","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"public class Main {\n    static String log = \"\";\n    static int check(int n) {\n        try {\n            if (n % 3 == 0) throw new ArithmeticException();\n            if (n > 4) throw new IllegalArgumentException();\n            return n;\n        } catch (ArithmeticException e) {\n            return n * 10;\n        } finally {\n            log += n;\n        }\n    }\n    public static void main(String[] args) {\n        int sum = 0;\n        for (int i = 1; i <= 6; i++) {\n            try {\n                sum += check(i);\n            } catch (IllegalArgumentException e) {\n                sum -= 1;\n            }\n        }\n        System.out.println(log);\n        System.out.println(sum);\n    }\n}","parts":[{"label":"출력 결과","answers":["123456\n96"]}],"explanation":"finally 블록은 try에서 return을 하든, catch로 잡히든, 잡히지 않은 예외가 밖으로 전파되든 항상 실행되므로 log에는 1부터 6까지 모두 붙어 '123456'이 된다. n=1,2,4는 그대로 반환되어 sum에 1, 2, 4가 더해진다. n=3과 6은 ArithmeticException이 발생해 같은 메서드의 catch에서 n*10인 30, 60이 반환된다. n=5는 IllegalArgumentException이 발생하는데 check 안에는 이를 잡는 catch가 없으므로 main으로 전파되고, main의 catch에서 sum이 1 감소한다. 이때 sum += check(5)의 덧셈은 수행되지 않는다. 따라서 sum = 1+2+30+4-1+60 = 96이다.","difficulty":"상","point":"예외 처리 흐름"},{"id":"security-3","bucketLabel":"정보 보안","type":"short","language":"","question":"다음은 접근 통제 모델에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 모델명을 쓰시오.\n\n- ( ① ) : 미 국방부의 군사 보안 정책을 기반으로 한 기밀성 중심의 강제적 접근 통제(MAC) 모델로, 주체는 자신보다 높은 보안 등급의 객체를 읽을 수 없고(No Read Up), 자신보다 낮은 보안 등급의 객체에 쓸 수 없다(No Write Down).\n- ( ② ) : ( ① ) 모델이 무결성을 다루지 못하는 단점을 보완하기 위해 만들어진 무결성 중심 모델로, 주체는 자신보다 낮은 무결성 등급의 객체를 읽을 수 없고(No Read Down), 자신보다 높은 무결성 등급의 객체에 쓸 수 없다(No Write Up).\n- ( ③ ) : 상업용 환경의 무결성 보장을 목적으로 하는 모델로, 주체가 객체에 직접 접근하지 못하고 반드시 검증된 프로그램(잘 형성된 트랜잭션)을 통해서만 접근하도록 하며, 직무 분리 원칙을 적용한다.","code":"","parts":[{"label":"①","answers":["벨-라파듈라 모델","벨-라파듈라","벨 라파듈라 모델","벨 라파듈라","벨라파듈라 모델","벨라파듈라","BLP","BLP 모델","Bell-LaPadula","Bell-LaPadula Model","Bell LaPadula","BellLaPadula","Bell-La Padula","Bell La Padula","Bell-La Padula Model","벨-라파듈라(BLP)","BLP(Bell-LaPadula)","벨-라파둘라 모델","벨-라파둘라","벨 라파둘라 모델","벨 라파둘라","벨라파둘라 모델","벨라파둘라","Bell-LaPadula 모델","BellLaPadula 모델","Bell LaPadula 모델","벨-라파듈라(BLP) 모델","BLP(벨-라파듈라) 모델","BLP(벨-라파듈라)","Bell-LaPadula(BLP)","벨-라파듈라 보안 모델","벨-라파듈라 기밀성 모델"]},{"label":"②","answers":["비바 모델","비바","비바 무결성 모델","Biba","Biba Model","Biba Integrity Model","비바(Biba)","Biba 무결성 모델","Biba 모델","비바(Biba) 모델","Biba(비바)","Biba(비바) 모델","비바 모델(Biba)"]},{"label":"③","answers":["클락-윌슨 모델","클락-윌슨","클락 윌슨 모델","클락 윌슨","클락윌슨 모델","클락윌슨","클라크-윌슨 모델","클라크 윌슨","Clark-Wilson","Clark-Wilson Model","Clark Wilson","ClarkWilson","클락-윌슨(Clark-Wilson)","Clark-Wilson 무결성 모델","클락-윌슨 무결성 모델","클라크-윌슨","클라크윌슨","클라크윌슨 모델","클라크 윌슨 모델","Clark-Wilson 모델","ClarkWilson 모델","Clark Wilson 모델","클락-윌슨(Clark-Wilson) 모델","Clark-Wilson(클락-윌슨)","클라크-윌슨 무결성 모델","Clark-Wilson Integrity Model","CW 모델","CWM"]}],"explanation":"벨-라파듈라(BLP) 모델은 군사 기밀 보호를 위해 설계된 기밀성 모델로, 단순 보안 속성(No Read Up)과 *-속성(No Write Down)으로 정보가 높은 등급에서 낮은 등급으로 흘러내리는 것을 막는다. 비바(Biba) 모델은 BLP가 무결성을 보장하지 못하는 점을 보완한 무결성 모델로, 규칙이 BLP와 정확히 반대 방향(No Read Down, No Write Up)인 점이 핵심 구분 포인트이다. 클락-윌슨(Clark-Wilson) 모델은 상업용 무결성 모델로, 주체가 객체에 직접 접근하는 대신 검증된 프로그램(잘 형성된 트랜잭션)을 거치도록 강제하고 직무 분리를 적용한다. 기밀성과 무결성 어느 쪽을 보호하는지, 읽기·쓰기 규칙의 방향, 그리고 「프로그램을 통한 간접 접근·직무 분리」라는 단서로 세 모델을 구분한다. 이 밖에 이해 충돌 방지를 목적으로 하는 만리장성(Chinese Wall, Brewer-Nash) 모델도 함께 출제되므로 구분해 둔다.","difficulty":"상","point":"접근 통제 모델"},{"id":"sql-n3","bucketLabel":"SQL","type":"short","language":"SQL","question":"다음 〈사원〉 테이블에 대해 아래 SQL 문을 순서대로 실행했을 때, 마지막 SELECT 문이 출력하는 COUNT(*), COUNT(보너스), AVG(보너스) 의 값을 각각 쓰시오.\n\n〈사원〉\n\n| 사번 | 이름 | 부서 | 급여 | 보너스 |\n|---|---|---|---|---|\n| 1 | 김하늘 | 영업 | 300 | 50 |\n| 2 | 이바다 | 개발 | 350 | NULL |\n| 3 | 박산 | 영업 | 200 | NULL |\n| 4 | 최강 | 인사 | 280 | 30 |\n| 5 | 정우 | 개발 | 400 | 80 |\n| 6 | 한결 | 영업 | 320 | NULL |\n| 7 | 서진 | 인사 | 260 | NULL |\n\n```sql\nUPDATE 사원 SET 보너스 = 40 WHERE 부서 = '영업' AND 보너스 IS NULL;\nDELETE FROM 사원 WHERE 급여 < 250 OR 이름 LIKE '서%';\nSELECT COUNT(*), COUNT(보너스), AVG(보너스) FROM 사원;\n```","code":"","parts":[{"label":"COUNT(*)","answers":["5","5행","5개"]},{"label":"COUNT(보너스)","answers":["4","4개","4행"]},{"label":"AVG(보너스)","answers":["50","50.0","50.00","50.000"]}],"explanation":"UPDATE 는 부서가 영업이면서 보너스가 NULL 인 3번(박산)과 6번(한결)의 보너스를 40 으로 바꾼다. 1번(김하늘)은 영업이지만 보너스가 50 이라 조건에 걸리지 않는다. DELETE 는 급여가 250 미만인 3번(200)과 이름이 '서'로 시작하는 7번(서진)을 삭제한다. 남은 행은 1(50), 2(NULL), 4(30), 5(80), 6(40) 의 5행이므로 COUNT(*)는 5이고, COUNT(보너스)는 NULL 을 세지 않으므로 4이다. AVG 역시 NULL 을 제외한 4개 값의 평균 (50+30+80+40)/4 = 50 이다. NULL 을 0 으로 보고 200/5 = 40 으로 계산하거나, UPDATE 를 빠뜨려 3개 값으로 평균을 내지 않도록 주의한다.","difficulty":"상","point":"DML 순차 실행 후 집계 결과"}]},{"key":"r2","name":"제2회 모의고사","questions":[{"id":"security-n0","bucketLabel":"정보 보안","type":"short","language":"","question":"다음 설명에 해당하는 웹 애플리케이션 공격 기법을 쓰시오.\n\n- 공격자는 이미 특정 웹 사이트에 로그인되어 있는 사용자가 공격자가 준비한 링크를 클릭하거나 악성 페이지를 열도록 유도한다.\n- 이때 사용자의 브라우저는 해당 사이트의 세션 쿠키를 자동으로 함께 전송하므로, 서버는 공격자가 미리 만들어 둔 요청(비밀번호 변경, 송금, 게시글 등록 등)을 정상 사용자가 보낸 것으로 판단하여 처리한다.\n- 악성 스크립트가 사용자의 브라우저에서 실행되는 것이 핵심이 아니라, 사용자의 권한을 빌려 서버에 공격자가 의도한 요청을 보내게 한다는 점이 특징이다.\n- 대응 방법으로 폼이나 요청마다 예측 불가능한 일회성 토큰을 포함시켜 서버에서 검증하거나, Referer 헤더 확인, 중요 기능 수행 시 재인증 등을 적용한다.","code":"","parts":[{"label":"정답","answers":["CSRF","Cross-Site Request Forgery","Cross Site Request Forgery","사이트 간 요청 위조","크로스 사이트 요청 위조","크로스사이트 요청 위조","사이트 간 요청 변조","크로스 사이트 요청 변조","XSRF","CSRF(Cross-Site Request Forgery)","사이트 간 요청 위조(CSRF)","CSRF 공격","XSRF 공격","사이트 간 요청 위조 공격","사이트 간 요청 변조 공격","크로스 사이트 요청 위조 공격","크로스 사이트 요청 변조 공격","교차 사이트 요청 위조","교차 사이트 요청 변조","크로스 사이트 리퀘스트 포저리","Cross-Site Request Forgery Attack","CSRF(크로스 사이트 요청 위조)","CSRF(크로스 사이트 요청 변조)","CSRF(사이트 간 요청 위조)","CSRF(사이트 간 요청 변조)","크로스 사이트 요청 위조(CSRF)","크로스 사이트 요청 변조(CSRF)","사이트 간 요청 변조(CSRF)","Cross-Site Request Forgery(CSRF)","세션 라이딩","Session Riding","원 클릭 공격","One-Click Attack"]}],"explanation":"로그인된 사용자의 브라우저가 세션 쿠키를 자동으로 전송하는 특성을 악용하여, 사용자가 의도하지 않은 요청을 서버가 정상 요청으로 처리하게 만드는 공격이 CSRF(사이트 간 요청 위조)이다. XSS는 공격자의 스크립트가 피해자 브라우저에서 «실행»되어 쿠키 탈취 등을 노리는 반면, CSRF는 스크립트 실행 여부와 무관하게 사용자의 «권한을 빌려 서버에 요청»을 보내게 한다는 점에서 구분된다. SSRF는 서버가 공격자가 지정한 내부 자원으로 요청을 보내게 하는 서버 측 공격이고, 세션 하이재킹은 세션 식별자 자체를 탈취하는 공격이므로 설명과 맞지 않는다. 서버가 요청의 출처를 검증하지 않는 것이 근본 원인이므로, 요청마다 예측 불가능한 토큰(CSRF 토큰)을 발급·검증하거나 Referer 확인, SameSite 쿠키 속성, 중요 기능 재인증으로 방어한다.","difficulty":"중","point":"웹 공격 유형"},{"id":"c-4","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nint acc(int v) {\n    static int total = 0;\n    int local = 0;\n    total += v;\n    local += v;\n    return total + local;\n}\n\nint main() {\n    int r = 0;\n    for (int i = 1; i <= 4; i++) {\n        r = acc(i * 2);\n        if (i > 1) printf(\" \");\n        printf(\"%d\", r);\n    }\n    printf(\"\\n%d\\n\", acc(0));\n    return 0;\n}","parts":[{"label":"출력 결과","answers":["4 10 18 28\n20"]}],"explanation":"static으로 선언한 지역변수 total은 프로그램 시작 시 한 번만 0으로 초기화되고 함수가 끝나도 값이 유지되므로, 호출될 때마다 인자가 누적된다. 반면 일반 지역변수 local은 호출마다 새로 0으로 만들어지므로 그 호출의 인자 v만 담는다. 인자는 2, 4, 6, 8 순으로 들어오며 total은 2, 6, 12, 20으로 누적되고 반환값 total + local은 4, 10, 18, 28이 된다. 마지막 acc(0)은 total이 20으로 유지된 상태에서 local이 0이므로 20을 반환한다. static을 빼면 total도 매번 0부터 시작해 4, 8, 12, 16과 0이 출력되므로 static의 유무가 결과를 가른다.","difficulty":"하","point":"static 지역변수의 누적"},{"id":"design-n0","bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음 설명에 해당하는 GoF(Gang of Four) 디자인 패턴의 이름을 쓰시오.\n\n- 구조(Structural) 패턴의 하나로, 기존 객체를 그 객체와 동일한 인터페이스를 가진 다른 객체로 감싸서(wrapping) 부가적인 책임이나 기능을 실행 시간에 동적으로 덧붙이는 방식으로 구현한다.\n- 기능을 확장할 때마다 서브클래스를 계속 늘려야 하는 상속 방식의 대안으로 제시되었으며, 감싸는 객체를 여러 겹으로 중첩하여 필요한 기능들을 자유롭게 조합할 수 있다.\n- 감싸는 객체가 원래 객체의 인터페이스를 그대로 유지하므로 클라이언트는 기능이 추가된 객체를 원래 객체와 똑같이 사용할 수 있다.\n- 예: 파일 입출력 스트림 객체에 버퍼링, 압축, 암호화 기능을 선택적으로 겹쳐 추가하는 경우","code":"","parts":[{"label":"정답","answers":["데코레이터(Decorator)","데코레이터","데코레이터 패턴","Decorator","Decorator Pattern","장식자 패턴","장식자","데코레이터 패턴(Decorator Pattern)","데코레이터(Decorator) 패턴","Decorator 패턴","장식자(Decorator)","장식자 패턴(Decorator Pattern)","장식 패턴","데커레이터","데커레이터 패턴","데커레이터(Decorator)"]}],"explanation":"데코레이터(Decorator) 패턴은 객체를 같은 인터페이스의 래퍼 객체로 감싸 부가 기능(책임)을 동적으로 추가하는 구조 패턴으로, 상속으로 기능을 확장할 때 생기는 서브클래스 폭발 문제를 객체 합성으로 해결한다. 래퍼를 여러 겹 중첩해 기능을 조합할 수 있고 클라이언트는 원래 객체와 동일하게 사용한다는 점이 핵심 단서이다. 프록시(Proxy) 패턴은 같은 인터페이스로 감싼다는 구조는 비슷하지만 목적이 접근 제어·지연 생성·원격 접근 등 대리 역할이지 기능 추가가 아니며, 여러 겹으로 중첩해 조합하지도 않는다. 어댑터(Adapter)는 호환되지 않는 인터페이스를 변환하는 것이 목적이므로 「동일한 인터페이스 유지」와 맞지 않고, 브리지(Bridge)는 추상과 구현을 분리해 독립적으로 확장하는 패턴, 컴포지트(Composite)는 부분-전체 계층을 트리로 구성하는 패턴, 퍼사드(Facade)는 복잡한 서브시스템에 단일 창구 인터페이스를 제공하는 패턴이다.","difficulty":"중","point":"GoF 디자인 패턴"},{"id":"java-4","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"public class Main {\n    static String conv(String s) {\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i < s.length(); i++) {\n            char c = s.charAt(i);\n            if (c >= 'a' && c <= 'z') sb.append((char)(c - 32));\n            else if (c >= 'A' && c <= 'Z') sb.append((char)(c + 32));\n            else sb.append(c);\n        }\n        return sb.reverse().toString();\n    }\n    public static void main(String[] args) {\n        String s = \"Java2Code\";\n        String r = conv(s);\n        System.out.println(r);\n        System.out.println(r.indexOf(\"A\") + r.substring(2, 5));\n        int cnt = 0;\n        for (char c : r.toCharArray()) {\n            if (c == 'a' || c == 'A') cnt++;\n        }\n        System.out.println(cnt);\n    }\n}","parts":[{"label":"출력 결과","answers":["EDOc2AVAj\n5Oc2\n2"]}],"explanation":"conv()는 소문자는 32를 빼서 대문자로, 대문자는 32를 더해 소문자로 바꾸고(숫자는 그대로) 마지막에 StringBuilder.reverse()로 뒤집는다. 'Java2Code'는 대소문자 반전 후 'jAVA2cODE'가 되고, 뒤집으면 'EDOc2AVAj'가 되어 첫 줄에 출력된다. 두 번째 줄에서 r.indexOf(\"A\")는 첫 'A'의 위치인 5(int)이고 r.substring(2, 5)는 인덱스 2부터 4까지인 'Oc2'이다. int와 String을 +로 결합하면 산술 덧셈이 아니라 문자열 결합이 되어 '5Oc2'가 된다. 마지막으로 r에서 'a' 또는 'A'는 인덱스 5와 7의 두 개이므로 2가 출력된다. substring의 끝 인덱스는 포함되지 않는다는 점과 int+String 결합 순서가 헷갈리기 쉬운 부분이다.","difficulty":"중","point":"문자열 처리"},{"id":"network-n1","bucketLabel":"네트워크","type":"short","language":"","question":"다음은 OSI 7계층 중 세 계층에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 계층의 이름을 쓰시오.\n\n- ( ① ): 응용 계층에서 넘어온 데이터를 수신 측이 이해할 수 있는 공통 형식으로 맞추는 계층으로, 코드 변환(ASCII↔EBCDIC), 데이터 압축, 암호화·복호화를 담당한다. JPEG, MPEG 등이 이 계층에 해당한다.\n- ( ② ): 양 끝 응용 프로세스 사이의 대화(Dialogue)를 설정·관리·해제하는 계층으로, 전이중/반이중 등 대화 방식을 결정하고 동기점(Synchronization Point)을 삽입하여 오류 발생 시 동기점부터 다시 전송(복구)할 수 있게 한다.\n- ( ③ ): 물리적으로 인접한 두 노드 사이에서 프레임(Frame) 단위로 데이터를 전송하는 계층으로, MAC 주소를 사용하며 흐름 제어와 오류 제어를 수행한다. 대표 장비는 브리지·스위치이고 HDLC, PPP가 이 계층의 프로토콜이다.","code":"","parts":[{"label":"①","answers":["표현 계층","표현","Presentation Layer","Presentation","프레젠테이션 계층","표현 계층(Presentation Layer)","프리젠테이션 계층","프리젠테이션","Presentation 계층","표현 계층(Presentation)","표현 계층(프레젠테이션 계층)"]},{"label":"②","answers":["세션 계층","세션","Session Layer","Session","세션 계층(Session Layer)","Session 계층","세션 계층(Session)"]},{"label":"③","answers":["데이터 링크 계층","데이터 링크","Data Link Layer","Data Link","데이터 링크 계층(Data Link Layer)","Data Link 계층","데이터 링크 계층(Data Link)","Datalink Layer","데이터링크 계층(Datalink Layer)"]}],"explanation":"표현 계층(6계층)은 송·수신 측의 데이터 표현 방식 차이를 해소하는 계층으로 코드 변환, 데이터 압축, 암호화·복호화를 담당하며 JPEG·MPEG·ASCII 등이 속한다. 세션 계층(5계층)은 응용 프로세스 간 대화를 설정·유지·종료하고 대화 방식(전이중/반이중)을 정하며 동기점을 두어 장애 시 복구 지점을 제공하는데, 동기점은 다른 계층에는 없는 세션 계층만의 식별 단서이다. 데이터 링크 계층(2계층)은 PDU가 프레임이고 MAC 주소로 인접 노드를 식별하며 브리지·스위치, HDLC·PPP가 대표적이다. 비슷한 설명이라도 '세그먼트·포트 번호·종단 간 신뢰성'이면 전송 계층, '패킷·IP 주소·라우팅·라우터'이면 네트워크 계층, '비트·전기 신호·리피터·허브'이면 물리 계층으로 구분한다.","difficulty":"중","point":"OSI 7계층 — 계층별 역할·PDU·장비"},{"id":"python-3","bucketLabel":"Python","type":"code","language":"Python","question":"다음 Python 코드의 출력 결과를 쓰시오.","code":"class Counter:\n    def __init__(self, start):\n        self.value = start\n        self.calls = 0\n\n    def step(self, n):\n        self.calls += 1\n        if n == 0:\n            return self.value\n        if n % 2 == 0:\n            self.value += n // 2\n        else:\n            self.value -= n % 3\n        return self.step(n - 1)\n\nc = Counter(10)\nprint(c.step(5))\nprint(c.calls)\nc2 = Counter(-7)\nprint(c2.value // 2, c2.value % 3)","parts":[{"label":"출력 결과","answers":["10\n6\n-4 2"]}],"explanation":"c.step(5)는 n이 0이 될 때까지 자기 자신을 재귀 호출하며 calls를 1씩 늘린다. n=5(홀수)에서 value는 10-5%3=10-2=8, n=4(짝수)에서 8+4//2=10, n=3에서 10-0=10, n=2에서 10+1=11, n=1에서 11-1=10이 되고 n=0에서 10을 반환한다. 호출은 n=5,4,3,2,1,0으로 총 6번이므로 calls는 6이다. 파이썬의 //는 내림(floor) 나눗셈이라 -7//2는 -3.5를 내린 -4이며, %의 결과는 나누는 수와 같은 부호를 가지므로 -7%3은 2이다(-7 = 3*(-3) + 2). C나 Java처럼 0 방향 절삭(-3, -1)으로 계산하면 틀리므로 음수 나눗셈 규칙을 구분해 기억해야 한다.","difficulty":"상","point":"클래스·재귀 메서드와 // · % 부호 규칙"},{"id":"db-2","bucketLabel":"데이터베이스","type":"short","language":"","question":"다음 설명에 해당하는 데이터베이스 회복 기법을 쓰시오.\n\n트랜잭션이 시작되면 현재 페이지 테이블을 복사하여 디스크에 보관해 두고, 트랜잭션 수행 중 데이터 페이지를 변경할 때는 원래 페이지를 덮어쓰지 않고 새로운 페이지에 기록한 뒤 현재 페이지 테이블만 갱신한다. 트랜잭션이 완료되면 새 페이지 테이블을 유효한 것으로 확정하고, 장애가 발생하면 보관해 둔 복사본 페이지 테이블로 되돌린다. 로그(log)를 사용하지 않으며 Undo·Redo 작업이 필요 없다.","code":"","parts":[{"label":"정답","answers":["그림자 페이징","그림자 페이징 기법","그림자 페이지","섀도 페이징","쉐도우 페이징","Shadow Paging","Shadow Page","그림자 페이징 회복 기법","그림자 페이지 기법","섀도우 페이징","섀도 페이지","쉐도우 페이지","섀도우 페이지","Shadow Paging 기법","Shadow Paging Recovery","쉐도 페이징","섀도 페이징 기법","섀도우 페이징 기법","쉐도우 페이징 기법","쉐도 페이징 기법","Shadow Paging Technique"]}],"explanation":"그림자 페이징(Shadow Paging)은 로그를 사용하지 않는 회복 기법으로, 트랜잭션 시작 시 페이지 테이블을 복사(그림자 페이지 테이블)해 두고 변경은 새 페이지에만 기록한다. 장애가 나면 그림자 페이지 테이블로 돌아가면 되므로 별도의 Undo·Redo가 필요 없다는 점이 가장 큰 특징이다. 반면 즉시 갱신 기법과 지연 갱신 기법은 로그를 기록하여 각각 Undo·Redo, Redo만 수행하고, 검사점(Checkpoint) 기법은 로그에 검사점을 기록해 회복 범위를 줄이는 방식이므로 모두 로그에 의존한다. 미디어 회복은 덤프(복사본)로 디스크 장애를 복구하는 기법이라 페이지 테이블과 무관하다. 따라서 «페이지 테이블 복사본»과 «로그 미사용»이라는 단서로 그림자 페이징이 유일한 답이 된다.","difficulty":"상","point":"회복 기법"},{"id":"c-n0","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nstruct Item {\n    int id;\n    int qty;\n    int price;\n};\n\nint total(struct Item *p, int n) {\n    int sum = 0;\n    for (int i = 0; i < n; i++) {\n        sum += (p + i)->qty * (p + i)->price;\n    }\n    return sum;\n}\n\nvoid swap(struct Item *a, struct Item *b) {\n    struct Item t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main() {\n    struct Item arr[4] = { {1, 3, 200}, {2, 5, 100}, {3, 2, 450}, {4, 4, 150} };\n    struct Item *p = arr;\n    int idx = 0;\n    for (int i = 1; i < 4; i++) {\n        if ((p + i)->qty * (p + i)->price > (p + idx)->qty * (p + idx)->price)\n            idx = i;\n    }\n    swap(&arr[0], &arr[idx]);\n    p++;\n    p->qty += 2;\n    printf(\"%d %d\\n\", arr[0].id, arr[1].qty);\n    printf(\"%d\\n\", total(arr, 4));\n    return 0;\n}\n","parts":[{"label":"출력 결과","answers":["3 7\n2800"]}],"explanation":"(p + i)->qty 는 arr[i].qty 와 같다. 각 항목의 qty*price 는 600, 500, 900, 600 이므로 가장 큰 항목은 idx=2(id 3)이다. swap 은 구조체 포인터로 구조체 전체를 복사하므로 arr[0] 과 arr[2] 가 통째로 바뀌어 arr 은 {3,2,450},{2,5,100},{1,3,200},{4,4,150} 이 된다. p++ 로 p 는 arr[1] 을 가리키고 p->qty += 2 로 arr[1].qty 는 7 이 되어 첫 줄은 3 7 이다. total 은 2*450 + 7*100 + 3*200 + 4*150 = 900+700+600+600 = 2800 이다. 구조체 포인터는 ++ 시 구조체 크기만큼 이동하므로 다음 원소를 가리킨다는 점이 핵심이다.","difficulty":"중","point":"구조체 배열과 구조체 포인터(->) 접근, 포인터로 구조체 교환"},{"id":"sql-n0","bucketLabel":"SQL","type":"short","language":"SQL","question":"다음은 〈학생〉 테이블과 〈학과〉 테이블이다. 아래 SQL 문 ①, ②, ③을 각각 실행했을 때 출력되는 값을 쓰시오.\n\n〈학생〉\n\n| 학번 | 이름 | 학과코드 |\n|---|---|---|\n| 1001 | 김민준 | D01 |\n| 1002 | 이서연 | D02 |\n| 1003 | 박도윤 | NULL |\n| 1004 | 최하은 | D01 |\n| 1005 | 정시우 | D04 |\n| 1006 | 한지아 | D02 |\n| 1007 | 송예준 | NULL |\n\n〈학과〉\n\n| 학과코드 | 학과명 |\n|---|---|\n| D01 | 컴퓨터공학 |\n| D02 | 경영학 |\n| D03 | 전자공학 |\n\n```sql\n-- ①\nSELECT COUNT(*) FROM 학생 S INNER JOIN 학과 D ON S.학과코드 = D.학과코드;\n\n-- ②\nSELECT COUNT(*) FROM 학생 S LEFT OUTER JOIN 학과 D ON S.학과코드 = D.학과코드;\n\n-- ③\nSELECT COUNT(*) FROM 학생 S LEFT OUTER JOIN 학과 D ON S.학과코드 = D.학과코드\n WHERE D.학과코드 IS NULL;\n```","code":"","parts":[{"label":"①","answers":["4","4행","4개"]},{"label":"②","answers":["7","7행","7개"]},{"label":"③","answers":["3","3행","3개"]}],"explanation":"INNER JOIN 은 조인 조건을 만족하는 행만 남기므로 학과코드가 D01, D02 인 학생 4명(1001, 1002, 1004, 1006)만 결과에 포함되어 ①은 4이다. 학과코드가 NULL 인 1003·1007 은 NULL = D.학과코드 비교가 참이 될 수 없고, 〈학과〉에 없는 D04 를 가진 1005 도 짝이 없어 제외된다. LEFT OUTER JOIN 은 왼쪽 테이블인 〈학생〉의 모든 행을 유지하고 짝이 없는 행은 〈학과〉 쪽 열을 NULL 로 채우므로 ②는 학생 수와 같은 7이다. ③은 LEFT OUTER JOIN 결과에서 〈학과〉 쪽 학과코드가 NULL 인 행, 즉 짝을 찾지 못한 학생만 고르는 조건이므로 1003, 1005, 1007 의 3행이다. 〈학과〉의 D03 은 소속 학생이 없지만 오른쪽 테이블이므로 LEFT OUTER JOIN 결과에는 나타나지 않는다는 점에 주의한다.","difficulty":"중","point":"조인 유형별 결과 행 수"},{"id":"test-2","bucketLabel":"테스트","type":"short","language":"","question":"어떤 모듈의 제어 흐름 그래프(Control Flow Graph)를 작성하였더니 노드(N)가 8개, 간선(E)이 11개였다. 맥케이브(McCabe)의 순환 복잡도(Cyclomatic Complexity) V(G)를 구하시오. (답은 숫자만 쓰시오.)","code":"","parts":[{"label":"정답","answers":["5","5개","V(G)=5","V(G) = 5"]}],"explanation":"맥케이브 순환 복잡도는 제어 흐름 그래프에서 V(G) = E - N + 2 (E: 간선 수, N: 노드 수)로 계산한다. 주어진 값을 대입하면 V(G) = 11 - 8 + 2 = 5이다. 같은 값은 「단순 결정 노드 수 + 1」(V(G) = P + 1) 또는 「그래프 내 영역 수」로도 구할 수 있으며 세 방법의 결과는 항상 같다. V(G)는 독립 경로의 개수이므로 기본 경로 커버리지를 만족하려면 최소 5개의 테스트 케이스가 필요하고, 일반적으로 10을 넘으면 모듈이 복잡하여 오류 발생 가능성이 높다고 본다. E - N + 2에서 +2를 빼먹거나 N - E로 순서를 바꾸는 실수를 주의한다.","difficulty":"중","point":"화이트박스 테스트 - 맥케이브 순환 복잡도"},{"id":"java-n3","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"public class Main {\n    static int cnt = 0;\n    static boolean check(int v) {\n        cnt++;\n        return v % 2 == 0;\n    }\n    public static void main(String[] args) {\n        int x = 7, y = 10;\n        boolean r1 = check(x) && check(y);\n        boolean r2 = check(x) & check(y);\n        boolean r3 = check(y) || check(x);\n        boolean r4 = check(y) | check(x);\n        System.out.println(r1 + \" \" + r2 + \" \" + r3 + \" \" + r4 + \" \" + cnt);\n        int a = 17, b = 5;\n        a /= b;\n        b += a * 2;\n        int c = (a > b) ? a - b : b - a;\n        c -= y / x * x;\n        a <<= 2;\n        char ch = 'a';\n        ch += 2;\n        int code = ch + 1;\n        System.out.println(a + \" \" + b + \" \" + c + \" \" + ch + \" \" + code + \" \" + (char)(code - 2));\n        x = (x & 1) == 1 ? x * 3 + 1 : x / 2;\n        y = (y ^ x) % 7;\n        System.out.println(x + \" \" + y);\n    }\n}","parts":[{"label":"출력 결과","answers":["false false true true 6\n12 11 1 c 100 b\n22 0"]}],"explanation":"&& 와 || 는 왼쪽 피연산자만으로 결과가 결정되면 오른쪽을 평가하지 않지만(단락 평가), & 와 | 는 항상 양쪽을 모두 평가한다. r1: check(7)=false 이므로 check(10) 은 호출되지 않아 cnt=1. r2: 둘 다 호출되어 cnt=3, 결과 false. r3: check(10)=true 로 단락되어 cnt=4, 결과 true. r4: 둘 다 호출되어 cnt=6, 결과 true. 2행: a=17/5=3, b=5+3*2=11, c=(3>11)? : 11-3=8, c -= 10/7*7 에서 10/7=1(정수 나눗셈) 이므로 c=8-7=1, a<<=2 로 a=12. ch 는 복합 대입이라 형변환 없이 'a'+2='c' 가 되고, ch + 1 은 int 로 승격되어 code=100, (char)(100-2)=98 은 'b' 이다. 3행: 7&1=1 이므로 x=7*3+1=22, 10^22 = 01010^10110 = 11100 = 28, 28%7=0 이므로 y=0 이다.","difficulty":"중","point":"논리 연산자 단락 평가의 부수효과와 복합 대입·삼항·정수 나눗셈·char 승격"},{"id":"os-2","bucketLabel":"운영체제","type":"short","language":"","question":"페이지 프레임이 3개인 시스템에서 LRU(Least Recently Used) 페이지 교체 알고리즘을 사용할 때, 다음 페이지 참조열에 대한 페이지 부재(Page Fault) 횟수를 쓰시오. (초기에는 모든 프레임이 비어 있다.)\n\n참조열: 2, 3, 1, 3, 2, 4, 2, 5, 3, 2","code":"","parts":[{"label":"페이지 부재 횟수","answers":["6","6회","6번","6 회","여섯 번"]}],"explanation":"LRU는 페이지 부재가 발생했을 때 가장 오랫동안 사용되지 않은 페이지를 교체하는 기법이다. 참조열을 순서대로 추적하면 2(부재, [2]) → 3(부재, [2,3]) → 1(부재, [2,3,1]) → 3(적중) → 2(적중) → 4(부재, 가장 오래 안 쓴 1 교체, [3,2,4]) → 2(적중) → 5(부재, 가장 오래 안 쓴 3 교체, [2,4,5]) → 3(부재, 가장 오래 안 쓴 4 교체, [2,5,3]) → 2(적중)이 된다. 부재는 2, 3, 1, 4, 5, 3 참조 시점에서 총 6회 발생한다. 같은 참조열을 FIFO로 처리하면 6번째 참조 4에서 가장 먼저 들어온 2가 교체되어 부재가 7회가 되므로, 「가장 오래된 페이지」가 아니라 「가장 오래 사용되지 않은 페이지」를 고르는 LRU의 기준을 정확히 적용해야 한다.","difficulty":"중","point":"페이지 교체 알고리즘"},{"id":"design-n1","bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음 설명에 해당하는 소프트웨어 아키텍처 패턴의 이름을 쓰시오.\n\n- 데이터 스트림을 처리하는 절차의 각 단계를 독립적인 처리 컴포넌트로 캡슐화하고, 한 컴포넌트의 출력이 다음 컴포넌트의 입력으로 전달되도록 데이터 전송 통로로 이어 붙여 시스템을 구성한다.\n- 각 처리 컴포넌트는 서로의 존재를 알 필요 없이 입력 데이터를 변환하여 출력하기만 하므로 재사용성이 높고, 컴포넌트를 추가·교체하거나 순서를 재배치하여 다양한 처리 흐름을 구성하기 쉽다.\n- 단계 사이에서 데이터 형식을 변환하는 과정이 반복되므로 오버헤드가 발생할 수 있다.\n- 유닉스(UNIX) 쉘에서 명령어의 출력을 다음 명령어의 입력으로 연결하는 방식과, 어휘 분석 → 구문 분석 → 의미 분석 → 코드 생성 단계로 이루어진 컴파일러가 대표적인 예이다.","code":"","parts":[{"label":"정답","answers":["파이프-필터(Pipe-Filter)","파이프-필터","파이프 필터 패턴","Pipe-Filter","Pipe-Filter Pattern","Pipe and Filter","Pipes and Filters","파이프 앤 필터","파이프 앤드 필터","파이프 필터 아키텍처","파이프 필터 패턴(Pipe-Filter Pattern)","파이프-필터(Pipe-Filter) 패턴","Pipe-Filter 패턴","Pipe and Filter Pattern","Pipes and Filters Pattern","파이프 앤 필터 패턴","파이프 앤드 필터 패턴","파이프 앤 필터(Pipe and Filter)","파이프-필터 아키텍처 패턴","파이프-필터 구조","파이프-필터 스타일","Pipe & Filter","Pipe & Filter Pattern","파이프 & 필터"]}],"explanation":"파이프-필터(Pipe-Filter) 패턴은 데이터 스트림 처리의 각 단계를 필터(Filter) 컴포넌트로 캡슐화하고 필터 사이를 파이프(Pipe)로 연결해 데이터를 전달하는 아키텍처 패턴이다. 필터는 입력을 변환해 출력만 하므로 재사용성이 높고 재배치로 다양한 파이프라인을 만들 수 있지만, 필터 간 데이터 변환에 따른 오버헤드가 생긴다는 점이 교재에 공통으로 나오는 특징이다. 계층(Layered) 패턴은 하위 계층이 상위 계층에 서비스를 제공하는 수직 구조이고, 브로커(Broker) 패턴은 분산 환경에서 클라이언트와 서버 사이의 통신을 중개하며, 마스터-슬레이브(Master-Slave) 패턴은 마스터가 작업을 분할해 슬레이브에 배분하고 결과를 취합한다. MVC는 모델·뷰·컨트롤러로 역할을 분리하는 패턴이다. 「데이터가 한 방향으로 흐르며 단계별로 변환된다」와 「유닉스 쉘·컴파일러」가 이 패턴만의 식별 단서이다.","difficulty":"하","point":"소프트웨어 아키텍처 패턴"},{"id":"c-n5","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\n#define N 2 + 3\n#define SQUARE(x) x * x\n#define HALF(x) x / 2\n#define CUBE(x) ((x) * (x) * (x))\n\nint main() {\n    int a = 4, b = 9;\n    int r1 = N * N;\n    int r2 = SQUARE(a + 1);\n    int r3 = 36 / HALF(b - 3);\n    int r4 = CUBE(a - 1) - SQUARE(a) / 2;\n    int x = 5;\n    int y = x++ * 2;\n    y += ++x - N;\n    printf(\"%d %d %d %d\\n\", r1, r2, r3, r4);\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}\n","parts":[{"label":"출력 결과","answers":["11 9 3 19\n7 18"]}],"explanation":"매크로는 계산이 아니라 텍스트 치환이므로 괄호가 없으면 우선순위가 달라진다. N * N 은 2 + 3 * 2 + 3 = 11 이고, SQUARE(a + 1) 은 a + 1 * a + 1 = 4 + 4 + 1 = 9 이다. 36 / HALF(b - 3) 은 36 / b - 3 / 2 로 치환되어 36/9 - 3/2 = 4 - 1 = 3 이 된다(정수 나눗셈). CUBE 는 괄호가 완전하므로 (a-1)의 세제곱 27 이고, SQUARE(a) / 2 는 a * a / 2 = 8 이므로 r4 = 19 이다. y = x++ * 2 는 증가 전 값 5 를 써서 y = 10, x = 6 이 되고, y += ++x - N 은 y += ++x - 2 + 3 으로 치환되어 x = 7, y = 10 + (7 - 2 + 3) = 18 이 된다.","difficulty":"상","point":"#define 매크로 텍스트 치환과 연산자 우선순위, 전위·후위 증감 복합 대입"},{"id":"network-2","bucketLabel":"네트워크","type":"short","language":"","question":"다음은 라우팅 프로토콜에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 용어를 쓰시오.\n\n- ( ① ): 거리 벡터(Distance Vector) 알고리즘을 사용하는 내부 게이트웨이 프로토콜(IGP)로, 벨만-포드(Bellman-Ford) 알고리즘에 기반하여 홉 수(Hop Count)를 메트릭으로 사용하며 최대 홉 수가 15로 제한되어 소규모 네트워크에 적합하다.\n- ( ② ): 링크 상태(Link State) 알고리즘을 사용하는 내부 게이트웨이 프로토콜(IGP)로, 다익스트라(Dijkstra) 알고리즘으로 최단 경로를 계산하고 영역(Area) 단위로 네트워크를 계층적으로 관리하여 대규모 네트워크에 적합하다.\n- ( ③ ): 자율 시스템(AS) 간의 라우팅 정보 교환에 사용되는 외부 게이트웨이 프로토콜(EGP)로, 경로 벡터(Path Vector) 알고리즘을 사용하며 인터넷 백본 라우팅의 표준 프로토콜이다.","code":"","parts":[{"label":"①","answers":["RIP","Routing Information Protocol","RIP(Routing Information Protocol)","RIP 프로토콜"]},{"label":"②","answers":["OSPF","Open Shortest Path First","OSPF(Open Shortest Path First)","OSPF 프로토콜"]},{"label":"③","answers":["BGP","Border Gateway Protocol","BGP(Border Gateway Protocol)","BGP 프로토콜"]}],"explanation":"RIP(Routing Information Protocol)는 거리 벡터 방식의 대표 IGP 로, 벨만-포드 알고리즘을 기반으로 홉 수를 메트릭으로 사용하며 15홉을 초과하면 도달 불가로 간주하고 30초마다 전체 라우팅 테이블을 교환한다. OSPF(Open Shortest Path First)는 링크 상태 방식의 IGP 로, 각 라우터가 네트워크 전체 토폴로지를 알고 다익스트라 알고리즘으로 최단 경로를 계산하며, Area 개념으로 계층적 관리가 가능하고 홉 수 제한이 없어 대규모 네트워크에 쓰인다. BGP(Border Gateway Protocol)는 AS 사이의 경로를 교환하는 EGP 로, 경로 벡터 방식을 사용한다. IGP(RIP·OSPF·IGRP·EIGRP)는 하나의 AS 내부용, EGP(BGP·EGP)는 AS 간 용도라는 점으로 구분하면 된다. 같은 IGP 라도 RIP 은 「홉 수 15·벨만-포드」, OSPF 는 「링크 상태·다익스트라·Area」가 식별 단서이다.","difficulty":"중","point":"라우팅 프로토콜"},{"id":"python-n0","bucketLabel":"Python","type":"code","language":"Python","question":"다음 Python 코드의 출력 결과를 쓰시오.","code":"def apply(func, data):\n    return [func(x) for x in data]\n\nnums = [5, 12, 7, 3, 20, 8]\nsq = list(map(lambda x: x * 2 - 1, nums))\nev = list(filter(lambda x: x % 3 == 0, sq))\nwords = [\"kiwi\", \"apple\", \"fig\", \"banana\", \"cherry\"]\nw1 = sorted(words, key=len)\nw2 = sorted(words, key=lambda s: s[-1], reverse=True)\ntotal = sum(apply(lambda x: x // 4, nums))\nmx = max(nums, key=lambda x: x % 7)\nprint(ev)\nprint(w1[0], w1[-1])\nprint(w2[0], w2[2])\nprint(total, mx)","parts":[{"label":"출력 결과","answers":["[9, 39, 15]\nfig cherry\ncherry fig\n12 20"]}],"explanation":"map은 각 원소에 람다를 적용하므로 sq = [9, 23, 13, 5, 39, 15]가 되고, filter는 3의 배수만 남겨 ev = [9, 39, 15]가 된다. sorted(key=len)은 문자열 길이 기준 오름차순이며 길이가 같은 banana와 cherry는 원래 순서를 유지(안정 정렬)하므로 w1 = ['fig', 'kiwi', 'apple', 'banana', 'cherry'], 따라서 첫 원소는 fig, 마지막은 cherry이다. w2는 마지막 글자(i, e, g, a, y)를 기준으로 내림차순이므로 ['cherry', 'kiwi', 'fig', 'apple', 'banana']가 되어 w2[0]은 cherry, w2[2]는 fig이다. total은 각 원소를 4로 나눈 몫 1+3+1+0+5+2 = 12이고, max(key=lambda x: x % 7)은 7로 나눈 나머지(5, 5, 0, 3, 6, 1)가 가장 큰 원소인 20을 반환한다. sorted·max의 key는 비교 기준만 바꿀 뿐 반환되는 값은 원래 원소라는 점에 주의한다.","difficulty":"중","point":"람다 함수와 map·filter·sorted(key, reverse)·max"},{"id":"misc-n1","bucketLabel":"통합·패키징","type":"short","language":"","question":"다음 설명에 해당하는 도구의 이름을 쓰시오.\n\n인터페이스 보안을 위한 데이터 무결성 검사 도구의 하나로, 시스템 주요 파일의 해시(체크섬) 값과 속성을 기준 데이터베이스에 저장해 두었다가 주기적으로 현재 값과 비교함으로써, 크래커가 침입하여 백도어를 설치하거나 설정 파일을 변경하였을 때 이를 탐지한다. 1992년 미국 퍼듀(Purdue) 대학에서 처음 개발되었으며, 오픈 소스 버전과 상용 버전이 함께 제공된다.","code":"","parts":[{"label":"정답","answers":["Tripwire","트립와이어","트립와이어(Tripwire)","Tripwire(트립와이어)","Open Source Tripwire"]}],"explanation":"Tripwire는 1992년 퍼듀 대학에서 개발된 대표적인 파일 무결성 검사 도구로, 설치 시점의 파일 해시(체크섬)·속성을 기준 데이터베이스로 저장해 두고 이후 상태와 비교하여 변조된 파일을 찾아낸다. 크래커가 침입 후 백도어를 심거나 설정 파일을 바꾸면 해시 값이 달라지므로 탐지가 가능하며, 인터페이스 보안의 데이터 무결성 검사 도구 범주에 속한다. 오픈 소스 버전과 상용 버전이 모두 있다는 점이 AIDE(오픈 소스 전용), Samhain(다수 시스템 중앙 관리형), Fcheck 등 다른 무결성 검사 도구와의 구분 포인트이다. 네트워크 트래픽을 감시하는 침입 탐지 시스템(Snort 등)이나 취약점 점검 도구(Nessus 등)와는 목적이 다르므로 혼동하지 않는다.","difficulty":"중","point":"인터페이스 보안 - 데이터 무결성 검사 도구"},{"id":"java-n4","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"class Parent {\n    String name = \"Parent\";\n    static String kind() { return \"P-static\"; }\n    String who() { return \"P-who\"; }\n    String show() { return name + \"/\" + who(); }\n}\nclass Child extends Parent {\n    String name = \"Child\";\n    static String kind() { return \"C-static\"; }\n    String who() { return \"C-who\"; }\n    String both() { return name + \"+\" + super.name; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Parent p = new Child();\n        Child c = (Child) p;\n        System.out.println(p.name + \" \" + c.name);\n        System.out.println(p.kind() + \" \" + c.kind());\n        System.out.println(p.who() + \" \" + p.show());\n        System.out.println(c.both() + \" \" + ((Parent) c).name.length());\n    }\n}","parts":[{"label":"출력 결과","answers":["Parent Child\nP-static C-static\nC-who Parent/C-who\nChild+Parent 6"]}],"explanation":"인스턴스 메서드는 실제 객체 타입에 따라 동적으로 결정되지만, 필드와 static 메서드는 참조 변수의 선언 타입에 따라 컴파일 시점에 정적으로 결정된다. 1행: p 는 Parent 타입이므로 p.name 은 Parent 의 필드 \"Parent\", c 는 Child 타입이므로 c.name 은 Child 의 필드 \"Child\" 이다(같은 객체인데도 다름). 2행: static 메서드 kind() 는 재정의가 아니라 숨김이므로 p.kind() 는 Parent 의 P-static, c.kind() 는 Child 의 C-static 이 호출된다. 3행: who() 는 인스턴스 메서드라 재정의되어 p.who() 는 C-who 이다. p.show() 는 Parent 에 정의된 메서드이므로 그 안의 name 은 Parent 의 필드 \"Parent\" 를 가리키고, who() 는 다시 동적 바인딩되어 C-who 가 되어 Parent/C-who 가 출력된다. 4행: c.both() 는 Child 의 name 과 super.name 을 이어 Child+Parent 이고, ((Parent) c).name 은 \"Parent\" 이므로 길이 6 이다.","difficulty":"상","point":"상속에서 필드 은닉과 static 메서드 숨김"},{"id":"security-n2","bucketLabel":"정보 보안","type":"short","language":"","question":"다음은 IPSec(IP Security)에 대한 설명이다. 괄호 ( ① )~( ③ )에 들어갈 알맞은 용어를 쓰시오.\n\nIPSec은 네트워크 계층(IP 계층)에서 패킷 단위로 보안 서비스를 제공하는 프로토콜 집합으로, 두 가지 보안 프로토콜과 두 가지 동작 모드를 조합하여 사용한다.\n\n- ( ① ): 데이터 출처 인증, 무결성, 재전송(replay) 공격 방지 기능을 제공하지만, 데이터를 암호화하지 않으므로 기밀성은 제공하지 않는다.\n- ( ② ): ( ① )이 제공하는 인증·무결성 기능에 더하여 페이로드를 암호화함으로써 기밀성까지 제공한다.\n- ( ③ ) 모드: 원본 IP 헤더를 포함한 IP 패킷 전체를 보호 대상으로 하여 캡슐화한 뒤 새로운 IP 헤더를 덧붙이는 방식으로, 보안 게이트웨이 간 VPN 구성에 주로 사용된다. 이에 비해 전송(Transport) 모드는 IP 헤더를 제외한 상위 계층 페이로드만 보호한다.","code":"","parts":[{"label":"①","answers":["AH","Authentication Header","인증 헤더","AH(Authentication Header)","인증 헤더(AH)","Authentication Header(AH)","AH 프로토콜","인증 헤더 프로토콜"]},{"label":"②","answers":["ESP","Encapsulating Security Payload","보안 페이로드 캡슐화","캡슐화 보안 페이로드","ESP(Encapsulating Security Payload)","보안 페이로드 캡슐화(ESP)","캡슐화 보안 페이로드(ESP)","Encapsulating Security Payload(ESP)","Encapsulated Security Payload","ESP 프로토콜"]},{"label":"③","answers":["터널","터널 모드","Tunnel","Tunnel Mode","터널링","터널링 모드","터널 모드(Tunnel Mode)","터널(Tunnel)","터널(Tunnel) 모드","터널 모드(Tunnel)","Tunnel(터널)","Tunnel Mode(터널 모드)","Tunneling","Tunneling Mode","터널링 모드(Tunneling Mode)"]}],"explanation":"IPSec은 보안 프로토콜로 AH와 ESP, 동작 모드로 전송 모드와 터널 모드를 제공한다. AH(Authentication Header)는 인증·무결성·재전송 방지만 제공하고 암호화를 하지 않으므로 기밀성이 없으며, ESP(Encapsulating Security Payload)는 페이로드를 암호화하여 기밀성까지 제공한다(인증·무결성은 선택 적용). 터널 모드는 원본 IP 패킷 전체를 캡슐화하고 새 IP 헤더를 붙이므로 원래의 출발지·목적지 주소까지 숨길 수 있어 게이트웨이 간 VPN 에 쓰이고, 전송 모드는 원본 IP 헤더를 그대로 두고 상위 계층 페이로드만 보호하므로 종단 호스트 간 통신에 쓰인다. 키 교환과 SA(Security Association) 협상은 별도의 IKE(Internet Key Exchange)가 담당하므로 ①·②의 답이 될 수 없다.","difficulty":"중","point":"네트워크 보안 프로토콜"},{"id":"sql-n2","bucketLabel":"SQL","type":"short","language":"SQL","question":"다음은 〈부서〉 테이블과 〈사원〉 테이블을 생성하는 SQL 문이다. 아래 〈조건〉을 만족하도록 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 SQL 키워드를 쓰시오.\n\n〈조건〉\n- 부서명은 비어 있을 수 없으며, 서로 다른 부서가 같은 부서명을 가질 수 없다.\n- 사원을 삽입할 때 급여를 지정하지 않으면 2000 이 자동으로 저장된다.\n- 〈부서〉 테이블에서 어떤 부서가 삭제되면, 그 부서에 속한 사원 행은 그대로 남기되 부서코드 값은 NULL 로 바뀐다.\n\n```sql\nCREATE TABLE 부서 (\n    부서코드 CHAR(3) PRIMARY KEY,\n    부서명   VARCHAR(20) NOT NULL ( ① )\n);\n\nCREATE TABLE 사원 (\n    사번     CHAR(5) PRIMARY KEY,\n    사원명   VARCHAR(20),\n    부서코드 CHAR(3),\n    급여     INT ( ② ) 2000,\n    FOREIGN KEY (부서코드) REFERENCES 부서(부서코드)\n        ON DELETE ( ③ )\n);\n```","code":"","parts":[{"label":"①","answers":["UNIQUE"]},{"label":"②","answers":["DEFAULT"]},{"label":"③","answers":["SET NULL"]}],"explanation":"①은 부서명이 중복될 수 없다는 조건이므로 열 제약조건 UNIQUE 이다. NOT NULL 과 함께 쓰면 값이 반드시 있어야 하고 서로 달라야 한다. ②는 값을 지정하지 않고 삽입할 때 자동으로 들어갈 기본값을 정하는 DEFAULT 이다. ③은 참조 무결성 유지 옵션으로, 부모 행이 삭제될 때 자식 행을 함께 삭제하는 CASCADE, 삭제 자체를 거부하는 NO ACTION(RESTRICT)과 달리 자식 행은 남기고 외래키 값을 NULL 로 바꾸는 SET NULL 이다. PRIMARY KEY 도 유일성을 뜻하지만 한 테이블에 하나뿐이고 이미 부서코드에 지정되어 있으므로 ①의 답이 될 수 없으며, CHECK 는 값의 범위 조건을 검사하는 제약이라 조건과 맞지 않는다.","difficulty":"하","point":"DDL 제약조건 빈칸"}]},{"key":"r3","name":"제3회 모의고사","questions":[{"id":"security-n1","bucketLabel":"정보 보안","type":"short","language":"","question":"다음 설명에 해당하는 보안 취약점(공격 기법)을 쓰시오.\n\n- 둘 이상의 프로세스나 스레드가 하나의 공유 자원에 거의 동시에 접근할 때, 실행 순서나 타이밍에 따라 결과가 달라지는 상태를 악용하는 공격이다.\n- 대표적으로 프로그램이 파일의 권한이나 존재 여부를 「검사하는 시점」과 그 파일을 실제로 「사용하는 시점」 사이의 짧은 틈을 노려, 그 사이에 파일을 심볼릭 링크 등으로 바꿔치기하여 높은 권한으로 다른 파일을 덮어쓰거나 읽게 만든다.\n- 특히 setuid 비트가 설정된 프로그램이 /tmp 와 같이 누구나 쓸 수 있는 디렉터리에 예측 가능한 이름의 임시 파일을 만들 때 자주 발생한다.\n- 시큐어 코딩 가이드에서는 「시간 및 상태」 항목으로 분류되며, 공유 자원 접근 구간에 잠금(lock)을 적용하거나 임시 파일 이름을 예측 불가능하게 생성하여 예방한다.","code":"","parts":[{"label":"정답","answers":["레이스 컨디션","Race Condition","경쟁 조건","경쟁 상태","레이스 컨디션 공격","경쟁 조건 공격","경쟁 상태 공격","레이스 컨디션(Race Condition)","TOCTOU","Time of Check to Time of Use","레이스 컨디션 취약점","경쟁 조건 취약점","경쟁 상태 취약점","Race Condition Attack","경쟁 조건(Race Condition)","경쟁 상태(Race Condition)","레이스 컨디션 공격(Race Condition Attack)","TOCTOU 공격","TOCTOU 취약점","TOCTOU(Time of Check to Time of Use)","TOCTTOU","TOC/TOU","Time of Check Time of Use","Time-of-Check-to-Time-of-Use","레이스 컨디션(TOCTOU)","경쟁 조건(TOCTOU)","Race Condition(TOCTOU)","TOCTOU 레이스 컨디션","검사 시점과 사용 시점(TOCTOU)","경쟁조건: 검사 시점과 사용 시점(TOCTOU)"]}],"explanation":"공유 자원에 대한 접근 순서(타이밍)에 따라 결과가 달라지는 상태를 악용하는 공격이 레이스 컨디션(경쟁 조건)이다. 파일을 검사하는 시점(Time of Check)과 사용하는 시점(Time of Use) 사이의 틈을 노리는 TOCTOU 공격이 대표적 형태로, setuid 프로그램이 /tmp 에 만드는 임시 파일을 심볼릭 링크로 바꿔치기하여 /etc/passwd 같은 파일을 덮어쓰는 식으로 권한 상승을 노린다. 버퍼 오버플로는 메모리 경계 검사 누락, 포맷 스트링 공격은 printf 계열 서식 문자열 조작을 이용하는 것이어서 «타이밍»과 무관하고, 교착상태(Deadlock)는 자원을 서로 기다리며 멈추는 현상일 뿐 공격 기법이 아니다. 시큐어 코딩 가이드의 「시간 및 상태」 항목에 해당하며, 임계 구역에 잠금을 적용하고 임시 파일은 예측 불가능한 이름으로 원자적으로 생성하여 예방한다.","difficulty":"상","point":"시스템 공격 유형"},{"id":"c-3","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nint main() {\n    int x = 44;\n    int y = 27;\n    int a = x & y;\n    int b = x | y;\n    int c = x ^ y;\n    int d = (x << 2) | (y >> 3);\n    int cnt = 0;\n    int n = c;\n    while (n > 0) {\n        cnt += n & 1;\n        n >>= 1;\n    }\n    printf(\"%d %d %d\\n\", a, b, c);\n    printf(\"%d %d\\n\", d, cnt);\n    return 0;\n}","parts":[{"label":"출력 결과","answers":["8 63 55\n179 5"]}],"explanation":"44는 2진수로 00101100, 27은 00011011이다. AND(&)는 두 비트가 모두 1인 자리만 1이므로 00001000 = 8, OR(|)는 하나라도 1이면 1이므로 00111111 = 63, XOR(^)는 서로 다를 때만 1이므로 00110111 = 55가 된다. x << 2는 44에 4를 곱한 176(10110000), y >> 3은 27을 8로 나눈 몫 3(00000011)이며 둘을 OR 하면 10110011 = 179이다. while 루프는 n의 최하위 비트를 n & 1로 꺼내 cnt에 더하고 오른쪽으로 한 칸씩 밀어 1인 비트의 개수를 세는 코드로, 55(110111)에는 1이 5개 있으므로 cnt는 5이다.","difficulty":"중","point":"비트 연산"},{"id":"design-n2","bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 UML 클래스 다이어그램에서 사용하는 관계(Relationship)와 그 표기법에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 관계의 이름을 쓰시오.\n\n- ( ① ) 관계: 한 사물이 다른 사물의 부분을 이루는 전체-부분 관계로, 부분은 전체와 독립적으로 존재할 수 있어 전체가 사라져도 부분은 남는다. 두 사물을 실선으로 잇고 전체 쪽 끝에 속이 빈 마름모를 그려 표현한다. 예: 컴퓨터와 프린터\n- ( ② ) 관계: 전체-부분 관계 중 부분이 전체에 강하게 종속되어 생명주기를 함께하며, 전체가 소멸하면 부분도 함께 소멸하는 관계이다. 두 사물을 실선으로 잇고 전체 쪽 끝에 속이 채워진 마름모를 그려 표현한다. 예: 문(Door)과 문 손잡이\n- ( ③ ) 관계: 한 사물이 다른 사물(인터페이스)에 정의된, 할 수 있거나 해야 하는 기능을 실제로 수행하도록 명세하는 관계이다. 수행하는 쪽에서 인터페이스 쪽으로 속이 빈 삼각형 화살촉이 달린 점선을 그려 표현한다. 예: 인터페이스 「날다」와 클래스 「새」, 「비행기」","code":"","parts":[{"label":"①","answers":["집합(Aggregation)","집합","집합 관계","Aggregation","집합 연관","집약","집약 관계","집합 관계(Aggregation)","집합(Aggregation) 관계","Aggregation 관계","애그리게이션","집약(Aggregation)","집합 연관 관계"]},{"label":"②","answers":["합성(Composition)","합성","합성 관계","Composition","포함","포함 관계","복합","복합 관계","컴포지션","합성 관계(Composition)","합성(Composition) 관계","포함(Composition)","포함 관계(Composition)","복합(Composition)","복합 관계(Composition)","컴포지션(Composition)","컴포지션 관계","Composition 관계"]},{"label":"③","answers":["실체화(Realization)","실체화","실체화 관계","Realization","실현","실현 관계","실체화 관계(Realization)","실체화(Realization) 관계","Realization 관계","실현(Realization)","실현화","실현화 관계","리얼라이제이션"]}],"explanation":"UML 클래스 다이어그램의 관계는 연관·집합·합성(포함)·일반화·의존·실체화 6종이다. 집합(Aggregation)과 합성(Composition)은 둘 다 전체-부분 관계이지만, 집합은 부분이 전체와 독립적으로 존재할 수 있어 속이 빈 마름모로, 합성은 부분이 전체에 종속되어 생명주기를 함께하므로 속이 채워진 마름모로 표기한다는 점에서 구분된다. 실체화(Realization)는 인터페이스에 정의된 기능을 클래스가 실제로 수행하도록 하는 관계로 점선에 속이 빈 삼각형 화살촉을 붙여 표기한다. 비슷한 표기인 일반화(Generalization)는 실선에 속이 빈 삼각형으로 상속(is-a) 관계를 나타내고, 의존(Dependency)은 점선에 열린 화살촉으로 일시적 사용 관계를 나타내며, 연관(Association)은 마름모 없는 실선이므로 각각 선 종류와 끝 모양으로 구별할 수 있다.","difficulty":"중","point":"UML 클래스 다이어그램 관계"},{"id":"java-n0","bucketLabel":"Java","type":"code","language":"Java","question":"다음 Java 코드의 출력 결과를 쓰시오.","code":"interface Greeter {\n    String name();\n    default String greet() { return \"Hi \" + name(); }\n}\nabstract class Member implements Greeter {\n    protected int point;\n    Member(int p) { point = p; }\n    abstract int bonus();\n    int total() { return point + bonus(); }\n}\nclass Gold extends Member {\n    Gold(int p) { super(p); }\n    public String name() { return \"Gold\"; }\n    int bonus() { return point / 2; }\n    public String greet() { return \"[\" + name() + \"]\"; }\n}\nclass Silver extends Member {\n    Silver(int p) { super(p); }\n    public String name() { return \"Silver\"; }\n    int bonus() { return point > 100 ? 20 : 10; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Member[] ms = { new Gold(90), new Silver(120), new Silver(40) };\n        int sum = 0;\n        for (Member m : ms) {\n            System.out.println(m.greet() + \":\" + m.total());\n            sum += m.bonus();\n        }\n        System.out.println(sum);\n    }\n}","parts":[{"label":"출력 결과","answers":["[Gold]:135\nHi Silver:140\nHi Silver:50\n75"]}],"explanation":"인터페이스 Greeter 의 default 메서드 greet() 는 구현 클래스가 재정의하지 않으면 그대로 상속되고, 재정의하면 재정의한 쪽이 호출된다. Gold 는 greet() 를 \"[\" + name() + \"]\" 로 재정의했으므로 [Gold] 가, Silver 는 재정의하지 않아 default 구현인 \"Hi \" + name() 이 실행되어 Hi Silver 가 출력된다. total() 은 추상 클래스 Member 에 구현되어 있지만 그 안의 bonus() 는 추상 메서드이므로 실제 객체 타입의 구현이 동적으로 선택된다. Gold(90): bonus=90/2=45, total=135. Silver(120): 120>100 이므로 bonus=20, total=140. Silver(40): bonus=10, total=50. 반복문에서 bonus 합계 sum=45+20+10=75 가 마지막 줄에 출력된다.","difficulty":"중","point":"인터페이스 default 메서드와 추상 클래스 구현"},{"id":"network-n0","bucketLabel":"네트워크","type":"short","language":"","question":"어느 회사가 네트워크 주소 192.168.10.0/24를 할당받아 VLSM(가변 길이 서브넷 마스크) 방식으로 세 부서에 나누어 주려고 한다. 각 부서가 필요로 하는 호스트 수는 다음 표와 같다. 낭비되는 주소가 가장 적도록 각 부서에 필요한 최소 크기의 서브넷을 만들고, 필요 호스트 수가 많은 부서부터 순서대로 192.168.10.0부터 연속하여 할당할 때 다음 물음에 답하시오. (서브넷마다 네트워크 주소와 브로드캐스트 주소는 호스트에 할당하지 않는다.)\n\n| 부서 | 필요 호스트 수 |\n|---|---|\n| 영업부 | 100 |\n| 개발부 | 50 |\n| 총무부 | 20 |\n\n① 영업부 서브넷의 프리픽스 길이(CIDR 표기, 예: /xx)\n② 개발부 서브넷의 서브넷 마스크(점-십진 표기)\n③ 총무부 서브넷의 네트워크 주소","code":"","parts":[{"label":"①","answers":["/25","25","/25 (255.255.255.128)","25비트"]},{"label":"②","answers":["255.255.255.192","255.255.255.192 (/26)","/26"]},{"label":"③","answers":["192.168.10.192","192.168.10.192/27","192.168.10.192 (/27)"]}],"explanation":"필요 호스트 수 h를 수용하려면 호스트 비트 수 n이 2^n − 2 ≥ h(네트워크 주소·브로드캐스트 주소 제외)를 만족해야 한다. 영업부 100대: 2^6 − 2 = 62로는 부족하고 2^7 − 2 = 126 ≥ 100이므로 호스트 비트 7, 프리픽스 /25(주소 128개) → 192.168.10.0/25(0~127)에 할당한다. 개발부 50대: 2^5 − 2 = 30으로는 부족하고 2^6 − 2 = 62 ≥ 50이므로 /26(주소 64개) → 바로 다음 주소인 192.168.10.128/26(128~191)에 할당하며, 앞 26비트가 1인 마스크는 255.255.255.192이다. 총무부 20대: 2^4 − 2 = 14로는 부족하고 2^5 − 2 = 30 ≥ 20이므로 /27(주소 32개) → 다음 주소인 192.168.10.192/27(192~223)에 할당하므로 네트워크 주소는 192.168.10.192이다. FLSM이 모든 서브넷을 같은 크기로 자르는 것과 달리 VLSM은 서브넷마다 마스크 길이를 달리하여 주소 낭비를 줄이며, 큰 블록부터 할당해야 각 서브넷의 시작 주소가 블록 크기의 배수에 맞아 겹치지 않는다.","difficulty":"상","point":"VLSM 서브네팅 계산"},{"id":"python-n1","bucketLabel":"Python","type":"code","language":"Python","question":"다음 Python 코드의 출력 결과를 쓰시오.","code":"a = [3, 1, 4, 1, 5]\nb = a\nc = a[:]\nb.append(9)\nc.insert(0, 7)\nr1 = a.pop()\nr2 = c.pop(1)\na.remove(1)\nc.extend([2, 6])\nidx = a.index(4)\nd = a\nd += [8]\ne = c\ne = e + [0]\nprint(a)\nprint(c)\nprint(r1, r2, idx)\nprint(a is d, c is e, len(e))","parts":[{"label":"출력 결과","answers":["[3, 4, 1, 5, 8]\n[7, 1, 4, 1, 5, 2, 6]\n9 3 1\nTrue False 8"]}],"explanation":"b = a는 같은 리스트 객체를 가리키는 별칭이고 c = a[:]는 새 리스트를 만드는 복사이므로, b.append(9)는 a에 반영되지만 c.insert(0, 7)은 c에만 반영된다. pop()은 마지막 원소 9를 꺼내 반환하고 pop(1)은 c의 인덱스 1에 있던 3을 반환하며, remove(1)은 처음 만나는 1 하나만 지우므로 a = [3, 4, 1, 5], index(4)는 1이다. d = a 뒤의 d += [8]은 리스트의 제자리(in-place) 확장이라 a도 [3, 4, 1, 5, 8]이 되고 d is a는 True이다. 반면 e = e + [0]은 새 리스트를 만들어 e에 다시 바인딩하므로 c는 그대로 7개 원소를 유지하고 c is e는 False, len(e)는 8이다.","difficulty":"상","point":"리스트 별칭과 복사(a = b vs a = b[:]), 리스트 메서드 반환값, += 와 + 의 차이"},{"id":"misc-n4","bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 관계대수(Relational Algebra)의 순수 관계 연산자에 대한 설명이다. 괄호 ( ① ), ( ② ), ( ③ )에 들어갈 알맞은 연산자 이름을 쓰시오.\n\n- ( ① ): 기호 σ(시그마)를 사용하며, 릴레이션에서 주어진 조건을 만족하는 튜플(행)의 부분집합을 구하여 새로운 릴레이션을 만든다. 수평적 부분집합을 구하는 연산이다.\n- ( ② ): 기호 π(파이)를 사용하며, 릴레이션에서 지정한 속성(열)만 뽑아 새로운 릴레이션을 만든다. 수직적 부분집합을 구하는 연산이다.\n- ( ③ ): 기호 ÷를 사용하며, 두 릴레이션 R과 S에 대해 S의 모든 튜플과 관련 있는 R의 튜플 중 S가 가진 속성을 제외한 속성만을 구한다.","code":"","parts":[{"label":"①","answers":["Select","셀렉트","선택","셀렉트(Select)","Selection","셀렉션","선택 연산","Select 연산","선택(Select)","셀렉트 연산"]},{"label":"②","answers":["Project","프로젝트","추출","프로젝트(Project)","Projection","프로젝션","투영","추출 연산","Project 연산","추출(Project)","프로젝트 연산"]},{"label":"③","answers":["Division","디비전","나누기","디비전(Division)","Division 연산","디비전 연산","나누기 연산","나눗셈","나눗셈 연산","나누기(Division)"]}],"explanation":"관계대수의 순수 관계 연산자는 Select(σ), Project(π), Join(⋈), Division(÷) 네 가지이다. σ는 조건을 만족하는 튜플(행)을 골라내므로 수평적 부분집합을, π는 지정한 속성(열)만 뽑으므로 수직적 부분집합을 만든다. ÷(Division)는 R÷S에서 S의 모든 튜플과 연관된 R의 튜플을 찾은 뒤 S의 속성을 제외한 속성만 남긴다. ⋈(Join)는 공통 속성을 기준으로 두 릴레이션의 튜플을 결합하며, 합집합(∪)·교집합(∩)·차집합(-)·카티션 프로덕트(×)는 일반 집합 연산자로 분류된다. SQL의 WHERE 절이 Select, SELECT 절의 열 목록이 Project에 대응한다는 점을 기억하면 혼동을 줄일 수 있다.","difficulty":"중","point":"관계대수 순수 관계 연산자"},{"id":"c-n3","bucketLabel":"C 언어","type":"code","language":"C","question":"다음 C언어 코드의 출력 결과를 쓰시오.","code":"#include <stdio.h>\n\nint main() {\n    int i = 0, a = 0, b = 0, c = 0;\n    do {\n        i++;\n        if (i % 4 == 0)\n            continue;\n        switch (i % 3) {\n            case 0:\n                a += i;\n            case 1:\n                b += i;\n                break;\n            case 2:\n                c += i;\n                if (c > 5)\n                    break;\n                a++;\n        }\n        if (a + b + c > 40)\n            break;\n    } while (i < 10);\n    printf(\"%d %d %d\\n\", a, b, c);\n    printf(\"%d\\n\", i);\n    return 0;\n}\n","parts":[{"label":"출력 결과","answers":["19 26 7\n9"]}],"explanation":"do-while 에서 continue 는 조건식 검사로 바로 넘어가므로 i 가 4, 8 일 때는 switch 와 합계 검사를 건너뛴다. case 0 에는 break 가 없어 a += i 후 case 1 의 b += i 까지 실행되는 fallthrough 가 일어난다. case 2 의 if 안에 있는 break 는 switch 만 빠져나가므로 c 가 5 를 넘는 i=5 부터는 a++ 가 실행되지 않는다. 추적하면 i=1: b=1, i=2: c=2,a=1, i=3: a=4,b=4, i=5: c=7, i=6: a=10,b=10, i=7: b=17, i=9: a=19,b=26 이 되고 합이 52 로 40 을 넘어 switch 밖의 break 로 반복문을 종료한다. 따라서 a b c 는 19 26 7, i 는 9 이다.","difficulty":"상","point":"do-while 안의 continue·break 와 switch-case fal
