fficulty":"","point":"SIEM 개념"},{"id":"past-2022-3-11","sourceNumber":11,"bucketLabel":"통합·패키징","type":"short","language":"","question":"다음 보기 중 형상 관리 도구에 해당하는 것을 모두 고르시오.\n\nATM, CVS, OLAP, DDOS, SVN, Cyber Kill Chain, OLTP, Git","code":"","images":[],"parts":[{"label":"1","answers":["CVS"]},{"label":"2","answers":["SVN","Subversion"]},{"label":"3","answers":["Git"]}],"explanation":"형상 관리 도구는 소스와 산출물의 변경 이력을 기록하고 버전을 관리하는 도구이다. CVS는 중앙 저장소 방식의 초기 도구, SVN은 CVS를 개선한 중앙집중형 도구, Git은 각자 전체 저장소를 복제해 쓰는 분산형 도구이다. 나머지 ATM은 전송 방식, OLAP·OLTP는 데이터 처리 방식, DDOS는 공격 유형, Cyber Kill Chain은 공격 단계 모델이라 형상 관리와 무관하다.","difficulty":"","point":"형상 관리 도구 종류","unordered":true},{"id":"past-2022-3-12","sourceNumber":12,"bucketLabel":"SQL","type":"short","language":"","question":"STUDENT 테이블에서 컴퓨터과 학생 50명, 전기과 학생 100명, 인터넷과 학생 50명의 정보가 저장되어 있을 때, 다음 SQL문의 실행 결과에 따른 튜플의 수는? (단, DEPT 칼럼은 학과명이다.)","code":"1) SELECT DERP FROM STUDENT;\n2) SELECT DISTINCT DEPT FROM STUDENT;\n3) SELECT COUNT(DISTINCT DEPT) FROM STUDENT WHERE DEPT = '인터넷과';","images":[],"parts":[{"label":"1)","answers":["200","200개"]},{"label":"2)","answers":["3","3개"]},{"label":"3)","answers":["1","1개"]}],"explanation":"1)은 학과 열을 모든 행에서 그대로 가져오므로 학생 수 전체인 50+100+50 = 200개 튜플이 나온다(DERP는 DEPT의 오타). 2)는 DISTINCT로 중복을 없애므로 컴퓨터과·전기과·인터넷과 3개 튜플이 남는다. 3)은 인터넷과 50행을 골라 그 안의 서로 다른 학과 수를 세는 집계 질의이다. 집계 함수는 결과를 한 행으로 만들므로 튜플 수는 1이며, 그 값도 1이다.","difficulty":"","point":"DISTINCT와 집계 결과 튜플 수","unordered":false},{"id":"past-2022-3-13","sourceNumber":13,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 코드에 대한 출력 값을 작성하시오.","code":"int n;\nint k;\nint s;\nint el = 0;\n \n  for(n=6; n<=30; n++){\n    s=0;\n    k=n/2;\n    for(int j=1; j<=k; j++){\n      if(n%j==0){\n        s=s+j;\n      }\n    }\n    if(s==n){\n    el++;\n    }\n  }\n  \n  printf(\"%d\", el);","images":[],"parts":[{"label":"정답","answers":["2"]}],"explanation":"n을 6부터 30까지 바꾸며 1부터 n/2까지의 약수를 더해 s를 만든다. n/2보다 큰 자기 자신 이외의 약수는 없으므로 s는 자기 자신을 뺀 약수의 합이다. s가 n과 같은 수, 즉 완전수일 때 el이 증가한다. 6은 1+2+3=6, 28은 1+2+4+7+14=28로 조건을 만족하고 이 범위의 다른 수는 만족하지 않는다. 따라서 2가 출력된다.","difficulty":"","point":"완전수 개수 세기"},{"id":"past-2022-3-14","sourceNumber":14,"bucketLabel":"정보 보안","type":"short","language":"","question":"아래 설명에 대하여 알맞는 답을 작성하시오.\n\n(   1   )은/는 프로세서(processor) 안에 독립적인 보안 구역을 따로 두어 중요한 정보를 보호하는 ARM사에서 개발한 하드웨어 기반의 보안 기술로 프로세서(processor) 안에 독립적인 보안 구역을 별도로 하여, 중요한 정보를 보호하는 하드웨어 기반의 보안 기술이다.\n\n(   2   )은/는 사용자들이 사이트에 접속할 때 주소를 잘못 입력하거나 철자를 빠뜨리는 실수를 이용하기 위해 유사한 유명 도메인을 미리 등록하는 일로 URL 하이재킹(hijacking)이라고도 한다.\n\n- Pharming, Tvishing, Trustzone, APT, Typosquatting, Ransomware, Hacktivism, CSRF, Watering Hole, Smurfing","code":"","images":[],"parts":[{"label":"(1)","answers":["TrustZone","트러스트존"]},{"label":"(2)","answers":["Typosquatting","타이포스쿼팅"]}],"explanation":"1번은 TrustZone이다. ARM 프로세서 안을 일반 영역(Normal World)과 보안 영역(Secure World)으로 하드웨어 수준에서 나눠, 키·생체정보 같은 중요 데이터를 보안 영역에서만 다루게 하는 기술이다. 2번은 타이포스쿼팅(Typosquatting)이다. 사용자가 주소를 잘못 칠 것을 노려 유명 도메인과 철자가 비슷한 도메인을 미리 등록해 두는 수법이다. DNS를 조작해 정상 주소로도 가짜 사이트에 접속시키는 파밍(Pharming)과 달리, 타이포스쿼팅은 사용자의 입력 실수에 기댄다는 점이 다르다.","difficulty":"","point":"TrustZone과 타이포스쿼팅","unordered":false},{"id":"past-2022-3-15","sourceNumber":15,"bucketLabel":"정보 보안","type":"short","language":"","question":"아래 설명에 대하여 괄호 안에 들어갈 알맞는 용어를 작성하시오.\n\n(   괄호    )은/는 여러 개의 사이트에서 한번의 로그인으로 여러가지 다른 사이트들을 자동적으로 접속하여 이용하는 방법을 말한다. 일반적으로 서로 다른 시스템 및 사이트에서 각각의 사용자 정보를 관리하게 되는데 이때 하나의 사용자 정보를 기반으로 여러 시스템을 하나의 통합 인증을 사용하게 하는 것을 말한다. 즉 하나의 시스템에서 인증을 할 경우 타 시스템에서는 인증 정보가 있는지 확인하고 있으면 로그인 처리를 하도록 하고, 없는 경우 다시 통합 인증을 할 수 있도록 만드는 것을 의미한다.","code":"","images":[],"parts":[{"label":"정답","answers":["SSO","Single Sign On","싱글 사인 온"]}],"explanation":"SSO(Single Sign-On)는 한 번의 인증으로 연계된 여러 시스템을 다시 로그인하지 않고 이용하게 하는 통합 인증 방식이다. 중앙 인증 서버가 발급한 인증 정보(토큰, 티켓 등)를 각 시스템이 확인해 로그인 상태를 인정하고, 없으면 통합 인증 화면으로 보낸다. 사용자는 계정 하나만 관리하면 되어 편리하지만, 그 계정이 뚫리면 연결된 모든 시스템이 노출된다는 단점이 있다. 권한 관리 모델인 RBAC 등과 혼동하지 않도록 '인증 통합'이 핵심어임을 기억한다.","difficulty":"","point":"SSO 통합 인증","unordered":false},{"id":"past-2022-3-16","sourceNumber":16,"bucketLabel":"운영체제","type":"short","language":"","question":"다음은 스케줄링에 관한 내용이다. 괄호안에 알맞는 답을 작성하시오.\n\n  \n    구분\n    기법\n    설명\n    문제/해결\n  \n\n\n  \n    비선점\n    ( A )\n    먼저 들어온 프로세스 먼저 처리\n    Convoy Effect 발생\n  \n  \n    ( B )\n    처리시간이 짧은 프로세스부터 처리\n    Starvation 발생\n  \n  \n    HRN\n    짧은 작업시간이면서 대기시간이 긴 프로세스부터 처리\n    Starvation 해결\n  \n  \n    선점\n    ( C )\n    먼저 들어온 순서대로 일정 시간만큼만 처리\n    \n  \n  \n    ( D )\n    남은 시간이 짧은 프로세스부터 처리\n    \n  \n  \n    MLQ\n    우선순위별로 큐를 분리하여 다양한 스케줄링 적용\n    Starvation 발생\n  ","code":"","images":[],"parts":[{"label":"A","answers":["FCFS","FIFO","First Come First Served"]},{"label":"B","answers":["SJF","Shortest Job First"]},{"label":"C","answers":["RR","라운드 로빈","Round Robin","RR(라운드 로빈)"]},{"label":"D","answers":["SRT","SRTF","Shortest Remaining Time","Shortest Remaining Time First"]}],"explanation":"A는 FCFS(FIFO)로, 도착 순서대로 처리하는 비선점 방식이며 긴 작업 뒤에 짧은 작업들이 줄줄이 기다리는 호위 효과(Convoy Effect)가 생긴다. B는 SJF로, 실행 시간이 짧은 작업부터 처리해 평균 대기 시간이 짧지만 긴 작업이 계속 밀리는 기아 현상이 생긴다. HRN은 (대기 시간 + 서비스 시간) / 서비스 시간 비율로 우선순위를 매겨 기아를 줄인다. C는 RR(라운드 로빈)로, 도착 순서대로 정해진 시간 할당량만큼만 실행하고 큐 뒤로 보내는 선점 방식이다. D는 SRT로, SJF의 선점형 버전이며 남은 실행 시간이 가장 짧은 프로세스에게 CPU를 넘긴다.","difficulty":"","point":"CPU 스케줄링 기법","unordered":false},{"id":"past-2022-3-17","sourceNumber":17,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 UML에 관한 설명이다. 괄호안에 알맞는 답을 작성하시오.\n\nUML은 통합 모델링 언어로써, 시스템을 모델로 표현해주는 대표적인 모델링 언어이다.\n\n구성 요소로는 사물, (    1    ), 다이어그램으로 이루어져 있으며, 구조 다이어그램 중, (     2    ) 다이어그램은 시스템에서 사용되는 객체 타입을 정의하고, 그들 간의 존재하는 정적인 관계를 다양한 방식으로 표현한 다이어그램이다.  또한 UML 모델링에서 (     3    )은/는 클래스와 같은 기타 모델 요소 또는 컴포넌트가 구현해야 하는 오퍼레이션 세트를 정의하는 모델 요소이다.","code":"","images":[],"parts":[{"label":"(1)","answers":["관계","Relationship","Relationships"]},{"label":"(2)","answers":["클래스","Class"]},{"label":"(3)","answers":["인터페이스","Interface"]}],"explanation":"UML의 구성 요소는 사물(Things), 관계(Relationships), 다이어그램(Diagrams) 세 가지이므로 1번은 관계이다. 2번은 클래스 다이어그램으로, 클래스의 속성·연산과 클래스 사이의 연관·일반화·의존 같은 정적 관계를 표현하는 대표 구조 다이어그램이다. 3번은 인터페이스로, 구현 없이 오퍼레이션의 목록(시그니처)만 정의하고 이를 실현(realization)하는 클래스나 컴포넌트가 실제 동작을 구현한다. 시간 흐름에 따른 메시지 교환을 보이는 시퀀스 다이어그램 같은 행위 다이어그램과 구분된다.","difficulty":"","point":"UML 구성 요소와 다이어그램","unordered":false},{"id":"past-2022-3-18","sourceNumber":18,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 E-R다이어그램의 표기 방법이다. 각 칸에 들어갈 알맞은 답을 골라 쓰시오.\n\n다중값 속성\n약한 개체 타입\n키 속성\n개체 타입\n속성\n관계 타입\n약한 관계 타입","code":"","images":["imported-images/2022-3-q18-1.png"],"parts":[{"label":"A","answers":["개체 타입","개체"]},{"label":"B","answers":["약한 개체 타입","약한 개체"]},{"label":"C","answers":["관계 타입","관계"]},{"label":"D","answers":["약한 관계 타입","약한 관계"]},{"label":"E","answers":["속성"]},{"label":"F","answers":["키 속성"]},{"label":"G","answers":["다중값 속성"]}],"explanation":"그림에서 A의 단일 사각형은 개체 타입, B의 이중 사각형은 키가 없어 소유 개체에 의존하는 약한 개체 타입이다. C의 단일 마름모는 관계 타입, D의 이중 마름모는 약한 개체를 식별하는 약한(식별) 관계 타입이다. E의 단일 타원은 일반 속성, F의 밑줄 친 타원은 개체를 유일하게 구분하는 키 속성, G의 이중 타원은 여러 값을 가질 수 있는 다중값 속성이다. 테두리가 이중이면 '약한' 또는 '다중'을, 밑줄은 '키'를 뜻한다고 정리하면 외우기 쉽다. 점선 타원은 유도 속성을 뜻하지만 이 문제에는 나오지 않는다.","difficulty":"","point":"E-R 다이어그램 표기법","unordered":false},{"id":"past-2022-3-19","sourceNumber":19,"bucketLabel":"Java","type":"short","language":"","question":"다음 자바 코드에 대한 출력 값을 작성하시오.","code":"public class Main {\n  static int[] MakeArray(){\n \n  int[] tempArr = new int[4];\n  \n  for(int i=0; i<tempArr.Length;i++){\n    tempArr[i] = i;\n  }\n  \n  return tempArr;\n  }\n  \n  public static void main(String[] args){\n  \n  int[] intArr;\n  intArr = MakeArray();\n  \n  for(int i=0; i < intArr.Length; i++)\n  System.out.print(intArr[i]);\n \n  }\n}","images":[],"parts":[{"label":"정답","answers":["0123"]}],"explanation":"MakeArray는 길이 4인 배열을 만들고 각 칸에 자기 인덱스를 넣어 [0, 1, 2, 3]을 돌려준다. main은 이 배열의 참조를 intArr에 받아 순서대로 출력한다. print는 줄바꿈이나 구분자를 넣지 않으므로 0123이 붙어서 출력된다. 복원본의 Length는 Java에서 배열 길이 필드인 length의 오타로 보고 의도대로 풀었다.","difficulty":"","point":"Java 배열 반환과 출력"},{"id":"past-2022-3-20","sourceNumber":20,"bucketLabel":"Java","type":"short","language":"","question":"다음 자바 코드에 대한 출력 값을 작성하시오.","code":"public class Exam {\n  public static void main(String[] args){\n  \n  int a = 0;\n  for(int i=1; i<999; i++){\n    if(i%3==0 && i%2!=0)\n      a = i;\n    }\n    System.out.print(a);\n}","images":[],"parts":[{"label":"정답","answers":["993"]}],"explanation":"반복은 i=1부터 998까지 돌며, 3의 배수이면서 홀수인 i를 만날 때마다 a에 덮어쓴다. 따라서 마지막에 남는 값은 998 이하에서 조건을 만족하는 가장 큰 수이다. 999는 i<999 조건 때문에 제외되고, 996은 짝수, 993은 3의 배수이면서 홀수이다. 그러므로 993이 출력된다. 복원본은 클래스를 닫는 중괄호가 하나 빠져 있지만 동작에는 영향이 없다.","difficulty":"","point":"반복문 조건 최댓값"}]},{"key":"past-2023-1","name":"2023년 1회 기출","questions":[{"id":"past-2023-1-1","sourceNumber":1,"bucketLabel":"Java","type":"code","language":"","question":"아래 자바 코드에서 출력되는 값을 작성하시오.","code":"class Static{\n    public int a = 20;\n    static int b = 0;   \n}\n \npublic class Test{\n    public static void main(String[] args) {\n        int  a = 10;\n        Static.b = a;\n        Static st = new Static();\n\n        System.out.println(Static.b++);\n        System.out.println(st.b);\n        System.out.println(a);\n        System.out.print(st.a);\n    }\n}","images":[],"parts":[{"label":"정답","answers":["10\n11\n10\n20"]}],"explanation":"static 변수 b 는 클래스에 하나만 존재하므로 Static.b 와 st.b 는 같은 저장 공간이다. Static.b = a 로 b 는 10 이 된다. println(Static.b++) 은 후위 증가라 현재 값 10 을 먼저 출력한 뒤 b 를 11 로 올린다. 이어서 st.b 는 같은 static 변수이므로 11, main 의 지역 변수 a 는 그대로 10, 인스턴스 변수 st.a 는 초기값 20 이 출력된다. 지역 변수 a 와 인스턴스 필드 a 는 이름만 같을 뿐 서로 다른 변수라는 점이 함정이다.","difficulty":"","point":"Java static 변수와 후위 증가"},{"id":"past-2023-1-2","sourceNumber":2,"bucketLabel":"C 언어","type":"code","language":"","question":"다음 C언어의 출력값을 작성하시오.","code":"#include \n \nint main(){\n\n    char a[] = \"Art\";\n    char* p = NULL;\n    p = a;\n \n    printf(\"%sn\", a);\n    printf(\"%cn\", *p);\n    printf(\"%cn\", *a);\n    printf(\"%sn\", p);\n \n    for(int i = 0; a[i] != ''; i++)\n    printf(\"%c\", a[i]);\n \n}","images":[],"parts":[{"label":"정답","answers":["Art\nA\nA\nArt\nArt"]}],"explanation":"배열 a 에는 'A','r','t','\\0' 이 들어 있고 p = a 로 p 는 배열의 첫 원소를 가리킨다. %s 로 a 를 출력하면 널 문자 직전까지인 Art, *p 와 *a 는 둘 다 첫 문자이므로 A 와 A, %s 로 p 를 출력하면 다시 Art 가 나온다. 마지막 for 문은 a[i] 가 널 문자가 아닐 동안 한 글자씩 출력하므로 Art 가 줄바꿈 없이 찍힌다. 배열 이름은 첫 원소의 주소로 쓰이므로 *a 와 a[0] 은 같다. 복원 원문에서 \\n, \\0 의 역슬래시와 헤더 이름이 빠졌는데, 의도대로 줄바꿈과 널 문자로 해석한다.","difficulty":"","point":"C 문자 배열과 포인터 출력"},{"id":"past-2023-1-3","sourceNumber":3,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어의 출력값을 작성하시오.","code":"#include \n \nint main(){\n \n    char* a = \"qwer\";\n    char* b = \"qwtety\";\n \n    for(int i = 0; a[i] != '' ; i++){\n        for(int j = 0; b[j] != ''; j++){\n            if(a[i] == b[j]) printf(\"%c\", a[i]);\n        }\n    }\n \n}","images":[],"parts":[{"label":"정답","answers":["qwe"]}],"explanation":"바깥 반복은 a = \"qwer\" 의 각 문자를, 안쪽 반복은 b = \"qwtety\" 의 각 문자를 차례로 비교해 같으면 a[i] 를 출력한다. q 는 b 에 한 번 있어 q, w 도 한 번 있어 w, e 도 한 번 있어 e 가 출력되고, r 은 b 에 없으므로 출력되지 않는다. b 안에 t 가 두 번 있지만 a 에 t 가 없으므로 영향이 없다. 따라서 결과는 qwe 이다. 같은 문자가 b 에 여러 번 있었다면 그 횟수만큼 반복 출력된다는 점에 주의한다.","difficulty":"","point":"C 이중 반복 문자 비교"},{"id":"past-2023-1-4","sourceNumber":4,"bucketLabel":"네트워크","type":"short","language":"","question":"다음 괄호안에 들어가는 용어의 Full Name 또는 약자를 작성하시오.\n\n(   )은/는 비동기적인 웹 애플리케이션의 제작을 위해 JavaScript와 XML을 이용한 비동기적 정보 교환 기법이다.\n\n(   )은/는 필요한 데이터만을 웹서버에 요청해서 받은 후 클라이언트에서 데이터에 대한 처리를 할 수 있다. \n보통 SOAP이나 XML 기반의 웹 서비스 프로토콜이 사용되며, 웹 서버의 응답을 처리하기 위해 클라이언트 쪽에서는 자바스크립트를 쓴다.\n\n(   )은/는 Google Map과 Google pages에서 사용한 기술에 기반하여 제작되었다.","code":"","images":[],"parts":[{"label":"정답","answers":["AJAX","Asynchronous JavaScript and XML"]}],"explanation":"AJAX(Asynchronous JavaScript and XML)는 페이지 전체를 새로 고치지 않고 JavaScript 로 서버에 필요한 데이터만 비동기 요청해 받아 화면 일부를 갱신하는 기법이다. 클라이언트 쪽 처리는 XMLHttpRequest 같은 JavaScript 객체가 맡고, 데이터 형식으로 XML 외에 JSON 도 널리 쓰인다. Google Maps 처럼 지도를 끌어도 페이지가 다시 로드되지 않는 서비스가 대표 사례로 알려져 있다. 동기 방식은 요청 후 응답이 올 때까지 기다리지만 비동기 방식은 기다리지 않고 다른 작업을 계속한다는 점이 핵심 차이다.","difficulty":"","point":"AJAX 비동기 통신","unordered":false},{"id":"past-2023-1-5","sourceNumber":5,"bucketLabel":"네트워크","type":"short","language":"","question":"아래 내용을 확인하여 괄호 안에 용어를 표안에 알맞는 값을 고르시오.\n\n• 회선 교환 방식\n• 데이터그램 방식\n• 가상 회선 방식\n• 메시지 교환 방식","code":"","images":["imported-images/2023-1-q05-1.png"],"parts":[{"label":"첫 번째 칸","answers":["가상 회선 방식","가상 회선","Virtual Circuit"]},{"label":"두 번째 칸","answers":["데이터그램 방식","데이터그램","Datagram"]}],"explanation":"첫 번째 칸은 처음에 경로를 정해 두고 그 논리적 경로로 패킷을 차례대로 보내는 가상 회선 방식이다. 회선 교환의 고정 경로 장점과 패킷 교환의 장점을 합친 형태이며 ATM 이 대표 예이다. 두 번째 칸은 패킷마다 독립적으로 경로를 정해 보내는 데이터그램 방식으로, 패킷이 서로 다른 길로 가므로 도착 순서가 뒤바뀔 수 있어 재정렬이 필요하다. 회선 교환은 통신 동안 물리 회선을 점유하고, 메시지 교환은 메시지 전체를 저장 후 전달하므로 둘 다 표의 설명과 맞지 않는다.","difficulty":"","point":"패킷 교환 방식 구분","unordered":false},{"id":"past-2023-1-6","sourceNumber":6,"bucketLabel":"네트워크","type":"short","language":"","question":"아래 내용을 확인하여 알맞는 답을 작성하시오.\n\n○ 2 계층(데이터링크 계층)에서 구현되는 터널링 기술 중 하나\n○ L2F와 PPTP가 결합된 프로토콜로 VPN과 인터넷 서비스 제공자(ISP)가 이용\n○ IPsec을 함께 사용하면 PPTP보다 훨씬 안전하지만 보안보다 익명화에 더 적합","code":"","images":[],"parts":[{"label":"정답","answers":["L2TP"]}],"explanation":"L2TP(Layer 2 Tunneling Protocol)는 Cisco 의 L2F 와 Microsoft 의 PPTP 를 합쳐 만든 2계층 터널링 프로토콜이다. 자체 암호화 기능이 없어 보통 IPsec 과 함께 L2TP/IPsec 형태로 VPN 에 사용한다. PPTP 는 2계층 터널링이지만 단독 프로토콜이고, IPsec 은 3계층에서 동작하는 보안 프로토콜이라 구분된다. 「L2F 와 PPTP 의 결합」이라는 문구가 가장 결정적인 단서이다.","difficulty":"","point":"L2TP 터널링 프로토콜"},{"id":"past-2023-1-7","sourceNumber":7,"bucketLabel":"네트워크","type":"short","language":"","question":"다음 설명에 해당하는 알맞은 용어를 영문 3글자로 쓰시오.\n\n○ 다른 컴퓨터에 로그인, 원격 명령 실행, 파일 복사 등을 수행할 수 있도록 다양한 기능을 지원하는 프로토콜 또는 이를 이용한 응용 프로그램이다.\n\n○ 데이터 암호화와 강력한 인증 방법으로 보안성이 낮은 네트워크에서도 안전하게 통신할 수 있다.\n\n○ 키(Key)를 통한 인증 방법으로 사용하려면 사전에  클라이언트의 공개키를 서버에 등록해야 한다.\n\n○기본적으로는 22번 포트를 사용한다.","code":"","images":[],"parts":[{"label":"정답","answers":["SSH"]}],"explanation":"SSH(Secure Shell)는 원격 로그인, 원격 명령 실행, 파일 복사(scp, sftp)를 암호화된 채널로 수행하는 프로토콜이다. 기본 포트는 22 번이며, 비밀번호 대신 공개키 인증을 쓰려면 클라이언트 공개키를 서버의 authorized_keys 에 미리 등록해야 한다. Telnet(23 번)도 원격 접속을 제공하지만 평문으로 전송해 도청에 취약하다는 점에서 구분된다. 「22 번 포트」와 「암호화된 원격 접속」이 채점 포인트이다.","difficulty":"","point":"SSH 원격 접속 프로토콜"},{"id":"past-2023-1-8","sourceNumber":8,"bucketLabel":"정보 보안","type":"short","language":"","question":"를 참고하여 아래 설명에 대한 (1) ~ (3)의 알맞는 답을 작성하시오.\n\n- 트로이 목마\n- 웜\n- 바이러스","code":"","images":["imported-images/2023-1-q08-1.png"],"parts":[{"label":"(1)","answers":["웜","Worm"]},{"label":"(2)","answers":["트로이 목마","Trojan Horse","Trojan"]},{"label":"(3)","answers":["바이러스","Virus"]}],"explanation":"(1) 은 다른 프로그램 없이 독자적으로 실행되며 네트워크를 통해 스스로 복제·전파하므로 웜이다. (2) 는 정상 프로그램으로 위장해 설치를 유도하고 백도어로 정보를 빼내지만 자기 복제 능력이 없으므로 트로이 목마이다. (3) 은 정상 파일에 기생해 감염시키고, 숙주 파일이 없으면 실행되지 않으므로 바이러스이다. 셋을 가르는 기준은 숙주 필요 여부(바이러스만 필요)와 자기 복제 여부(트로이 목마만 없음)이다.","difficulty":"","point":"악성코드 유형 구분","unordered":false},{"id":"past-2023-1-9","sourceNumber":9,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 아래 코드에서 이진수 101110를 십진수로 변환하는 C언어 코드에 대해\n괄호 (a) (b)의 적합한 답을 작성하시오.","code":"#include \n \nint main() { \n    int input = 101110;\n    int di = 1;\n    int sum = 0;\n \n    while (1) {\n \n        if (input == 0) break;\n        else {\n \n          sum = sum + (input (a)(b)) * di;\n             di = di * 2;\n             input = input / 10; \n        }\n    }\n \n    printf(\"%d\", sum);\n \n    return 0;\n}","images":[],"parts":[{"label":"(a)(b)","answers":["% 10","% 5","% 2","& 1","(a) % (b) 10","(a) % (b) 5","(a) % (b) 2","(a) & (b) 1"]}],"explanation":"10진수처럼 적힌 101110 의 각 자릿수를 이진수의 비트로 보고, 맨 끝 자리부터 꺼내 자리 가중치 di(1, 2, 4, …)를 곱해 더하는 코드이다. 맨 끝 자리는 input % 10 으로 얻고, input / 10 으로 그 자리를 버린다. 반복별로 꺼낸 자리는 0, 1, 1, 1, 0, 1 이고 가중치는 1, 2, 4, 8, 16, 32 이므로 합은 2 + 4 + 8 + 32 = 46 이다. 각 자리가 0 또는 1 뿐이므로 input % 2, input % 5 도 같은 값을 주고, 10 이 짝수라 input 의 홀짝이 끝자리의 홀짝과 같으므로 input & 1 도 정답이 된다.","difficulty":"","point":"C 이진수 십진 변환 연산자","unordered":false},{"id":"past-2023-1-10","sourceNumber":10,"bucketLabel":"네트워크","type":"short","language":"","question":"다음 보안 관련 설명으로 괄호안에 알맞는 용어를  작성하시오.\n\n(    )은/는 TCP/IP에서 IP 패킷을 처리할 때 발생되는 문제를 알려주는 프로토콜이다.\n\n(    ) 프로토콜은 보통 다른 호스트나 게이트웨이 와 연결된 네트웍에 문제가 있는지 확인하기 위한 목적으로 주로 사용된다.\n\n(    ) 을/를 이용한 공격에는 (    ) Flooding가 있는데 ping 명령어를 통한 (     ) 패킷을 연속적으로 계속 보내어 서버의 요청에 응답으로 인한 다른작업을 하지 못하도록 하는 공격이다.","code":"","images":[],"parts":[{"label":"정답","answers":["ICMP"]}],"explanation":"ICMP(Internet Control Message Protocol)는 IP 패킷 처리 중 발생한 오류나 제어 정보를 알려 주는 네트워크 계층 프로토콜이다. ping 은 ICMP Echo Request/Reply 로 상대 호스트와의 연결 상태를 확인하고, traceroute 도 ICMP 메시지를 이용한다. ICMP Flooding 은 대량의 Echo Request 를 보내 대상이 응답 처리에 자원을 소모하도록 만드는 서비스 거부 공격이다. IGMP 는 멀티캐스트 그룹 관리용이라 혼동하지 않는다.","difficulty":"","point":"ICMP 와 ICMP Flooding"},{"id":"past-2023-1-11","sourceNumber":11,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 디자인 패턴에 관한 설명이다.\n설명에 내용에 알맞는 답을 고르시오.\n\n(   )은/는 복잡한 시스템을 개발하기 쉽도록 클래스나 객체을 조합하는 패턴에 속하며,\n대리라는 이름으로도 불린다. 내부에서는 객체 간의 복잡한 관계를 단순하게 정리해 주고,\n외부에서는 객체의 세부인 내용을 숨기는 역할을 한다.","code":"","images":["imported-images/2023-1-q11-1.png"],"parts":[{"label":"정답","answers":["proxy"]}],"explanation":"프록시(Proxy) 패턴은 실제 객체 앞에 대리 객체를 두어 접근을 제어하거나 생성 시점 지연, 원격 접근 같은 부가 기능을 맡기는 구조 패턴이다. 문제의 「대리라는 이름으로도 불린다」가 결정적 단서이며, 보기 표에서 구조 패턴에 속한다. 복잡한 하위 시스템을 하나의 단순한 인터페이스로 감싸는 퍼사드(Facade)와 설명이 일부 겹치지만, 퍼사드는 「창구」 역할이고 프록시는 같은 인터페이스를 가진 「대리인」이라는 점에서 구분된다. 따라서 답은 Proxy 이다.","difficulty":"","point":"프록시(Proxy) 구조 패턴"},{"id":"past-2023-1-12","sourceNumber":12,"bucketLabel":"데이터베이스","type":"short","language":"","question":"릴레이션의 구성하는 용어들에 대한 다음 설명에서 괄호(① ~ ③)에 들어갈 알맞은 답을\n에서 찾아 쓰시오.\n\n○도메인  ○차수  ○속성  ○튜플\n○디그리  ○카디널리티  ○릴레이션 스키마  ○릴레이션 인스턴스","code":"","images":["imported-images/2023-1-q12-1.png"],"parts":[{"label":"①","answers":["튜플","Tuple"]},{"label":"②","answers":["릴레이션 인스턴스","Relation Instance"]},{"label":"③","answers":["카디널리티","Cardinality"]}],"explanation":"① 은 릴레이션의 각 행으로, 파일 구조의 레코드에 해당하는 튜플이다. ② 는 스키마(구조 정의)에 따라 실제 값이 채워진 튜플들의 집합, 즉 특정 시점의 릴레이션 인스턴스(외연)이다. ③ 은 튜플의 개수를 뜻하는 카디널리티이다. 속성(열)의 개수는 차수(디그리)이고, 스키마는 값이 아닌 구조를 정의한다는 점에서 각각 구분된다.","difficulty":"","point":"릴레이션 구성 용어","unordered":false},{"id":"past-2023-1-13","sourceNumber":13,"bucketLabel":"SQL","type":"short","language":"","question":"[학생] 테이블에서 학생 이름이 '민수'인 튜플을 삭제하는 쿼리를 작성하시오.\n\n조건\n- 컬럼의 값이 문자열일 경우 작은 따옴표 ('  ')를 표시하시오.\n- SQL 마지막에 세미콜론(;)은 표기하지 않아도 관계 없습니다.","code":"","images":["imported-images/2023-1-q13-1.png"],"parts":[{"label":"정답","answers":["DELETE FROM 학생 WHERE 이름 = '민수';"]}],"explanation":"튜플을 지우는 DML 은 DELETE FROM 테이블 WHERE 조건 형식으로 쓴다. 이름이 '민수' 인 행만 지워야 하므로 WHERE 이름 = '민수' 조건을 붙이고, 문자열이므로 작은따옴표로 감싼다. WHERE 를 빼면 테이블의 모든 행이 삭제된다. 테이블 자체를 없애는 DROP TABLE, 전체 행을 비우는 TRUNCATE 와 혼동하지 않는다.","difficulty":"","point":"SQL DELETE 문"},{"id":"past-2023-1-14","sourceNumber":14,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 코드에서 괄호안에 알맞는 값을 변수명으로 작성하시오.","code":"#include \nvoid swap(int *a, int idx1, int idx2) {\n int t= a[idx1];\n a[idx1] = a[idx2];\n a[(    ①    )] = t;\n}\n\nvoid  Usort(int *a, int len) {\n  for(int i = 0; i < len - 1; i++) \n     for(int j = 0; j < len - 1 - i; j++)\n        if(a[j] > a[j+1])\n            swap(a,j,j+1);\n}\n\nvoid main(){\n int a[] = {85, 75, 50, 100, 95};\n int nx = 5;\n Usort(a, (    ②    ));\n}","images":[],"parts":[{"label":"①","answers":["idx2"]},{"label":"②","answers":["nx"]}],"explanation":"swap 함수는 t 에 a[idx1] 을 보관하고, a[idx1] 에 a[idx2] 를 넣은 뒤, 보관한 t 를 a[idx2] 에 넣어야 두 값이 교환되므로 ① 은 idx2 이다. Usort 는 인접한 두 원소를 비교해 큰 값을 뒤로 보내는 버블 정렬이며 두 번째 인자 len 으로 배열 길이를 받는다. main 에서 배열 길이를 담은 변수는 nx 이므로 ② 는 nx 이다. 실행하면 배열은 50, 75, 85, 95, 100 으로 오름차순 정렬된다. 숫자 5 도 동작은 같지만 문제가 변수명을 요구하므로 nx 로 쓴다.","difficulty":"","point":"C 버블 정렬 swap 빈칸","unordered":false},{"id":"past-2023-1-15","sourceNumber":15,"bucketLabel":"Python","type":"short","language":"","question":"다음 파이썬 코드의 알맞는 출력값을 작성하시오.\n\na = {'한국', '중국', '일본'}\na.add('베트남')\na.add('중국')\na.remove('일본')\na.update({'홍콩', '한국', '태국'})\nprint(a)","code":"","images":[],"parts":[{"label":"원소 1","answers":["한국","중국","베트남","홍콩","태국"]},{"label":"원소 2","answers":["중국","베트남","홍콩","태국","한국"]},{"label":"원소 3","answers":["베트남","홍콩","태국","한국","중국"]},{"label":"원소 4","answers":["홍콩","태국","한국","중국","베트남"]},{"label":"원소 5","answers":["태국","한국","중국","베트남","홍콩"]}],"explanation":"집합(set)은 중복을 허용하지 않는다. 처음 {'한국', '중국', '일본'} 에 add('베트남') 으로 4개가 되고, add('중국') 은 이미 있으므로 변화가 없다. remove('일본') 으로 일본이 빠지고, update 로 홍콩·한국·태국을 넣으면 한국은 중복이라 무시되어 최종 원소는 한국, 중국, 베트남, 홍콩, 태국 5개이다. set 은 순서가 없는 자료형이라 실제 출력 순서는 실행 환경마다 다를 수 있으며, 채점은 원소 구성 기준으로 본다.","difficulty":"","point":"Python set 연산 결과","unordered":true},{"id":"past-2023-1-16","sourceNumber":16,"bucketLabel":"SQL","type":"code","language":"","question":"다음 성적 테이블에서 과목별 점수의 평균이 90점 이상인 '과목이름', '최소점수', '최대점수' 를 검색하고자 한다. [조건]을 참고하여 적합한 SQL문을 작성하시오.\n\n[조건] \n- WHERE사용하지 말아야 한다.\n- SELECT절에 별칭을 사용하여 작성해야 한다.\n- SQL 구문 마지막에 세미콜론(;)은 생락 가능하다.\n- 반드시 GROUP BY와 HAVING 을 사용해야 한다.\n- 집계 함수를 사용해야 한다.","code":"","images":["imported-images/2023-1-q16-1.png"],"parts":[{"label":"정답","answers":["SELECT 과목이름 ,MIN(점수) AS 최소점수 ,MAX(점수) AS 최대점수\nFROM 성적\nGROUP BY 과목이름 HAVING AVG(점수) >= 90"]}],"explanation":"과목별로 묶어야 하므로 GROUP BY 과목이름 을 쓰고, 그룹의 평균 조건은 WHERE 가 아니라 HAVING AVG(점수) >= 90 으로 건다. SELECT 절에는 과목이름과 MIN(점수) AS 최소점수, MAX(점수) AS 최대점수 를 별칭과 함께 쓴다. 평균을 계산하면 데이터베이스 90.5, 네트워크 88.5, 소프트웨어 88 이므로 데이터베이스만 남고 최소 89, 최대 92 가 출력된다. WHERE 는 그룹화 전 개별 행을, HAVING 은 그룹화 후 그룹을 거른다는 차이가 핵심이다.","difficulty":"","point":"SQL GROUP BY와 HAVING"},{"id":"past-2023-1-17","sourceNumber":17,"bucketLabel":"Java","type":"short","language":"","question":"다음 JAVA 코드에서 알맞는 출력 값을 작성하시오.","code":"abstact class Vehicle {\n    String name;\n    abstract public String getName(String val);\n \n    public String getName() {\n            return \"Vehicle name: \" + name;\n    }\n}\n \nclass Car extends Vehicle {\n    public Car(String val) {\n            name=super.name=val;\n    }\n \n    public String getName(String val) {\n            return \"Car name:\" + val;\n    }\n \n    public String getName(byte val[]) {\n            return \"Car name:\" + val;\n    }\n}\n \n \npublic class Main {\n    public static void main(String[] args) {\n    Vehicle obj = new Car(\"Spark\");\n    System.out.println(obj.getName());\n    }\n}","images":[],"parts":[{"label":"정답","answers":["Vehicle name: Spark"]}],"explanation":"obj 는 Vehicle 타입이지만 실제 객체는 Car 이다. Car 생성자에서 name = super.name = val 은 Car 에 별도 name 필드가 없으므로 상속받은 같은 필드에 \"Spark\" 를 넣는다. obj.getName() 은 인자가 없는 메서드인데 Car 는 이를 재정의하지 않았으므로 Vehicle 의 getName() 이 실행되어 \"Vehicle name: Spark\" 를 반환한다. Car 의 getName(String), getName(byte[]) 는 매개변수가 다른 오버로딩이라 이 호출과 무관하다. 원문의 abstact 는 abstract 의 오타로 보고 푼다.","difficulty":"","point":"Java 오버로딩과 상속 호출"},{"id":"past-2023-1-18","sourceNumber":18,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 스키마와 관련된 내용이다.\n각 괄호안에 알맞는 답을 작성하시오.","code":"","images":["imported-images/2023-1-q18-1.png"],"parts":[{"label":"(1)","answers":["외부","외부 스키마","External"]},{"label":"(2)","answers":["개념","개념 스키마","Conceptual"]},{"label":"(3)","answers":["내부","내부 스키마","Internal"]}],"explanation":"(1) 은 사용자나 응용 프로그래머 관점에서 필요한 부분만 정의하며 여러 개 존재할 수 있는 서브 스키마이므로 외부 스키마이다. (2) 는 조직 전체 관점의 논리적 구조로 데이터베이스에 하나만 존재하고 관계, 제약 조건, 접근 권한까지 정의하므로 개념 스키마이다. (3) 은 저장 장치 관점에서 레코드의 물리적 구조, 인덱스 유무 등을 정의하므로 내부 스키마이다. 「여러 개=외부」, 「전체·하나=개념」, 「물리 저장=내부」로 구분한다.","difficulty":"","point":"3단계 스키마 구분","unordered":false},{"id":"past-2023-1-19","sourceNumber":19,"bucketLabel":"테스트","type":"short","language":"","question":"다음 아래 제어 흐름 그래프가 분기 커버리지를 만족하기 위한 테스팅 순서를 쓰시오.","code":"","images":["imported-images/2023-1-q19-1.png"],"parts":[{"label":"정답","answers":["1234561, 124567","124567, 1234561","1234567, 124561","124561, 1234567"]}],"explanation":"분기(결정) 커버리지는 모든 결정 노드의 참과 거짓 결과가 각각 한 번 이상 실행되면 만족한다. 결정 노드는 ②(X > K)와 ⑥(RESULT > 1) 두 개이다. 경로 1→2→3→4→5→6→1 은 ② 참, ⑥ 참을, 경로 1→2→4→5→6→7 은 ② 거짓, ⑥ 거짓을 지나므로 두 경로로 네 가지 결과가 모두 덮인다. ② 참과 ⑥ 거짓을 묶은 1234567 과 ② 거짓과 ⑥ 참을 묶은 124561 의 조합도 같은 이유로 정답이다.","difficulty":"","point":"분기 커버리지 테스트 경로","unordered":false},{"id":"past-2023-1-20","sourceNumber":20,"bucketLabel":"Java","type":"short","language":"","question":"다음 Java 코드에 대한 출력 값을 작성하시오.","code":"class Parent {\n    int x = 100;\n    Parent() {\n        this(500);\n    }\n \n    Parent(int x) {\n        this.x = x;\n    }\n \n    int getX() {\n        return x;\n    }\n}\n \nclass Child extends Parent {\n    int x = 4000;\n    Child() {\n        this(5000);\n    }\n \n    Child(int x) {\n        this.x = x;\n    }\n}\n \npublic class Main {\n    public static void main(String[] args) {\n        Child obj = new Child();\n        System.out.println(obj.getX());\n    }\n}","images":[],"parts":[{"label":"정답","answers":["500"]}],"explanation":"new Child() 는 Child() 에서 this(5000) 으로 Child(int) 를 부르고, 그 첫 줄에서 암묵적으로 super() 즉 Parent() 가 실행된다. Parent() 는 this(500) 으로 Parent(int) 를 불러 Parent 의 필드 x 를 500 으로 만든다. 이후 Child 의 필드 x 가 4000 으로 초기화되고 this.x = 5000 으로 Child 의 x 만 바뀐다. getX() 는 Parent 에 정의되어 있고 필드는 오버라이딩되지 않으므로 Parent 의 x 인 500 을 반환한다. 같은 이름의 필드가 부모·자식에 따로 존재하는 필드 숨김(hiding)이 핵심이다.","difficulty":"","point":"Java 생성자 연쇄와 필드 숨김"}]},{"key":"past-2023-2","name":"2023년 2회 기출","questions":[{"id":"past-2023-2-1","sourceNumber":1,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어 코드의 문제이다.\n다음의 조건에 맞도록 빈 괄호 안에 알맞은 코드를 작성하시오.\n\n[조건]\n입력값이 54321일 경우 \n출력값이 43215로 출력되어야 한다.","code":"","images":["imported-images/2023-2-q01-1.png"],"parts":[{"label":"정답","answers":["n[(i+1) % 5]"]}],"explanation":"scanf 가 %d 로 한 번에 한 정수를 읽으므로 입력 54321 은 5, 4, 3, 2, 1 을 차례로 넣는다는 뜻이고 n 은 {5, 4, 3, 2, 1} 이 된다. 출력 43215 는 두 번째 원소부터 끝까지 출력한 뒤 첫 원소로 돌아오는 순서이므로 i 번째 출력에 n[i+1] 을 쓰되 마지막에 n[5] 대신 n[0] 이 나오도록 나머지 연산으로 감싼다. 따라서 빈칸은 n[(i+1) % 5] 이다. i 가 0~4 일 때 인덱스는 1, 2, 3, 4, 0 이 되어 4, 3, 2, 1, 5 가 출력된다.","difficulty":"","point":"C 배열 순환 인덱스"},{"id":"past-2023-2-2","sourceNumber":2,"bucketLabel":"Java","type":"short","language":"","question":"다음은 JAVA 코드 문제이다.\n가지고 있는 돈이 총 4620원일 경우\n1000원, 500원, 100원, 10원의 지폐 및 동전을\n이용하여 보기의 조건에 맞춰 \"최소한의 코드\"를 작성해 빈 괄호 안을 채우시오.\n\n[보기]\n아래 주어진 항목들을 응용하여 괄호 안 코드를 작성.\n변수 : m\n연산자 : / , %\n괄호 : [ , ] , ( , )\n정수 : 1000, 500, 100, 10","code":"","images":["imported-images/2023-2-q02-1.png"],"parts":[{"label":"a","answers":["m / 1000"]},{"label":"b","answers":["(m % 1000) / 500"]},{"label":"c","answers":["(m % 500) / 100"]},{"label":"d","answers":["(m % 100) / 10"]}],"explanation":"천 원 장수는 m / 1000 = 4 이다. 오백 원 개수는 천 원으로 나눈 나머지 620 을 500 으로 나눈 (m % 1000) / 500 = 1 이다. 백 원 개수는 500 으로 나눈 나머지 120 을 100 으로 나눈 (m % 500) / 100 = 1 이고, 십 원 개수는 100 으로 나눈 나머지 20 을 10 으로 나눈 (m % 100) / 10 = 2 이다. 정수 나눗셈은 몫만 남기고 % 는 나머지를 구한다는 점을 이용해, 바로 위 단위로 나눈 나머지에서 현재 단위의 몫을 구하는 것이 핵심이다.","difficulty":"","point":"Java 몫·나머지 화폐 계산","unordered":false},{"id":"past-2023-2-3","sourceNumber":3,"bucketLabel":"C 언어","type":"code","language":"","question":"다음은 C언어의 코드이다.\n다음의 조건에 맞추어 알맞은 출력값을 작성하시오.\n\n[조건]\n입력값은 홍길동, 김철수, 박영희 순서로 주어진다.","code":"","images":["imported-images/2023-2-q03-1.png"],"parts":[{"label":"정답","answers":["박영희\n박영희\n박영희"]}],"explanation":"test() 는 전역 배열 n 에 입력을 받고 n 의 주소를 반환한다. 세 번 호출해도 반환되는 주소는 모두 같은 n 이므로 test1, test2, test3 는 한 저장 공간을 가리킨다. 입력은 홍길동, 김철수, 박영희 순으로 같은 자리에 덮어써지므로 마지막에는 n 에 박영희만 남는다. 따라서 세 printf 모두 박영희를 출력한다. 포인터 변수는 문자열을 복사하는 것이 아니라 주소만 저장한다는 점이 핵심이며, 원문 그림에서 printf 의 따옴표가 빠진 것은 복원 과정의 누락으로 본다.","difficulty":"","point":"C 전역 배열 포인터 공유"},{"id":"past-2023-2-4","sourceNumber":4,"bucketLabel":"SQL","type":"code","language":"","question":"다음은 테이블에 데이터를 삽입하기 위한 과정이다.\n보기의 조건식에 맞게  데이터 삽입을 위한 SQL문을 작성하시오.\n\nCREATE TABLE 학생 (\n  학번 int,\n  이름 varchar(20),\n  학년 int,\n  전공 varchar(30),\n  전화번호varchar(20)\n);\n\n*****************************************\n- [조건]\n문자열의 경우 작은 따음표를 사용.(' ')","code":"","images":["imported-images/2023-2-q04-1.png"],"parts":[{"label":"정답","answers":["INSERT INTO 학생(학번,이름,학년,전공,전화번호)\nVALUES(22106940,'정처기',4,'컴퓨터공학','010-1234-5678');"]}],"explanation":"행을 넣는 DML 은 INSERT INTO 테이블(컬럼 목록) VALUES(값 목록) 형식으로 쓴다. 컬럼 순서에 맞춰 학번 22106940, 학년 4 는 int 이므로 따옴표 없이, 이름·전공·전화번호는 문자열이므로 작은따옴표로 감싼다. 모든 컬럼에 테이블 정의 순서대로 값을 넣으므로 컬럼 목록을 생략한 INSERT INTO 학생 VALUES(…) 도 같은 결과이다. 전화번호는 하이픈이 들어간 문자 자료라 숫자로 쓰면 안 된다.","difficulty":"","point":"SQL INSERT 문"},{"id":"past-2023-2-5","sourceNumber":5,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어의 문제이다. 알맞은 출력값을 작성하시오.","code":"","images":["imported-images/2023-2-q05-1.png"],"parts":[{"label":"정답","answers":["BCD"]}],"explanation":"sum 은 73 + 95 + 82 = 250 이고 250 / 30 은 정수 나눗셈이라 8 이다. switch 는 case 8 로 들어가 B 를 출력하는데 break 가 없으므로 아래로 계속 실행된다. case 7 은 빈 문장이고 case 6 에서 C, default 에서 D 가 출력되어 결과는 BCD 이다. switch 의 case 는 진입 지점일 뿐이라 break 가 없으면 이후 case 와 default 가 모두 실행된다는 폴스루(fall-through)가 핵심이다.","difficulty":"","point":"C switch 폴스루"},{"id":"past-2023-2-6","sourceNumber":6,"bucketLabel":"테스트","type":"short","language":"","question":"다음은 테스트 커버리지에 대한 내용이다. 내용을 보고 보기에 알맞는 '기호' 를 고르시오\n\n- 프로그램 내에 있는 결정포인트 내의 모든 각 개별 조건식에 대한 모든 가능한 결과 (참/거짓)에 대해 적어도 한번 수행한다.\n\n- 소프트웨어 테스트 수행 시 소스코드를 어느 수준까지 수행하였는가 를 나타내는 기준을 나타낸다.\n\n- 실제 업무에서는 다양한 툴을 사용하여 테스팅 수행한다.\n\n- True/False에 충분한 영향을 줄 수 없는 경우가 발생 가능한 한계점을 지닌다.\n\n***************************************************************************************\n[보기]\nㄱ. 구문 커버리지  \nㄴ. 경로 커버리지  \nㄷ. 조건/결정 커버리지   \nㄹ. 변형 조건/결정 커버리지  \nㅂ. 다중 조건 커버리지  \nㅅ. 결정 커버리지  \nㅇ. 조건 커버리지","code":"","images":[],"parts":[{"label":"정답","answers":["ㅇ","ㅇ. 조건 커버리지"]}],"explanation":"결정 포인트 안의 개별 조건식 하나하나가 참과 거짓을 각각 한 번 이상 갖도록 하는 기준은 조건 커버리지(ㅇ)이다. 개별 조건만 보므로 전체 결정 결과가 참·거짓을 모두 갖는다는 보장은 없고, 이것이 설명의 한계점이다. 결정 커버리지는 결정문 전체의 참·거짓을, 조건/결정 커버리지는 둘을 동시에, 변형 조건/결정 커버리지는 각 조건이 결정 결과에 독립적으로 영향을 주는지를, 다중 조건 커버리지는 조건 조합 전체를 본다. 「개별 조건식」이라는 표현이 조건 커버리지를 가리키는 단서이다.","difficulty":"","point":"조건 커버리지 판별 기준","unordered":false},{"id":"past-2023-2-7","sourceNumber":7,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 소스코드의 알맞은 출력 결과를 작성하시오","code":"","images":["imported-images/2023-2-q07-1.png"],"parts":[{"label":"정답","answers":["505"]}],"explanation":"i 가 1 부터 2023 까지 증가하면서 i % 4 == 0 인 경우, 즉 4 의 배수일 때만 c 를 1 증가시킨다. 1~2023 범위의 4 의 배수는 4, 8, …, 2020 이고 개수는 2023 / 4 의 몫인 505 이다. 2024 는 범위 밖이므로 포함되지 않는다. 따라서 출력은 505 이다.","difficulty":"","point":"C 반복문 배수 개수"},{"id":"past-2023-2-8","sourceNumber":8,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음 내용에 해당하는 알맞는 답을 작성하시오.\n\n- 소프트웨어에서 워터마크 삭제  등과 같이 소프트웨어가 불법으로 변경(unauthorized modifications)되었을 경우, 그 소프트웨어가 정상 수행되지 않게 하는 기법이다.\n\n- 소프트웨어 변조 공격을 방어하기 위해 프로그램에 변조검증코드(tamper-proofing code)를 삽입하는 것도 한 방법으로, 변조검증코드의 용도는 첫째 프로그램이 변경되었는지를 탐지하는 것이고, 둘째는 변조가 탐지되었다면 프로그램이 실행되지 않게 한다.\n\n- 소프트웨어의 위변조 방지 역공학 기술의 일종으로 디지털 콘텐츠의 관련 산업이나 전자상거래 또는 보호해야 할 소프트웨어가 있는 다양한 산업 분야에 적용된다.","code":"","images":[],"parts":[{"label":"정답","answers":["템퍼 프루핑","Tamper Proofing","템퍼 프루핑(Tamper proofing)","탬퍼 프루핑"]}],"explanation":"템퍼 프루핑(Tamper Proofing)은 소프트웨어가 무단 변경되었는지를 탐지하고, 변조가 확인되면 정상 실행되지 않도록 하는 위변조 방지 기술이다. 해시 값 비교 같은 변조 검증 코드를 프로그램 안에 넣어 탐지와 실행 차단을 함께 수행한다. 코드를 읽기 어렵게 만드는 난독화(Obfuscation)는 분석을 어렵게 할 뿐 변조 시 실행을 막지는 않고, 워터마킹은 소유권 표시가 목적이라 구분된다. 「변경되었을 경우 정상 수행되지 않게」가 채점 포인트이다.","difficulty":"","point":"템퍼 프루핑 위변조 방지","unordered":false},{"id":"past-2023-2-9","sourceNumber":9,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어 문제이다.\n알맞은 출력값을 작성하시오.","code":"","images":["imported-images/2023-2-q09-1.png"],"parts":[{"label":"정답","answers":["213465"]}],"explanation":"isWhat 배열과 point 로 만든 스택이며 into 는 ++point 위치에 넣고 take 는 point 위치 값을 꺼낸 뒤 point 를 줄인다. into(5), into(2) 후 스택은 [5, 2] 이다. 반복 안에서 take 로 2 를 출력하고, 4·1 을 넣어 [5, 4, 1] 에서 1, 3 을 넣어 [5, 4, 3] 에서 3 과 4, 6 을 넣어 [5, 6] 에서 6 과 5 를 출력한다. 이때 스택이 비어 isEmpty() 가 1 이 되므로 반복이 끝나고 출력은 213465 이다. 나중에 넣은 것이 먼저 나오는 LIFO 동작을 따라가는 것이 핵심이다.","difficulty":"","point":"C 배열 스택 LIFO"},{"id":"past-2023-2-10","sourceNumber":10,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 DB 설계 순서에 관한 내용이다.\n보기를 이용하여 괄호안에 알맞은 내용을 작성하시오.\n\n[보기]\n구현, 요구조건 분석, 개념적 설계, 물리적 설계, 논리적 설계","code":"","images":["imported-images/2023-2-q10-1.png"],"parts":[{"label":"1단계","answers":["요구조건 분석","요구사항 분석"]},{"label":"2단계","answers":["개념적 설계","개념 설계"]},{"label":"3단계","answers":["논리적 설계","논리 설계"]},{"label":"4단계","answers":["물리적 설계","물리 설계"]},{"label":"5단계","answers":["구현"]}],"explanation":"데이터베이스 설계는 요구조건 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현 순서로 진행한다. 개념적 설계에서는 DBMS 와 무관하게 E-R 다이어그램 같은 개념 모델을 만들고, 논리적 설계에서는 특정 데이터 모델(관계형 등)에 맞춰 테이블 구조로 변환하며 정규화를 한다. 물리적 설계는 저장 구조, 인덱스, 접근 경로처럼 실제 저장 방식을 정하고, 구현 단계에서 DDL 로 데이터베이스를 만든다. 「개념 → 논리 → 물리」로 추상에서 구체로 내려간다는 점으로 순서를 기억한다.","difficulty":"","point":"DB 설계 단계 순서","unordered":false},{"id":"past-2023-2-11","sourceNumber":11,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 디자인 패턴에 관한 문제이다. 보기를 참고하여 알맞는 답을 작성하시오.\n\n[1]\n- 생성자가 여러 차례 호출되더라도 실제로 생성되는 객체는 하나이고 최초 생성 이후에 호출된 생성자는 최초의 생성자가 생성한 객체를 리턴한다.\n- 주로 공통된 객체를 여러개 생성해서 사용하는 DBCP(DataBase Connection Pool)와 같은 상황에서 많이 사용한다.\n\n\n[2] \n- 호스트 객체의 내부 상태에 접근할 수 있는 방법을 제공하여 호스트 객체에 연산을 추가할 수 있도록 한다.\n- 이 패턴은 보통 합성 구조의 원소들과 상호 작용하는 데 사용되며, 기존 코드를 변경하지 않고 새로운 기능을 추가하는 방법이다.","code":"","images":["imported-images/2023-2-q11-1.png"],"parts":[{"label":"[1]","answers":["Singleton","싱글톤","싱글턴","Singleton Pattern","싱글톤 패턴"]},{"label":"[2]","answers":["Visitor","비지터","방문자","Visitor Pattern","비지터 패턴"]}],"explanation":"[1] 은 생성자를 여러 번 호출해도 객체가 하나만 만들어지고 이후에는 그 객체를 돌려주므로 생성 패턴인 싱글톤(Singleton)이다. DB 커넥션 풀처럼 공유 자원을 하나로 관리할 때 쓴다. [2] 는 데이터 구조(호스트 객체)와 연산을 분리해, 구조를 바꾸지 않고 방문자 객체로 새 연산을 추가하는 행위 패턴인 비지터(Visitor)이다. 객체에 책임을 동적으로 덧붙이는 데코레이터(Decorator)와 달리 비지터는 합성 구조의 원소들을 순회하며 연산을 적용한다는 점에서 구분된다.","difficulty":"","point":"싱글톤·비지터 패턴","unordered":false},{"id":"past-2023-2-12","sourceNumber":12,"bucketLabel":"네트워크","type":"short","language":"","question":"다음 내용에서 설명하는 문제에 대해 보기에 알맞는 답을 골라 작성하시오.\n\n[보기]\nEAC, FEC, hamming, CRC, PDS, parity, BEC\n\n***************************************************************************************\n\n( 1 ) Code는 데이터 전송시 1 비트의 에러를 정정할 수 있는, 오류정정부호의 일종으로 미국의 Bell 연구소의 Hamming에 의해 고안되었다.\n선형블록부호 및 순회부호에 속에 속한다.\n\n \n\n( 2 ) 은/는 송신측이 전송할 문자나 프레임에 부가적 정보(Redundancy)를 첨가하여 전송하고 수신측이 이 부가적 정보를 이용하여 에러검출 및 에러정정을 하는 방식이다.\n\n \n\n( 3 ) 은/는 공격자가 전자 메일을 사용하여 상대방이 금전을 보내거나 기밀 회사 정보를 누설하도록 유도하는 사이버 범죄의 일종이다.\n\n공격자는 신뢰할 수 있는 인물로 가장한 다음 가짜 청구서의 지불을 요청하거나 다른 사기에서 사용할 중요한 데이터를 요구한다.\n\n \n\n( 4 ) 은/는 데이터가 저장장치 내의 한 장소에서 다른 장소로 이동되거나, 컴퓨터들간에 전송될 때, 데이터가 유실 또는 손상되었는지 여부를 점검하는 기술과 관련된 용어이다.\n\n \n\n( 5 ) 은/는 네트워크 등을 통하여 데이터를 전송할 때 전송된 데이터에 오류가 있는지를 확인하기 위한 체크값을 결정하는 방식을 말한다.","code":"","images":[],"parts":[{"label":"(1)","answers":["hamming","해밍"]},{"label":"(2)","answers":["FEC","Forward Error Correction"]},{"label":"(3)","answers":["BEC","Business Email Compromise"]},{"label":"(4)","answers":["parity","패리티"]},{"label":"(5)","answers":["CRC","Cyclic Redundancy Check"]}],"explanation":"(1) 은 1 비트 오류를 정정하는 해밍(hamming) 코드이다. (2) 는 송신 측이 부가 정보를 덧붙여 수신 측이 재전송 요청 없이 스스로 오류를 검출·정정하는 전진 오류 수정 FEC 이다. (3) 은 신뢰할 수 있는 인물로 가장한 이메일로 송금이나 기밀 유출을 유도하는 비즈니스 이메일 침해 BEC(Business Email Compromise)이다. (4) 는 데이터 이동·전송 중 손상 여부를 점검하는 패리티(parity), (5) 는 다항식 나눗셈으로 체크값을 정해 오류를 검출하는 순환 중복 검사 CRC 이다. BEC 는 오류 제어 용어(후진 오류 수정)의 약자로도 쓰이지만 이 문항에서는 보안 공격의 의미라는 점에 주의한다.","difficulty":"","point":"오류 검출·정정 기법","unordered":false},{"id":"past-2023-2-13","sourceNumber":13,"bucketLabel":"네트워크","type":"short","language":"","question":"다음은 HDLC 프로토콜에 대한 설명이다. 보기 안에 알맞는 '기호' 를 골라 작성하시오.\n\n[보기]\nㄱ. 연결제어     ㄴ. 감독     ㄷ. 정보     ㄹ. 양방향 응답     ㅁ. 익명     ㅂ. 비번호\nㅅ. 릴레이    ㅇ. 동기균형     ㅈ. 동기응답    ㅊ. 비동기균형     ㅋ. 비동기응답\n\n***************************************************************************************\n\n( 1 ) 프레임은 Seq, Next, P/F의 필드를 가진다. 또한 맨 처음 비트를 0으로 가진다. Seq는 송신용 순서번호를 가지고 있다. Next는 응답용 순서번호를 가진다. P/F는 P가 1로 설정된 경우 주국에서 종국에 데이터 전송을 허용하는 것을 의미하고 F가 1로 설정된 경우 종국에서 주국으로 데이터 전송을 하는 것을 의미한다.\n\n\n( 2 ) 프레임은 맨 앞의 필드가 1로 되어 있어 정보 프레임이 아니라는 것을 나타내고 다음 비트가 0이 나와있다. Type의 경우에는 2비트를 가지고 있어 4가지의 종류로 나누어진다.  데이터를 보내는 역할이 아니라 응답의 기능을 수행하므로 Seq에 대한 값은 필요가 없고 다음 프레임을 요구하는 Next만 존재한다.\n\n\n( 3 ) 프레임은 순서 번호가 없는 프레임을 의미한다. 첫 번째 비트와 두 번째 비트가 모두 1로 설정되어 있다. 여러 종류를 가지고 있는데 Type의 2비트와 Modifier의 3비트를 합쳐 5비트를 통해 종류를 나눈다.\n\n\n( 4 ) 은/는 두 호스트 모두 혼합국으로 동작한다. 양쪽에서 명령과 응답을 전송할 수 있다.\n\n\n( 5 ) 은/는 불균형 모드로 주국의 허락 없이 종국에서 데이터를 전송할 수 있다.","code":"","images":[],"parts":[{"label":"(1)","answers":["ㄷ","ㄷ. 정보"]},{"label":"(2)","answers":["ㄴ","ㄴ. 감독"]},{"label":"(3)","answers":["ㅂ","ㅂ. 비번호"]},{"label":"(4)","answers":["ㅊ","ㅊ. 비동기균형"]},{"label":"(5)","answers":["ㅋ","ㅋ. 비동기응답"]}],"explanation":"HDLC 프레임은 제어 필드의 앞 비트로 종류를 구분한다. 첫 비트가 0 이고 송신 순서번호(Seq)와 응답 순서번호(Next)를 모두 갖는 (1) 은 정보 프레임(ㄷ), 앞 두 비트가 10 이고 Next 만 갖고 흐름·오류 제어를 하는 (2) 는 감독 프레임(ㄴ), 앞 두 비트가 11 이고 순서번호 없이 링크 설정·해제 등을 하는 (3) 은 비번호 프레임(ㅂ)이다. 양쪽이 혼합국으로 대등하게 명령과 응답을 보내는 (4) 는 비동기 균형 모드 ABM(ㅊ), 불균형 구성이지만 종국이 주국의 허락 없이 전송할 수 있는 (5) 는 비동기 응답 모드 ARM(ㅋ)이다. 주국의 허락(폴링)을 받아야만 종국이 전송하는 정규 응답 모드 NRM 과 구분한다.","difficulty":"","point":"HDLC 프레임과 동작 모드","unordered":false},{"id":"past-2023-2-14","sourceNumber":14,"bucketLabel":"Java","type":"code","language":"","question":"다음은 자바 프로그래밍에 대한 문제이다. 알맞은 출력값을 작성하시오.\n단, 프로그래밍 언어 특성에 따른 대·소문자를 반드시 구별해서 작성하시오.","code":"","images":["imported-images/2023-2-q14-1.png"],"parts":[{"label":"정답","answers":["true\nfalse\ntrue\ntrue"]}],"explanation":"문자열 리터럴은 상수 풀에 한 번만 저장되므로 str1 과 str2 는 같은 객체를 가리켜 str1 == str2 는 true 이다. new String 은 힙에 새 객체를 만들므로 str3 는 다른 객체이고 str1 == str3 는 false 이다. equals 는 참조가 아니라 문자열 내용을 비교하므로 str1.equals(str3) 와 str2.equals(str3) 는 모두 true 이다. == 는 참조(주소) 비교, equals 는 값 비교라는 차이가 핵심이며, 원문 그림의 작은따옴표와 System.out 누락은 복원 과정의 오류로 보고 큰따옴표 문자열로 해석한다.","difficulty":"","point":"Java 문자열 == 과 equals"},{"id":"past-2023-2-15","sourceNumber":15,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음 보기는 암호화 알고리즘에 대한 내용이다.\n대칭키와 비대칭키에 해당하는 용어를 보기의 내용 참고하여 작성하시오.\n\n[보기]\nDES, RSA, AES, ECC, PKI, ARIA, SEED\n\n*****************************************\n- 대칭키 : (          )\n\n- 비대칭키 : (          )","code":"","images":[],"parts":[{"label":"대칭키","answers":["DES, AES, ARIA, SEED","DES, AES, SEED, ARIA","DES, ARIA, AES, SEED","DES, ARIA, SEED, AES","DES, SEED, AES, ARIA","DES, SEED, ARIA, AES","AES, DES, ARIA, SEED","AES, DES, SEED, ARIA","AES, ARIA, DES, SEED","AES, ARIA, SEED, DES","AES, SEED, DES, ARIA","AES, SEED, ARIA, DES","ARIA, DES, AES, SEED","ARIA, DES, SEED, AES","ARIA, AES, DES, SEED","ARIA, AES, SEED, DES","ARIA, SEED, DES, AES","ARIA, SEED, AES, DES","SEED, DES, AES, ARIA","SEED, DES, ARIA, AES","SEED, AES, DES, ARIA","SEED, AES, ARIA, DES","SEED, ARIA, DES, AES","SEED, ARIA, AES, DES"]},{"label":"비대칭키","answers":["RSA, ECC","ECC, RSA"]}],"explanation":"대칭키 암호는 암호화와 복호화에 같은 키를 쓰며 DES, AES, ARIA, SEED 가 해당한다. 비대칭키(공개키) 암호는 공개키와 개인키 쌍을 쓰며 소인수분해 문제에 기반한 RSA 와 타원 곡선 이산대수 문제에 기반한 ECC 가 해당한다. PKI 는 공개키 인증서를 발급·관리하는 기반 구조이지 암호 알고리즘이 아니므로 어느 쪽에도 넣지 않는다. ARIA 와 SEED 는 국내에서 개발된 블록 암호라는 점도 함께 기억한다.","difficulty":"","point":"대칭키·비대칭키 알고리즘","unordered":false},{"id":"past-2023-2-16","sourceNumber":16,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"다음 괄호 안에 알맞는 답을 작성하시오.\n\n- ( ) 란 임의의 크기를 가진 데이터(Key)를 고정된 크기의 데이터(Value)로 변화시켜 저장하는 것이다.\n- 키에 대한 ( ) 값을 사용하여 값을 저장하고 키-값 쌍의 갯수에 따라 동적으로 크기가 증가한다.\n- ( ) 값 자체를 index로 사용하기 때문에 평군 시간복잡도가 O(1) 로 매우 빠르다\n- ( ) 함수는 임의의 길이의 데이터를 고정된 길이의 데이터로 매핑하는 함수이다.\n- ( ) 함수는 큰 파일에서 중복되는 레코드를 찾을 수 있기 때문에 데이터베이스 검색이나 테이블 검색의 속도를 가속할 수 있다.","code":"","images":[],"parts":[{"label":"정답","answers":["해시","Hash","해시(hash)"]}],"explanation":"해시(Hash)는 해시 함수로 임의 길이의 데이터를 고정 길이의 값으로 바꾸는 것이며, 그 값을 인덱스로 삼아 저장하는 자료구조가 해시 테이블이다. 키에서 곧바로 저장 위치를 계산하므로 평균 탐색 시간 복잡도가 O(1) 이다. 서로 다른 키가 같은 해시 값을 갖는 충돌은 체이닝이나 개방 주소법으로 처리한다. 「임의 길이 → 고정 길이」, 「O(1)」 이 채점 포인트이다.","difficulty":"","point":"해시 함수와 해시 테이블","unordered":false},{"id":"past-2023-2-17","sourceNumber":17,"bucketLabel":"SQL","type":"short","language":"","question":"다음 조건을 참고하여, SQL문에서 괄호안에 알맞는 단어를 작성하시오.\n\n[조건]\n학생 테이블을 참조하는 다른 VIEW나 제약 조건까지 모두 삭제되어야 한다.\n단, 용어의 대·소문자는 상관하지 않는다.\n***************************************************************************************\n\nDROP VIEW 학생 (         )","code":"","images":[],"parts":[{"label":"정답","answers":["CASCADE"]}],"explanation":"DROP 문의 CASCADE 옵션은 삭제 대상을 참조하는 다른 뷰나 제약 조건까지 연쇄적으로 함께 삭제한다. 반대 옵션인 RESTRICT 는 참조하는 객체가 하나라도 있으면 삭제를 거부한다. 조건이 「참조하는 다른 VIEW 나 제약 조건까지 모두 삭제」이므로 답은 CASCADE 이다. 원문은 「학생 테이블」이라고 하면서 DROP VIEW 를 쓰고 있으나, 묻는 핵심은 연쇄 삭제 옵션이다.","difficulty":"","point":"SQL DROP CASCADE"},{"id":"past-2023-2-18","sourceNumber":18,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 코드는 선택정렬 구현에 관한 문제이다.\n빈칸에 알맞는 연산자를 보기에서 골라 작성하시오.","code":"","images":["imported-images/2023-2-q18-1.png"],"parts":[{"label":"정답","answers":[">"]}],"explanation":"바깥 do-while 은 기준 위치 i 를, 안쪽 do-while 은 그 뒤의 j 를 돌며 E[i] 와 E[j] 를 비교해 교환한다. E[i] > E[j] 일 때 교환하면 i 자리에 남은 값 중 가장 작은 값이 모이므로 오름차순 정렬이 된다. i = 0 이 끝나면 E[0] 이 11, i = 1 이 끝나면 E[1] 이 12 가 되는 식으로 진행되어 최종 출력은 11 12 22 25 64 이다. < 를 넣으면 내림차순이 되므로, 오름차순 정렬을 의도한 원 문제에 맞는 연산자는 > 이다.","difficulty":"","point":"C 선택 정렬 비교 연산자"},{"id":"past-2023-2-19","sourceNumber":19,"bucketLabel":"Python","type":"short","language":"","question":"다음 Python 코드에 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2023-2-q19-1.png"],"parts":[{"label":"정답","answers":["engneing"]}],"explanation":"문자열 a = \"engineer information processing\" 의 길이는 31 이고 슬라이싱 a[x:y] 는 x 부터 y 바로 앞까지를 자른다. b = a[:3] 은 0~2 번째인 eng, c = a[4:6] 은 4~5 번째인 ne 이다. d = a[28:] 은 28 번째부터 끝까지인데 processing 이 21 번째에서 시작하므로 28 번째는 i 이고 d 는 ing 이다. e = b + c + d 이므로 eng + ne + ing 를 이어 붙인 engneing 이 출력된다.","difficulty":"","point":"Python 문자열 슬라이싱"},{"id":"past-2023-2-20","sourceNumber":20,"bucketLabel":"테스트","type":"short","language":"","question":"다음 설명에 대한 알맞는 답을 작성하시오.\n\n[1]\n- 하향식 테스트 시 상위 모듈은 존재하나 하위 모듈이 없는 경우의 테스트를 위해 임시 제공되는 모듈이다.\n- 특별한 목적의 소프트웨어를 구현하는 것으로 컴포넌트를 개발하거나 테스트할 때 사용된다.\n- 서버-클라이언트 구조에서 서버만 구현된 상태로 테스트를 해보고 싶을때 단순히 값만 넘겨주는 가상의 클라이언트를 만들어서 테스트 할 수 있다.\n\n[2]\n- 상향식 테스트 시 상위 모듈 없이 하위 모듈이 존재할 때 하위 모듈 구동 시 자료 입출력을 제어하기 위한 제어 모듈(소프트웨어)이다.\n- 서버-클라이언트 구조에서 클라이언트만 구현된 상태로 테스트를 해보고 싶을때 접속 인증 등의 간단한 기능만 하는 가상의 서버를 만들어서 테스트 할 수 있다.","code":"","images":[],"parts":[{"label":"[1]","answers":["스텁","테스트 스텁","Stub","Test Stub"]},{"label":"[2]","answers":["드라이버","테스트 드라이버","Driver","Test Driver"]}],"explanation":"[1] 은 하향식 통합 테스트에서 상위 모듈은 있으나 아직 없는 하위 모듈을 대신해 호출을 받아 미리 정한 값을 돌려주는 임시 모듈, 테스트 스텁(Stub)이다. [2] 는 상향식 통합 테스트에서 아직 없는 상위 모듈을 대신해 하위 모듈을 호출하고 입력·출력을 제어하는 테스트 드라이버(Driver)이다. 「하향식=스텁(아래를 가짜로)」, 「상향식=드라이버(위를 가짜로)」 로 구분한다. 지문의 서버-클라이언트 예시는 설명이 다소 섞여 있으므로 하향식·상향식이라는 첫 문장을 기준으로 판단한다.","difficulty":"","point":"테스트 스텁과 드라이버","unordered":false}]},{"key":"past-2023-3","name":"2023년 3회 기출","questions":[{"id":"past-2023-3-1","sourceNumber":1,"bucketLabel":"Java","type":"short","language":"","question":"다음은 Java 코드로 작성한 프로그램이다.\n올바른 출력 결과를 작성하시오.","code":"","images":["imported-images/2023-3-q01-1.png"],"parts":[{"label":"정답","answers":["BDCDD"]}],"explanation":"변수 b 의 선언형은 A 이지만 실제 객체는 B 이므로, 오버라이딩된 메서드는 항상 B 의 것이 호출된다(동적 바인딩). b.paint() 는 B.paint() 로 들어가 먼저 super.draw() 로 A.draw() 를 실행해 B 를 출력한다. A.draw() 안의 draw() 호출도 실제 객체가 B 이므로 B.draw() 가 실행되어 D 를 출력하고, A.draw() 의 재귀처럼 보이는 부분은 여기서 끝난다. 이어서 B.paint() 가 C 를 출력하고 this.draw() 로 D 를 출력한다. 마지막 b.draw() 가 다시 D 를 출력해 최종 결과는 BDCDD 이다. super 로 부른 부모 메서드 안에서도 내부 호출은 자식의 오버라이딩 메서드로 간다는 점이 핵심이다.","difficulty":"","point":"Java 오버라이딩·super 호출"},{"id":"past-2023-3-2","sourceNumber":2,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음 설명하는 용어를 보기에 맞게 골라 '기호'를  1개 작성하시오.\n\n[보기]\nㄱ.NFT                            ㄴ.JWT                        \nㄷ.SAML                         ㄹ.accessToken             \nㅁ.SSO                            ㅂ.OIDC            \nㅅ.Autentication             ㅇ. OAuth             \nㅈ.Cookie                       ㅊ.Refresh Token\n\n***************************************************************************************\n- 사용자가 사용자 이름 및 암호와 같은 자격 증명을 공유하지 않고도 타사 애플리케이션이 데이터 또는 리소스에 액세스할 수 있도록 권한을 부여할 수 있는 개방형 표준 프로토콜이다.\n\n- 사용자가 데이터에 대한 제어를 유지하면서 리소스에 대한 액세스 권한을 부여할 수 있는 안전하고 표준화된 방법을 제공하며, 액세스 토큰을 사용하여 타사 애플리케이션에 리소스에 대한 액세스 권한을 부여하는 메커니즘을 사용자에게 제공하는 방식으로 작동한다.\n\n- 사용자가 응용 프로그램에 대한 액세스 권한을 부여하면 응용 프로그램은 사용자를 대신하여 사용자의 리소스 또는 데이터에 액세스하는 데 사용할 수 있는 액세스 토큰을 받는다.\n\n- 암호와 같은 사용자의 자격 증명은 타사 응용 프로그램과 공유되지 않으며, 클라우드 스토리지 서비스, 온라인 마켓 플레이스 및 금융 서비스를 포함한 다른 많은 응용 프로그램 및 서비스에서도 사용된다.\n\n- Facebook, Twitter 및 LinkedIn과 같은 소셜 미디어 플랫폼에서 널리 사용되어 사용자가 소셜 미디어 데이터에 대한 액세스 권한을 타사 애플리케이션에 부여할 수 있도록 한다.\n\n- 타사 애플리케이션에 대한 사용자 자격 증명의 노출을 최소화하여 향상된 보안, 간소화된 애플리케이션 개발, 사용자가 리소스에 대한 액세스 권한을 쉽게 부여하거나 취소할 수 있도록 하여 향상된 사용자 환경 등 여러 가지 이점을 제공한다.","code":"","images":[],"parts":[{"label":"정답","answers":["ㅇ","ㅇ. OAuth"]}],"explanation":"자격 증명(아이디·비밀번호)을 넘기지 않고 액세스 토큰으로 타사 애플리케이션에 자원 접근 권한을 위임하는 개방형 표준은 OAuth 이다. 사용자가 권한을 승인하면 애플리케이션은 토큰을 받아 사용자를 대신해 API 를 호출하고, 사용자는 언제든 권한을 취소할 수 있다. 비슷한 보기와 구분하면, SSO 는 한 번 로그인으로 여러 서비스를 쓰는 인증 방식이고, OIDC 는 OAuth 위에 사용자 신원(ID 토큰)을 더한 인증 계층이며, JWT 는 토큰의 형식, SAML 은 XML 기반 인증 정보 교환 표준이다. 문제는 인증보다 권한 위임(인가)에 초점을 두므로 ㅇ(OAuth)이 답이다.","difficulty":"","point":"OAuth 권한 위임","unordered":false},{"id":"past-2023-3-3","sourceNumber":3,"bucketLabel":"운영체제","type":"short","language":"","question":"리눅스(Linux)에서 사용자에게 읽기/쓰기/실행 권한을 부여하고,\n그룹에게는 읽기/실행을 부여하고,\n그 이외에는 실행 권한을 test.txt 파일에 부여하는 위한 명령어는 다음과 같다.\n빈칸에 들어갈 답을 작성하시오. (8진법 사용)\n\n(    ①    ) (    ②    ) test.txt","code":"","images":[],"parts":[{"label":"①","answers":["chmod"]},{"label":"②","answers":["751"]}],"explanation":"리눅스에서 파일 권한을 바꾸는 명령어는 chmod 이다. 8진수 표기에서 읽기(r)=4, 쓰기(w)=2, 실행(x)=1 을 더해 소유자·그룹·기타 사용자 순으로 한 자리씩 쓴다. 소유자 rwx 는 4+2+1=7, 그룹 r-x 는 4+1=5, 기타 --x 는 1 이므로 751 이 된다. 따라서 명령은 chmod 751 test.txt 이다. 소유자를 바꾸는 chown, 기본 권한 마스크를 정하는 umask 와 혼동하지 않는다.","difficulty":"","point":"chmod 8진수 권한","unordered":false},{"id":"past-2023-3-4","sourceNumber":4,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C 언어 코드이다. 알맞는 출력 결과를 작성하시오.","code":"","images":["imported-images/2023-3-q04-1.png"],"parts":[{"label":"정답","answers":["34"]}],"explanation":"test(n) 은 1 부터 n/2 까지의 약수를 모두 더해 그 합이 n 과 같으면 1 을 돌려주는 함수, 즉 완전수 판별 함수이다. main 은 2 부터 100 까지 중 완전수만 sum 에 더한다. 6 은 1+2+3=6, 28 은 1+2+4+7+14=28 로 완전수이고, 100 이하에서 다른 완전수는 없다. 따라서 sum 은 6+28=34 이고, printf 의 서식이 \"%d \" 라 34 뒤에 공백 하나가 붙어 출력된다.","difficulty":"","point":"C 완전수 합 계산"},{"id":"past-2023-3-5","sourceNumber":5,"bucketLabel":"C 언어","type":"short","language":"","question":"C언어에서 구조체의 멤버에 접근하기 위해 괄호안의 '기호'를 작성하시오.\n\n[출력결과]\n10\n10","code":"","images":["imported-images/2023-3-q05-1.png"],"parts":[{"label":"정답","answers":["→"]}],"explanation":"d1 은 구조체 변수이므로 멤버에 점(.) 연산자로 접근하지만, d2 는 malloc 으로 받은 구조체 포인터이므로 화살표 연산자 -> 로 접근한다. d2->numPtr 는 (*d2).numPtr 과 같은 뜻이다. 두 numPtr 모두 num 의 주소를 가리키므로 *d1.numPtr 과 *d2->numPtr 은 모두 10 이 되어 출력 결과가 10, 10 이다. 빈칸에는 하이픈과 부등호를 붙인 -> 를 쓴다. 저장된 답은 화살표 기호(→)로 적혀 있으나 실제 C 코드에서 쓰는 기호는 -> 이다.","difficulty":"","point":"C 구조체 포인터 -> 연산자"},{"id":"past-2023-3-6","sourceNumber":6,"bucketLabel":"SQL","type":"code","language":"","question":"다음 빈칸에 들어갈 UNION 연산의 결과값을 작성하시오.","code":"[쿼리]\nSELECT A FROM  T1\nUNION\nSELECT A FROM  T2\nORDER BY A DESC;","images":["imported-images/2023-3-q06-1.png"],"parts":[{"label":"정답","answers":["4\n3\n1"]}],"explanation":"UNION 은 두 SELECT 결과를 합치면서 중복 행을 제거한다. T1 은 3, 1, 4 이고 T2 도 3, 1, 4 이므로 합친 뒤 중복을 지우면 1, 3, 4 세 행만 남는다. ORDER BY A DESC 로 내림차순 정렬하면 4, 3, 1 순서가 된다. 중복을 그대로 남기는 UNION ALL 이었다면 여섯 행이 나왔을 것이라는 점과 구분한다.","difficulty":"","point":"SQL UNION 중복 제거"},{"id":"past-2023-3-7","sourceNumber":7,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음 설명은 서버 접근 통제의 유형이다. 괄호 안에 들어갈 용어를 작성하시오.\n('영어 약자'로 작성하시오.)\n\n- (   ①   )은/는 규칙 기반(Rule-Based) 접근통제 정책으로, 객체에 포함된 정보의 허용 등급과 접근 정보에 대하여 주체가 갖는 접근 허가 권한에 근거하여 객체에 대한 접근을 제한하는 방법이다.\n\n- (   ②   )은/는 중앙 관리자가 사용자와 시스템의 상호관계를 통제하며 조직 내 맡은 역할(Role)에 기초하여 자원에 대한 접근을 제한하는 방법이다.\n\n- (   ③   )은/는 신분 기반(Identity-Based) 접근통제 정책으로, 주체나 그룹의 신분에 근거하여 객체에 대한 접근을 제한하는 방법이다.","code":"","images":[],"parts":[{"label":"①","answers":["MAC","MAC(Mandatory Access Control)"]},{"label":"②","answers":["RBAC","RBAC(Role-Based Access Control)"]},{"label":"③","answers":["DAC","DAC(Discretionary Access Control)"]}],"explanation":"① 객체의 보안 등급(허용 등급)과 주체의 인가 등급을 비교해 규칙으로 접근을 정하는 방식은 강제적 접근통제 MAC(Mandatory Access Control)이다. ② 사용자 개인이 아니라 조직 내 역할에 권한을 부여하고 중앙 관리자가 통제하는 방식은 역할 기반 접근통제 RBAC(Role-Based Access Control)이다. ③ 주체의 신분(ID)이나 그룹에 근거하고, 객체 소유자가 재량으로 권한을 줄 수 있는 방식은 임의적 접근통제 DAC(Discretionary Access Control)이다. 규칙 기반이면 MAC, 역할이면 RBAC, 신분 기반이면 DAC 로 키워드를 연결해 구분한다.","difficulty":"","point":"접근통제 MAC·RBAC·DAC","unordered":false},{"id":"past-2023-3-8","sourceNumber":8,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어 코드에 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2023-3-q08-1.png"],"parts":[{"label":"정답","answers":["5040"]}],"explanation":"f(n) 은 n 이 1 이하이면 1 을, 아니면 n*f(n-1) 을 돌려주는 재귀 팩토리얼 함수이다. f(7) 은 7*f(6) 으로 펼쳐지고 f(1)=1 에서 멈춘 뒤 거꾸로 곱해진다. 계산하면 1, 2, 6, 24, 120, 720 을 거쳐 7*720=5040 이 된다. 따라서 출력은 5040 이다.","difficulty":"","point":"C 재귀 팩토리얼 결과"},{"id":"past-2023-3-9","sourceNumber":9,"bucketLabel":"네트워크","type":"short","language":"","question":"다음 설명에 대해 괄호 안에 알맞는 용어를 작성하시오.\n('영어 약자' 로 작성하시오.)\n\n- (     )은/는 자료를 일정한 크기로 정하여 순서대로 전송하는 자료의 전송 방식이다.\n\n- 셀이라 부르는 고정 길이 패킷을 이용하여 처리가 단순하고 고속망에 적합하며, 연속적으로 셀을 보낼 때 다중화를 하지 않고 셀단위로 동기가 이루어지지만 경우에 따라 동기식 시간 분할 다중화를 사용하기도 한다.\n\n- 가상 채널 (Virtual Channel) 기반의 연결 지향 서비스로 셀이라 부르는 고정 길이(53바이트) 패킷을 사용하며 통계적 다중화 방식을 이용한다.","code":"","images":[],"parts":[{"label":"정답","answers":["ATM","ATM(Asynchronous Transfer Mode)"]}],"explanation":"셀(cell)이라는 53바이트 고정 길이 패킷을 사용하고, 가상 채널 기반 연결 지향 서비스와 통계적 다중화를 쓰는 전송 방식은 ATM(Asynchronous Transfer Mode, 비동기 전송 모드)이다. 고정 길이라 스위칭 처리가 단순해 고속망에 적합하다. 53바이트는 헤더 5바이트와 데이터 48바이트로 구성된다. 가변 길이 프레임을 쓰는 프레임 릴레이나 X.25 와는 셀 고정 길이라는 점으로 구분한다.","difficulty":"","point":"ATM 셀 전송 방식","unordered":false},{"id":"past-2023-3-10","sourceNumber":10,"bucketLabel":"C 언어","type":"code","language":"","question":"다음은 C언어의 포인터 문제이다. 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2023-3-q10-1.png"],"parts":[{"label":"정답","answers":["KOREA\nOREA\nK\nE\nO"]}],"explanation":"p 는 문자열 \"KOREA\" 의 첫 글자를 가리키는 포인터이다. %s 로 p 를 출력하면 KOREA, p+1 은 두 번째 글자부터라 OREA 가 출력된다. *p 는 첫 글자 K, *(p+3) 은 인덱스 3 의 글자 E 이다. *p+4 는 괄호가 없어 *p 를 먼저 구한 뒤 4 를 더하므로 문자 K 의 코드값에 4 를 더한 O 가 된다(인덱스 4 의 A 가 아님). 따라서 KOREA, OREA, K, E, O 가 차례로 출력된다.","difficulty":"","point":"C 포인터 연산 우선순위"},{"id":"past-2023-3-11","sourceNumber":11,"bucketLabel":"Java","type":"short","language":"","question":"다음 Java 코드에 대한 알맞는 출력값을 작성하시오.","code":"","images":["imported-images/2023-3-q11-1.png"],"parts":[{"label":"정답","answers":["2"]}],"explanation":"obj 는 Parent 형이지만 실제 객체가 Child 이므로 compute 는 Child 의 것이 실행되고, 내부 재귀 호출도 모두 Child.compute 로 간다. Child 의 점화식은 c(n)=c(n-1)+c(n-3) 이고 n<=1 이면 n 을 그대로 돌려주므로 c(1)=1, c(0)=0, c(-1)=-1 이다. 차례로 c(2)=c(1)+c(-1)=0, c(3)=c(2)+c(0)=0, c(4)=c(3)+c(1)=1, c(5)=c(4)+c(2)=1, c(6)=c(5)+c(3)=1, c(7)=c(6)+c(4)=2 이다. 따라서 출력은 2 이며, 음수 인자일 때 n 을 그대로 반환해 -1 이 나오는 점을 놓치지 않아야 한다.","difficulty":"","point":"Java 오버라이딩 재귀"},{"id":"past-2023-3-12","sourceNumber":12,"bucketLabel":"네트워크","type":"short","language":"","question":"IP 패킷에서 외부의 공인 IP주소와 포트 주소에 해당하는 내부 IP주소를 재기록하여 라우터를 통해 네트워크 트래픽을 주고받는 기술은 무엇인가?","code":"","images":[],"parts":[{"label":"정답","answers":["NAT(Network Address Translation)","NAT"]}],"explanation":"내부 사설 IP 와 외부 공인 IP(및 포트)를 서로 바꿔 기록해 라우터를 통해 통신하게 하는 기술은 NAT(Network Address Translation, 네트워크 주소 변환)이다. 공인 IP 부족 문제를 덜고 내부 주소를 외부에 숨기는 보안 효과도 있다. 포트 번호까지 함께 바꿔 하나의 공인 IP 를 여러 내부 호스트가 나눠 쓰는 방식은 PAT(NAPT)라 한다. IP 를 자동 할당하는 DHCP, IP 주소를 MAC 주소로 바꾸는 ARP 와 구분한다.","difficulty":"","point":"NAT 네트워크 주소 변환"},{"id":"past-2023-3-13","sourceNumber":13,"bucketLabel":"Java","type":"short","language":"","question":"다음 자바 코드를 실행할 경우 에러가 발생이 된다.\n에러가 발생하는 라인을 작성하시오.","code":"","images":["imported-images/2023-3-q13-1.png"],"parts":[{"label":"정답","answers":["7"]}],"explanation":"6행의 get() 은 static 메서드인데 7행에서 인스턴스 변수 name 을 반환하려 한다. static 메서드는 객체 없이 클래스 단위로 호출되므로 특정 객체에 속한 인스턴스 필드에 접근할 수 없다. 그래서 컴파일 시 7행에서 non-static 변수를 static 문맥에서 참조할 수 없다는 오류가 난다. name 이 private 인 것은 같은 클래스 안이라 문제가 되지 않으며, get() 이 호출되지 않더라도 컴파일 단계에서 오류가 발생한다. 따라서 답은 7 이다.","difficulty":"","point":"Java static 메서드 제약"},{"id":"past-2023-3-14","sourceNumber":14,"bucketLabel":"Python","type":"short","language":"","question":"다음은 Python 프로그램에 대한 문제이다.\n빨간색 박스로 가려진 '예약어' 를  알맞게 작성하시오.\n(단,  첫 번째 라인의 '5 10'은 사용자로 부터 입력받은 값에 해당한다.)\n\n#실행결과\nx, y의 값을 공백으로 구분하여 입력: 5 10\nx의 값: 5\ny의 값: 10","code":"","images":["imported-images/2023-3-q14-1.png"],"parts":[{"label":"정답","answers":["split"]}],"explanation":"input() 은 입력 한 줄을 문자열 하나로 돌려주므로, 「5 10」을 x 와 y 두 변수에 나눠 담으려면 공백 기준으로 쪼개야 한다. 문자열 메서드 split() 은 인자 없이 호출하면 공백을 기준으로 잘라 ['5', '10'] 리스트를 만들고, 이것이 x, y 에 언패킹된다. 이후 int(x), int(y) 로 정수로 바꿔 5 와 10 이 출력된다. 문제는 예약어라고 했지만 split 은 엄밀히는 str 의 메서드 이름이다.","difficulty":"","point":"Python input().split()"},{"id":"past-2023-3-15","sourceNumber":15,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 판매와 관련된 다이어그램이다. 해당 다이어그램의 명칭을 쓰시오.","code":"","images":["imported-images/2023-3-q15-1.png"],"parts":[{"label":"정답","answers":["패키지(Package)","패키지","Package","패키지 다이어그램","Package Diagram","패키지 다이어그램(Package Diagram)"]}],"explanation":"그림처럼 폴더 모양 기호로 요소들을 그룹으로 묶고, 그룹 사이의 의존 관계를 점선 화살표와 <<import>> 같은 스테레오타입으로 나타내는 UML 다이어그램은 패키지 다이어그램이다. ordering 패키지가 pricing, products 패키지를 가져다 쓰는 관계를 보여준다. 패키지 다이어그램은 구조적(정적) 다이어그램에 속한다. 클래스 내부 속성·메서드를 그리는 클래스 다이어그램, 물리적 컴포넌트를 그리는 컴포넌트 다이어그램과 구분한다.","difficulty":"","point":"UML 패키지 다이어그램","unordered":false},{"id":"past-2023-3-16","sourceNumber":16,"bucketLabel":"테스트","type":"short","language":"","question":"다음 설명에 알맞는 답을 보기에서 골라 '기호' 를 작성하시오.\n\n- 시스템이나 시스템 구성요소(component) 또는 소프트웨어 프로그램의 입력값과 출력값이 특정 그룹으로 분류되며, 분류된 그룹내의 값들이 시스템에 의해 동일하게 취급된다는 특성을 이용하여 시험하는 기법\n\n- 유사한 입력값들이 시스템을 거치면서 유사한 답변이 나온다는 것을 가정하여 테스트\n\n- 하나의 값은 그 분할 내 모든 값을 대표하는 것으로 간주하는 기법\n\n- 모든 입력 값을 시험할 필요가 없게 하여 시험을 효율적으로 수행하도록 지원\n\n- 일반적으로 경계값 분석기법(boundary value analysis)과 함께 테스트 케이스 도출하는데 사용","code":"","images":["imported-images/2023-3-q16-1.png"],"parts":[{"label":"정답","answers":["ㄱ","ㄱ. Equivalence Partitioning"]}],"explanation":"입력값을 같은 결과를 낼 것으로 보이는 그룹(분할)으로 나누고, 각 그룹에서 대표값 하나만 골라 시험하는 블랙박스 기법은 동등 분할(Equivalence Partitioning)이다. 모든 입력을 시험하지 않아도 되어 효율적이며, 분할의 경계에서 오류가 많다는 점을 보완하려고 경계값 분석과 함께 쓰는 경우가 많다. 경계값 분석은 경계 부근 값을 고르는 기법이고, 구문·분기·조건 커버리지는 코드 구조를 보는 화이트박스 기준이라 구분된다. 따라서 답은 ㄱ 이다.","difficulty":"","point":"동등 분할 테스트 기법","unordered":false},{"id":"past-2023-3-17","sourceNumber":17,"bucketLabel":"요구사항·기타","type":"short","language":"","question":"다음은 클라우드에 대한 유형 문제이다.\n괄호안에 알맞는 답을 보기에 골라 작성하시오.\n\nPaaS                 SaaS                  IaaS","code":"","images":["imported-images/2023-3-q17-1.png"],"parts":[{"label":"①","answers":["IaaS","IaaS(Infrastructure as a Service)"]},{"label":"②","answers":["PaaS","PaaS(Platform as a Service)"]},{"label":"③","answers":["SaaS","SaaS(Software as a Service)"]}],"explanation":"관리 주체가 공급 업체로 넘어가는 범위로 구분한다. ① 네트워킹·스토리지·서버·가상화까지만 공급 업체가 관리하고 OS 부터 위는 고객이 관리하므로 인프라를 빌려 쓰는 IaaS(Infrastructure as a Service)이다. ② 런타임·미들웨어·OS 까지 공급 업체가 관리하고 고객은 애플리케이션과 데이터만 관리하므로 개발·실행 플랫폼을 빌리는 PaaS 이다. ③ 모든 계층을 공급 업체가 관리하고 고객은 완성된 소프트웨어를 쓰기만 하므로 SaaS 이다.","difficulty":"","point":"클라우드 IaaS·PaaS·SaaS","unordered":false},{"id":"past-2023-3-18","sourceNumber":18,"bucketLabel":"네트워크","type":"short","language":"","question":"다음은 프로토콜 종류에 관한 설명이다. 알맞는 답을 작성하시오.\n\n- 최소 Hop count를 파악하여 라우팅하는 프로토콜이다.\n\n- 거리와 방향으로 길을 찾아가는 Distance Vector 다이나믹 프로토콜이다.\n\n- 최단거리 즉, Hop count가 적은 경로를 택하여 라우팅하는 프로토콜로 Routing Table에 인접 라우터 정보를 저장하여 경로를 결정한다.\n\n- 최대 Hop count는 15로 거리가 짧기 때문에 IGP로 많이 이용하는 프로토콜이다.","code":"","images":[],"parts":[{"label":"정답","answers":["RIP"]}],"explanation":"홉 수(거쳐 가는 라우터 수)를 거리로 삼아 최단 경로를 고르는 거리 벡터(Distance Vector) 방식의 내부 라우팅 프로토콜은 RIP(Routing Information Protocol)이다. 인접 라우터와 라우팅 테이블을 주기적으로 교환하며, 최대 홉 수가 15 로 제한되어(16 은 도달 불가) 소규모 망에 쓰인다. 링크 상태 방식으로 다익스트라 알고리즘을 쓰는 OSPF, 자율 시스템 간 라우팅에 쓰는 BGP 와 구분한다.","difficulty":"","point":"RIP 거리 벡터 라우팅"},{"id":"past-2023-3-19","sourceNumber":19,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 관계 대수에 대한 내용이다.\n보기에 알맞는 기호를 작성하시오.\n\n[보기]\nㄱ. σ              ㄴ.  π                   ㄷ.⋈                 ㄹ.÷\n***************************************************************************************\n\n1. JOIN :   (   ①   )\n\n2. PROJECT :   (   ②   )\n\n3. SELECT :   (   ③   )\n\n4. DIVISION :   (   ④   )","code":"","images":[],"parts":[{"label":"①","answers":["ㄷ","ㄷ. ⋈","⋈"]},{"label":"②","answers":["ㄴ","ㄴ. π","π"]},{"label":"③","answers":["ㄱ","ㄱ. σ","σ"]},{"label":"④","answers":["ㄹ","ㄹ. ÷","÷"]}],"explanation":"관계 대수 연산자 기호를 연결하는 문제이다. JOIN 은 두 릴레이션을 공통 속성으로 결합하며 ⋈(ㄷ)로 쓴다. PROJECT 는 원하는 속성(열)만 뽑아내며 π(ㄴ), SELECT 는 조건을 만족하는 튜플(행)만 고르며 σ(ㄱ)로 쓴다. DIVISION 은 한 릴레이션의 속성 값을 모두 가진 튜플을 찾는 연산으로 ÷(ㄹ)이다. SELECT 는 행, PROJECT 는 열을 고른다는 점을 혼동하지 않는다.","difficulty":"","point":"관계 대수 연산자 기호","unordered":false},{"id":"past-2023-3-20","sourceNumber":20,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음은 데이터베이스에 관련된 문제이다. 괄호 안에 알맞는 답을 작성하시오.\n\n- (            ) 무결성은 관계 데이터베이스 관계 모델에서 2개의 관련 있던 관계 변수(테이블) 간의 \n   일관성(데이터 무결성)을 말한다.\n\n- 종종 기본 키 또는 키가 아닌 후보 키와 외래 키의 조합으로 강제 적용된다.\n \n- 외래 키가 선언된 관계 변수의 외래 키를 구성하는 속성(열)의 값은 그 관계 변수의 부모가 되는 관계 변수의 기본 키 값 또는 기본 키가 아닌 후보 키 값으로 존재해야 한다.","code":"","images":[],"parts":[{"label":"정답","answers":["참조"]}],"explanation":"외래 키 값은 참조하는 부모 릴레이션의 기본 키(또는 후보 키) 값으로 존재하거나 NULL 이어야 한다는 제약은 참조 무결성이다. 두 테이블 사이의 일관성을 지켜, 존재하지 않는 부모를 가리키는 고아 데이터를 막는다. 기본 키는 NULL 이나 중복을 가질 수 없다는 개체 무결성, 속성 값이 정의된 도메인 범위 안에 있어야 한다는 도메인 무결성과 구분한다. 외래 키라는 단어가 나오면 참조 무결성을 떠올리면 된다.","difficulty":"","point":"참조 무결성 제약 조건"}]},{"key":"past-2024-1","name":"2024년 1회 기출","questions":[{"id":"past-2024-1-1","sourceNumber":1,"bucketLabel":"Java","type":"short","language":"","question":"다음 Java 코드에서 알맞는 출력 값을 작성하시오.","code":"class Connection {\n    private static Connection _inst = null;\n    private int count = 0;\n    \n    static public Connection get() {\n        if(_inst == null) {\n            _inst = new Connection();\n            return _inst;\n        }\n        return _inst;\n    }    \n    public void count() {\n         count++; \n    }  \n    public int getCount() {\n         return count; \n    }\n}\n\npublic class main {  \n    public static void main(String[] args) { \n        Connection conn1 = Connection.get();\n        conn1.count();\n \n        Connection conn2 = Connection.get();\n        conn2.count();\n \n        Connection conn3 = Connection.get();\n        conn3.count();\n        \n        conn1.count();\n        System.out.print(conn1.getCount());\n    } \n}","images":[],"parts":[{"label":"정답","answers":["4"]}],"explanation":"Connection 클래스는 싱글톤 패턴으로, static 필드 _inst 가 null 일 때 한 번만 객체를 만들고 이후에는 같은 객체를 돌려준다. 따라서 conn1, conn2, conn3 은 모두 같은 객체를 가리키고 count 필드도 하나뿐이다. count() 가 conn1, conn2, conn3, conn1 순으로 네 번 호출되므로 count 는 1, 2, 3, 4 로 증가한다. 마지막에 conn1.getCount() 는 4 를 출력한다. 각 변수가 별도 객체라고 착각해 2 로 답하지 않도록 한다.","difficulty":"","point":"Java 싱글톤 패턴"},{"id":"past-2024-1-2","sourceNumber":2,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어 코드에서 알맞는 출력 값을 작성하시오.","code":"int main() {\n \n    int v1 = 0, v2 = 35, v3 = 29;\n    if(v1 > v2 ? v2 : v1) {\n        v2 = v2 < < 2;\n    }else{\n        v3 = v3 < < 2;\n    }    \n    printf(\"%d\", v2+v3);\n \n}","images":[],"parts":[{"label":"정답","answers":["151"]}],"explanation":"조건식 v1 > v2 ? v2 : v1 에서 0 > 35 는 거짓이므로 v1 의 값 0 이 선택되고, C 에서 0 은 거짓이라 else 쪽이 실행된다. else 에서 v3 = v3 << 2 는 29 를 왼쪽으로 2비트 이동해 29*4=116 이 된다. v2 는 그대로 35 이므로 v2+v3=35+116=151 이 출력된다. 원문에 < < 로 띄어 적힌 것은 시프트 연산자 << 의 복원 오타로 보고 풀었다.","difficulty":"","point":"C 삼항·시프트 연산"},{"id":"past-2024-1-3","sourceNumber":3,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음은 응집도와 관련해서 보기에서 응집도가 높은 순으로 나열하시오.\n\n보기\nㄱ. 기능                   ㄴ. 교환 \nㄷ. 우연                   ㄹ. 시간","code":"","images":[],"parts":[{"label":"1번째","answers":["ㄱ","ㄱ. 기능"]},{"label":"2번째","answers":["ㄴ","ㄴ. 교환"]},{"label":"3번째","answers":["ㄹ","ㄹ. 시간"]},{"label":"4번째","answers":["ㄷ","ㄷ. 우연"]}],"explanation":"응집도는 모듈 내부 요소들이 하나의 목적으로 얼마나 밀접하게 묶여 있는지를 뜻하며, 높은 순서는 기능, 순차, 교환(통신), 절차, 시간, 논리, 우연이다. 기능적 응집도는 모든 요소가 단일 기능을 위해 존재하는 가장 바람직한 형태이다. 교환적 응집도는 같은 입력·출력 자료를 쓰는 요소끼리 모인 것, 시간적 응집도는 초기화처럼 같은 시점에 실행된다는 이유로 모인 것이다. 우연적 응집도는 아무 관련 없이 모인 가장 낮은 단계이므로, 보기를 나열하면 ㄱ, ㄴ, ㄹ, ㄷ 이다.","difficulty":"","point":"응집도 강도 높은 순서","unordered":false},{"id":"past-2024-1-4","sourceNumber":4,"bucketLabel":"C 언어","type":"short","language":"","question":"다음은 C언어에 대한 문제이다. 알맞는 출력 값을 작성하시오.","code":"#include \n#include \n \nvoid reverse(char* str){\n    int len = strlen(str);\n    char temp;\n    char*p1 = str;\n    char*p2 = str + len - 1;\n    while(p1 < p2){\n        temp = *p1;\n        *p1 = *p2;\n        *p2 = temp;\n        p1++;\n        p2--;\n    }\n}\n \nint main(int argc, char* argv[]){\n    char str[100] = \"ABCDEFGH\";\n \n    reverse(str);\n \n    int len = strlen(str);\n \n    for(int i=1; i < len; i+=2){\n        printf(\"%c\",str[i]);\n    }\n \n    printf(\"n\");\n \n    return 0;\n \n}","images":[],"parts":[{"label":"정답","answers":["GECA"]}],"explanation":"reverse() 는 앞쪽 포인터 p1 과 뒤쪽 포인터 p2 가 만날 때까지 두 문자를 맞바꿔 문자열을 뒤집는다. A-H, B-G, C-F, D-E 를 교환해 str 은 HGFEDCBA 가 된다. 이후 반복문은 i 를 1 부터 2씩 늘려 인덱스 1, 3, 5, 7 의 문자를 출력하므로 G, E, C, A 가 차례로 나온다. 따라서 출력은 GECA 이다. 원문의 #include 헤더 이름과 printf 의 줄바꿈 \\n 이 복원 과정에서 빠진 것으로 보고 풀었다.","difficulty":"","point":"C 포인터 문자열 뒤집기"},{"id":"past-2024-1-5","sourceNumber":5,"bucketLabel":"네트워크","type":"short","language":"","question":"아래 그림에서의 네트워크에서 라우터을 통한 할당 가능한  2번, 4번, 5번의 IP를 작성하시오.\n\n1) 192.168.35.3/24\n3) 129.200.10.16/22\n6) 192.168.36.24/24\n\n \n\n보기\n192.168.35.0\n192.168.35.72\n192.168.36.0\n192.168.36.249\n129.200.8.0\n129.200.8.249","code":"","images":["imported-images/2024-1-q05-1.png"],"parts":[{"label":"2번","answers":["192.168.35.72"]},{"label":"4번","answers":["129.200.8.249"]},{"label":"5번","answers":["192.168.36.249"]}],"explanation":"각 라우터가 나누는 세 네트워크에서, 같은 대역에 속하면서 네트워크 주소나 브로드캐스트 주소가 아닌 호스트 주소를 골라야 한다. 1번 192.168.35.3/24 와 같은 대역에서 192.168.35.0 은 네트워크 주소라 할당할 수 없으므로 2번은 192.168.35.72 이다. 3번 129.200.10.16/22 는 셋째 옥텟을 4 단위로 묶어 129.200.8.0~129.200.11.255 가 한 네트워크이고, 129.200.8.0 은 네트워크 주소이므로 4번은 129.200.8.249 이다. 6번 192.168.36.24/24 와 같은 대역에서 192.168.36.0 은 네트워크 주소이므로 5번은 192.168.36.249 이다. /22 처럼 옥텟 경계가 아닌 프리픽스는 블록 크기(2의 10제곱 중 셋째 옥텟 4칸)를 따져 범위를 구하는 것이 핵심이다.","difficulty":"","point":"서브넷 할당 가능 IP","unordered":false},{"id":"past-2024-1-6","sourceNumber":6,"bucketLabel":"데이터베이스","type":"short","language":"","question":"아래 표에서 나타나고 있는 정규형을 작성하시오.\n\n(주문) - 정규화 전\n주문번호\t고객번호\t주소\nA345\t100\t        서울\nD347\t200 \t부산\nA210\t300\t        광주\nB230\t200 \t부산\n\n↓\n\n(주문) - 정규화 후\n주문번호\t고객번호\nA345\t100\nD347\t200\nA210\t300\nB230\t200\n\n(고객)\n고객번호\t주소\n100         서울\n200\t        부산\n300\t        광주","code":"","images":[],"parts":[{"label":"정답","answers":["제 3정규형"]}],"explanation":"정규화 전 주문 테이블에서 주문번호가 고객번호를 결정하고, 고객번호가 다시 주소를 결정한다. 즉 주소가 기본 키 주문번호에 고객번호를 거쳐 간접적으로 종속되는 이행적 함수 종속이 있다. 이를 없애려고 고객번호와 주소를 고객 테이블로 분리했으므로 제3정규형으로 정규화한 것이다. 부분 함수 종속을 제거하는 제2정규형, 결정자가 모두 후보 키가 되게 하는 BCNF 와 구분한다.","difficulty":"","point":"제3정규형 이행 종속"},{"id":"past-2024-1-7","sourceNumber":7,"bucketLabel":"네트워크","type":"short","language":"","question":"아래의 내용에서 설명하는 네트워크 용어를 영문 약자로 1개 작성하시오.\n\n- 대표적인 링크 상태 라우팅 프로토콜이다. 이것은 인터넷에서 연결된 링크의 상태를 감시하여 최적의 경로를 선택한다는것이다.\n- 단일 자율 시스템 내에서 라우팅 정보를 배포하는 데 사용되는 내부 게이트웨이 프로토콜이다.\n- 모든 대상에 도달하기 위한 최단 경로를 구축하고 계산하며 최단 경로는 Dijkstra 알고리즘을 사용하여 계산된다.","code":"","images":[],"parts":[{"label":"정답","answers":["OSPF","OSPF(Open Shortest Path First)"]}],"explanation":"링크 상태(Link State) 방식으로 망 전체의 링크 정보를 모아 다익스트라 알고리즘으로 최단 경로를 계산하는 내부 게이트웨이 프로토콜은 OSPF(Open Shortest Path First)이다. 변화가 생길 때만 링크 상태를 알려 수렴이 빠르고, 홉 수 제한이 없어 대규모 망에 적합하다. 홉 수만 보는 거리 벡터 방식의 RIP, 자율 시스템 사이를 잇는 외부 게이트웨이 프로토콜 BGP 와 구분한다.","difficulty":"","point":"OSPF 링크 상태 라우팅","unordered":false},{"id":"past-2024-1-8","sourceNumber":8,"bucketLabel":"데이터베이스","type":"short","language":"","question":"아래 내용의 각각의 조인 설명에 대한 답을 작성하시오.\n\n(1) 조인에 참여하는 두 릴레이션의 속성 값을 비교하여 조건을 만족하는 튜플만 반환한다.\n\n(2) 조건이 정확하게 '=' 등호로 일치하는 결과를 반환한다. \n\n(3) ( (2) ) 조인에서 조인에 참여한 속성이 두 번 나오지 않도록 중복된 속성을 제거한 결과를 반환한다.","code":"","images":[],"parts":[{"label":"(1)","answers":["세타 조인","세타","Theta Join","세타 조인(Theta Join)"]},{"label":"(2)","answers":["동등 조인","동등","Equi Join","동등 조인(Equi Join)"]},{"label":"(3)","answers":["자연 조인","자연","Natural Join","자연 조인(Natural Join)"]}],"explanation":"(1) 두 릴레이션의 속성을 =, <, > 등 임의의 비교 연산자로 비교해 조건을 만족하는 튜플만 결합하는 것은 세타 조인이다. (2) 세타 조인 가운데 비교 연산자가 = 인 경우를 동등 조인(Equi Join)이라 한다. (3) 동등 조인 결과에서 같은 값을 가진 조인 속성이 두 번 나오지 않도록 하나를 제거한 것이 자연 조인(Natural Join)이다. 세타 조인이 가장 넓은 개념이고, 동등 조인과 자연 조인이 차례로 그 특수한 경우라는 관계로 기억하면 된다.","difficulty":"","point":"세타·동등·자연 조인","unordered":false},{"id":"past-2024-1-9","sourceNumber":9,"bucketLabel":"운영체제","type":"short","language":"","question":"다음은 운영체제 페이지 순서를 참고하여 할당된 프레임의 수가 3개일 때  LRU와 LFU 알고리즘의 페이지 부재 횟수를 작성하시오.\n\n페이지 참조 순서 : 1, 2, 3, 1, 2, 4, 1, 2, 5, 7\n\n(1) LRU : \n(2) LFU :","code":"","images":[],"parts":[{"label":"(1) LRU","answers":["6","6회","6번"]},{"label":"(2) LFU","answers":["6","6회","6번"]}],"explanation":"LRU 는 가장 오래 사용되지 않은 페이지를 교체한다. 1, 2, 3 은 부재 3회, 1·2 는 적중, 4 는 마지막 사용이 가장 오래된 3 을 교체(4회), 1·2 적중, 5 는 1·2·4 중 가장 오래 쓰이지 않은 4 를 교체(5회), 7 은 1·2·5 중 1 을 교체(6회)하여 총 6회이다. LFU 는 참조 횟수가 가장 적은 페이지를 교체한다. 1, 2, 3 부재 3회 후 1·2 가 적중해 횟수가 2 가 되고, 4 는 횟수 1 인 3 을 교체(4회), 1·2 적중 후 5 는 횟수 1 인 4 를 교체(5회), 7 은 횟수 1 인 5 를 교체(6회)하여 총 6회이다. 두 기법 모두 페이지 부재 6회이다.","difficulty":"","point":"LRU·LFU 페이지 부재","unordered":false},{"id":"past-2024-1-10","sourceNumber":10,"bucketLabel":"Java","type":"short","language":"","question":"아래 JAVA언어 코드의 실행 순서를 중복 번호없이 작성하시오.","code":"class Parent {\n    int x, y;\n \n    Parent(int x, int y) { ①\n        this.x=x;\n        this y=y;\n    }\n \n    int getT() { ②\n        return x*y;\n    }\n}\n \n​class Child extend Parent {\n    int x;\n \n    Child (int x) { ③\n        super(x+1, x);\n        this.x=x;\n    }\n \n    int getT(int n){ ④\n        return super.getT()+n;\n    }\n}\n \nclass Main {\n    public static void main(String[] args) { ⑤\n        Parent parent = new Child(3); ⑥\n        System.out.println(parent.getT()); ⑦\n    }\n}\n\n실행 순서 : 5 → ( ) → ( ) → ( ) → ( ) → ( )","images":[],"parts":[{"label":"1번째 ( )","answers":["6","⑥"]},{"label":"2번째 ( )","answers":["3","③"]},{"label":"3번째 ( )","answers":["1","①"]},{"label":"4번째 ( )","answers":["7","⑦"]},{"label":"5번째 ( )","answers":["2","②"]}],"explanation":"main(⑤) 에서 시작해 new Child(3)(⑥) 로 Child 생성자(③)가 호출되고, 생성자 첫 줄 super(4, 3) 에 의해 Parent 생성자(①)가 실행되어 x=4, y=3 이 된다. 다음 줄 parent.getT()(⑦) 는 인자가 없으므로, Child 의 getT(int n) 은 매개변수가 다른 오버로딩일 뿐 오버라이딩이 아니어서 Parent 의 getT()(②) 가 실행된다. ②는 4*3=12 를 돌려주고 ④는 끝내 실행되지 않는다. 따라서 실행 순서는 5, 6, 3, 1, 7, 2 이다. 원문의 this y, extend 는 this.y, extends 의 복원 오타로 보고 풀었다.","difficulty":"","point":"Java 생성자·오버로딩 순서","unordered":false},{"id":"past-2024-1-11","sourceNumber":11,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어의 알맞는 출력값을 작성하시오.","code":"#include \n \n \ntypedef struct{\n    int accNum;\n    double bal;\n}BankAcc;\n \n \n \ndouble sim_pow(double base, int year){\n    int i;\n    double r = 1.0;\n \nfor(i=0; i < year; i++){\n        r = r * base;\n    }\n    return r;\n}\n \n void initAcc(BankAcc *acc, int x, double y){\n    acc -> accNum = x;\n    acc -> bal = y;\n}\n \nvoid xxx(BankAcc *acc, double *en){\n    if (*en > 0 && *en < acc - > bal) {\n        acc - > bal = acc - > bal-*en;\n    }else{\n        acc - > bal = acc - > bal+*en;\n    }\n}\n \n \n \nvoid yyy(BankAcc *acc){\n    acc -> bal = acc -> bal * sim_pow((1+0.1),3);\n}\n \n \nint main(){\n \n    BankAcc myAcc;\n    initAcc(&myAcc, 9981, 2200.0);\n    double amount = 100.0;\n    xxx(&myAcc, &amount);\n    yyy(&myAcc);\n    printf(\"%d and %.2f\", myAcc.accNum, myAcc.bal);\n    return 0;\n \n}","images":[],"parts":[{"label":"정답","answers":["9981 and 2795.10"]}],"explanation":"initAcc 로 accNum=9981, bal=2200.0 이 설정된다. xxx 에서 amount 100.0 은 0 보다 크고 잔액 2200 보다 작으므로 bal=2200-100=2100 이 된다. yyy 에서 sim_pow(1.1, 3) 은 1.1 을 세 번 곱한 1.331 이므로 bal=2100*1.331=2795.1 이다. printf 는 %d 로 9981, %.2f 로 소수점 둘째 자리까지 2795.10 을 찍어 결과는 9981 and 2795.10 이다. 원문의 - > 는 구조체 포인터 연산자 -> 의 복원 오타이다.","difficulty":"","point":"C 구조체 포인터 계산"},{"id":"past-2024-1-12","sourceNumber":12,"bucketLabel":"Python","type":"short","language":"","question":"다음 파이썬 코드에 대한 알맞는 출력 값을 작성하시오.\n\na = [\"Seoul\", \"Kyeonggi\", \"Incheon\", \"Daejun\", \"Daegu\", \"Pusan\"] \nstr = \"S\"\n \nfor i in a:\n    str = str + i[1]\n \nprint(str)","code":"","images":[],"parts":[{"label":"정답","answers":["Seynaau"]}],"explanation":"str 은 \"S\" 로 시작하고, 반복문이 리스트의 각 문자열 i 에 대해 i[1], 즉 두 번째 글자를 이어 붙인다. Seoul 의 e, Kyeonggi 의 y, Incheon 의 n, Daejun 의 a, Daegu 의 a, Pusan 의 u 가 차례로 붙는다. 따라서 S 뒤에 eynaau 가 붙어 Seynaau 가 출력된다. 파이썬 인덱스는 0 부터 시작하므로 i[1] 은 첫 글자가 아니라 두 번째 글자라는 점이 핵심이다.","difficulty":"","point":"Python 문자열 인덱싱"},{"id":"past-2024-1-13","sourceNumber":13,"bucketLabel":"SQL","type":"code","language":"","question":"아래 보기의 SQL 문장과 테이블을 참고하여 출력 값을 표로 작성하시오.","code":"SELECT\n    B\nFROM\n    R1\nWHERE\n    C IN (SELECT C FROM R2 WHERE D=\"k\");","images":["imported-images/2024-1-q13-1.png"],"parts":[{"label":"정답","answers":["B\na\nb"]}],"explanation":"먼저 서브쿼리를 실행하면 R2 에서 D 가 k 인 행의 C 값, 즉 x 와 y 가 나온다. 바깥 쿼리는 R1 에서 C 가 x 또는 y 인 행의 B 를 고른다. R1 에서 C 가 x 인 행은 B 가 a, b 인 두 행이고, y 인 행은 없다. 따라서 결과는 B 열 이름 아래 a, b 두 행이다.","difficulty":"","point":"SQL IN 서브쿼리"},{"id":"past-2024-1-14","sourceNumber":14,"bucketLabel":"테스트","type":"short","language":"","question":"아래는 애플리케이션 테스트 관리에 대한 내용이다. 설명하는 답을 보기에서 1개 골라 작성하시오.\n\n- 모든 분기와 조건의 조합을 고려하나 모든 조합을 테스트하는 대신에 테스트가 필요한 중요한 조합을 찾아내는데에 중점을 둔다.\n \n- 특정 조건을 수행할 때 다른 조건과는 상관없이 전체 결과에 영향을 미치는 조건만을 테스트한다. \n\n- 각각의 파라미터는 적어도 한 번은 최종 결과에 영향을 주어야 한다.\n\n보기\nㄱ. 구문 커버리지      ㄴ. 결정 커버리지    ㄷ. 조건 커버리지    ㄹ. 변경 조건/결정 커버리지     ㅁ.다중 조건 커버리지      ㅂ.경로 커버리지    ㅅ.조건/결정 커버리지","code":"","images":[],"parts":[{"label":"정답","answers":["ㄹ","ㄹ. 변경 조건/결정 커버리지","변경 조건/결정 커버리지","MC/DC"]}],"explanation":"각 개별 조건이 다른 조건과 상관없이 전체 결정 결과에 독립적으로 영향을 미친다는 것을 보이는 테스트 케이스를 만드는 기준은 변경 조건/결정 커버리지(MC/DC)이다. 모든 조합을 다 시험하는 다중 조건 커버리지보다 적은 케이스로도 각 조건의 영향을 확인할 수 있어 항공처럼 안전이 중요한 분야에서 쓰인다. 조건/결정 커버리지는 각 조건과 전체 결정이 참·거짓을 한 번씩 갖는지만 보고, 조건이 결과를 바꾸는지까지는 보지 않는다는 점에서 구분된다. 따라서 답은 ㄹ 이다.","difficulty":"","point":"MC/DC 커버리지","unordered":false},{"id":"past-2024-1-15","sourceNumber":15,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음 아래 내용을 보고  보기에서 알맞는 용어를 골라 작성하시오.\n\n인터넷 공격자의 존재를 숨기면서 이 공격자에게 시스템에 대한 무제한 접근 권한을 부여하는 악성 프로그램이다.\n\n해커가 자신의 존재를 숨기면서 허가되지 않은 컴퓨터나 소프트웨어에 접근할 수 있도록 설계된 도구이다.\n\n일반적으로 펌웨어, 가상화 계층 등의 다양한 시스템 영역에서 작동하며, 운영체제의 시스템콜을 해킹하여 악성코드의 실행여부를 숨겨 안티바이러스 탐지를 우회할 수 있다.\n \n\n보기\nㄱ.Worm    ㄴ.Trojan horse    ㄷ.Backdoor     ㄹ.Virus     ㅁ.Ransomware      ㅂ.Spyware     ㅅ.Rootkit","code":"","images":[],"parts":[{"label":"정답","answers":["ㅅ","ㅅ. Rootkit","Rootkit","루트킷"]}],"explanation":"공격자의 존재와 악성코드 실행 흔적을 숨기면서 시스템에 대한 관리자 수준의 접근을 유지하게 해 주는 도구 모음은 루트킷(Rootkit)이다. 운영체제의 시스템 콜이나 커널, 펌웨어 등 낮은 계층을 조작해 백신 탐지를 피하는 것이 특징이다. 인증 없이 들어올 뒷문을 만드는 백도어, 정상 프로그램으로 위장하는 트로이 목마, 스스로 복제·전파하는 웜과 달리, 루트킷의 핵심어는 은닉이다. 따라서 답은 ㅅ 이다.","difficulty":"","point":"루트킷 은닉 악성코드","unordered":false},{"id":"past-2024-1-16","sourceNumber":16,"bucketLabel":"Java","type":"short","language":"","question":"다음 Java 코드를 보고 알맞는 출력 값을 작성하시오.","code":"class classOne {\n    int a, b;\n \n    public classOne(int a, int b) {\n        this.a = a;\n        this.b = b;\n    }\n \n    public void print() {\n        System.out.println(a + b);\n    }\n \n}\nclass classTwo extends classOne {\n    int po = 3;\n    \n    public classTwo(int i) {\n        super(i, i+1);\n    }\n \n    public void print() {\n        System.out.println(po*po);\n    }\n}\n \npublic class main {  \n    public static void main(String[] args) {\n        classOne one = new classTwo(10);\n        one.print();\n    }\n}","images":[],"parts":[{"label":"정답","answers":["9"]}],"explanation":"one 의 선언형은 classOne 이지만 실제 객체는 classTwo 이므로, 오버라이딩된 print() 는 classTwo 의 것이 실행된다. 생성자 classTwo(10) 은 super(10, 11) 로 a=10, b=11 을 설정하지만 classTwo.print() 는 이 값을 쓰지 않는다. classTwo.print() 는 po*po=3*3=9 를 출력한다. a+b=21 로 착각하지 않도록, 실행 시점의 실제 객체 기준으로 메서드가 결정된다는 동적 바인딩이 핵심이다.","difficulty":"","point":"Java 동적 바인딩"},{"id":"past-2024-1-17","sourceNumber":17,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음 아래 내용을 보고  보기에서 알맞는 용어를 골라 작성하시오.\n\n불특정 다수가 아닌 명확한 표적을 정하여 지속적인 정보수집 후 공격감행할 수 있다.\n\n시스템에 직접 침투하는 것뿐 아니라 표적 내부직원들이 이용하는 다양한 단말을 대상으로 한다.\n\n한가지 기술만이 아닌 Zero-day 취약점, 악성코드 등 다양한 보안 위협 공격 기술을 사용한다.\n\n일반적으로 공격은 침투, 검색, 수집 및 유출의 4단계로 실행되며, 각 단계별로 다양한 공격 기술을 사용한다.\n\n보기\nㄱ.사회공학 기법     ㄴ.Adware     ㄷ.MITM      ㄹ.XDR     ㅁ.Replace attack      ㅂ.key logger attack     ㅅ.APT","code":"","images":[],"parts":[{"label":"정답","answers":["ㅅ","ㅅ. APT","APT"]}],"explanation":"불특정 다수가 아니라 특정 조직을 표적으로 정해 오랜 기간 정보를 모은 뒤, 제로데이 취약점·악성코드 등 여러 기법을 조합해 침투하는 공격은 지능형 지속 위협 APT(Advanced Persistent Threat)이다. 침투, 검색, 수집, 유출 단계로 은밀하고 지속적으로 진행된다는 점이 특징이다. 사람의 심리를 속이는 사회공학 기법은 APT 의 침투 수단으로 쓰일 수 있지만 그 자체가 전체 공격 유형은 아니다. 통신을 가로채는 MITM, 탐지·대응 솔루션인 XDR 과도 구분되므로 답은 ㅅ 이다.","difficulty":"","point":"APT 지능형 지속 위협","unordered":false},{"id":"past-2024-1-18","sourceNumber":18,"bucketLabel":"SQL","type":"short","language":"","question":"아래의 SQL 코드와 테이블을 참고하여 결과 값을 작성하시오.\n\nSELECT \n    COUNT(*) \nFROM \n    TABLE \nWHERE \n    EMPNO > 100 \nAND \n    SAL >= 3000 OR EMPNO = 200","code":"","images":["imported-images/2024-1-q18-1.png"],"parts":[{"label":"정답","answers":["1"]}],"explanation":"SQL 에서 AND 가 OR 보다 우선순위가 높으므로 조건은 (EMPNO > 100 AND SAL >= 3000) OR EMPNO = 200 으로 해석된다. 앞부분을 만족하는 행은 EMPNO 200, SAL 3000 하나뿐이다. 뒷부분 EMPNO = 200 도 같은 행이다. 두 조건을 OR 로 묶어도 해당하는 행은 200 하나이므로 COUNT(*) 결과는 1 이다.","difficulty":"","point":"SQL AND·OR 우선순위"},{"id":"past-2024-1-19","sourceNumber":19,"bucketLabel":"C 언어","type":"short","language":"","question":"다음 C언어 코드의 알맞는 출력 값을 작성하시오.","code":"#include\n#include\n \nint main(){\n    char*p = \"It is 8\";\n    char result[100];\n    int i;\n \n    for(i=0; p[i]!=''; i++){\n        if(isupper(p[i]))\n            result[i] = (p[i]-'A'+5)% 26 + 'A';\n        else if(islower(p[i]))\n            result[i] = (p[i]-'a'+10)% 26 + 'a';\n        else if(isdigit(p[i]))\n            result[i] = (p[i]-'0'+3)% 10 + '0';\n        else if(!(isupper(p[i]) || islower(p[i]) || isdigit(p[i])))    \n            result[i] = p[i];\n    }\n \n    result[i] = '';\n    printf(\"%sn\",result);\n \n    return 0;\n}","images":[],"parts":[{"label":"정답","answers":["Nd sc 1"]}],"explanation":"문자마다 종류에 따라 다른 거리로 밀어내는 카이사르식 변환이다. 대문자는 5칸, 소문자는 10칸, 숫자는 3칸 밀고 나머지 연산으로 범위를 순환하며, 그 밖의 문자는 그대로 둔다. I(8) 는 13 이 되어 N, t(19) 는 29%26=3 이라 d, i(8) 는 18 이라 s, s(18) 는 28%26=2 라 c, 숫자 8 은 11%10=1 이 된다. 공백은 그대로 남아 결과는 Nd sc 1 이다. 원문의 '' 와 %sn 은 각각 '\\0' 과 %s\\n 의 복원 오타로 보고 풀었다.","difficulty":"","point":"C 문자 변환 암호"},{"id":"past-2024-1-20","sourceNumber":20,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"다음 아래의 내용을 보고 알맞는 용어를 작성하시오.\n\n구체적인 클래스에 의존하지 않고 서로 연관되거나 의존적인 객체들의 조합을 만드는 인터페이스를 제공하는 패턴이다.\n\n연관성이 있는 객체 군이 여러개 있을 경우 이들을 묶어 추상화하고, 어떤 구체적인 상황이 주어지면 팩토리 객체에서 집합으로 묶은 객체 군을 구현화 하는 생성 패턴이다\n\n관련성 있는 여러 종류의 객체를 일관된 방식으로 생성하는 경우에 유용하다.\n\nkit라고도 불린다.","code":"","images":[],"parts":[{"label":"정답","answers":["Abstract Factory"]}],"explanation":"구체적인 클래스를 지정하지 않고 서로 관련된 객체 군(제품군)을 한꺼번에 생성하는 인터페이스를 제공하는 생성 패턴은 추상 팩토리(Abstract Factory)이며, Kit 라고도 불린다. 예를 들어 운영체제별로 버튼·창 같은 UI 부품을 일관된 묶음으로 만들 때 쓴다. 객체 하나의 생성을 하위 클래스에 맡기는 팩토리 메서드, 복잡한 객체를 단계별로 조립하는 빌더와 달리, 여러 종류의 연관 객체를 군 단위로 만든다는 점이 핵심이다.","difficulty":"","point":"추상 팩토리 디자인 패턴"}]},{"key":"past-2024-2","name":"2024년 2회 기출","questions":[{"id":"past-2024-2-1","sourceNumber":1,"bucketLabel":"Java","type":"short","language":"","question":"다음 Java로 구현된 프로그램을 분석하여 그 실행 결과를 쓰시오.","code":"public class Main {\n\tpublic static void check(int[] x, int[] y) {\n\t\tif(x==y) System.out.print(\"O\");\n\t\telse System.out.print(\"N\");\n\t}\n\tpublic static void main(String[] args) {\n\t\tint a[] = new int[] {1, 2, 3, 4};\n\t\tint b[] = new int[] {1, 2, 3, 4};\n\t\tint c[] = new int[] {1, 2, 3};\n\t\tcheck(a, b);\n\t\tcheck(b, c);\n\t\tcheck(a, c);\n\t}\n}","images":[],"parts":[{"label":"정답","answers":["NNN"]}],"explanation":"Java에서 배열 변수는 배열 객체를 가리키는 참조이므로 == 연산자는 내용이 아니라 두 변수가 같은 객체를 가리키는지를 비교한다. a와 b는 원소가 {1, 2, 3, 4}로 같지만 new로 각각 따로 만든 객체라 참조가 달라 N이 출력된다. b와 c, a와 c도 서로 다른 객체이므로 모두 N이다. 따라서 세 번의 check 호출 결과가 이어져 NNN이 출력된다. 내용 비교가 목적이라면 Arrays.equals(a, b)를 써야 하며, 이 경우 a와 b만 true가 된다.","difficulty":"","point":"Java 배열 참조 비교"},{"id":"past-2024-2-2","sourceNumber":2,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음 내용이 설명하는 용어를 쓰시오.\n\n시스템의 성능을 향상시키고 개발 및 운영의 편의성 등을 높이기 위해 정규화된 데이터 모델을 의도적으로 통합, 중복, 분리하여 정규화 원칙을 위배하는 행위","code":"","images":[],"parts":[{"label":"정답","answers":["반정규화","비정규화","역정규화","Denormalization"]}],"explanation":"반정규화는 정규화로 잘게 나뉜 테이블을 성능과 운영 편의를 위해 일부러 합치거나(통합), 같은 데이터를 여러 곳에 두거나(중복), 테이블·컬럼을 다시 나누는(분리) 작업이다. 조인이 줄어 조회 성능이 좋아지는 대신 데이터 중복으로 인한 갱신 이상과 정합성 관리 부담이 생긴다. 정규화가 이상 현상 제거를 위해 테이블을 분해하는 것이라면, 반정규화는 그 원칙을 의도적으로 깨는 것이라는 점이 구분 포인트다. 비정규화, 역정규화라고도 부른다.","difficulty":"","point":"반정규화 정의","unordered":false},{"id":"past-2024-2-3","sourceNumber":3,"bucketLabel":"SQL","type":"short","language":"","question":"다음의 조건을 만족하도록 괄호에 적합한 명령을 넣어 SQL문을 완성하시오.\n\n[테이블]\n사원 [사원번호(PK), 이름, 나이, 부서]\n부서 [사원번호(PK), 이름, 주소, 나이]\n\n① 신입사원이 들어와서 부서 테이블에 새로운 사람을 추가\nINSERT INTO 부서 (사원번호, 이름, 주소, 나이) (  ①  ) (240728, '홍길동', '서울', 30);\n\n② 부서 테이블에서 추가한 사원을 검색한 후 사원 테이블에 추가\nINSERT INTO 사원 (사원번호, 이름, 나이, 부서)\n(  ②  ) 사원번호, 이름, 나이, ‘영업’ FROM 부서 WHERE 이름 = '홍길동';\n\n③ 전체 사원 테이블 조회\nSELECT * (  ③  ) 사원;\n \n④ 사원의 퇴사로 인해 부서에 해당하는 값을 '퇴사'로 변경\nUPDATE 사원 (  ④  ) 부서 = '퇴사' WHERE 사원번호 = 240728;","code":"","images":[],"parts":[{"label":"①","answers":["VALUES"]},{"label":"②","answers":["SELECT"]},{"label":"③","answers":["FROM"]},{"label":"④","answers":["SET"]}],"explanation":"① 값을 직접 넣는 INSERT는 INSERT INTO 테이블(컬럼…) VALUES (값…) 형식이므로 VALUES가 들어간다. ② 다른 테이블을 조회한 결과를 넣을 때는 VALUES 대신 서브쿼리 SELECT를 쓰며, 여기서는 부서 테이블에서 홍길동을 찾아 사원번호·이름·나이와 상수 '영업'을 넘기므로 SELECT가 들어간다. ③ 조회는 SELECT 컬럼 FROM 테이블 형식이라 FROM이다. ④ 값을 바꾸는 UPDATE는 UPDATE 테이블 SET 컬럼 = 값 WHERE 조건 형식이므로 SET이 들어간다. INSERT…SELECT에는 VALUES와 괄호를 함께 쓰지 않는다는 점을 기억해 두면 좋다.","difficulty":"","point":"SQL INSERT·UPDATE 구문","unordered":false},{"id":"past-2024-2-4","sourceNumber":4,"bucketLabel":"데이터베이스","type":"short","language":"","question":"다음 테이블에서 카디널리티(Cardinality)와 디그리(Degree)를 구하시오.","code":"","images":["imported-images/2024-2-q04-1.png"],"parts":[{"label":"카디널리티(Cardinality)","answers":["5","5개"]},{"label":"디그리(Degree)","answers":["4","4개"]}],"explanation":"카디널리티는 릴레이션에 들어 있는 튜플(행)의 수이고, 디그리(차수)는 속성(열)의 수이다. 회원 테이블에는 백영헌, 차수인, 허채빈, 윤지호, 배서희 5명의 행이 있으므로 카디널리티는 5이다. 열은 ID, 이름, 거주지, 신청강의 4개이므로 디그리는 4이다. 제목 행(속성명)은 튜플 수에 포함하지 않는다는 점과, 도메인(속성이 가질 수 있는 값의 범위)과 혼동하지 않는 것이 포인트다.","difficulty":"","point":"카디널리티와 디그리","unordered":false},{"id":"past-2024-2-5","sourceNumber":5,"bucketLabel":"정보 보안","type":"short","language":"","question":"다음 설명에 해당하는 프로토콜을 쓰시오.\n\n- Network layer에서 IP패킷을 암호화하고 인증하는 등의 보안을 위한 표준이다. \n- 기업에서 사설 인터넷망으로 사용할 수 있는 VPN을 구현하는데 사용되는 프로토콜이다.\n- AH(Authentication Header)와 ESP(Encapsulating Security Payload)라는 두 가지 보안 프로토콜을 사용한다.","code":"","images":[],"parts":[{"label":"정답","answers":["IPsec"]}],"explanation":"IPsec은 네트워크 계층(3계층)에서 IP 패킷 단위로 인증과 암호화를 제공하는 보안 프로토콜 모음이다. AH는 무결성과 출발지 인증을 제공하지만 암호화는 하지 않고, ESP는 암호화까지 제공한다. 패킷 전체를 새 IP 헤더로 감싸는 터널 모드는 사이트 간 VPN 구성에 널리 쓰인다. SSL/TLS가 전송 계층 위에서 동작하는 것과 달리 IPsec은 네트워크 계층에서 동작한다는 점이 구분 포인트이며, 키 교환에는 IKE를 사용한다.","difficulty":"","point":"IPsec 프로토콜"},{"id":"past-2024-2-6","sourceNumber":6,"bucketLabel":"소프트웨어 설계","type":"short","language":"","question":"모듈에 대한 다음 설명에 해당하는 응집도(Cohesion)를 에서 찾아 쓰시오.\n\n실행 순서가 밀접한 관계를 갖는 기능을 모아 모듈로 구성하며, 한 모듈 내부의 한 기능 요소에 의한 출력 자료가 다음 기능 원소의 입력 자료로써 제공되는 형태이다.","code":"","images":
